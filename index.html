        const i = idx(c,r);
        const b = brightnessOf(i);
        if (b <= 0) continue;                     // unexplored stays dark
        const x = c*cellSize - camX, y = r*cellSize - camY, s = cellSize;
        drawFloorBlock(i, b, x, y, s, t);         // chunky pixel block for this cell
        if (b > DIM){                             // warm lantern light pooled on top
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.05 * b;
          ctx.fillStyle = thread;
          ctx.fillRect(x, y, s, s);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
        }
        const w = cells[i].walls;
        if (w[0]||w[1]||w[2]||w[3]){
          const bkt = wallBuckets[Math.min(WB-1, Math.floor(b*WB))];
          if (w[0]) bkt.push(x,y,x+s,y);
          if (w[3]) bkt.push(x,y,x,y+s);
          if (w[1]) bkt.push(x+s,y,x+s,y+s);
          if (w[2]) bkt.push(x,y+s,x+s,y+s);
        }
      }
    }
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;

    // walls: solid & opaque, drawn in batched passes — all shadows first, then all cores, then a
    // thin highlight. No transparency and single-stroke-per-batch, so overlaps never show.
    const thick = Math.max(4, cellSize*0.14);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const strokeBuckets = (col, lw, dx, dy, lighten)=>{
      ctx.save(); if (dx||dy) ctx.translate(dx,dy); ctx.lineWidth = lw;
      for (let lvl=0; lvl<WB; lvl++){
        const arr = wallBuckets[lvl]; if (!arr.length) continue;
        const bb = (lvl+0.5)/WB;
        ctx.strokeStyle = mixRGB(col, bgRGB, 1-bb);
        ctx.beginPath();
        for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
        ctx.stroke();
      }
      ctx.restore();
    };
    strokeBuckets(WALL_SHADOW, thick*1.2, 1.7, 1.7);            // drop shadow (opaque)
    strokeBuckets(wallCoreRGB, thick, 0, 0);                    // solid raised core
    strokeBuckets(wallHiRGB, Math.max(1.2, thick*0.3), -0.7, -0.9);  // top highlight edge

    drawParticles(t);                                         // drifting atmosphere in the lantern light
    const haze = LOOK_FX[curLook].haze;
    if (haze){                                                // soft world tint (e.g. Gale's cold sky)
      const hg = ctx.createRadialGradient(viewW/2, viewH*0.44, 0, viewW/2, viewH*0.44, viewH*0.7);
      hg.addColorStop(0, `rgba(${haze},0.16)`); hg.addColorStop(1, `rgba(${haze},0)`);
      ctx.fillStyle = hg; ctx.fillRect(0,0,viewW,viewH);
    }

    // deepen the dark beyond the reach of the light — and let it close in as the lantern gutters
    const lowLight = 1 - light;                               // 0 (full) .. 1 (guttering)
    const crit = Math.max(0, (CRIT - light) / CRIT);          // 0 above CRIT .. 1 at empty
    const pulse = crit>0 ? (0.06*crit)*(0.5+0.5*Math.sin(t/240)) : 0;  // ominous throb when dark
    const inner = viewH*(0.16 - lowLight*0.07 - crit*0.05);   // lit pool tightens, then clamps in hard
    const darkA = 0.55 + lowLight*0.28 + crit*0.16 + pulse;   // up to ~0.95 and pulsing
    const vg = ctx.createRadialGradient(viewW/2, viewH*0.46, Math.max(0,inner), viewW/2, viewH*0.46, viewH*0.72);
    vg.addColorStop(0, 'rgba(6,10,12,0)');
    vg.addColorStop(1, `rgba(5,9,11,${Math.min(0.97,darkA)})`);
    ctx.fillStyle = vg; ctx.fillRect(0,0,viewW,viewH);

    if (explored.has(startCell)) drawMarker(startCell, T.start, false, t);
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    // the thread — dims behind you as the lantern fades
    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize, tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.45 + 0.55*light;
      // glow underlay
      ctx.strokeStyle = `rgba(${T.threadRGB},0.22)`;
      ctx.lineWidth = cellSize*0.5;
      strokeTrail();
      // core
      const grad = ctx.createLinearGradient(0,0,viewW,viewH);
      grad.addColorStop(0, getVar('--thread'));
      grad.addColorStop(1, T.core);
      ctx.strokeStyle = grad;
      ctx.lineWidth = cellSize*0.2;
      strokeTrail();
      ctx.globalAlpha = 1;
    }
    // head bead — now at the smoothly-eased tip, under the finger
    const bx = tipX - camX, by = tipY - camY;
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.17, 0, 7);
    ctx.fillStyle = getVar('--thread-core'); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.30, 0, 7);
    ctx.strokeStyle = `rgba(${T.coreRGB},0.35)`; ctx.lineWidth = 2; ctx.stroke();
  }

  // The ground, the hedges and the cloud are static between steps: they only move
  // because the camera does. So they are drawn once into a world-anchored layer a
  // little larger than the viewport and then blitted with an offset, and only rebuilt
  // when the fog version changes or the camera runs past the margin.
  let bakeCv = null, bakeVer = -1, bakeX = 0, bakeY = 0, bakeCell = 0, bakeW = 0, bakeH = 0;
  const BAKE_M = 96;

  /* ---- skin: garden -----------------------------------------------------------
     A clipped garden in cut paper. Nothing here has height: the depth is entirely in
     the layering, because every mass — hedge and cloud alike — is the same shape cut
     three times, each sheet a little smaller than the one below it, so a shaded rim
     shows along one side and a lit one along the other.

     Hedge and cloud are built differently on purpose. A hedge wants a bumpy, clipped
     silhouette, so it is a union of capsules with circles bulging past their edges. A
     cloud does not: it wants to read as one sheet cut with a radius, so it is the maze
     grid itself, with a corner rounded only where both edges meeting there are on the
     outside. Building the cloud out of circles instead makes a heap of discs that never
     quite integrate.

     None of it moves between steps, so all of it bakes into a world-anchored layer the
     way the previous hedge world did — including the footprints, which only change when
     you commit to a cell.
     ---------------------------------------------------------------------------- */
  const GARDEN = {
    grass:'#9ed163',
    hedgeLo:'#2c7038', hedgeMid:'#48a04c', hedgeHi:'#63b862',
    cloudLo:'#c2d2c4', cloudMid:'#e7eee5', cloudHi:'#fbfdfa',
    cast:'rgba(38,64,30,.42)',
    pathLo:'#d9c69c', path:'#f4ead0', lamp:'#ffe6a8', lampCore:'#fffdf2',
    petal:'#fbfbf4', petalPink:'#ffdce8', pollen:'#eec14a', stem:'#2c7038',
    spark:'#f6e07c',
  };
  let paperPat = null, paperTileCv = null;
  // the tooth of the stock, world-anchored so it never swims under the camera
  function paperTile(){
    if (paperPat) return paperPat;
    const t = document.createElement('canvas'); t.width = t.height = 128;
    const c = t.getContext('2d');
    for (let i=0;i<900;i++){
      c.fillStyle = i%2 ? 'rgba(255,255,255,.15)' : 'rgba(70,96,44,.10)';
      c.fillRect(hash(i,0,71)*128, hash(i,1,71)*128, 1.4, 1.4);
    }
    paperTileCv = t;
    paperPat = ctx.createPattern(t, 'repeat');
    return paperPat;
  }

  const gSeen = i => brightnessOf(i) > 0;
  const gFoggy = (c,r) => !(c>=0 && c<cols && r>=0 && r<rows && gSeen(idx(c,r)));

  /* The hedge silhouette. The body is one rounded rectangle per wall rather than a
     chain of circles — a capsule either way, but fifteen times fewer subpaths, which
     is the difference between a bake you notice and one you do not. The scallops stay
     circles; they are the whole look. */
  function gardenHedge(g, ox, oy, c0, r0, c1, r1, rough){
    const th = Math.max(5, cellSize*0.357), s = cellSize;
    const dot = (x,y,r) => { g.moveTo(x+r, y); g.arc(x, y, r, 0, 7); };
    g.beginPath();
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r), w = cells[i].walls;
      const x = c*s - ox, y = r*s - oy;
      const known = (dc,dr) => {
        if (gSeen(i)) return true;
        const nc = c+dc, nr = r+dr;
        return nc>=0 && nc<cols && nr>=0 && nr<rows && gSeen(idx(nc,nr));
      };
      // Few, large, overlapping lobes rather than many small ones: beads read as
      // bubbles, lobes that run into each other read as a clipped hedge waving.
      const run = (x0, y0, horiz, seed) => {
        if (horiz) g.roundRect(x0 - th/2, y0 - th/2, s + th, th, th/2);
        else       g.roundRect(x0 - th/2, y0 - th/2, th, s + th, th/2);
        const step = Math.max(7, cellSize*0.40);
        for (let n = 0; step*(n + 0.5) < s; n++){
          const d = step*(n + 0.5);
          const k = hash(seed + n*4.13, 3);
          const rr = th*(0.38 + k*0.20)*(rough||1);
          const j = (hash(seed + n*7.71, 5) - 0.5)*step*0.34;
          const push = th/2 - rr*0.70;              // seated in the body, not perched on it
          if (horiz){ dot(x0+d+j, y0 - push, rr); dot(x0+d+j, y0 + push, rr*0.9); }
          else      { dot(x0 - push, y0+d+j, rr); dot(x0 + push, y0+d+j, rr*0.9); }
        }
      };
      const seed = c*131.7 + r*57.3;
      if (w[0] && known(0,-1)) run(x, y, true,  seed);
      if (w[3] && known(-1,0)) run(x, y, false, seed + 1.7);
      if (w[1] && c===cols-1 && gSeen(i)) run(x + s, y, false, seed + 3.4);
      if (w[2] && r===rows-1 && gSeen(i)) run(x, y + s, true,  seed + 5.1);
    }
  }

  /* The cloud. One square per unreached cell, unioned into a sheet; a corner takes a
     radius only when both edges meeting there are exposed, so cells that carry on join
     square and the bank stays one piece. The inset bites only on exposed sides too —
     apply it all round and the upper sheets come apart into a tiled grid. Cells overlap
     their neighbours slightly, because an exactly abutting seam antialiases into a
     visible lattice. The field runs two cells past the layer, so nothing at the frame
     has an outside and the sheet reaches the edge flush. */
  function gardenFog(g, ox, oy, c0, r0, c1, r1, rad, inset){
    const s = cellSize, ov = Math.max(0.6, s*0.014), ins = inset || 0;
    g.beginPath();
    for (let r=r0-2; r<=r1+2; r++) for (let c=c0-2; c<=c1+2; c++){
      if (!gFoggy(c,r)) continue;
      const n = gFoggy(c,r-1), so = gFoggy(c,r+1), w = gFoggy(c-1,r), e = gFoggy(c+1,r);
      const x0 = c*s - ox + (w ? -ov : ins), x1 = (c+1)*s - ox + (e ? ov : -ins);
      const y0 = r*s - oy + (n ? -ov : ins), y1 = (r+1)*s - oy + (so ? ov : -ins);
      g.roundRect(x0, y0, x1-x0, y1-y0,
        [ (!n && !w) ? rad : 0, (!n && !e) ? rad : 0,
          (!so && !e) ? rad : 0, (!so && !w) ? rad : 0 ]);
      const fil = rad*0.55, cxp = c*s - ox, cyp = r*s - oy;
      const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
      if (n  && w && !gFoggy(c-1,r-1)) nook(cxp, cyp);
      if (n  && e && !gFoggy(c+1,r-1)) nook(cxp + s, cyp);
      if (so && e && !gFoggy(c+1,r+1)) nook(cxp + s, cyp + s);
      if (so && w && !gFoggy(c-1,r+1)) nook(cxp, cyp + s);
    }
  }

  // The path is a strip of paper laid on the grass — a darker sheet with a lighter one
  // on top, the same two-sheet logic as everything else here. Points are the committed
  // cells; the live stub out to where you actually are is drawn on top, every frame.
  function gardenPathAt(g, ox, oy, upto){
    const s = cellSize, n = upto === undefined ? trail.length : upto;
    if (n < 1) return false;
    const at = i => [(cx(trail[i])+0.5)*s - ox, (cy(trail[i])+0.5)*s - oy];
    g.beginPath();
    const [x0,y0] = at(0); g.moveTo(x0, y0);
    for (let i=1; i<n-1; i++){
      const [ax,ay] = at(i), [bx,by] = at(i+1);
      g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
    }
    if (n > 1){ const [lx,ly] = at(n-1); g.lineTo(lx, ly); }
    return true;
  }

  function drawGarden(t){
    ctx.clearRect(0,0,viewW,viewH);
    const needW = viewW + BAKE_M*2, needH = viewH + BAKE_M*2;
    const stale = bakeVer !== fogVer || bakeCell !== cellSize
               || bakeW !== needW || bakeH !== needH
               || camX < bakeX || camY < bakeY
               || camX + viewW > bakeX + needW || camY + viewH > bakeY + needH;
    if (stale){
      if (!bakeCv || bakeW !== needW || bakeH !== needH){
        bakeCv = document.createElement('canvas');
        bakeW = needW; bakeH = needH;
      }
      bakeCv.width = Math.round(needW*dpr); bakeCv.height = Math.round(needH*dpr);
      bakeX = camX - BAKE_M; bakeY = camY - BAKE_M;
      bakeVer = fogVer; bakeCell = cellSize;
      const bg = bakeCv.getContext('2d');
      bg.setTransform(dpr,0,0,dpr,0,0);
      bakeGarden(bg, bakeX, bakeY, needW, needH);
    }
    ctx.drawImage(bakeCv, Math.round(bakeX - camX), Math.round(bakeY - camY), bakeW, bakeH);
    gardenActors(t);
  }

  function bakeGarden(g, ox, oy, w, h){
    const s = cellSize, k = s/42;
    const c0 = Math.max(0, Math.floor(ox/s)), r0 = Math.max(0, Math.floor(oy/s));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/s)), r1 = Math.min(rows-1, Math.ceil((oy+h)/s));

    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), ox, oy); g.fillRect(0,0,w,h);

    // the path you have laid, under everything else on the ground
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (gardenPathAt(g, ox, oy)){
      g.save();
      g.shadowColor = GARDEN.cast; g.shadowBlur = s*0.10; g.shadowOffsetY = s*0.055;
      g.strokeStyle = GARDEN.pathLo; g.lineWidth = s*0.30; g.stroke();
      g.restore();
      gardenPathAt(g, ox, oy);
      g.strokeStyle = GARDEN.path; g.lineWidth = s*0.22; g.stroke();
    }

    // what grows in the corridor, off the path you wore walking it
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r);
      if (!gSeen(i)) continue;
      const x = c*s - ox, y = r*s - oy;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + s*0.19 + hash(c,r,32)*s*0.62, sy = y + s*0.19 + hash(c,r,33)*s*0.62;
        g.fillStyle = GARDEN.spark;
        const sr = s*0.107;
        g.beginPath();
        g.moveTo(sx, sy-sr); g.quadraticCurveTo(sx, sy, sx+sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy+sr); g.quadraticCurveTo(sx, sy, sx-sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy-sr); g.fill();
      }
      if (inTrail.has(i) || hash(c*5.3 + r*2.9, 21) > 0.34) continue;
      const fx = x + s*0.24 + hash(c,r,22)*s*0.5, fy = y + s*0.26 + hash(c,r,23)*s*0.45;
      g.strokeStyle = GARDEN.stem; g.lineWidth = Math.max(1.4, s*0.052); g.lineCap = 'round';
      g.beginPath(); g.moveTo(fx, fy + s*0.31); g.lineTo(fx, fy + s*0.07); g.stroke();
      g.save();
      g.shadowColor = GARDEN.cast; g.shadowBlur = s*0.095; g.shadowOffsetY = s*0.06;
      g.fillStyle = hash(c,r,24) > 0.5 ? GARDEN.petal : GARDEN.petalPink;
      for (let p=0;p<6;p++){
        const a = p/6*6.2832;
        g.beginPath();
        g.ellipse(fx + Math.cos(a)*s*0.100, fy + Math.sin(a)*s*0.100, s*0.081, s*0.081, 0, 0, 7);
        g.fill();
      }
      g.restore();
      g.fillStyle = GARDEN.pollen;
      g.beginPath(); g.arc(fx, fy, s*0.057, 0, 7); g.fill();
    }

    // the hedge: a shadow on the grass, then three sheets
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 9*k;
    g.shadowOffsetX = 3*k; g.shadowOffsetY = 7*k;
    gardenHedge(g, ox, oy, c0, r0, c1, r1, 1.06);
    g.fillStyle = GARDEN.hedgeLo; g.fill();
    g.restore();
    g.save(); g.translate(-1.5*k, -4.5*k);
    gardenHedge(g, ox, oy, c0, r0, c1, r1, 0.94);
    g.fillStyle = GARDEN.hedgeMid; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 1.5*k, oy + 4.5*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-3*k, -9*k);
    gardenHedge(g, ox, oy, c0, r0, c1, r1, 0.74);
    g.fillStyle = GARDEN.hedgeHi; g.fill();
    g.restore();

    // the cloud: the same three sheets, cut from the grid
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k;
    g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.40, 0);
    g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.42, 1.5*k);
    g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 4*k, oy + 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.46, 5*k);
    g.fillStyle = GARDEN.cloudHi; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 9*k, oy + 13*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
  }

  // only the things that move between steps
  function gardenActors(t){
    if (explored.has(startCell)) drawMarker(startCell, '#f4ecd8', false, t);
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();
    // The baked path stops at the last cell you committed to. This is the stub out to
    // where you actually are, and the light you are carrying at the end of it.
    const s = cellSize, head = trail[trail.length-1];
    const hx = (cx(head)+0.5)*s - camX, hy = (cy(head)+0.5)*s - camY;
    const bx = tipX - camX, by = tipY - camY;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (Math.hypot(bx-hx, by-hy) > s*0.04){
      ctx.save();
      ctx.shadowColor = GARDEN.cast; ctx.shadowBlur = s*0.10; ctx.shadowOffsetY = s*0.055;
      ctx.strokeStyle = GARDEN.pathLo; ctx.lineWidth = s*0.30;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = GARDEN.path; ctx.lineWidth = s*0.22;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
    }
    ctx.save();
    ctx.shadowColor = 'rgba(255,206,110,.95)'; ctx.shadowBlur = s*0.55;
    ctx.fillStyle = GARDEN.lamp;
    ctx.beginPath(); ctx.arc(bx, by, s*0.13, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = GARDEN.lampCore;
    ctx.beginPath(); ctx.arc(bx, by, s*0.085, 0, 7); ctx.fill();
  }


  /* ---- skin: card -------------------------------------------------------------
     A paper world: the maze is a sheet of single-wall corrugated board laid on a
     table and cut into one square flap per cell. Ground you have not reached is
     still covered. As the light finds a cell its flap lifts on one edge, turns past
     vertical to show its liner side, and fades out, and the walls stand up out of
     the slots underneath. The flutes only show on a cut edge — which is why the top
     of every wall reads as board and the flat of a flap does not.

     Board is fibre, and a flat fill reads as plastic no matter how good the shadow
     is, so the stock is a repeating tile of fibres and flecks anchored to world
     coordinates. Drawing it as a pattern rather than a level-sized bitmap is what
     lets the same texture serve a scrolling world at any cell size.

     A flap that is still shut never moves, so the shut ones bake into a world-
     anchored layer along with the table, the board and the walls, exactly as the
     hedge does. Only the handful mid-turn are drawn live — of some two hundred flaps
     on screen, three or four are moving at once.
     ---------------------------------------------------------------------------- */
  const CARD = {
    table:'#f5edd9', tableInk:'rgba(160,140,100,.09)', tableLit:'rgba(255,255,250,.30)',
    board:'#83a058', boardEdge:'rgba(58,78,36,.5)', slot:'rgba(40,44,26,.5)',
    face:'#bd8749', back:'#dcbc8e', core:'#f0e2c2', edge:'#8a5f2c',
    shadow:'rgba(58,40,18,', flute:'rgba(112,78,34,.6)',
    yarnDark:'#9e3a26', yarn:'#c94f36', yarnLit:'#e08068',
  };
  const CARD_TURN = 380;                   // ms for one flap to go from shut to gone
  const cardPats = {}, cardTileCv = {};
  // One 256px tile per stock face. Every fibre is drawn at all nine wrap offsets so
  // the tile joins seamlessly — the alternative, insetting them off the edge, leaves
  // a clean band every 256px that the eye picks up as a grid.
  function cardTile(which){
    if (cardPats[which]) return cardPats[which];
    const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d');
    const rnd = (k,sd) => { const v = Math.sin(k*12.9898 + sd*78.233)*43758.5453; return v - Math.floor(v); };
    const fibres = (n, cols, len) => {
      c.lineWidth = 0.6;
      for (let k=0; k<n; k++){
        const x = rnd(k,1.3)*N, y = rnd(k,2.7)*N, a = rnd(k,4.1)*6.2832;
        const l = len*(0.5 + rnd(k,5.9)), ddx = Math.cos(a)*l, ddy = Math.sin(a)*l;
        c.strokeStyle = cols[k % cols.length];
        for (let ox=-N; ox<=N; ox+=N) for (let oy=-N; oy<=N; oy+=N){
          c.beginPath(); c.moveTo(x+ox, y+oy); c.lineTo(x+ox+ddx, y+oy+ddy); c.stroke();
        }
      }
    };
    const speck = (n, cols, size) => {
      for (let k=0; k<n; k++){
        c.fillStyle = cols[k % cols.length];
        c.fillRect(rnd(k,7.1)*N, rnd(k,8.3)*N, size, size);
      }
    };
    if (which === 'face'){                          // the printed outer liner
      c.fillStyle = CARD.face; c.fillRect(0,0,N,N);
      fibres(1400, ['rgba(96,64,24,.16)','rgba(240,214,168,.20)'], 3.2);
      speck(1150, ['rgba(86,56,20,.14)','rgba(246,224,182,.16)'], 1.1);
    } else if (which === 'back'){                   // the inner liner, seen when it turns over
      c.fillStyle = CARD.back; c.fillRect(0,0,N,N);
      fibres(1000, ['rgba(120,84,38,.12)','rgba(255,244,220,.22)'], 3);
    } else {                                        // the table the whole thing lies on
      c.fillStyle = CARD.table; c.fillRect(0,0,N,N);
      speck(2600, [CARD.tableInk, CARD.tableLit], 1.2);
    }
    cardTileCv[which] = cv;
    cardPats[which] = ctx.createPattern(cv, 'repeat');
    return cardPats[which];
  }
  // patterns are anchored to the world, so the fibre stays put as the camera moves
  function cardAnchor(pat, ox, oy){
    if (pat.setTransform) pat.setTransform(new DOMMatrix().translate(-ox % 256, -oy % 256));
    return pat;
  }

  let flapOpen = null, flapLevel = -1, flapT = 0;
  let cardCv = null, cardStamp = -1, cardX = 0, cardY = 0,
      cardCell = 0, cardW = 0, cardH = 0;

  // A flap is a square hinged on one edge. As it turns, the side opposite the hinge
  // sweeps toward it and the panel foreshortens; past vertical the depth goes
  // negative, it lands beyond its own hinge, and you are looking at its back.
  function flapPath(g, c, r, ox, oy, open, dx, dy){
    const size = cellSize - cellSize*0.06;          // the saw kerf between one flap and the next
    const x = c*cellSize - ox + cellSize*0.03 + (dx||0);
    const y = r*cellSize - oy + cellSize*0.03 + (dy||0);
    const hinge = (Math.abs(hash(c*3.1 + r*5.7, 2))*4) | 0;
    const depth = size * Math.cos(open * Math.PI * 0.60);
    const bow = open * cellSize * 0.083;
    const sg = Math.sign(depth) || 1, d = Math.abs(depth);
    const inset = (1 - d/size) * (size*0.073);      // the far edge narrows as it tips away
    // cut a degree or two off square, so the field reads as separate pieces rather
    // than one sheet scored into a grid
    const mx = c*cellSize - ox + cellSize/2, my = r*cellSize - oy + cellSize/2;
    g.save();
    g.translate(mx, my); g.rotate((hash(c*2.7 + r*4.1, 9)*2 - 1) * 0.016); g.translate(-mx, -my);
    if (hinge === 0 || hinge === 2){                // hinged along a horizontal edge
      const hy = hinge === 0 ? y : y + size, fy = hy + (hinge === 0 ? sg*d : -sg*d);
      g.moveTo(x, hy);
      g.lineTo(x + inset, fy);
      g.quadraticCurveTo(x + size/2, fy + bow, x + size - inset, fy);
      g.lineTo(x + size, hy);
    } else {                                        // hinged along a vertical edge
      const hx = hinge === 3 ? x : x + size, fx = hx + (hinge === 3 ? sg*d : -sg*d);
      g.moveTo(hx, y);
      g.lineTo(fx, y + inset);
      g.quadraticCurveTo(fx + bow, y + size/2, fx, y + size - inset);
      g.lineTo(hx, y + size);
    }
    g.closePath();
    g.restore();
    return depth;
  }

  function drawCard(t){
    // a level you have just walked into starts with its flaps where the fog says they
    // are, so resuming a run does not replay two hundred openings
    if (!flapOpen || flapOpen.length !== cells.length || flapLevel !== levelVer){
      flapOpen = new Float32Array(cells.length);
      for (let i=0; i<cells.length; i++) flapOpen[i] = explored.has(i) ? 1 : 0;
      flapLevel = levelVer; flapT = t;
    }
    const dt = Math.min(64, Math.max(0, t - flapT)); flapT = t;
    const sp = dt / CARD_TURN;
    const moving = [];
    for (let i=0; i<flapOpen.length; i++){
      if (!explored.has(i)) continue;               // still shut; the baked layer has it
      const o = flapOpen[i];
      if (o < 1){ const n = Math.min(1, o + sp); flapOpen[i] = n; if (n < 1) moving.push(i); }
    }

    ctx.clearRect(0,0,viewW,viewH);
    const needW = viewW + BAKE_M*2, needH = viewH + BAKE_M*2;
    const stale = cardStamp !== fogVer || cardCell !== cellSize
               || cardW !== needW || cardH !== needH
               || camX < cardX || camY < cardY
               || camX + viewW > cardX + needW || camY + viewH > cardY + needH;
    if (stale){
      if (!cardCv || cardW !== needW || cardH !== needH){
        cardCv = document.createElement('canvas'); cardW = needW; cardH = needH;
      }
      cardCv.width = Math.round(needW*dpr); cardCv.height = Math.round(needH*dpr);
      cardX = camX - BAKE_M; cardY = camY - BAKE_M;
      cardStamp = fogVer; cardCell = cellSize;
      const bg = cardCv.getContext('2d');
      bg.setTransform(dpr,0,0,dpr,0,0);
      bakeCard(bg, cardX, cardY, needW, needH);
    }
    ctx.drawImage(cardCv, Math.round(cardX - camX), Math.round(cardY - camY), cardW, cardH);
    cardActors(t);
    if (moving.length) cardFlaps(ctx, camX, camY, moving);
  }

  // the table, the board, the walls, and every flap still lying shut
  function bakeCard(g, ox, oy, w, h){
    const k = cellSize/30;
    const c0 = Math.max(0, Math.floor(ox/cellSize)), r0 = Math.max(0, Math.floor(oy/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((oy+h)/cellSize));

    g.fillStyle = cardAnchor(cardTile('table'), ox, oy); g.fillRect(0,0,w,h);
    // the board the maze is cut from, sitting proud of the table
    const bx = -ox - cellSize*0.14, by = -oy - cellSize*0.14;
    const bw = cols*cellSize + cellSize*0.28, bh = rows*cellSize + cellSize*0.28;
    g.save();
    g.shadowColor = CARD.shadow + '.34)'; g.shadowBlur = 9*k; g.shadowOffsetY = 4*k;
    g.fillStyle = CARD.board; g.fillRect(bx, by, bw, bh);
    g.restore();
    g.save();                                       // grain, to keep the mat off flat colour
    g.beginPath(); g.rect(bx, by, bw, bh); g.clip();
    g.globalAlpha = 0.20; g.fillStyle = cardAnchor(cardTile('back'), ox, oy);
    g.fillRect(bx, by, bw, bh);
    g.restore();
    g.strokeStyle = CARD.boardEdge; g.lineWidth = 1.4; g.strokeRect(bx, by, bw, bh);

    // walls: a strip of board standing in a slot, shown only where the ground either
    // side of it has been reached
    const segs = [];
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r), wl = cells[i].walls;
      const x = c*cellSize - ox, y = r*cellSize - oy, s = cellSize;
      const known = (dc,dr) => {
        if (brightnessOf(i) > 0) return true;
        const nc = c+dc, nr = r+dr;
        return nc>=0 && nc<cols && nr>=0 && nr<rows && brightnessOf(idx(nc,nr)) > 0;
      };
      if (wl[0] && known(0,-1)) segs.push(x, y, x+s, y);
      if (wl[3] && known(-1,0)) segs.push(x, y, x, y+s);
      if (wl[1] && known(1,0))  segs.push(x+s, y, x+s, y+s);
      if (wl[2] && known(0,1))  segs.push(x, y+s, x+s, y+s);
    }
    if (segs.length){
      const thick = Math.max(5, cellSize*0.33);
      const line = (lw, col, dx, dy) => {
        g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'butt'; g.lineJoin = 'round';
        g.beginPath();
        for (let n=0;n<segs.length;n+=4){ g.moveTo(segs[n]+dx, segs[n+1]+dy); g.lineTo(segs[n+2]+dx, segs[n+3]+dy); }
        g.stroke();
      };
      line(thick, CARD.slot, 0.4*k, 3.4*k);                    // the slot it stands in
      g.save(); g.filter = 'blur(' + (2.8*k).toFixed(2) + 'px)'; g.globalAlpha = 0.4;
      line(thick, CARD.shadow + '1)', 4*k, 5.4*k); g.restore();
      line(thick, cardAnchor(cardTile('face'), ox, oy), 0, 0);  // the face of the card
      // flutes, on the cut edge only
      g.strokeStyle = CARD.flute; g.lineWidth = 1;
      const half = thick*0.30;
      g.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const len = Math.hypot(x2-x1, y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
        const nx=-uy*half, ny=ux*half;
        for (let d=2; d<len; d+=3.6){          // fixed pitch: the flutes are the board's,
          const fx=x1+ux*d, fy=y1+uy*d;        // not the camera's
          g.moveTo(fx-nx, fy-ny); g.lineTo(fx+nx, fy+ny);
        }
      }
      g.stroke();
    }

    // every flap still shut. They all carry the same blur, so one accumulated path
    // gives the whole field its shadow for a single filter pass.
    const shutCells = [];
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      if (!explored.has(idx(c,r))) shutCells.push(c, r);
    }
    if (shutCells.length) cardShutFlaps(g, ox, oy, shutCells, k);
  }

  function cardShutFlaps(g, ox, oy, list, k){
    const each = (dx, dy) => {
      g.beginPath();
      for (let n=0;n<list.length;n+=2) flapPath(g, list[n], list[n+1], ox, oy, 0, dx, dy);
    };
    g.save();
    g.filter = 'blur(' + (1.4*k).toFixed(2) + 'px)'; g.globalAlpha = 0.42;
    g.fillStyle = CARD.shadow + '1)'; each(1.2*k, 1.8*k); g.fill();
    g.restore();
    g.fillStyle = cardAnchor(cardTile('face'), ox, oy); each(0,0); g.fill();
    g.strokeStyle = CARD.edge; g.lineWidth = 1; each(0,0); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.34)'; each(0, -0.9*k); g.stroke();
  }

  // the few mid-turn, drawn live over the baked field
  function cardFlaps(g, ox, oy, moving){
    const k = cellSize/30;
    for (const i of moving){
      const c = cx(i), r = cy(i), o = flapOpen[i];
      const fade = o < 0.78 ? 1 : Math.max(0, (1 - o)/0.22);
      const lift = o * 7 * k;
      g.save();
      g.globalAlpha = 0.42 * (1 - o*0.25) * fade;
      g.shadowColor = CARD.shadow + '.9)';
      g.shadowBlur = (1.4 + o*5) * k;
      g.fillStyle = CARD.shadow + '1)';
      g.beginPath(); flapPath(g, c, r, ox, oy, o, 1.2*k + lift*0.9, 1.8*k + lift*1.15);
      g.fill(); g.restore();

      g.save(); g.globalAlpha = fade;
      g.beginPath();
      const depth = flapPath(g, c, r, ox, oy, o, 0, -lift*0.5);
      g.fillStyle = cardAnchor(cardTile(depth >= 0 ? 'face' : 'back'), ox, oy);
      g.fill();
      g.strokeStyle = CARD.edge; g.lineWidth = 1; g.stroke();
      if (depth >= 0){                                // a contact line while it still touches
        g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 1;
        g.beginPath(); flapPath(g, c, r, ox, oy, o, 0, -lift*0.5 - 0.9*k); g.stroke();
      }
      g.restore();
    }
  }

  // the yarn and everything standing on the spread
  function cardActors(t){
    if (explored.has(startCell)) drawMarker(startCell, '#f4ecd8', false, t);
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize,
                              tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.save();                                     // the yarn's own soft shadow
      ctx.shadowColor = CARD.shadow + '.45)'; ctx.shadowBlur = cellSize*0.10; ctx.shadowOffsetY = cellSize*0.05;
      ctx.strokeStyle = CARD.yarnDark; ctx.lineWidth = cellSize*0.20; strokeTrail();
      ctx.restore();
      ctx.strokeStyle = CARD.yarn; ctx.lineWidth = cellSize*0.155; strokeTrail();
      // the twist: short strokes across the run, which is what makes it read as wool
      ctx.strokeStyle = CARD.yarnLit; ctx.lineWidth = Math.max(1, cellSize*0.05);
      const pts = threadPoints();
      ctx.beginPath();
      for (let i=1; i<pts.length; i++){
        const x1=pts[i-1].x, y1=pts[i-1].y, x2=pts[i].x, y2=pts[i].y;
        const len = Math.hypot(x2-x1, y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
        const nx=-uy*cellSize*0.067, ny=ux*cellSize*0.067;
        const sx=ux*cellSize*0.047, sy=uy*cellSize*0.047;
        for (let d=0; d<len; d+=cellSize*0.147){
          const bx=x1+ux*d, by=y1+uy*d;
          ctx.moveTo(bx-nx-sx, by-ny-sy); ctx.lineTo(bx+nx+sx, by+ny+sy);
        }
      }
      ctx.stroke();
    }
    const hx = tipX - camX, hy = tipY - camY;
    ctx.save();
    ctx.shadowColor = CARD.shadow + '.45)'; ctx.shadowBlur = cellSize*0.12; ctx.shadowOffsetY = cellSize*0.055;
    ctx.fillStyle = CARD.yarnDark; ctx.beginPath(); ctx.arc(hx, hy, cellSize*0.19, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = CARD.yarn; ctx.beginPath(); ctx.arc(hx, hy, cellSize*0.147, 0, 7); ctx.fill();
    ctx.fillStyle = CARD.yarnLit;
    ctx.beginPath(); ctx.arc(hx-cellSize*0.04, hy-cellSize*0.05, cellSize*0.055, 0, 7); ctx.fill();
  }

  const SKINS = { iso: drawIso, garden: drawGarden, card: drawCard };
  function draw(t){ (SKINS[T.skin] || SKINS.iso)(t); }

  // build the thread's points: committed cell centres, plus the live tip
  function threadPoints(){
    const pts = [];
    for (const i of trail) pts.push({ x:(cx(i)+0.5)*cellSize-camX, y:(cy(i)+0.5)*cellSize-camY });
    const hx = (cx(trail[trail.length-1])+0.5)*cellSize-camX, hy = (cy(trail[trail.length-1])+0.5)*cellSize-camY;
    const tx = tipX-camX, ty = tipY-camY;
    if (Math.hypot(tx-hx, ty-hy) > cellSize*0.04) pts.push({ x:tx, y:ty });  // add tip if beyond the head
    return pts;
  }
  function strokeTrail(){
    const pts = threadPoints();
    if (pts.length < 2){ if(pts.length===1){ } return; }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length-1;i++){                 // midpoint smoothing → flowing line, no hard corners
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  }

  function drawMarker(i, color, pulse, t){
    const x=(cx(i)+0.5)*cellSize-camX, y=(cy(i)+0.5)*cellSize-camY;
    if (pulse){
      const p = (Math.sin(t/520)*0.5+0.5);
      ctx.beginPath(); ctx.arc(x,y, cellSize*(0.28+0.22*p), 0, 7);
      ctx.strokeStyle = `rgba(${T.beaconRGB},${0.5-0.4*p})`; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.2, 0, 7);
      ctx.fillStyle = color; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.19, 0, 7);
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  // The exit shines through the fog — a light to head toward. It stays sealed (a dim ring)
  // until you've gathered enough embers, then opens into a bright, pulsing beacon.
  function drawBeacon(t){
    const head = trail[trail.length-1];
    const open = exitOpen();
    const bx=(cx(endCell)+0.5)*cellSize, by=(cy(endCell)+0.5)*cellSize;
    const hx=(cx(head)+0.5)*cellSize, hy=(cy(head)+0.5)*cellSize;
    const dCells = Math.hypot(bx-hx, by-hy)/cellSize;
    const intensity = Math.max(0.05, Math.min(1, 1 - dCells/16)) * (open ? 1 : 0.5);
    const sx = bx - camX, sy = by - camY;
    const cyan = T.beaconRGB;
    const onScreen = sx>-cellSize && sx<viewW+cellSize && sy>-cellSize && sy<viewH+cellSize;
    if (onScreen){
      const p = Math.sin(t/520)*0.5+0.5;
      const rad = cellSize*(0.8 + 2.4*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${cyan},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${cyan},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      if (explored.has(endCell)){
        if (open){                                   // open: bright pulsing beacon
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*(0.28+0.18*p),0,7);
          ctx.strokeStyle=`rgba(${cyan},${0.6-0.4*p})`; ctx.lineWidth=2.5; ctx.stroke();
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.2,0,7); ctx.fillStyle=getVar('--beacon'); ctx.fill();
        } else {                                     // sealed: a quiet, dim locked ring
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.26,0,7);
          ctx.strokeStyle=`rgba(${cyan},0.34)`; ctx.lineWidth=2; ctx.stroke();
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.13,0,7);
          ctx.strokeStyle=`rgba(${cyan},0.5)`; ctx.lineWidth=2; ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.1*intensity+2,0,7);
        ctx.fillStyle=`rgba(${cyan},${0.6*intensity})`; ctx.fill();
      }
    } else {
      // edge compass: which way is the light
      const ccx=viewW/2, ccy=viewH/2, dx=sx-ccx, dy=sy-ccy, m=24;
      const tx = dx!==0 ? ((dx>0?viewW-m:m)-ccx)/dx : Infinity;
      const ty = dy!==0 ? ((dy>0?viewH-m:m)-ccy)/dy : Infinity;
      const tt = Math.min(Math.abs(tx),Math.abs(ty));
      const ex=ccx+dx*tt, ey=ccy+dy*tt, ang=Math.atan2(dy,dx);
      ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
      ctx.globalAlpha = (open ? 0.3 : 0.18) + 0.5*intensity; ctx.fillStyle = getVar('--beacon');
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
  }

  // Embers: steady warm motes — the exit keys. Glow faintly through nearby fog.
  function drawEmbers(t){
    const head = trail[trail.length-1];
    const warm = T.ember;
    const nearRange = 5;
    embers.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.6 : Math.max(0, 0.7 - dCells/(nearRange+4)));
      if (intensity <= 0.02) return;
      const bob = Math.sin(t/700 + i)*cellSize*0.06;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + bob;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      const rad = cellSize*(0.30 + 0.30*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${warm},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${warm},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.075, 0, 7);
      ctx.fillStyle = `rgba(${T.coreRGB},${0.5+0.4*intensity})`; ctx.fill();
    });
  }

  // Flames: flickering fire — your light fuel. They burn brighter and reach further when your
  // own lantern is fading, so the dark itself guides you to fuel.
  function drawFlames(t){
    const head = trail[trail.length-1];
    const lowLight = 1 - light;
    const nearRange = 6 + lowLight*6;
    const boost = 1 + lowLight*0.9;
    flames.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.7 : Math.max(0, 0.8 - dCells/(nearRange+4)));
      intensity = Math.min(1, intensity*boost);
      if (intensity <= 0.03) return;
      const flick = 0.8 + 0.2*Math.sin(t/90 + i*1.7) + 0.08*Math.sin(t/41 + i*4.3);
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      const rad = cellSize*(0.42 + 0.42*intensity)*flick;
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(255,170,70,${0.6*intensity})`);
      g.addColorStop(1, `rgba(255,110,40,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      // little flame tongue
      const h = cellSize*0.34*flick;
      ctx.beginPath();
      ctx.moveTo(sx, sy - h);
      ctx.quadraticCurveTo(sx + cellSize*0.14, sy - h*0.15, sx, sy + cellSize*0.09);
      ctx.quadraticCurveTo(sx - cellSize*0.14, sy - h*0.15, sx, sy - h);
      ctx.fillStyle = `rgba(255,236,190,${0.85*intensity})`;
      ctx.fill();
    });
  }

  // Soft ripple when an ember is gathered.
  function drawBlooms(){
    const now = performance.now(), LIFE = 620;
    blooms = blooms.filter(b => now - b.t0 < LIFE);
    for (const b of blooms){
      const p = (now - b.t0)/LIFE;                 // 0..1
      const scale = b.big ? 2.4 : 1;
      const rad = cellSize*(0.2 + p*1.3)*scale;
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      const col = b.big ? T.beaconRGB : T.ember;
      ctx.strokeStyle = `rgba(${col},${0.5*(1-p)})`; ctx.lineWidth = 2.5*(1-p)+0.5; ctx.stroke();
    }
    // quick ring acknowledging a tap
    const TAP = 360;
    pings = pings.filter(b => now - b.t0 < TAP);
    for (const b of pings){
      const p = (now - b.t0)/TAP;
      const rad = cellSize*(0.15 + p*0.5);
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      ctx.strokeStyle = `rgba(${T.coreRGB},${0.55*(1-p)})`; ctx.lineWidth = 2*(1-p)+0.5; ctx.stroke();
    }
  }

  // ---- helpers ----
  let varCache = {};
  function getVar(name){ return varCache[name] || (varCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim()); }
  function fmt(ms){ const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function showHint(msg){
    elHint.textContent = msg;
    elHint.style.opacity = '1';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>{ elHint.style.opacity = '0'; }, 2600);
  }
  function updateHud(){
    const open = exitOpen();
    elEmbers.textContent = open ? `${emberNeed}/${emberNeed}` : `${Math.min(emberGot,emberNeed)}/${emberNeed}`;
    elEmbers.parentElement.style.color = open ? T.beacon : '';
    elEmbers.previousElementSibling && (elEmbers.previousElementSibling.style.background = open ? T.beacon : '');
    elLightFill.style.width = Math.round(light*100) + '%';
    const low = light < CRIT && !won;
    elTrack.classList.toggle('low', low);
    elLantern.classList.toggle('low', low);
    elLightFill.style.background = low
      ? 'linear-gradient(90deg,#ff4d33,#ff8a5a)'                         // warning red when fading
      : `linear-gradient(90deg,${T.thread},${T.core})`;
    if (light > 0.55) warnedLow = false;                                 // re-arm the warning for next dark spell
    elTime.textContent = fmt((won || paused) ? elapsed : (started ? performance.now()-startTime : 0));
  }

  // ---- loop ----
  function frame(t){
    const dt = lastT ? t - lastT : 0; lastT = t;
    if (walkQueue.length && !won){        // glide the thread along a tapped route
      walkAcc += dt;
      while (walkAcc >= STEP_MS && walkQueue.length && !won){
        walkAcc -= STEP_MS;
        applyStep(walkQueue.shift());
      }
    }
    if (dragging && moved && !won) dragUpdate();
    else { tipCell = trail[trail.length-1]; tipT = 0; }   // idle / tap-walk: tip rests at the head
    // ease the drawn tip toward its target point on the head->tipCell edge
    const head = trail[trail.length-1], O = cellCenter(head), C = cellCenter(tipCell);
    const gx = O.x + (C.x-O.x)*tipT, gy = O.y + (C.y-O.y)*tipT;
    tipX += (gx - tipX) * TIP_EASE;
    tipY += (gy - tipY) * TIP_EASE;
    updateCamera();
    draw(t);
    updateHud();
    const hd = trail[trail.length-1];
    // the drone belongs to the maze — let it fade out while the world map is open
    Snd.ambient(light, Math.hypot(cx(hd)-cx(endCell), cy(hd)-cy(endCell)), !won && !mapEl.classList.contains('show'));
    requestAnimationFrame(frame);
  }

  // ---- controls ----
  document.getElementById('reset').addEventListener('click', ()=>loadLevel(cur, true));   // fresh maze, same level
  // sound toggle (persisted)
  const elMute = document.getElementById('mute'), muteIcon = document.getElementById('muteIcon');
  const speakerOn = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>';
  const speakerOff = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/>';
  let soundMuted = false; try{ soundMuted = localStorage.getItem('thread_mute')==='1'; }catch(e){}
  function applyMute(){ Snd.setMuted(soundMuted); muteIcon.innerHTML = soundMuted ? speakerOff : speakerOn; elMute.style.color = soundMuted ? 'var(--muted)' : ''; }
  elMute.addEventListener('click', ()=>{ soundMuted=!soundMuted; try{ localStorage.setItem('thread_mute', soundMuted?'1':'0'); }catch(e){} Snd.resume(); applyMute(); });
  applyMute();
  // the map opens before anything is touched, so the audio context is built
  // suspended; the very first gesture anywhere wakes it
  window.addEventListener('pointerdown', ()=>Snd.resume(), { once:true, capture:true });
  document.getElementById('next').addEventListener('click', ()=>loadLevel(cur+1 < TOTAL ? cur+1 : cur));
  document.getElementById('tomap').addEventListener('click', openMap);
  markEl.addEventListener('click', openMap);

  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>layout(), 120); });

  // go
  loadProgress();
  loadSaves();
  loadLevel(Math.min(beaten, TOTAL-1));   // resume at the next unbeaten level
  if (PREVIEW_UNLOCK) openMap();           // TEMP: show the map right away for previewing
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
