  function drawHedgeTiles(g, ox, oy){
    if (!hedgeTilesReady) return;
    if (hedgeLevelVer !== levelVer) rebuildHedgeGeometry();
    const cs = cellSize, scale = cs / HEDGE_NATIVE_CELL;
    // Two full passes -- every shadow, then every body -- instead of shadow+body per tile.
    // Guarantees a tile's opaque art always caps whatever shadow lands on its footprint
    // (its own or a neighbor's overspill), regardless of draw order between strips/corners/
    // T-stops/plus. See hedgeDrawCorner for why this was needed.
    hedgeStrips.forEach(s => hedgeDrawStrip(g, s, ox, oy, cs, scale, 'shadow'));
    hedgeCorners.forEach(cj => hedgeDrawCorner(g, cj, ox, oy, cs, scale, 'shadow'));
    hedgeTStops.forEach(tj => hedgeDrawTStop(g, tj, ox, oy, cs, scale, 'shadow'));
    hedgePlus.forEach(p => hedgeDrawPlus(g, p.x, p.y, ox, oy, cs, scale, 'shadow'));
    hedgeStrips.forEach(s => hedgeDrawStrip(g, s, ox, oy, cs, scale, 'body'));
    hedgeCorners.forEach(cj => hedgeDrawCorner(g, cj, ox, oy, cs, scale, 'body'));
    hedgeTStops.forEach(tj => hedgeDrawTStop(g, tj, ox, oy, cs, scale, 'body'));
    hedgePlus.forEach(p => hedgeDrawPlus(g, p.x, p.y, ox, oy, cs, scale, 'body'));
  }

  /* The hedge silhouette. The body is one rounded rectangle per wall rather than a
     chain of circles — a capsule either way, but fifteen times fewer subpaths, which
     is the difference between a bake you notice and one you do not. The scallops stay
     circles; they are the whole look.

     Two layers, not the old three: a 'dark' layer (hedgeLo) grown uniformly outward
     by growPx on every side, then a 'top' layer (hedgeMid) at nominal size on top, so
     the dark layer peeks out as an even rim all the way around -- same fix as the
     tile-stamp shadow (hedgeDrawTileShadow): growing has no preferred direction, so a
     bend in the wall gets exactly as much rim as a straight run does, instead of a
     directional offset that only shows up on edges facing one way. Corners and T-stops
     aren't separate pieces here at all -- a corner is just two capsules overlapping --
     so there's no separate corner-shadow logic left to get out of sync with the rest
     of the wall in the first place.

     bumps=false draws just the roundRect capsules, skipping the scallop dots -- used to
     cast the offset drop shadow from a plain straight-edged shape instead of a copy of
     the bushy silhouette (a canvas shadow is always a copy of whatever it's attached to,
     so casting it from the bushy path would mirror every bump into the shadow too). */
  // hedgeDegAt is purely topological -- built once per level from the full maze, with
  // no idea which cells are actually revealed yet. That's fine for whether a tip is a
  // true dead end structurally, but it isn't fine for deciding whether to ROUND that
  // tip right now: at a real bend, both segments meeting the vertex round fully and
  // rely on each other's overlap to look joined. If only one of the two has cleared
  // its own known() check so far, the other isn't drawn at all yet -- so the one that
  // is drawn still rounds as if a partner were there, leaving an unattached round nub
  // poking out toward the fog. hedgeLiveDegAt recomputes degree from what's actually
  // being drawn this frame (mirroring the same known()-style gate the main loop uses
  // for each of the up to four segments that could meet a vertex), so a segment whose
  // partner hasn't been revealed yet correctly reads as a dead end -- small bevel, not
  // a floating round cap -- until that partner shows up and it can round again.
  function hedgeSegDrawn(c, r, side){
    if (c < 0 || c >= cols || r < 0 || r >= rows) return false;
    const i = idx(c,r), w = cells[i].walls, seenSelf = gSeen(i);
    if (side === 'N') return !!w[0] && (seenSelf || (r-1 >= 0 && gSeen(idx(c,r-1))));
    if (side === 'W') return !!w[3] && (seenSelf || (c-1 >= 0 && gSeen(idx(c-1,r))));
    if (side === 'E') return c === cols-1 && !!w[1] && seenSelf;
    if (side === 'S') return r === rows-1 && !!w[2] && seenSelf;
    return false;
  }
  function hedgeLiveDegAt(gx, gy){
    let n = 0;
    if (hedgeSegDrawn(gx,   gy,   'N')) n++;   // north wall of (gx,gy): (gx,gy)-(gx+1,gy)
    if (hedgeSegDrawn(gx-1, gy,   'N')) n++;   // north wall of (gx-1,gy): (gx-1,gy)-(gx,gy)
    if (hedgeSegDrawn(gx,   gy,   'W')) n++;   // west wall of (gx,gy): (gx,gy)-(gx,gy+1)
    if (hedgeSegDrawn(gx,   gy-1, 'W')) n++;   // west wall of (gx,gy-1): (gx,gy-1)-(gx,gy)
    if (hedgeSegDrawn(gx-1, gy,   'E')) n++;   // right-boundary wall of (gx-1,gy), touching (gx,gy) as its near/top end
    if (hedgeSegDrawn(gx-1, gy-1, 'E')) n++;   // right-boundary wall of (gx-1,gy-1), touching (gx,gy) as its far/bottom end
    if (hedgeSegDrawn(gx,   gy-1, 'S')) n++;   // bottom-boundary wall of (gx,gy-1), touching (gx,gy) as its near/left end
    if (hedgeSegDrawn(gx-1, gy-1, 'S')) n++;   // bottom-boundary wall of (gx-1,gy-1), touching (gx,gy) as its far/right end
    return n;
  }
  /* ---- a bushy, hedge-styled version of the card world's stroke wall ------------
     Reuses drawCardWalls' topology handling (segment trimming at dead ends, hub
     filling at junctions) since that's what keeps a short dead-end stub from
     overshooting into a wide, poking-out tab -- a thin trimmed stroke, not a filled
     capsule. The card-specific surface (flute wave, liner bands) is swapped for a
     scalloped bump texture and a two-tone rim/fill, the same visual language the
     original capsule-based gardenHedge used, so it reads as clipped foliage instead
     of corrugated board.
     -------------------------------------------------------------------------- */
  function drawHedgeWalls(g, segs, cs, k, wox, woy, pal, w, h){
    if (!segs.length) return;
    const th0 = Math.max(5, cs*0.357), growPx = 2;
    const capKey = (x,y) => Math.round(x*4)+','+Math.round(y*4);
    const capCount = new Map(), capAxes = new Map();
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
      [[x1,y1],[x2,y2]].forEach(([px,py]) => {
        const kk = capKey(px,py);
        capCount.set(kk, (capCount.get(kk)||0)+1);
        if (!capAxes.has(kk)) capAxes.set(kk, new Set());
        capAxes.get(kk).add(axis);
      });
    }
    const isJunction = (x,y) => (capAxes.get(capKey(x,y))||new Set()).size > 1;
    const isDeadEnd  = (x,y) => capCount.get(capKey(x,y)) === 1;
    // A plain 2-way bend (exactly one horizontal and one vertical segment, nothing
    // else, touching this point) vs. a T or cross (3-4 segments touching, even if
    // only 2 distinct axes) -- isJunction alone can't tell these apart, since a
    // straight-through wall with a branch off it still has exactly 2 axes.
    const isSimpleBend = (x,y) => capCount.get(capKey(x,y)) === 2 && isJunction(x,y);
    // At a simple bend, the vertical segment's OTHER endpoint tells us which side
    // (up or down) its wall body occupies relative to the joint. The horizontal
    // (reaching) segment's corner on THAT side has to stay sharp -- the vertical
    // wall stops short of the joint by design (see endShift below), so nothing
    // backfills whatever a rounded corner there would carve away. Only the corner
    // on the opposite side is genuinely open/outer and safe to round.
    const otherEndV = new Map();
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
      if (axis === 'v'){
        otherEndV.set(capKey(x1,y1), {x:x2,y:y2});
        otherEndV.set(capKey(x2,y2), {x:x1,y:y1});
      }
    }
    const fitTrim = (st, et, len) => {
      const total = st + et;
      if (total <= len*0.9) return [st, et];
      const f = (len*0.9) / (total || 1);
      return [st*f, et*f];
    };
    const endShift = (x, y, axis, lw) => {
      // Scaled by THIS layer's own lw (not the fixed halfT) so the grown rim layer
      // reaches/pulls back further than the top layer by the same growPx it's wider
      // by -- otherwise rim and top end up trimmed to the identical length-wise
      // point at every junction, and the rim (which is only wider, never longer)
      // has nothing left to peek out from under the top layer along the curve.
      if (isJunction(x,y)) return axis === 'h' ? -lw/2 : lw/2;
      // Dead ends pull the straight part of the rectangle IN before the cap radius
      // rounds it, and that pull-back has to shrink -- not grow -- as the layer gets
      // wider, or the two corrections double up in the same direction. The reach
      // case above and this pull-back case both move the tip by half this layer's
      // own width, but reach ADDS that to the raw endpoint while pull-back
      // SUBTRACTS it -- so growing lw pushes a reaching tip further out (which is
      // exactly what growing the corner radius by the same amount needs to stay
      // centered on it) while it pulls a dead-end tip further in (which fights the
      // radius growth instead of matching it). Subtracting the growth here instead
      // of adding it keeps the cap's rounded center in the same place regardless of
      // which layer is drawing it, same as the reach case above.
      if (isDeadEnd(x,y)) { const grow = (lw - th0)/2; return th0/2 - grow; }
      return 0;
    };
    const shiftPair = (sd, ed, len) => {
      const [cs_, ce_] = fitTrim(Math.max(0,sd), Math.max(0,ed), len);
      return [sd > 0 ? cs_ : sd, ed > 0 ? ce_ : ed];
    };
    const trimmedEnds = (x1,y1,x2,y2,lw) => {
      const len = Math.hypot(x2-x1,y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
      const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
      const [sd, ed] = shiftPair(endShift(x1,y1,axis,lw), endShift(x2,y2,axis,lw), len);
      return [x1+ux*sd, y1+uy*sd, x2-ux*ed, y2-uy*ed];
    };
    // Bevel radii: a small curve at true dead ends (capR) and at real corners/T/cross
    // junctions (bevelR), but NOT at a plain seam where two collinear same-axis
    // segments just happen to meet (a straight run split across cell boundaries) --
    // isJunction is false there since only one axis touches that point, so it falls
    // through to 0 and the two segments still meet perfectly flush. Rounding that
    // seam too (an earlier version of this did) carves a small notch out of an
    // otherwise straight wall, since each segment's end curves away independently
    // with nothing on the other side to fill the gap it leaves.
    const capR = 3, bevelR = 5;
    // Only the REACHING side of a plain 2-way bend gets rounded -- the pulled-back
    // side's corner sits entirely underneath the reaching side's footprint anyway
    // (that's the whole point of the hub-claiming trim), so rounding it too was
    // never visible, just redundant. At a T or cross (isSimpleBend false) neither
    // side rounds at all: with 3+ segments sharing that point, whichever one reaches
    // can only cover its OWN width across the hub, not the full gap left by every
    // through-segment pulling back, so a rounded corner there doesn't fully close --
    // a small notch, the same shape of bug as the original overshoot bulge, just
    // inverted (a bite taken out instead of a tab sticking out).
    // Radii also grow with lw (by the same amount the layer's width grew past th0),
    // matching the endShift change above -- with a fixed radius but a reach/width
    // that's now longer by growPx, the rim's arc would just be top's arc translated
    // sideways rather than a true concentric offset, which stays visible as a border
    // along one part of the curve and vanishes (or worse, tucks under top) on the
    // opposite part. Growing the radius by the same growPx keeps both layers' arcs
    // centered on the same point, so the rim traces a uniform ring around the curve.
    const radiusFor = (x, y, axis, lw) => {
      const grow = (lw - th0)/2;
      if (isDeadEnd(x,y)) return capR + grow;
      if (isSimpleBend(x,y) && axis === 'h') return bevelR + grow;
      return 0;
    };
    // Per-corner version for horizontal segments: even at a plain 2-way bend, the
    // reaching end has TWO corners (top and bottom), and only one of them is truly
    // outer. The other sits flush against wherever the attached vertical wall's body
    // is, and that vertical wall stops short of the joint (its own pull-back trim),
    // so a rounded corner on that side carves out a gap nothing else fills. Returns
    // [topR, botR] for the corner at point (px,py).
    const hRadii = (px, py, lw) => {
      const grow = (lw - th0)/2;
      if (isDeadEnd(px,py)) { const r = capR + grow; return [r, r]; }
      if (isSimpleBend(px,py)){
        const v = otherEndV.get(capKey(px,py));
        if (v) { const r = bevelR + grow; return v.y < py ? [0, r] : [r, 0]; }
      }
      return [0, 0];
    };
    // ctx2 is a parameter rather than closing over `g` directly, so the top layer can
    // be redrawn a second time onto its own scratch canvas for the speckle pass below
    // without duplicating this logic. Filled rounded boxes instead of a stroked line
    // -- a stroke's cap/join can't carry two independent per-end radii the way
    // roundRect's four corner radii can, which is what lets a dead end and a junction
    // at the two opposite ends of the same segment bevel differently.
    const box = (ctx2, lw, col, dx, dy) => {
      ctx2.fillStyle = col;
      ctx2.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
        const [tx1,ty1,tx2,ty2] = trimmedEnds(x1,y1,x2,y2, lw);
        // segs are stored low-to-high (x then y) and trimming only moves endpoints
        // inward, so tx1<=tx2 (horizontal) / ty1<=ty2 (vertical) always holds --
        // x1,y1 is always the near/left (or top) point, x2,y2 the far/right (or
        // bottom) one. Horizontal segments use hRadii for independent top/bottom
        // corner radii at each end (see comment above); vertical segments still use
        // the simpler radiusFor since they only ever round at true dead ends.
        if (axis === 'h'){
          const [aTop, aBot] = hRadii(x1,y1,lw), [bTop, bBot] = hRadii(x2,y2,lw);
          ctx2.roundRect(tx1+dx, y1-lw/2+dy, tx2-tx1, lw, [aTop,bTop,bBot,aBot]);
        } else {
          const rA = radiusFor(x1,y1,axis,lw), rB = radiusFor(x2,y2,axis,lw);
          ctx2.roundRect(x1-lw/2+dx, ty1+dy, lw, ty2-ty1, [rA,rA,rB,rB]);
        }
      }
      ctx2.fill();
    };
    const wk = cs/42;
    // Three layers now, back to front: a long, faint cast SHADOW; a short, solid
    // WALL riser it's cast from; then the rim/HEDGE fill drawn further below. Each
    // is swept from the wall's own footprint (offset 0,0 -- exactly where the rim
    // is about to be drawn, so its corners land flush on the rim's own corners) out
    // to its own throw in small steps, all in one opaque colour per layer. Step
    // count scales with the actual pixel distance being swept (roughly one step per
    // half pixel) so consecutive steps always overlap by more than the anti-aliased
    // edge and fuse into one hard-edged solid shape, no matter how far a given layer
    // throws at a given cell size -- a fixed step count that looked smooth at a
    // short throw would visibly band at a longer one. Both are drawn before the
    // rim/top below, so either one crossing under a neighbouring wall gets cut off
    // by that wall's own opaque body, same as a real shadow would be interrupted by
    // anything solid in its path.
    const sweepSteps = (dx, dy) => Math.max(10, Math.ceil(Math.hypot(dx, dy) / 0.5));
    // SHADOW: long throw, low opacity. Built on its own scratch canvas at full
    // opacity first, then composited once at 0.25 -- setting globalAlpha to 0.25 for
    // each of the many overlapping sweep steps directly would have every overlap
    // between consecutive steps compound (each one blending semi-transparently over
    // the last), banding the shadow into rings of increasing opacity instead of
    // leaving it one flat, even 25% tone.
    const LONG_SHADOW_MULT = 6;
    const shadowDX = 1.5*wk*LONG_SHADOW_MULT, shadowDY = 4.5*wk*LONG_SHADOW_MULT;
    const shadowSteps = sweepSteps(shadowDX, shadowDY);
    const shadowTmp = document.createElement('canvas');
    shadowTmp.width = Math.max(1, Math.ceil(w));
    shadowTmp.height = Math.max(1, Math.ceil(h));
    const shadowTg = shadowTmp.getContext('2d');
    for (let i=0;i<=shadowSteps;i++){
      const t = i/shadowSteps;
      box(shadowTg, th0 + growPx*2, pal.shadow + '1)', shadowDX*t, shadowDY*t);
    }
    g.save(); g.globalAlpha = 0.25; g.drawImage(shadowTmp, 0, 0); g.restore();
    // WALL: short throw, full opacity -- no banding risk at full opacity, so this
    // one draws straight onto g instead of needing its own scratch canvas.
    const wallDX = 1.5*wk, wallDY = 4.5*wk;
    const wallSteps = sweepSteps(wallDX, wallDY);
    for (let i=0;i<=wallSteps;i++){
      const t = i/wallSteps;
      box(g, th0 + growPx*2, pal.shadow + '1)', wallDX*t, wallDY*t);
    }
    // many small, irregular bumps rather than a few large ones -- same technique the
    // original capsule-based gardenHedge used, just seeded per trimmed segment here
    // instead of per cell, and layered onto the stroke silhouette as decoration
    // rather than defining it. Placed on the UNTRIMMED span so a short dead-end
    // stub still gets its own little cluster of tufts instead of none at all.
    const bumps = (ctx2, th, grow, col) => {
      ctx2.fillStyle = col;
      ctx2.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const horiz = Math.abs(x2-x1) >= Math.abs(y2-y1);
        const seed = x1*131.7 + y1*57.3 + x2*7.1 + y2*3.3;
        const step = Math.max(5, cs*0.24);
        const len = Math.hypot(x2-x1,y2-y1) || 1;
        const x0 = Math.min(x1,x2), y0 = Math.min(y1,y2);
        for (let m = 0; step*(m + 0.5) < len; m++){
          const d = step*(m + 0.5);
          const j = (hash(seed + m*7.71, 5) - 0.5)*step*0.5;
          const k1 = hash(seed + m*4.13, 3), k2 = hash(seed + m*5.91, 9);
          const rr1 = th0*(0.14 + k1*0.20) + grow, rr2 = th0*(0.14 + k2*0.20) + grow;
          const push1 = th/2 - rr1*0.70, push2 = th/2 - rr2*0.70;
          if (horiz){
            ctx2.moveTo(x0+d+j+rr1, y1-push1); ctx2.arc(x0+d+j, y1-push1, rr1, 0, 7);
            ctx2.moveTo(x0+d+j+rr2, y1+push2); ctx2.arc(x0+d+j, y1+push2, rr2, 0, 7);
          } else {
            ctx2.moveTo(x1-push1+rr1, y0+d+j); ctx2.arc(x1-push1, y0+d+j, rr1, 0, 7);
            ctx2.moveTo(x1+push2+rr2, y0+d+j); ctx2.arc(x1+push2, y0+d+j, rr2, 0, 7);
          }
        }
      }
      ctx2.fill();
    };
    // HEDGE_WALL_BUMPS: false for clean straight edges, true for the scalloped bushy
    // look -- the trim/junction logic above is unaffected either way, since the bumps
    // are decoration layered on top of the stroke silhouette, not part of it.
    const HEDGE_WALL_BUMPS = false;
    // dark rim (grown 2px border, same fixed amount the old hedge used) straight onto
    // the real context -- it's a flat colour, nothing to speckle
    box(g, th0 + growPx*2, pal.wallBase, 0, 0);
    if (HEDGE_WALL_BUMPS) bumps(g, th0 + growPx*2, growPx, pal.wallBase);
    // the lighter top fill, trimmed the same way so its tip is flush against the rim.
    // Speckle only belongs on this layer, and 'source-atop' paints over EVERYTHING
    // already on the destination -- grass, path, the rim we just drew -- not just
    // whatever we drew most recently. So the top fill is built on its own blank
    // scratch canvas first, speckled there in isolation, then the whole result is
    // composited onto the real context in one drawImage -- same visual effect as the
    // old capsule-fill's g.clip(), which doesn't apply here since a stroke plus loose
    // bump circles isn't one closed path a clip could capture.
    if (w !== undefined && h !== undefined){
      const tmp = document.createElement('canvas');
      tmp.width = Math.max(1, Math.ceil(w));
      tmp.height = Math.max(1, Math.ceil(h));
      const tg = tmp.getContext('2d');
      box(tg, th0, pal.wallLiner, 0, 0);
      if (HEDGE_WALL_BUMPS) bumps(tg, th0, 0, pal.wallLiner);
      tg.save();
      tg.globalCompositeOperation = 'source-atop';
      tg.fillStyle = cardAnchor(hedgeSpeckle(pal.speckle, pal.speckleThresh), wox, woy);
      tg.fillRect(0, 0, w, h);
      tg.restore();
      g.drawImage(tmp, 0, 0);
    } else {
      box(g, th0, pal.wallLiner, 0, 0);
      if (HEDGE_WALL_BUMPS) bumps(g, th0, 0, pal.wallLiner);
    }
  }

  function gardenHedge(g, ox, oy, c0, r0, c1, r1, layer, bumps, wallExtend){
    if (bumps === undefined) bumps = true;
    if (wallExtend === undefined) wallExtend = 0;
    // hedgeDegAt(x,y) (built for the old tile system, but purely topological -- it doesn't
    // care which renderer uses it) tells us how many wall segments meet a grid vertex.
    // Degree 1 is a true dead end: nothing continues past it, so that tip is squared off.
    // Degree 2+ is a straight-through point, a bend, a T, or a cross -- something keeps
    // going, so that end stays rounded and gets fused into the join by the overlap, same
    // as before. gardenHedge itself uses hedgeLiveDegAt (below), the fog-aware version,
    // for the actual rounding decision.
    if (hedgeLevelVer !== levelVer) rebuildHedgeGeometry();
    const s = cellSize;
    const th0 = Math.max(5, s*0.357);
    const growPx = 2;   // fixed border thickness in px, not proportional to cell size
    const grown = layer === 'dark';
    const th = grown ? th0 + growPx*2 : th0;
    const grow = grown ? growPx : 0;
    const dot = (x,y,r) => { g.moveTo(x+r, y); g.arc(x, y, r, 0, 7); };
    g.beginPath();
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r), w = cells[i].walls;
      const x = c*s - ox, y = r*s - oy;
      const known = (dc,dr) => {
        if (gSeen(i)) return true;
        const nc = c+dc, nr = r+dr;
        return nc>=0 && nc<cols && nr>=0 && nr<rows && gSeen(idx(nc,nr));
      };
      // Many small, irregular lobes rather than a few large ones: big evenly-sized bumps
      // read as individual things stuck onto the wall (bubbles, growths); a denser
      // scatter of smaller bumps with independently randomised size and position on
      // each side of the wall reads as foliage instead. The two edges of a run no
      // longer share the same size/offset draw (they used to be mirrored, one just
      // 0.9x the other) -- decorrelating them breaks the "paired twin blob" look.
      const run = (x0, y0, horiz, seed, gx0, gy0, gx1, gy1) => {
        const capR = 3;   // small bevel on true dead ends, not fully square
        // Every join (bend, T, cross) is squared off rather than rounded at rFull.
        // A short 1-cell dead-end stub off a T-junction is barely longer than it is
        // wide, so rounding BOTH its base (the join) and its tip made it read as a
        // separate round blob pinched onto the wall instead of part of it. Squaring
        // the join just fills the box's own rectangle there instead of drawing a
        // separate arc, so the stub flows out flush like a notch -- closer to how a
        // thin centerline stroke with a mitered join (no flare at the joint at all)
        // reads. This also incidentally fixed the old wallExtend overshoot bulge at
        // live joins on vertical segments, since squared now applies there too.
        const joinR = 0;
        const rA = hedgeLiveDegAt(gx0, gy0) <= 1 ? capR : joinR;
        const rB = hedgeLiveDegAt(gx1, gy1) <= 1 ? capR : joinR;
        // wallExtend stretches the south edge of the capsule's own box straight down
        // (no horizontal shift). For a horizontal segment that's purely a thickness
        // change -- its left/right reach never moves, so it can't overshoot a join no
        // matter what's rounded there. For a vertical segment it's a length change:
        // the box's own south edge is what gets pushed past the far vertex. Squaring
        // that corner (above) stopped it from drawing a separate arc out there, but
        // the box itself was still reaching past the vertex -- a flush square nub
        // instead of a round one, same overshoot. If that far vertex is a live join,
        // there's nothing structurally there to sit on, and the segment on the other
        // side of that join covers its own footprint, not this one's overshoot -- so
        // only extend a vertical segment's far end when it's actually a dead end
        // (where reading as a grounded foot is the point).
        const vExtend = (!horiz && wallExtend > 0 && hedgeLiveDegAt(gx1, gy1) > 1) ? 0 : wallExtend;
        if (horiz) g.roundRect(x0 - th/2 - grow, y0 - th/2, s + th + grow*2, th + wallExtend, [rA, rB, rB, rA]);
        else       g.roundRect(x0 - th/2, y0 - th/2 - grow, th, s + th + grow*2 + vExtend, [rA, rA, rB, rB]);
        if (!bumps) return;   // wall-face pass: straight capsule only, no scallops
        const step = Math.max(5, cellSize*0.24);
        for (let n = 0; step*(n + 0.5) < s; n++){
          const d = step*(n + 0.5);
          const j = (hash(seed + n*7.71, 5) - 0.5)*step*0.5;
          const k1 = hash(seed + n*4.13, 3), k2 = hash(seed + n*5.91, 9);
          const rr1 = th0*(0.14 + k1*0.20) + grow, rr2 = th0*(0.14 + k2*0.20) + grow;
          const push1 = th/2 - rr1*0.70, push2 = th/2 - rr2*0.70;  // seated, not perched
          if (horiz){ dot(x0+d+j, y0 - push1, rr1); dot(x0+d+j, y0 + push2, rr2); }
          else      { dot(x0 - push1, y0+d+j, rr1); dot(x0 + push2, y0+d+j, rr2); }
        }
      };
      const seed = c*131.7 + r*57.3;
      if (w[0] && known(0,-1)) run(x, y, true,  seed,       c,   r,   c+1, r  );
      if (w[3] && known(-1,0)) run(x, y, false, seed + 1.7, c,   r,   c,   r+1);
      if (w[1] && c===cols-1 && gSeen(i)) run(x + s, y, false, seed + 3.4, c+1, r,   c+1, r+1);
      if (w[2] && r===rows-1 && gSeen(i)) run(x, y + s, true,  seed + 5.1, c,   r+1, c+1, r+1);
    }
  }

  /* The cloud. One square per unreached cell, unioned into a sheet; a corner takes a
     radius only when both edges meeting there are exposed, so cells that carry on join
     square and the bank stays one piece. The inset bites only on exposed sides too —
     apply it all round and the upper sheets come apart into a tiled grid. Cells overlap
     their neighbours slightly, because an exactly abutting seam antialiases into a
     visible lattice. The field runs two cells past the layer, so nothing at the frame
     has an outside and the sheet reaches the edge flush. */
  // Boundary for the cloud layer, clipped to still-foggy cells so no sheet's blur/
  // offset can spill onto an already-seen cell (a stray white/gray sliver landing on
  // a freshly revealed hedge corner, which a rounded corner's art doesn't fully cover
  // the way a straight run's wall thickness does). This used to be raw, un-rounded
  // per-cell squares -- safe, but a hard-cornered mask cutting into the sheets' own
  // smoothly rounded silhouette left small rectangular notches (one per cell corner)
  // along what should read as one continuous curve. Reusing gardenFog's own rounded/
  // inset shape instead -- slightly less rounded and with no inset, so it's a strict
  // superset of the sheets it's clipping (they all round at FOG_RAD with some inset,
  // which only ever shrinks them further) -- keeps the mask a curve that matches the
  // sheets' own instead of fighting it, even after their small per-sheet nudges.
  function gardenFogMask(g, ox, oy, c0, r0, c1, r1){
    gardenFog(g, ox, oy, c0, r0, c1, r1, cellSize*0.40, 0);
  }
  function gardenFog(g, ox, oy, c0, r0, c1, r1, rad, inset){
    const s = cellSize, ov = Math.max(0.6, s*0.014), ins = inset || 0;
    g.beginPath();
    for (let r=r0-2; r<=r1+2; r++) for (let c=c0-2; c<=c1+2; c++){
      if (!gFoggy(c,r)) continue;
      const n = gFoggy(c,r-1), so = gFoggy(c,r+1), w = gFoggy(c-1,r), e = gFoggy(c+1,r);
      const x0 = c*s - ox + (w ? -ov : ins), x1 = (c+1)*s - ox + (e ? ov : -ins);
      const y0 = r*s - oy + (n ? -ov : ins), y1 = (r+1)*s - oy + (so ? ov : -ins);
      g.roundRect(x0, y0, x1-x0, y1-y0,
        [ (!n && !w) ? rad : 0, (!n && !e) ? rad : 0,
          (!so && !e) ? rad : 0, (!so && !w) ? rad : 0 ]);
      const fil = rad*0.55, cxp = c*s - ox, cyp = r*s - oy;
      const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
      if (n  && w && !gFoggy(c-1,r-1)) nook(cxp, cyp);
      if (n  && e && !gFoggy(c+1,r-1)) nook(cxp + s, cyp);
      if (so && e && !gFoggy(c+1,r+1)) nook(cxp + s, cyp + s);
      if (so && w && !gFoggy(c-1,r+1)) nook(cxp, cyp + s);
    }
  }

  // The path is a strip of paper laid on the grass — a darker sheet with a lighter one
  // on top, the same two-sheet logic as everything else here. Points are the committed
  // cells; the live stub out to where you actually are is drawn on top, every frame.
  function gardenPathAt(g, ox, oy, upto){
    const s = cellSize, n = upto === undefined ? trail.length : upto;
    if (n < 1) return false;
    const at = i => [(cx(trail[i])+0.5)*s - ox, (cy(trail[i])+0.5)*s - oy];
    g.beginPath();
    const [x0,y0] = at(0); g.moveTo(x0, y0);
    for (let i=1; i<n-1; i++){
      const [ax,ay] = at(i), [bx,by] = at(i+1);
      g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
    }
    if (n > 1){ const [lx,ly] = at(n-1); g.lineTo(lx, ly); }
    return true;
  }

  function drawGarden(t){
    ctx.clearRect(0,0,viewW,viewH);
    const needW = viewW + BAKE_M*2, needH = viewH + BAKE_M*2;
    const stale = bakeVer !== fogVer || bakeCell !== cellSize
               || bakeW !== needW || bakeH !== needH
               || camX < bakeX || camY < bakeY
               || camX + viewW > bakeX + needW || camY + viewH > bakeY + needH;
    if (stale){
      if (!bakeCv || bakeW !== needW || bakeH !== needH){
        bakeCv = document.createElement('canvas');
        bakeW = needW; bakeH = needH;
      }
      bakeCv.width = Math.round(needW*dpr); bakeCv.height = Math.round(needH*dpr);
      bakeX = camX - BAKE_M; bakeY = camY - BAKE_M;
      bakeVer = fogVer; bakeCell = cellSize;
      const bg = bakeCv.getContext('2d');
      bg.setTransform(dpr,0,0,dpr,0,0);
      bakeGarden(bg, bakeX, bakeY, needW, needH);
    }
    ctx.drawImage(bakeCv, Math.round(bakeX - camX), Math.round(bakeY - camY), bakeW, bakeH);
    gardenActors(t);
  }

  // Spring only: small hedge-top blossoms built from petal/petalPink/pollen, colours
  // GARDEN_PALETTES already carried for every look but nothing drew with until now.
  // A single small blossom -- a ring of petals (alternating the palette's two petal
  // tones for a little variety) around a pollen-coloured centre, rotated per-instance
  // so a cluster doesn't read as identical stamped copies.
  function drawFlower(g, cx, cy, r, pal, seed){
    const rot = hash(seed, 51)*Math.PI*2;
    const petals = 5;
    g.save(); g.translate(cx, cy); g.rotate(rot);
    for (let i=0;i<petals;i++){
      g.save(); g.rotate((i/petals)*Math.PI*2);
      g.beginPath();
      g.ellipse(0, -r*0.62, r*0.42, r*0.62, 0, 0, Math.PI*2);
      g.fillStyle = (i%2===0) ? pal.petal : pal.petalPink;
      g.fill();
      g.restore();
    }
    g.beginPath(); g.arc(0, 0, r*0.36, 0, Math.PI*2);
    g.fillStyle = pal.pollen; g.fill();
    g.restore();
  }
  // Scatters blossoms along the hedge's own wall segments -- sparse and seeded off
  // each segment's own coordinates (same technique the wall's leaf-bump texture
  // already uses), so it's stable frame to frame rather than reshuffling.
  function drawHedgeBlooms(g, segs, cs, pal){
    const th0 = Math.max(5, cs*0.357);
    const step = Math.max(cs*0.55, 16);
    for (let n=0; n<segs.length; n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const len = Math.hypot(x2-x1, y2-y1) || 1;
      const ux = (x2-x1)/len, uy = (y2-y1)/len;
      const nx = -uy, ny = ux;
      const seed = x1*131.7 + y1*57.3 + x2*7.1 + y2*3.3;
      for (let m=0; step*(m+0.5) < len; m++){
        if (hash(seed + m*9.1, 41) > 0.3) continue;
        const d = step*(m+0.5) + (hash(seed+m*3.3, 42)-0.5)*step*0.5;
        const across = (hash(seed+m*5.7, 43)-0.5)*th0*0.55;
        const px = x1 + ux*d + nx*across, py = y1 + uy*d + ny*across;
        const r = cs*(0.045 + hash(seed+m, 44)*0.025);
        drawFlower(g, px, py, r, pal, seed + m*1.7);
      }
    }
  }

  // Fall only: small piles of leaves (built from the same rust/gold speckle colours)
  // tucked into every inside corner of the hedge. A soft ground shadow first so a
  // pile reads as sitting on the grass, then several flattened, randomly rotated
  // ellipses standing in for leaves, scattered within a small radius.
  function drawLeafPile(g, cx, cy, r, colors, seed){
    g.save();
    g.fillStyle = 'rgba(20,14,4,.28)';
    g.beginPath(); g.ellipse(cx, cy + r*0.16, r*0.95, r*0.55, 0, 0, Math.PI*2); g.fill();
    g.restore();

    const count = 8;
    for (let i=0;i<count;i++){
      const a = hash(seed + i*3.1, 81) * Math.PI*2;
      const d = hash(seed + i*5.7, 82) * r*0.4;
      const lx = cx + Math.cos(a)*d, ly = cy + Math.sin(a)*d*0.55;
      const rot = hash(seed + i*7.3, 83) * Math.PI*2;
      const lr = r * (0.34 + hash(seed + i*2.1, 84)*0.21);
      g.save();
      g.translate(lx, ly);
      g.rotate(rot);
      g.beginPath();
      g.ellipse(0, 0, lr, lr*0.5, 0, 0, Math.PI*2);
      g.fillStyle = colors[i % colors.length];
      g.fill();
      g.restore();
    }
  }
  // Walks every seen cell and checks its four corners for a wall on both adjacent
  // sides (e.g. a wall to the north AND to the west means that corner is a genuine
  // inside corner of the hedge, not just an open edge) -- that's the pocket wind
  // would actually pile leaves into. Sparse: not every qualifying corner gets a
  // pile, seeded off the cell/corner so it's stable frame to frame. The inset (0.62
  // cell widths along the diagonal) clears the wall's own half-thickness plus the
  // pile's own leaf spread, so piles land on the grass rather than on the wall.
  function drawGardenLeafPiles(g, ox, oy, w, h, colors){
    const s = cellSize;
    const c0 = Math.max(0, Math.floor(ox/s)), r0 = Math.max(0, Math.floor(oy/s));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/s)), r1 = Math.min(rows-1, Math.ceil((oy+h)/s));
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r);
      if (!gSeen(i)) continue;
      const wl = cells[i].walls;
      const n = wl[0], e = wl[1], s2 = wl[2], w2 = wl[3];
      const x = c*s - ox, y = r*s - oy;
      const corners = [];
      if (n && w2) corners.push([x, y, 1, 1]);
      if (n && e) corners.push([x+s, y, -1, 1]);
      if (s2 && w2) corners.push([x, y+s, 1, -1]);
      if (s2 && e) corners.push([x+s, y+s, -1, -1]);
      corners.forEach(([cx, cy, dirx, diry], ci) => {
        const seed = c*17.3 + r*9.1 + ci*3.7;
        if (hash(seed, 71) > 0.55) return;
        const inset = s*0.62;
        const norm = Math.SQRT1_2;
        const px = cx + dirx*norm*inset, py = cy + diry*norm*inset;
        drawLeafPile(g, px, py, s*0.17, colors, seed + 11);
      });
    }
  }

  function bakeGarden(g, ox, oy, w, h){
    const s = cellSize, k = s/42;
    const c0 = Math.max(0, Math.floor(ox/s)), r0 = Math.max(0, Math.floor(oy/s));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/s)), r1 = Math.min(rows-1, Math.ceil((oy+h)/s));

    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), ox, oy); g.fillRect(0,0,w,h);

    // The hedge's wall-face extrusion goes down first, before the path -- it's the
    // ground-level base/ shadow of the wall, and the path sits on the ground too, so
    // where the trail runs close beside a wall it should read as in front of that base,
    // not chopped off by it. The rim + top (the wall's actual standing body) still draw
    // after the path further down, so the wall itself correctly covers the trail if they
    // ever truly overlap -- only the extruded "shadow" area yields to the path.
    // The card world's stroke-based wall renderer (drawCardWalls) is used below,
    // after the path -- it draws its own offset shadow, so no separate extrusion
    // pass is needed here the way gardenHedge's capsule fill required.

    // the trail you have laid, under everything else on the ground -- same thin +
    // soft glow technique every world uses now, coloured from the current look's
    // own thread pair instead of the old garden-only two-tone path strip.
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (gardenPathAt(g, ox, oy)){
      g.strokeStyle = TRAIL_HALO; g.lineWidth = s*0.28; g.stroke();
      gardenPathAt(g, ox, oy);
      g.strokeStyle = TRAIL_THREAD; g.lineWidth = s*0.09; g.stroke();
    }

    // what grows in the corridor, off the path you wore walking it
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r);
      if (!gSeen(i)) continue;
      const x = c*s - ox, y = r*s - oy;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + s*0.19 + hash(c,r,32)*s*0.62, sy = y + s*0.19 + hash(c,r,33)*s*0.62;
        g.fillStyle = GARDEN.spark;
        const sr = s*0.107;
        g.beginPath();
        g.moveTo(sx, sy-sr); g.quadraticCurveTo(sx, sy, sx+sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy+sr); g.quadraticCurveTo(sx, sy, sx-sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy-sr); g.fill();
      }
    }

    // the hedge: two-layer procedural capsule wall (gardenHedge), not the PNG stamps --
    // dark rim layer, then the top fill layer with a speckle grain clipped onto it for
    // texture. Drawn BEFORE the cloud (the cloud used to be under the hedge, so any piece
    // that was "known" -- even via the lenient any-touching-cell-seen rule -- always
    // painted fully solid, visible right through fog that hadn't actually cleared over its
    // own cell yet). Now the cloud is the top layer again, so a hedge piece only reads as
    // fully revealed once the fog over its own footprint is gone -- otherwise it's
    // dimmed/hidden under cloud like everything else that isn't seen yet.
    // (The wall-face extrusion itself was already drawn above, before the path, so the
    // trail reads in front of it.) The dark rim goes now -- no shadow properties
    // active here, just the uniform grown-outward peek border.
    // HEDGE_BUMPS: false for clean straight-edged walls (no scallop texture), true
    // for the bushy hand-drawn look -- flip this one flag to compare the two.
    // The hedge wall, drawn with the same stroke-based corrugated-wall renderer the
    // card world uses (drawCardWalls) instead of gardenHedge's capsule fill. A short
    // dead-end stub reads as a thin flush line-ending here rather than a wide rounded
    // (or squared) capsule tab, so it no longer stands out as a separate poking-out
    // shape the way the capsule technique's stubs did -- same maze, same dead-end
    // count, far less visually prominent. Recoloured green via the pal argument
    // instead of card's cardboard palette; the geometry/trim logic is untouched.
    // shadow and wallBase (the rim/border) both pinned to the same #246534 -- one flat
    // colour for both instead of GARDEN.hedgeLo for the border and a separate rgba for
    // the shadow, so the solid wall face and the border it grows out of read as the
    // same material rather than two shades that happen to be close.
    // Bloom (peak-summer growth) and Fall (see GARDEN_PALETTES[LOOK.FALL] above) both
    // depart from the plain "fixed dark rim + GARDEN.hedgeMid fill" treatment every
    // other look still uses -- Bloom reverses which colour is the flat fill and which
    // is the speckle (the fill becomes the fixed dark green, so the hedge reads as
    // dense, shaded growth, and the old fill colour becomes a lighter speckle instead);
    // Fall pulls its rim from hedgeLo and its speckle from the palette's own explicit
    // duo-tone `speckle` field, at a lower (denser) threshold. #163d1f/rgba(22,61,31,
    // is the precomputed dark shade of the #246534 border used for Bloom's rim.
    let HEDGE_WALL_PAL;
    if (curLook === LOOK.BLOOM){
      HEDGE_WALL_PAL = {
        shadow: 'rgba(22,61,31,', wallBase: '#163d1f', wallLiner: '#246534',
        speckle: 'rgba('+toRGB(GARDEN.hedgeMid).join(',')+',.5)',
      };
    } else if (curLook === LOOK.FALL){
      HEDGE_WALL_PAL = {
        shadow: 'rgba('+toRGB(GARDEN.hedgeLo).join(',')+',', wallBase: GARDEN.hedgeLo,
        wallLiner: GARDEN.hedgeMid, speckle: GARDEN.speckle, speckleThresh: 0.65,
      };
    } else {
      HEDGE_WALL_PAL = { shadow:'rgba(36,101,52,', wallBase:'#246534', wallLiner:GARDEN.hedgeMid };
    }
    {
      const rawSegs = [];
      for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
        const i = idx(c,r), wl = cells[i].walls;
        const x = c*s - ox, y = r*s - oy;
        const known2 = (dc,dr) => {
          if (gSeen(i)) return true;
          const nc = c+dc, nr = r+dr;
          return nc>=0 && nc<cols && nr>=0 && nr<rows && gSeen(idx(nc,nr));
        };
        if (wl[0] && known2(0,-1)) rawSegs.push(x, y, x+s, y);
        if (wl[3] && known2(-1,0)) rawSegs.push(x, y, x, y+s);
        if (wl[1] && known2(1,0))  rawSegs.push(x+s, y, x+s, y+s);
        if (wl[2] && known2(0,1))  rawSegs.push(x, y+s, x+s, y+s);
      }
      const segMap = new Map();
      for (let n=0;n<rawSegs.length;n+=4){
        const x1=rawSegs[n],y1=rawSegs[n+1],x2=rawSegs[n+2],y2=rawSegs[n+3];
        const a=[Math.round(x1*4),Math.round(y1*4)], b=[Math.round(x2*4),Math.round(y2*4)];
        const [p,q] = (a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) ? [a,b] : [b,a];
        segMap.set(p[0]+','+p[1]+','+q[0]+','+q[1], [x1,y1,x2,y2]);
      }
      const segs2 = [];
      segMap.forEach(sv => segs2.push(sv[0],sv[1],sv[2],sv[3]));
      drawHedgeWalls(g, segs2, s, k, ox, oy, HEDGE_WALL_PAL, w, h);
      if (curLook === LOOK.SPRING) drawHedgeBlooms(g, segs2, s, GARDEN);
      if (curLook === LOOK.FALL) drawGardenLeafPiles(g, ox, oy, w, h, GARDEN.speckle);
    }

    // the cloud: three sheets, each clipped to the exact set of still-foggy cells
    // (gardenFogMask) so none of the three sheets' blur/offset can spill onto an
    // already-seen cell -- that's what used to read as fog "cutting off" a corner
    // that had just been drawn. With the clip, a foggy cell's cloud can only ever
    // cover that cell's own square, so it sits over an early-revealed hedge piece
    // cleanly, right up to the cell boundary, instead of in some blobby shape that
    // doesn't line up with the grid.
    // Each of the three paper sheets is nudged up-left by its own amount (the torn-
    // layers look), but a single clip mask built once, before any of those nudges,
    // stays put in its own original spot -- so a shifted sheet's soft rounded edge
    // was getting sliced by a mask window that no longer lined up with it, which is
    // exactly what read as a flat, hard cut instead of a soft edge. Re-deriving the
    // mask separately inside each sheet's own translated frame keeps the clip window
    // riding along with that sheet, so it always cuts relative to where that sheet's
    // rounded shape actually sits, not where the untranslated base sheet sits.
    // The three sheets used to round each at its own radius (.40/.42/.46) -- close,
    // but not equal, so one sheet's corner arc wasn't a true concentric shrink of the
    // next one's. Where a rounded corner cell sits beside a straight-run cell (square
    // corner, only one edge exposed there), the straight cell's unrounded corner and
    // the rounded neighbour's arc no longer met at quite the same tangent once their
    // radii differed -- which is what read as tiny rectangular teeth notched into the
    // curve. Rounding every sheet at the same FOG_RAD keeps every sheet's corner a
    // plain scaled/shifted copy of the others, so they nest as smooth concentric
    // curves instead.
    const FOG_RAD = s*0.42;
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k;
    g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    gardenFogMask(g, ox, oy, c0, r0, c1, r1);
    g.clip();
    gardenFog(g, ox, oy, c0, r0, c1, r1, FOG_RAD, 0);
    g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    gardenFogMask(g, ox, oy, c0, r0, c1, r1);
    g.clip();
    gardenFog(g, ox, oy, c0, r0, c1, r1, FOG_RAD, 1.5*k);
    g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 4*k, oy + 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    gardenFogMask(g, ox, oy, c0, r0, c1, r1);
    g.clip();
    gardenFog(g, ox, oy, c0, r0, c1, r1, FOG_RAD, 5*k);
    g.fillStyle = GARDEN.cloudHi; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 9*k, oy + 13*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
  }

  // only the things that move between steps
  // windGlyph/WIND_LINES/windLinePath: the garden's original wind-fuel pickup art --
  // three curled, travelling-highlight lines. Superseded by the uploaded sun icon
  // (drawSunIcon, defined up near drawGoalToken/drawExitBasket) and left defined but
  // unused, same convention as drawVanes/drawWindmill/drawOlliToken.
  const WIND_LINES = [
    { y:-0.30, len:0.42, curl:0.15, curlDir: 1, dx:0.29 },  // top -- nudged left off its mirrored spot, clear of the middle line's own curl
    { y: 0,    len:0.62, curl:0.19, curlDir: 1  },          // middle
    { y: 0.16, len:0.46, curl:0.15, curlDir: -1 },          // bottom -- pulled up toward the middle line
  ];
  function windLinePath(scale, ln){
    const x0 = -scale*0.55, x1 = x0 + scale*ln.len;
    if (ln.curl){
      // the loop leads the line: a small hook the line unwinds out of, curling up or
      // down depending on the line, then continuing straight out
      const r = scale*ln.curl;
      if (ln.curlDir < 0){
        ctx.arc(x0, scale*ln.y + r, r, -Math.PI/2 - Math.PI*1.5, -Math.PI/2, false);
      } else {
        ctx.arc(x0, scale*ln.y - r, r, Math.PI/2 + Math.PI*1.5, Math.PI/2, true);
      }
      ctx.lineTo(x1, scale*ln.y);
    } else {
      ctx.moveTo(x0, scale*ln.y);
      ctx.lineTo(x1, scale*ln.y);
    }
  }
  function windGlyph(cx0, cy0, s, intensity, t, seed){
    // pulled from the garden's own current-season palette (spark), same as the
    // sparkle decorations sceneGarden already paints, rather than a fixed colour --
    // this is the one wind-fuel pickup a garden level has, so it reskins with the
    // season the way the rest of the world's art already does
    const spark = toRGB(GARDEN.spark).join(',');
    const scale = s*0.34;
    ctx.save();
    ctx.translate(cx0, cy0);
    ctx.scale(-1, 1);
    ctx.lineCap = 'round';
    WIND_LINES.forEach((ln, li) => {
      const arcLen = ln.curl ? scale*ln.curl*1.5*Math.PI : 0;   // the curl's own 270° hook
      const totalLen = arcLen + scale*ln.len;
      const dashLen = totalLen*0.9, gapLen = totalLen*0.6, cyc = dashLen+gapLen;
      const offset = ((t/1000 + seed*0.4)*scale*0.9 + li*(cyc/3)) % cyc;
      ctx.save();
      if (ln.dx) ctx.translate(scale*ln.dx, 0);
      ctx.setLineDash([dashLen, gapLen]);
      ctx.lineDashOffset = offset;
      // a dark outline, drawn first with the exact same dash pattern/offset so it
      // frames just the travelling highlight itself rather than reintroducing a
      // separate always-on base line -- some seasons' grass (frost's pale near-white,
      // fall's gold) leave the bright spark colour alone with too little contrast,
      // and a neutral dark edge reads against any of them. Both strokes also got a
      // bit thicker for the same reason.
      ctx.strokeStyle = `rgba(4,6,9,${(0.45*intensity).toFixed(3)})`;
      ctx.lineWidth = Math.max(2.2, scale*0.17);
      ctx.beginPath(); windLinePath(scale, ln); ctx.stroke();
      ctx.strokeStyle = `rgba(${spark},${(0.98*intensity).toFixed(3)})`;
      ctx.lineWidth = Math.max(1.8, scale*0.13);
      ctx.beginPath(); windLinePath(scale, ln); ctx.stroke();
      ctx.restore();
    });
    ctx.restore();
  }
  function drawGusts(t){
    const head = trail[trail.length-1];
    const lowLight = 1 - light;
    const nearRange = 6 + lowLight*6;
    const boost = 1 + lowLight*0.9;
    flames.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.7 : Math.max(0, 0.8 - dCells/(nearRange+4)));
      intensity = Math.min(1, intensity*boost);
      if (intensity <= 0.03) return;
      const bob = Math.sin(t/900 + i*1.7)*cellSize*0.06;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + bob;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      drawSunIcon(ctx, sx, sy, cellSize*0.44, intensity, t, i);
    });
  }

  // Vanes: the garden's exit key — a tiny toy pinwheel, not a glow. Embers read as a
  // light source (soft radial + a dot); a vane needs to read as an object instead, so
  // there's no ambient glow here at all. Bold, evenly-filled blades on a clean continuous
  // spin — the rotation itself carries the "this is a pinwheel" read, so the blades don't
  // need an alternating-opacity trick to sell it.
  function drawVanes(t){
    const head = trail[trail.length-1];
    const pink = T.beaconRGB, nearRange = 5;
    embers.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.6 : Math.max(0, 0.7 - dCells/(nearRange+4)));
      if (intensity <= 0.02) return;
      const spin = t/900 + i;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + Math.sin(t/700 + i)*cellSize*0.05;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      // a thin ring that breathes outward and fades — reads as "pick this up" without
      // filling in like a light source the way the embers' glow does
      const pulse = (t/900 + i*0.6) % 1;
      ctx.beginPath(); ctx.arc(sx, sy, cellSize*(0.20 + 0.24*pulse), 0, 7);
      ctx.strokeStyle = `rgba(${pink},${0.55*(1-pulse)*intensity})`;
      ctx.lineWidth = Math.max(1, cellSize*0.025); ctx.stroke();
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(spin);
      // a wedge disc with a scalloped, pinking-shears-style rim. Wedges and rim are built
      // from the exact same vertex list rather than a clip()'d arc — `beginPath()` wipes
      // the whole current path regardless of save()/restore(), so drawing each wedge with
      // its own beginPath() was silently erasing the rim path before it got stroked,
      // leaving only the last wedge outlined. Sharing one vertex array sidesteps that.
      const outline = Math.max(2.2, cellSize*0.045);
      const r = cellSize*0.20, bump = cellSize*0.03, n = 16, wedges = 8, perW = n/wedges;
      const pts = [];
      for (let k=0;k<n;k++){
        const a = (k/n)*Math.PI*2;
        const rr = r + (k%2 ? bump : -bump*0.4);
        pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
      }
      for (let w=0; w<wedges; w++){
        ctx.beginPath(); ctx.moveTo(0,0);
        for (let s=0; s<=perW; s++){ const p = pts[(w*perW+s) % n]; ctx.lineTo(p[0], p[1]); }
        ctx.closePath();
        ctx.fillStyle = w%2 ? `rgba(${pink},${0.92*intensity})` : `rgba(${T.coreRGB},${0.92*intensity})`;
        ctx.fill();
      }
      ctx.beginPath();
      pts.forEach((p,idx)=>{ if (idx===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
      ctx.closePath();
      ctx.lineJoin = 'round';
      ctx.strokeStyle = `rgba(4,6,9,${0.72*intensity})`; ctx.lineWidth = outline;
      ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.06, 0, 7);
      ctx.fillStyle = `rgba(${pink},${0.95*intensity})`; ctx.fill();
      ctx.strokeStyle = `rgba(4,6,9,${0.72*intensity})`; ctx.lineWidth = outline*0.85; ctx.stroke();
    });
  }

  // The windmill: the garden's beacon. Sealed and still until enough vanes are gathered,
  // then it turns — the same closed-until-earned beat the mine's beacon has, just wind
  // instead of light. Vanes fill in one at a time as emberGot climbs toward emberNeed.
  function drawWindmill(t){
    const head = trail[trail.length-1];
    const open = exitOpen();
    const bx=(cx(endCell)+0.5)*cellSize, by=(cy(endCell)+0.5)*cellSize;
    const hx=(cx(head)+0.5)*cellSize, hy=(cy(head)+0.5)*cellSize;
    const dCells = Math.hypot(bx-hx, by-hy)/cellSize;
    const intensity = Math.max(0.05, Math.min(1, 1 - dCells/16)) * (open ? 1 : 0.5);
    const sx = bx - camX, sy = by - camY;
    const pink = T.beaconRGB;
    const onScreen = sx>-cellSize && sx<viewW+cellSize && sy>-cellSize && sy<viewH+cellSize;
    if (onScreen){
      const rad = cellSize*(0.8 + 2.4*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${pink},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${pink},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      if (explored.has(endCell)){
        // a short post, so the blades read as mounted rather than floating
        ctx.strokeStyle = `rgba(4,6,9,0.55)`; ctx.lineWidth = Math.max(2, cellSize*0.055);
        ctx.beginPath(); ctx.moveTo(sx, sy+cellSize*0.06); ctx.lineTo(sx, sy+cellSize*0.34); ctx.stroke();
        const nVanes = 4;
        const filled = open ? nVanes : Math.max(0, Math.min(nVanes, Math.round(nVanes * (emberGot/Math.max(1,emberNeed)))));
        const spin = open ? t/240 : 0;
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(spin);
        // a wedge disc with a scalloped rim, matching the vane pickup — four quadrant
        // slices instead of eight, sharing one vertex list with the rim (see the note on
        // the vane pickup: separate beginPath() calls per wedge were wiping the rim path
        // before it got stroked, so only the last wedge ever showed an outline).
        const r = cellSize*(0.24+0.07*intensity), bump = cellSize*0.045, n = 16, perW = n/nVanes;
        const outline = Math.max(2.4, cellSize*0.05);
        const pts = [];
        for (let k=0;k<n;k++){
          const a = (k/n)*Math.PI*2;
          const rr = r + (k%2 ? bump : -bump*0.4);
          pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
        }
        for (let w=0; w<nVanes; w++){
          ctx.beginPath(); ctx.moveTo(0,0);
          for (let s=0; s<=perW; s++){ const p = pts[(w*perW+s) % n]; ctx.lineTo(p[0], p[1]); }
          ctx.closePath();
          if (w < filled) ctx.fillStyle = w%2 ? `rgba(${pink},${0.6+0.35*intensity})` : `rgba(${T.coreRGB},${0.6+0.35*intensity})`;
          else ctx.fillStyle = `rgba(${pink},0.12)`;
          ctx.fill();
        }
        ctx.beginPath();
        pts.forEach((p,idx)=>{ if (idx===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
        ctx.closePath();
        ctx.lineJoin = 'round';
        ctx.strokeStyle = `rgba(4,6,9,${0.7*intensity})`; ctx.lineWidth = outline;
        ctx.stroke();
        ctx.restore();
        ctx.beginPath(); ctx.arc(sx,sy, cellSize*(open?0.14:0.10), 0, 7);
        ctx.fillStyle = open ? getVar('--beacon') : `rgba(${T.coreRGB},0.9)`; ctx.fill();
        ctx.strokeStyle = `rgba(4,6,9,0.7)`; ctx.lineWidth = outline*0.85; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.1*intensity+2,0,7);
        ctx.fillStyle=`rgba(${pink},${0.6*intensity})`; ctx.fill();
      }
    } else {
      // edge compass: which way the windmill is
      const ccx=viewW/2, ccy=viewH/2, dx=sx-ccx, dy=sy-ccy, m=24;
      const tx = dx!==0 ? ((dx>0?viewW-m:m)-ccx)/dx : Infinity;
      const ty = dy!==0 ? ((dy>0?viewH-m:m)-ccy)/dy : Infinity;
      const tt = Math.min(Math.abs(tx),Math.abs(ty));
      const ex=ccx+dx*tt, ey=ccy+dy*tt, ang=Math.atan2(dy,dx);
      ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
      ctx.globalAlpha = (open ? 0.3 : 0.18) + 0.5*intensity; ctx.fillStyle = getVar('--beacon');
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
  }

  function gardenActors(t){
    // The hedge world gets the same exit basket as mining and card now, in place of
    // its own windmill/pinwheel beacon (drawWindmill is left defined but unused,
    // same convention as drawVanes below).
    drawBeacon(t);
    // was drawVanes(t) -- the garden's own spinning-pinwheel pickup art, from before
    // the goal item became one fixed icon in every world. drawEmbers() already carries
    // that icon now (see drawGoalToken), so the garden pickups render the same way
    // iso/card's do; drawVanes() itself is left defined but unused rather than deleted.
    drawEmbers(t);
    drawGusts(t);
    drawBlooms();

    // where you actually are -- same thin + soft glow trail technique as the baked
    // portion, and every other world.
    const s = cellSize, head = trail[trail.length-1];
    const hx = (cx(head)+0.5)*s - camX, hy = (cy(head)+0.5)*s - camY;
    const bx = tipX - camX, by = tipY - camY;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (Math.hypot(bx-hx, by-hy) > s*0.04){
      ctx.strokeStyle = TRAIL_HALO; ctx.lineWidth = s*0.28;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
      ctx.strokeStyle = TRAIL_THREAD; ctx.lineWidth = s*0.09;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx, by); ctx.stroke();
    }

    // point so it halos around him instead of showing as its own bright disc.
    ctx.save();
    ctx.shadowColor = 'rgba(255,206,110,.95)'; ctx.shadowBlur = s*0.55;
    ctx.fillStyle = 'rgba(255,206,110,.01)';
    ctx.beginPath(); ctx.arc(bx, by, s*0.04, 0, 7); ctx.fill();
    ctx.restore();
    // The two-tone bead -- same fixed-green head marker as every other world.
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = s*0.08; ctx.shadowOffsetY = s*0.03;
    ctx.fillStyle = OLLI_GREEN_DK;
    ctx.beginPath(); ctx.arc(bx, by, s*0.16, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = OLLI_GREEN;
    ctx.beginPath(); ctx.arc(bx, by-s*0.015, s*0.13, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(bx-s*0.045, by-s*0.06, s*0.05, s*0.03, -0.5, 0, 7); ctx.fill();
  }


  /* ---- skin: card -------------------------------------------------------------
     A paper world: the maze is a sheet of single-wall corrugated board laid on a
     table and cut into one square flap per cell. Ground you have not reached is
     still covered. As the light finds a cell its flap lifts on one edge, turns past
     vertical to show its liner side, and fades out, and the walls stand up out of
     the slots underneath. The flutes only show on a cut edge — which is why the top
     of every wall reads as board and the flat of a flap does not.

     Board is fibre, and a flat fill reads as plastic no matter how good the shadow
     is, so the stock is a repeating tile of fibres and flecks anchored to world
     coordinates. Drawing it as a pattern rather than a level-sized bitmap is what
     lets the same texture serve a scrolling world at any cell size.

     A flap that is still shut never moves, so the shut ones bake into a world-
     anchored layer along with the table, the board and the walls, exactly as the
     hedge does. Only the handful mid-turn are drawn live — of some two hundred flaps
     on screen, three or four are moving at once.
     ---------------------------------------------------------------------------- */
  const CARD = {
    table:'#f5edd9', tableInk:'rgba(160,140,100,.09)', tableLit:'rgba(255,255,250,.30)',
    board:'#83a058', boardEdge:'rgba(58,78,36,.5)', slot:'rgba(40,44,26,.5)',
    face:'#bd8749', back:'#dcbc8e', core:'#f0e2c2', edge:'#8a5f2c',
    shadow:'rgba(58,40,18,', flute:'rgba(112,78,34,.6)',
    wallBase:'#5B3A15', wallLiner:'#BB8E51',            // the custom corrugated wall art
    yarnDark:'#9e3a26', yarn:'#c94f36', yarnLit:'#e08068',
  };
  // The wall's cross-section, lifted from the user's own wall.svg (125x22 viewBox, v2):
  // a dark base the full thickness of the wall, a liner band top and bottom, a single
  // continuous flute wave between them, and a solid liner cap at any exposed cut end.
  // Constants below are the exact control points from that SVG's one clean repeat (the
  // cycle from x=59.7736 to x=77.4064), kept relative to the strip's own centreline —
  // top and bottom are not quite symmetric in the source art, so they're tracked
  // separately rather than as one shared amplitude — and re-scaled by
  // k = actualThickness/20.6401 so it holds its proportions at any cell size.
  const WALL_SVG = {
    thick: 20.6401, band: 3, stroke: 2, capW: 3.468,
    period: 17.6328,
    topAmp: -5.01422, topCtrl: -6.63338, botAmp: 4.86135, botCtrl: 7.29005,
    ctrl1X: 0.6916, ctrl2X: 2.9868, capEndX: 3.6785,
    troughX: 7.8968, ctrl3X: 8.9342, ctrl4X: 12.3771, cap2EndX: 13.4145,
  };
  // Two independently-drawn wall segments that happen to be collinear (any straight
  // run longer than one cell) used to each restart the wave's phase at their own local
  // 0 — which made the curve jump and double back on itself at every cell boundary.
  // Anchoring the phase to the segment's absolute world position instead means any two
  // collinear segments land on the exact same curve, so drawing them independently
  // still reads as one continuous wave with no seam.
  // The phase has to key off the wall's position in the *world*, not its position in
  // whatever buffer it happens to be drawn into. Wall segments are baked in coordinates
  // local to the bake tile (`c*cellSize - ox`), and that tile's origin moves whenever the
  // camera pans or the fog re-bakes — so keying off the local x/y re-seeded the wave
  // against a moving datum and the flutes crawled along the wall as the map opened up.
  // wox/woy convert back to absolute world position, which never moves.
  function wallFlutePhaseStart(x1, y1, ux, uy, period, wox, woy){
    const horiz = Math.abs(ux) >= Math.abs(uy);
    const axisPos = (horiz ? x1 + (wox||0) : y1 + (woy||0));
    const axisDir = horiz ? ux : uy;
    const base = (((-axisDir*axisPos) % period) + period) % period;
    return base - period;   // one period of lead-in, so there's always a full curve to clip against
  }
  function wallFluteSegment(g, x1, y1, x2, y2, thick, wox, woy){
    const S = WALL_SVG, k = thick / S.thick;
    const len = Math.hypot(x2-x1, y2-y1); if (len < 1) return;
    const ux = (x2-x1)/len, uy = (y2-y1)/len, nx = -uy, ny = ux;
    const pt = (d, off) => [x1+ux*d+nx*off, y1+uy*d+ny*off];
    const period = S.period*k;
    const topAmp=S.topAmp*k, topCtrl=S.topCtrl*k, botAmp=S.botAmp*k, botCtrl=S.botCtrl*k;
    let first = true;
    for (let d0 = wallFlutePhaseStart(x1,y1,ux,uy,period,wox,woy); d0 < len+period; d0 += period){
      const p0 = pt(d0, topAmp);
      if (first){ g.moveTo(p0[0], p0[1]); first = false; }
      const c1 = pt(d0+S.ctrl1X*k, topCtrl), c2 = pt(d0+S.ctrl2X*k, topCtrl), p1 = pt(d0+S.capEndX*k, topAmp);
      g.bezierCurveTo(c1[0],c1[1], c2[0],c2[1], p1[0],p1[1]);
      const p2 = pt(d0+S.troughX*k, botAmp);
      g.lineTo(p2[0], p2[1]);
      const c3 = pt(d0+S.ctrl3X*k, botCtrl), c4 = pt(d0+S.ctrl4X*k, botCtrl), p3 = pt(d0+S.cap2EndX*k, botAmp);
      g.bezierCurveTo(c3[0],c3[1], c4[0],c4[1], p3[0],p3[1]);
      const p4 = pt(d0+period, topAmp);
      g.lineTo(p4[0], p4[1]);
    }
  }
  /* ---- the yarn's twist ----------------------------------------------------------
     The strand's body is stroked as a midpoint-smoothed curve, but the twist marks
     used to be spaced along the raw corner points instead. Wherever the path bends the
     curve cuts the corner and the raw polyline does not, so near every turn the marks
     were laid across ground the strand had already curved away from — which is what
     made them spill outside it.

     Two things fix it. `yarnSamples` walks the exact same smoothed curve the body is
     stroked from, so a mark is always square to the strand it sits on; and the marks
     are composited with 'source-atop' into a scratch layer holding just the strand, so
     even on the tightest bend a mark is cut off at the strand's edge rather than
     hanging over it. Because containment is guaranteed, the marks can run the full
     width edge to edge and read as a real ply instead of a short centred tick.
     ------------------------------------------------------------------------------ */
  function yarnSamples(P, per){
    if (P.length < 2) return P.slice();
    const out = [{ x:P[0].x, y:P[0].y }];
    let cur = out[0];
    for (let i=1; i<P.length-1; i++){
      const m = { x:(P[i].x+P[i+1].x)/2, y:(P[i].y+P[i+1].y)/2 };
      for (let s=1; s<=per; s++){
        const u = s/per, iu = 1-u;
        out.push({ x: iu*iu*cur.x + 2*iu*u*P[i].x + u*u*m.x,
                   y: iu*iu*cur.y + 2*iu*u*P[i].y + u*u*m.y });
      }
      cur = m;
    }
    out.push({ x:P[P.length-1].x, y:P[P.length-1].y });
    return out;
  }
  // the ply marks: slanted chords at an even arc-length spacing along the strand
  function yarnTwistPath(g, S, cs){
    const half = cs*0.086, slant = cs*0.052, step = cs*0.132;
    g.beginPath();
    let dist = 0, next = step*0.5;
    for (let i=1; i<S.length; i++){
      const x1=S[i-1].x, y1=S[i-1].y, x2=S[i].x, y2=S[i].y;
      const segLen = Math.hypot(x2-x1, y2-y1);
      if (segLen < 1e-6) continue;
      const ux=(x2-x1)/segLen, uy=(y2-y1)/segLen, nx=-uy, ny=ux;
      while (next <= dist + segLen){
        const d = next - dist, bx = x1+ux*d, by = y1+uy*d;
        g.moveTo(bx - nx*half - ux*slant, by - ny*half - uy*slant);
        g.lineTo(bx + nx*half + ux*slant, by + ny*half + uy*slant);
        next += step;

    }

  let yarnCv = null;
  function yarnLayer(w, h, scale){
    if (!yarnCv) yarnCv = document.createElement('canvas');
    const pw = Math.max(1, Math.round(w*scale)), ph = Math.max(1, Math.round(h*scale));
    if (yarnCv.width !== pw || yarnCv.height !== ph){ yarnCv.width = pw; yarnCv.height = ph; }
    const c = yarnCv.getContext('2d');
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.clearRect(0, 0, w, h);
    return c;
  }
  // strand core + ply, built in the scratch layer and stamped down in one piece

    const c = yarnLayer(w, h, scale);
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = CARD.yarn; c.lineWidth = cs*0.155;
    strokeCore(c);
    c.globalCompositeOperation = 'source-atop';
    c.strokeStyle = CARD.yarnLit; c.lineWidth = Math.max(1, cs*0.052); c.lineCap = 'butt';
    yarnTwistPath(c, yarnSamples(pts, 8), cs); c.stroke();
