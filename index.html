        const step = Math.max(6, cs*0.40), seed = n*13.7;
        for (let m = 0; step*(m + 0.5) < len; m++){
          const d = step*(m + 0.5);
          const rr = th*(0.38 + hash(seed + m*4.13, 3)*0.20)*rough;
          const j = (hash(seed + m*7.71, 5) - 0.5)*step*0.34;
          const push = th/2 - rr*0.70;
          if (horiz){ dot(x1+d+j, y1 - push, rr); dot(x1+d+j, y1 + push, rr*0.9); }
          else      { dot(x1 - push, y1+d+j, rr); dot(x1 + push, y1+d+j, rr*0.9); }
        }
      }
    };
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 9*k; g.shadowOffsetX = 3*k; g.shadowOffsetY = 7*k;
    hedge(1.06); g.fillStyle = GARDEN.hedgeLo; g.fill();
    g.restore();
    g.save(); g.translate(-1.5*k, -4.5*k);
    hedge(0.94); g.fillStyle = GARDEN.hedgeMid; g.fill();
    g.save(); g.clip(); g.fillStyle = cardAnchor(paperTile(), 1.5*k, 4.5*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-3*k, -9*k);
    hedge(0.74); g.fillStyle = GARDEN.hedgeHi; g.fill();
    g.restore();

    const fogAt = (c,r) => sceneLit(c,r) <= 0;
    const fog = (rad, ins) => {
      const ov = Math.max(0.6, cs*0.014);
      g.beginPath();
      for (let r=-3; r<=SCENE_H+3; r++) for (let c=-3; c<=SCENE_W+3; c++){
        if (!fogAt(c,r)) continue;
        const n = fogAt(c,r-1), s2 = fogAt(c,r+1), we = fogAt(c-1,r), e = fogAt(c+1,r);
        const x0 = ox + c*cs + (we ? -ov : ins), x1 = ox + (c+1)*cs + (e ? ov : -ins);
        const y0 = oy + r*cs + (n ? -ov : ins), y1 = oy + (r+1)*cs + (s2 ? ov : -ins);
        g.roundRect(x0, y0, x1-x0, y1-y0,
          [ (!n && !we) ? rad : 0, (!n && !e) ? rad : 0,
            (!s2 && !e) ? rad : 0, (!s2 && !we) ? rad : 0 ]);
        const fil = rad*0.55, cxp = ox + c*cs, cyp = oy + r*cs;
        const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
        if (n  && we && !fogAt(c-1,r-1)) nook(cxp, cyp);
        if (n  && e  && !fogAt(c+1,r-1)) nook(cxp + cs, cyp);
        if (s2 && e  && !fogAt(c+1,r+1)) nook(cxp + cs, cyp + cs);
        if (s2 && we && !fogAt(c-1,r+1)) nook(cxp, cyp + cs);
      }
    };
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k; g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    fog(cs*0.40, 0); g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    fog(cs*0.42, 1.5*k); g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip(); g.fillStyle = cardAnchor(paperTile(), 4*k, 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    fog(cs*0.46, 5*k); g.fillStyle = GARDEN.cloudHi; g.fill();
    g.restore();
    const [hx, hy] = pts[pts.length-1];
    g.save();
    g.shadowColor = 'rgba(255,206,110,.95)'; g.shadowBlur = cs*0.55;
    g.fillStyle = GARDEN.lamp;
    g.beginPath(); g.arc(hx, hy, cs*0.13, 0, 7); g.fill();
    g.restore();
    g.fillStyle = GARDEN.lampCore;
    g.beginPath(); g.arc(hx, hy, cs*0.085, 0, 7); g.fill();
    g.strokeStyle = '#f4ecd8'; g.lineWidth = Math.max(1.4, cs*0.055);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.24, 0, 7); g.stroke();
  }

  // Paper: the board, still shut over most of it, and the yarn on what is open
  function scenePaper(g, w, h, cs, ox, oy){
    const k = cs/30;
    g.fillStyle = cardAnchor(cardTile('table'), 0, 0); g.fillRect(0,0,w,h);
    g.save();
    g.shadowColor = CARD.shadow + '.34)'; g.shadowBlur = 9*k; g.shadowOffsetY = 4*k;
    g.fillStyle = CARD.board;
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();
    g.save(); g.globalAlpha = 0.20;
    g.fillStyle = cardAnchor(cardTile('back'), 0, 0);
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();

    // the same corrugated wall the board draws — sceneWalls can hand the same physical
    // wall in from both of its cells, so it gets the identical dedup the board does
    // before any of the corner or end-cap logic sees it
    const rawScene = sceneWalls(cs, ox, oy);
    const sceneMap = new Map();
    for (let n=0;n<rawScene.length;n+=4){
      const x1=rawScene[n],y1=rawScene[n+1],x2=rawScene[n+2],y2=rawScene[n+3];
      const a=[Math.round(x1*4),Math.round(y1*4)], b=[Math.round(x2*4),Math.round(y2*4)];
      const [p,q] = (a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) ? [a,b] : [b,a];
      sceneMap.set(p[0]+','+p[1]+','+q[0]+','+q[1], [x1,y1,x2,y2]);
    }
    const segs = [];
    sceneMap.forEach(s => segs.push(s[0],s[1],s[2],s[3]));
    drawCardWalls(g, segs, cs, k, 0, 0);

    const pts = scenePts(cs, ox, oy), head = pts[pts.length-1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save();
    g.shadowColor = CARD.shadow + '.45)'; g.shadowBlur = cs*0.10; g.shadowOffsetY = cs*0.05;
    g.strokeStyle = CARD.yarnDark; g.lineWidth = cs*0.20; sceneStroke(g, pts);
    g.restore();
    // core + twist together, same containment the live board uses
    yarnBodyAndTwist(g, pts.map(p => ({x:p[0], y:p[1]})), cs, w, h,
                     Math.min(window.devicePixelRatio || 1, 2),
                     (c) => sceneStroke(c, pts));
    g.strokeStyle = '#f4ecd8'; g.lineWidth = Math.max(1.4, cs*0.06);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.24, 0, 7); g.stroke();
    g.save();
    g.shadowColor = CARD.shadow + '.45)'; g.shadowBlur = cs*0.12; g.shadowOffsetY = cs*0.055;
    g.fillStyle = CARD.yarnDark; g.beginPath(); g.arc(head[0], head[1], cs*0.19, 0, 7); g.fill();
    g.restore();
    g.fillStyle = CARD.yarn; g.beginPath(); g.arc(head[0], head[1], cs*0.147, 0, 7); g.fill();

    // every flap still shut, plus one caught mid-turn so the card shows what it does
    const shut = [];
    for (let r=-1; r<=SCENE_H; r++) for (let c=-1; c<=SCENE_W; c++)
      if (sceneLit(c,r) <= 0) shut.push(c, r);
    const save = [cellSize, camX, camY];
    cellSize = cs; camX = -ox; camY = -oy;              // flapPath works in world space
    cardShutFlaps(g, -ox, -oy, shut, k);
    // one caught partway, opening as shutters exactly as it does in play
    g.save(); g.globalAlpha = 0.92;
    shutterFlap(g, 5, 4, -ox, -oy, 0.55, k);
    g.restore();
    cellSize = save[0]; camX = save[1]; camY = save[2];
  }

  const SCENES = [sceneLantern, sceneGarden, scenePaper];
  function paintScene(cv, wi){
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);
    // the corridor is centred on the card; the grid runs off every edge behind it
    const cs = r.width/5.2, ox = -cs*0.45, oy = r.height/2 - 4.5*cs;
    (SCENES[wi] || SCENES[0])(g, r.width, r.height, cs, ox, oy);
  }

  // the world's furniture, cut from the world's own material
  const CARD_MAT = [
    { mat:'pixel', edge:'#c0532a', acc:'#8a3a1c', onacc:'#f6efe2',
      tag:'#ffc06a', tagink:'rgba(6,9,12,.85)', fibre:null },
    { mat:'hedge', edge:'#2c7038', acc:'#eef7e6', onacc:'#2c7038',
      tag:'#ffffff', tagink:'rgba(28,68,30,.8)', fibre:'hedge' },
    { mat:'kraft', edge:'#8a5f2c', acc:'#7a4f22', onacc:'#f0e2c2',
      tag:'#f4ecd8', tagink:'rgba(52,36,18,.85)', fibre:'kraft' },
  ];
  const fibreCache = {};
  function fibreURL(kind){
    if (fibreCache[kind] !== undefined) return fibreCache[kind];
    let cv = null;
    if (kind === 'hedge'){ paperTile(); cv = paperTileCv; }
    else if (kind === 'kraft'){ cardTile('face'); cv = cardTileCv.face; }
    fibreCache[kind] = cv ? `url(${cv.toDataURL()})` : 'none';
    return fibreCache[kind];
  }
  // which level PLAY drops you into: the one you are on if it is in this world,
  // otherwise the first you have not finished
  function playTarget(wi){
    const a = wi*LEVELS_PER_WORLD;
    if (worldOf(cur) === wi) return cur;
    return Math.max(a, Math.min(a + LEVELS_PER_WORLD - 1, beaten));
  }

  function buildMap(){
    const deck = document.getElementById('mapDeck');
    let cards = '';
    WORLDS.forEach((w, wi) => {
      const a = wi*LEVELS_PER_WORLD, seen = PREVIEW_UNLOCK || beaten >= a;
      const M = CARD_MAT[wi] || CARD_MAT[0];
      let rail = '';
      for (let l=0; l<LEVELS_PER_WORLD; l++){
        const i = a+l, done = i<beaten, locked = !PREVIEW_UNLOCK && i>beaten;
        const st = levelStat(i), held = i!==cur && !done && st && st.started;
        const cls = 'lv' + (done?' done':'') + (locked?' locked':'')
                  + (i===cur?' cur':'') + (held?' held':'');
        const face = done ? CHECK : (locked ? LOCK : (l+1));
        rail += `<button data-i="${i}" ${locked?'disabled':''} class="${cls}">`
              + `<span class="lvn">${face}</span></button>`;
      }
      const on = worldOf(cur) === wi, s = on ? levelStat(cur) : null;
      const stat = `<div class="cstat${on?'':' hide'}">`
        + `<span class="cgauge"><i style="width:${Math.round(Math.max(0,Math.min(1,s?s.light:1))*100)}%"></i></span>`
        + `<span>${FLAME}${s?s.got:0}/${s?s.need:0}</span>`
        + `<span>${CLOCK}${fmt(s?s.elapsed:0)}</span></div>`;
      // the shadow takes the world's own hue darkened — not black — and keys off the
      // same colour the page tint does, so card and ground agree about the light
      const shd = toRGB(M.edge).map(c => Math.round(c*0.34 + 10)).join(',');
      cards += `<div class="card${seen?'':' locked'}">`
        + `<div class="frame" style="--edge:${M.edge};--acc:${M.acc};--onacc:${M.onacc};`
        + `--tag:${M.tag};--tagink:${M.tagink};--shd:${shd}">`
        + `<div class="art">`
        +   `<canvas class="scene" data-w="${wi}"></canvas>`
        +   `<div class="cmid"><button class="play mat" data-w="${wi}">Play</button></div>`
        + `</div>`
        + `<div class="cfoot">`
        +   `<div class="cname">${seen ? w.name : '? ? ?'}</div>`
        +   stat
        +   `<div class="lvrail">${rail}</div>`
        + `</div>`
        + `</div></div>`;
    });
    deck.innerHTML = cards;
    deck.querySelectorAll('.lv').forEach(el=>{
      const i = +el.dataset.i;
      if (!(!PREVIEW_UNLOCK && i>beaten))
        el.addEventListener('click', ()=>{ Snd.resume(); Snd.ui(); loadLevel(i); });
    });
    deck.querySelectorAll('.play').forEach(el=>{
      el.addEventListener('click', ()=>{ Snd.resume(); Snd.ui(); loadLevel(playTarget(+el.dataset.w)); });
    });
    requestAnimationFrame(()=>{
      deck.querySelectorAll('canvas.scene').forEach(cv => paintScene(cv, +cv.dataset.w));
    });
    // a card is no longer the width of the deck, so the snap step has to be measured
    const step = () => {
      const c = deck.querySelector('.card');
      return (c ? c.getBoundingClientRect().width : deck.clientWidth) + DECK_GAP;
    };
    // as the deck moves, each card trails it a little, and the trailing is eased so it
    // settles rather than tracking the finger rigidly
    const paint = () => {
      const stp = Math.max(1, step()), sl = deck.scrollLeft;
      const at = Math.round(sl / stp);
      // the peek itself now carries "which world am I on" — no separate dots row to sync
      bgSetWorld(Math.max(0, Math.min(WORLDS.length-1, at)));
      deck.querySelectorAll('.card').forEach((c,k)=>{
        const p = (k*stp - sl) / stp;                 // 0 centred, ±1 one card away
        const aa = Math.min(1, Math.abs(p));
        const ease = Math.sign(p) * (aa*aa*(3 - 2*aa));  // smoothstep: eased at both ends
        // the foot and the button belong to whichever card is nearest the middle, and
        // the threshold sits well inside a full step so they commit rather than dither
        // back and forth while a swipe is still in the air
        c.classList.toggle('active', aa < 0.34);
        // dimming the neighbours used to go down to .55 opacity, which combined with a
        // ~22px sliver read as page margin rather than "another card." Keeping the peek
        // closer to full colour is what actually makes it register as a card at a glance.
        c.style.opacity = (1 - aa*0.22).toFixed(3);
        c.style.transform = `scale(${(1 - aa*0.06).toFixed(4)})`;
        const f = c.querySelector('.frame');
        if (f) f.style.transform = `translateX(${(ease*stp*0.10).toFixed(1)}px)`;
      });
    };
    if (!deck.dataset.wired){
      deck.dataset.wired = '1';
      let queued = false;
      deck.addEventListener('scroll', ()=>{
        if (queued) return;
        queued = true;
        requestAnimationFrame(()=>{ queued = false; paint(); });
      }, { passive:true });
    }
    // open on the world you are actually in
    requestAnimationFrame(()=>{ deck.scrollLeft = worldOf(cur) * step(); paint(); });
  }

  // ---- the menu's ground: the level background, drawn live behind the cards ----
  // Same fill, haze and drifting motes a level uses, so the menu sits in the world it
  // is offering. The world crossfades as you swipe between cards.
  const bgCanvas = document.getElementById('mapBg'), bgCtx = bgCanvas.getContext('2d');
  let bgParts = [], bgWorld = 0, bgRaf = 0;
  function bgSeed(w, h){
    const f = LOOK_FX[WORLDS[bgWorld].art].part;
    bgParts = [];
    for (let i=0; i<f.n; i++) bgParts.push({
      x: Math.random()*w, y: Math.random()*h, ph: Math.random()*Math.PI*2,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
    });
  }
  function bgResize(){
    const r = mapEl.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, 2);
    if (!r.width || !r.height) return;
    bgCanvas.width = Math.round(r.width*d); bgCanvas.height = Math.round(r.height*d);
    bgCanvas.style.width = r.width+'px'; bgCanvas.style.height = r.height+'px';
    bgCtx.setTransform(d,0,0,d,0,0);
    bgSeed(r.width, r.height);
  }
  function bgSetWorld(wi){
    if (wi === bgWorld || !WORLDS[wi]) return;
    bgWorld = wi;
    const f = LOOK_FX[WORLDS[wi].art].part;         // keep positions, take the new motes
    bgParts.forEach(p => { p.r = f.size[0] + Math.random()*(f.size[1]-f.size[0]); });
  }
  /* ---- the page is the card, spread out ------------------------------------------
     The ground behind the deck is the world's own scene rendered at a few dozen pixels
     and then stretched across the whole page. Blowing something that small up is the
     blur — no filter, no per-frame cost — and what comes out is a soft field of exactly
     the colours that are on the card, in roughly the places they sit on it. Light from
     the lantern lands where the lantern is; the dark end of the maze stays dark.

     That is the part that was missing. A tint pulled from a palette can match a card,
     but it cannot be lit by it, so the card always read as pasted on top of a coloured
     sheet. This is derived from the art itself, so it moves when the art does.
     -------------------------------------------------------------------------------- */
  // A plain box blur over the tiny canvas's own pixels, run a few times to approximate a
  // gaussian. This is done once here, baked into the bitmap, rather than leaning on the
  // canvas context's `filter` property in bgFrame every frame — Safari doesn't support
  // `filter` on a 2D context, so that version drew the bloom crisp there instead of soft.
  function boxBlur(data, w, h, r){
    const out = new Uint8ClampedArray(data.length);
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        let sr=0,sg=0,sb=0,sa=0,n=0;
        for (let dy=-r;dy<=r;dy++){
          const yy = Math.min(h-1, Math.max(0, y+dy));
          for (let dx=-r;dx<=r;dx++){
            const xx = Math.min(w-1, Math.max(0, x+dx));
            const i = (yy*w+xx)*4;
            sr+=data[i]; sg+=data[i+1]; sb+=data[i+2]; sa+=data[i+3]; n++;
          }
        }
        const o = (y*w+x)*4;
        out[o]=sr/n; out[o+1]=sg/n; out[o+2]=sb/n; out[o+3]=sa/n;
      }
    }
    return out;
  }

  const mapBloomCache = {};
  function mapBloom(wi){
    if (mapBloomCache[wi] !== undefined) return mapBloomCache[wi];
    let cv = null;
    try {
      cv = document.createElement('canvas');
      cv.width = 34; cv.height = 60;              // deliberately tiny: the upscale is the blur
      const g = cv.getContext('2d');
      const cs = cv.width/5.2, ox = -cs*0.45, oy = cv.height/2 - 4.5*cs;
      (SCENES[wi] || SCENES[0])(g, cv.width, cv.height, cs, ox, oy);
      const id = g.getImageData(0, 0, cv.width, cv.height);
      let data = id.data;
      for (let pass=0; pass<3; pass++) data = boxBlur(data, cv.width, cv.height, 2);
      id.data.set(data);
      g.putImageData(id, 0, 0);
    } catch(e){ cv = null; }                      // a bad frame here must not kill the map
    return (mapBloomCache[wi] = cv);
  }

  function bgFrame(t){
    if (!mapEl.classList.contains('show')){ bgRaf = 0; return; }
    const w = bgCanvas.clientWidth, h = bgCanvas.clientHeight;
    const ai = WORLDS[bgWorld].art, W_ = LOOKS[ai], fx = LOOK_FX[ai], f = fx.part;
    // The ground is the same flat off-white the level panels sit on (topbar, cfoot) —
    // #faf8f3 — rather than a colour pulled from the world, so the page reads as one
    // paper the chrome and the deck are both printed on instead of two different surfaces.
    const idc = (CARD_MAT[bgWorld] || CARD_MAT[0]).edge;
    bgCtx.fillStyle = '#faf8f3';
    bgCtx.fillRect(0,0,w,h);

    // the card's own scene, blown up until it is only light and colour. Drawn wider and
    // taller than the page so the interesting middle of it lands behind the card rather
    // than its edges. SHOW_BLOOM is off for now — comparing the flat paper on its own,
    // with nothing blurred from the level behind it, against the tinted version.
    const SHOW_BLOOM = false;
    const bloom = SHOW_BLOOM ? mapBloom(bgWorld) : null;
    if (bloom){
      const over = 1.5, bw = w*over, bh = h*over;
      bgCtx.globalAlpha = 0.30;
      bgCtx.drawImage(bloom, (w-bw)/2, (h-bh)/2 - h*0.04, bw, bh);
      bgCtx.globalAlpha = 1;
    }

    /* One light, agreeing with the card's own. The pool sits where the card sits and the
       vignette pulls the far corners down, so the page has an up and a down instead of
       being an even field. It breathes on the same slow cycle the lantern does. */
    const cxp = w/2, cyp = h*0.44;
    const tc = toRGB(W_.thread).join(',');
    const breathe = 1 + 0.06*Math.sin(t/2600);
    const glow = bgCtx.createRadialGradient(cxp, cyp, 0, cxp, cyp, Math.max(w,h)*0.72*breathe);
    glow.addColorStop(0,    `rgba(${tc},.20)`);
    glow.addColorStop(0.40, `rgba(${tc},.09)`);
    glow.addColorStop(1,    `rgba(${tc},0)`);
    bgCtx.fillStyle = glow; bgCtx.fillRect(0,0,w,h);

    const dk = toRGB(idc).map(c => Math.round(c*0.5)).join(',');
    const vig = bgCtx.createRadialGradient(cxp, cyp, Math.min(w,h)*0.30,
                                           cxp, cyp, Math.max(w,h)*0.86);
    vig.addColorStop(0, `rgba(${dk},0)`);
    vig.addColorStop(1, `rgba(${dk},.30)`);
    bgCtx.fillStyle = vig; bgCtx.fillRect(0,0,w,h);
    for (const p of bgParts){                        // the same drift a level uses, inked
      p.y += f.vy; p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = h+4; else if (p.y > h+4) p.y = -4;
      if (p.x < -4) p.x = w+4; else if (p.x > w+4) p.x = -4;
      const aa = (f.twinkle ? 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3)) : 0.5) * 0.34;
      bgCtx.fillStyle = `rgba(120,96,64,${aa.toFixed(3)})`;
      bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, 7); bgCtx.fill();
    }
    bgRaf = requestAnimationFrame(bgFrame);
  }
  window.addEventListener('resize', ()=>{ if (mapEl.classList.contains('show')) bgResize(); });
  // a mouse drag does not pan an overflow container, so the deck is dragged by hand;
  // touch is left to the browser's own panning
  (function deckDrag(){
    const deck = document.getElementById('mapDeck');
    let down = false, id = null, startX = 0, startAt = 0, moved = false, swallow = false;
    deck.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      down = true; moved = false; id = e.pointerId;
      startX = e.clientX; startAt = deck.scrollLeft;
      deck.style.scrollSnapType = 'none'; deck.style.scrollBehavior = 'auto';
    });
    window.addEventListener('pointermove', e => {
      if (!down || e.pointerId !== id) return;
      const dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 4) moved = true;   // let a still pointer still be a tap
      if (moved){ deck.scrollLeft = startAt - dx; e.preventDefault(); }
    }, { passive:false });
    window.addEventListener('pointerup', e => {
      if (!down || e.pointerId !== id) return;
      down = false;
      deck.style.scrollSnapType = ''; deck.style.scrollBehavior = '';
      if (moved){                                      // settle on whichever card is nearest
        const step = deck.clientWidth + DECK_GAP;
        deck.scrollTo({ left: Math.round(deck.scrollLeft/step)*step, behavior:'smooth' });
        swallow = true;                                // only the click ending this drag
        setTimeout(()=>{ swallow = false; }, 0);
      }
    });
    deck.addEventListener('click', e => {              // a drag must not also pick a level
      if (swallow){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  })();
  function openMap(){
    pauseClock(); snapLevel();                       // the level you're leaving keeps its place
    winEl.classList.remove('show'); mapEl.classList.add('show');
    document.querySelector('.device').classList.add('menu');
    buildMap();
    bgWorld = worldOf(cur); bgResize();
    if (!bgRaf) bgRaf = requestAnimationFrame(bgFrame);
    Snd.resume(); Snd.ui();
  }
  function hideMap(){ mapEl.classList.remove('show');
    document.querySelector('.device').classList.remove('menu'); if (bgRaf){ cancelAnimationFrame(bgRaf); bgRaf = 0; } }

  const worldW = () => cols*cellSize;
  const worldH = () => rows*cellSize;
  const clampCam = (v, max) => max <= 0 ? max/2 : Math.max(0, Math.min(max, v));

  // ---- layout / sizing ----
  function layout() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    viewW = r.width; viewH = r.height;
    // show ~7 cells across, clamped to a comfortable finger size
    cellSize = Math.max(38, Math.min(66, Math.round(viewW / 7)));
    tCamX = camX = clampCam(camX, worldW()-viewW);
    tCamY = camY = clampCam(camY, worldH()-viewH);
    seedParticles();
  }

  // ---- input ----
  const FINGER_LIFT = 1.15; // active point sits ~1.15 cells above the fingertip so it isn't hidden

  function cellAt(clientX, clientY, lift) {
    const r = canvas.getBoundingClientRect();
    const px = clientX - r.left;
    const py = clientY - r.top - (lift ? FINGER_LIFT*cellSize : 0); // lift only while dragging
    const wx = px + camX, wy = py + camY;
    if (lift) fingerActive = { x: wx, y: wy };
    let c = Math.floor(wx / cellSize), rr = Math.floor(wy / cellSize);
    c = Math.max(0, Math.min(cols-1, c));
    rr = Math.max(0, Math.min(rows-1, rr));
    return idx(c, rr);
  }

  function openNeighbors(i) {
    const c = cx(i), r = cy(i), out = [];
    if (!cells[i].walls[0]) out.push(idx(c, r-1)); // N
    if (!cells[i].walls[1]) out.push(idx(c+1, r)); // E
    if (!cells[i].walls[2]) out.push(idx(c, r+1)); // S
    if (!cells[i].walls[3]) out.push(idx(c-1, r)); // W
    return out;
  }
  const dist = (a, b) => Math.abs(cx(a)-cx(b)) + Math.abs(cy(a)-cy(b));

  // Scatter embers — you must gather a quota of them to open the exit, so they're spread
  // across the maze (biased toward dead ends and side corridors) to force real exploration.
  function placeEmbers(){
    embers = new Set(); emberGot = 0;
    const count = Math.max(4, Math.round(cols*rows * emberDensity));
    const deadEnds = [], others = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell) continue;
      if (dist(i,startCell) < 3) continue;                 // give the opening room to breathe
      (openNeighbors(i).length === 1 ? deadEnds : others).push(i);
    }
    const shuffle = a => { for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];} return a; };
    const pool = shuffle(deadEnds).concat(shuffle(others));
    const chosen = [];
    for (const i of pool){
      if (chosen.length >= count) break;
      if (chosen.every(c => dist(c,i) >= 3)) chosen.push(i);   // keep them spread out
    }
    chosen.forEach(i => embers.add(i));
    emberTotal = embers.size;
    emberNeed = Math.max(1, Math.min(emberTotal, Math.round(emberTotal * needFrac)));
  }

  // Scatter flames — pure light fuel, spread across corridors (not on embers), so keeping the
  // lantern alive is its own hunt, separate from opening the exit.
  function placeFlames(){
    flames = new Set();
    const count = Math.max(4, Math.round(cols*rows * flameDensity));
    const pool = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell || embers.has(i)) continue;
      if (dist(i,startCell) < 4) continue;                 // first flame shouldn't be right at the door
      pool.push(i);
    }
    for (let k=pool.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[pool[k],pool[j]]=[pool[j],pool[k]];}
    const chosen = [];
    for (const i of pool){
      if (chosen.length >= count) break;
      if (chosen.every(c => dist(c,i) >= 4)) chosen.push(i);
    }
    chosen.forEach(i => flames.add(i));
  }
  const exitOpen = () => emberGot >= emberNeed;

  // Cast sight from the head: flood through OPEN corridors only, as far as the lantern reaches.
  // Walls block it, so corners hide what's beyond — you see down your hallway, not through it.
  let fogVer = 0;                 // bumped whenever what is visible changes
  let levelVer = 0;               // bumped on a new deal, so a skin can drop level state
  function reveal(){
    fogVer++;
    sightReach = reachOf(light);
    const maxDepth = Math.max(1, Math.round(sightReach));
    nearDepth = new Map();
    const head = trail[trail.length-1];
    const q = [head]; nearDepth.set(head, 0); explored.add(head);
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi], d = nearDepth.get(i);
      if (d >= maxDepth) continue;
      for (const n of openNeighbors(i)){
        if (!nearDepth.has(n)){ nearDepth.set(n, d+1); explored.add(n); q.push(n); }
      }
    }
  }
  function brightnessOf(i){
    if (won) return 0.62;                                    // the way lights up on arrival
    if (nearDepth.has(i)){
      let b = 1 - nearDepth.get(i)/sightReach;               // smooth falloff that breathes with the light
      b = b<=0 ? 0 : (b>=1 ? 1 : b*b*(3-2*b));
      return Math.max(b, explored.has(i) ? DIM : 0);
    }
    return explored.has(i) ? DIM : 0;
  }

  // One corridor-step: advance into new ground (spending light, gathering embers) or retract
  // back along the thread (free). Shared by dragging and tap-to-walk so they behave identically.
  function applyStep(next){
    const prev = trail.length > 1 ? trail[trail.length-2] : -1;
    if (next === prev){                            // retract — costs no light
      const popped = trail.pop();
      inTrail.delete(popped);
      Snd.trace(trail.length, -1);
    } else {                                        // advance into new ground
      trail.push(next);
      inTrail.add(next);
      Snd.trace(trail.length, 1);
      light = Math.max(0, light - DRAIN);
      if (embers.has(next)){                        // gather an ember (exit key — no light)
        embers.delete(next); emberGot++;
        Snd.ember();
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now(), key:true });
        if (emberGot === emberNeed){                // just enough — the exit opens
          showHint('Enough treats — Olli is coming out');
          Snd.exitOpen();
          blooms.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now(), big:true });
        }
      }
      if (flames.has(next)){                         // gather a flame (light fuel)
        flames.delete(next);
        Snd.flame();
        light = Math.min(1, light + FLAME_GAIN);
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now() });
        if (light > 0.55) warnedLow = false;
      }
      if (!warnedLow && light < CRIT){               // dramatic first warning
        warnedLow = true;
        showHint('Getting dark — find a snack');
        Snd.low();
      }
    }
    reveal();
    if (!started) { started = true; startTime = performance.now(); elHint.style.opacity = '0'; }
    if (next === endCell){
      if (exitOpen()) doWin();
      else {                                        // the way is sealed until the quota is met
        pings.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now() });
        Snd.sealed();
        const remain = emberNeed - emberGot;
        showHint(`Gather ${remain} more treat${remain===1?'':'s'} for Olli`);
      }
    }
  }

  // Shortest corridor route from the head to a tapped cell, staying within what's been seen
  // (so you can't tap your way through the fog). Unique in a perfect maze.
  function bfsPath(from, to){
    if (from === to || !explored.has(to)) return null;
    // tapping onto your own thread simply retraces back to that point
    if (inTrail.has(to)){
      const k = trail.indexOf(to);
      return k < 0 ? null : trail.slice(k, trail.length-1).reverse();
    }
    // otherwise route through seen corridors WITHOUT crossing the existing thread,
    // so with braided loops the line never knots itself
    const prevMap = new Map([[from, -1]]);
    const q = [from];
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      if (i === to) break;
      for (const n of openNeighbors(i)){
        if (!explored.has(n) || prevMap.has(n)) continue;
        if (inTrail.has(n) && n !== to) continue;   // don't walk over the thread
        prevMap.set(n, i); q.push(n);
      }
    }
    if (!prevMap.has(to)) return null;
    const path = []; let cur = to;
    while (cur !== from){ path.push(cur); cur = prevMap.get(cur); }
    return path.reverse();
  }

  // Move the trail head toward the finger cell, one valid corridor-step at a time.
  // Because the finger is physically on the corridor being traced, "step toward finger"
  // reliably follows the path — no global pathfinding needed.
  function stepToward(target) {
    let guard = 0;
    while (guard++ < 24) {
      const head = trail[trail.length-1];
      if (head === target || won) break;
      const prev = trail.length > 1 ? trail[trail.length-2] : -1;
      const nbrs = openNeighbors(head);
      let best = -1, bestD = dist(head, target);
      for (const n of nbrs) {
        const d = dist(n, target);
        if (d >= bestD) continue;                 // must make progress toward the finger
        if (n === prev || !inTrail.has(n)) {      // retrace previous, or explore new
          if (d < bestD) { best = n; bestD = d; }
        }
      }
      if (best === -1) break;
      applyStep(best);
    }
  }

  function onDown(e){
    if (won) return;
    dragging = true; moved = false;
    Snd.resume();
    downX = e.clientX; downY = e.clientY;
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;
    walkQueue.length = 0;                 // a new touch cancels any auto-walk in progress
    const head = trail[trail.length-1];   // start the tip exactly at the head
    tipCell = head; tipT = 0;
    tipX = (cx(head)+0.5)*cellSize; tipY = (cy(head)+0.5)*cellSize;
  }
  function onMove(e){
    if (!dragging || won) return;
    if (!moved && Math.hypot(e.clientX-downX, e.clientY-downY) < DRAG_THRESH) return;
    moved = true;                         // past the threshold: this is a drag
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;   // record; tracing happens per-frame
  }
  function onUp(e){
    if (!won && moved){                   // drag ended mid-edge: round to the nearest cell
      if (tipT >= 0.5) applyStep(tipCell);
    }
    dragging = false; fingerActive = null;
    if (won || moved) return;             // a drag already handled it
    const target = cellAt(e.clientX, e.clientY, false);   // a tap: walk there along the corridor
    const path = bfsPath(trail[trail.length-1], target);
    if (path && path.length){
      walkQueue = path; walkAcc = 0;
      Snd.tap();
      pings.push({ x:(cx(target)+0.5)*cellSize, y:(cy(target)+0.5)*cellSize, t0:performance.now() });
    }
  }

  // ---- smooth corridor-tracking tip ----
  const cellCenter = i => ({ x:(cx(i)+0.5)*cellSize, y:(cy(i)+0.5)*cellSize });
  const fingerWorld = () => ({ x: fingerSX + camX, y: fingerSY - FINGER_LIFT*cellSize + camY });

  // Which open direction the finger is pulling toward from cell h, and how far (0..1) along it.
  function chooseTip(h, F){
    const O = cellCenter(h);
    const dx = F.x-O.x, dy = F.y-O.y, dlen = Math.hypot(dx,dy);
    if (dlen < cellSize*0.06) return { cell:h, t:0 };
    const prev = trail.length>1 ? trail[trail.length-2] : -1;
    const cands = [];
    for (const n of openNeighbors(h)) if (!inTrail.has(n)) cands.push(n); // advance into new ground
    if (prev>=0) cands.push(prev);                                        // or retrace
    if (!cands.length) return { cell:h, t:0 };
    let best=-1, bestScore=-2, bestT=0;
    for (const c of cands){
      const C = cellCenter(c);
      const ex = C.x-O.x, ey = C.y-O.y, el = Math.hypot(ex,ey)||1;
      const align = (dx*ex+dy*ey)/(dlen*el);
      const t = Math.max(0, Math.min(1, (dx*ex+dy*ey)/(el*el)));
      const bias = (c===tipCell) ? 0.12 : 0;   // hysteresis: don't flicker between directions
      if (align+bias > bestScore){ bestScore=align+bias; best=c; bestT=t; }
    }
    if (best<0 || bestScore < 0.12) return { cell:(best>=0?best:h), t:0 }; // finger pulling into a wall
    return { cell:best, t:bestT };
  }

  // Per-frame: commit whole cells the finger has crossed, then set the tip's target.
  function dragUpdate(){
    const F = fingerWorld();
    let head = trail[trail.length-1], guard = 0;
    while (guard++ < 8 && !won){
      const pk = chooseTip(head, F);
      if (pk.t < 0.999) break;              // finger hasn't reached the next centre yet
      applyStep(pk.cell);                   // crossed it — commit (light, embers, fog, win)
      head = trail[trail.length-1];
    }
    if (won){ tipCell=head; tipT=0; return; }
    const pk = chooseTip(head, F);
    tipCell = pk.cell; tipT = pk.t;
  }


  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e); });
  canvas.addEventListener('pointermove', onMove, {passive:false});
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function doWin(){
    if (won) return;
    won = true; dragging = false; fingerActive = null; walkQueue.length = 0;
    dropSave(cur);                                   // a beaten level is dealt fresh next time
    Snd.win();
    beaten = Math.max(beaten, cur+1); saveProgress();
    elapsed = started ? (performance.now() - startTime) : 0;
    document.getElementById('wtime').firstChild.nodeValue = fmt(elapsed);
    document.getElementById('wsteps').firstChild.nodeValue = String(trail.length-1);
    document.getElementById('wembers').firstChild.nodeValue = `${emberGot}/${emberTotal}`;
    const last = cur+1 >= TOTAL;
    const nextBtn = document.getElementById('next');
    nextBtn.textContent = last ? 'Play again' : 'Next level';
    const tags = ["You followed the trail.","Still warm — he was just here.","The snacks kept your glow up.","Closer than yesterday."];
    document.getElementById('wintag').textContent = last ? 'You found him.' : tags[(Math.random()*tags.length)|0];
    document.getElementById('winh2').textContent = last ? 'Olly olly, oxen free!' : 'Found one!';
    setTimeout(()=>winEl.classList.add('show'), 420);
  }

  // ---- camera follow (dead-zone + easing) ----
  function updateCamera(){
    const head = trail[trail.length-1];
    const hx = tipX, hy = tipY;           // follow the smooth tip, not the snapping cell
    if (walkQueue.length > 0){
      // tap-walking: no finger involved, so keep the lantern centred as the maze glides past
      tCamX = (cx(head)+0.5)*cellSize - viewW/2;
      tCamY = (cy(head)+0.5)*cellSize - viewH/2;
    } else {
      // dragging (or idle): hold a still patch of world so the finger maps to a stable cell
      const dzX = viewW*0.24, dzY = viewH*0.22;
      if (hx < tCamX + dzX) tCamX = hx - dzX;
      if (hx > tCamX + viewW - dzX) tCamX = hx - viewW + dzX;
      if (hy < tCamY + dzY) tCamY = hy - dzY;
      if (hy > tCamY + viewH - dzY) tCamY = hy - viewH + dzY;
    }
    tCamX = clampCam(tCamX, worldW()-viewW);
    tCamY = clampCam(tCamY, worldH()-viewH);
    camX += (tCamX - camX) * 0.16;
    camY += (tCamY - camY) * 0.16;
  }

  // ---- per-world atmosphere ----
  let parts = [];
  function seedParticles(){
    const f = LOOK_FX[curLook].part, w = viewW||400, h = viewH||800;
    parts = [];
    for (let k=0;k<f.n;k++) parts.push({
      x: Math.random()*w, y: Math.random()*h,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
      ph: Math.random()*6.28, sp: 0.6 + Math.random()*0.8
    });
  }
  function drawParticles(t){
    const f = LOOK_FX[curLook].part;
    for (const p of parts){
      p.y += f.vy * p.sp;
      p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = viewH+4; else if (p.y > viewH+4) p.y = -4;
      if (p.x < -4) p.x = viewW+4; else if (p.x > viewW+4) p.x = -4;
      let a = 0.5;
      if (f.twinkle) a = 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3));
      if (f.type==='bubble'){
        ctx.strokeStyle = `rgba(${f.color},${a*0.5})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
        ctx.fillStyle = `rgba(${f.color},${a*0.12})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      } else if (f.type==='star'){
        ctx.fillStyle = `rgba(${f.color},${a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${f.color},${a*0.55})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
    }
  }
  // smooth value noise (continuous across cells) for mottled materials
  // ---- Minecraft-Dungeons-style block floor: chunky pixel tiles, one block per cell ----
  const BLOCK = [
    { base:['#3a2620','#472c22','#2f211d','#523228'], acc:['#c85a2a','#e0742f'], mortar:'#20140f', feat:'glow'    }, // Ember  (warm stone)
    { base:['#1f4a52','#256069','#1a3f4a','#2d6b74'], acc:['#4fb0a8','#7fd8c8'], mortar:'#123037', feat:'wave', shades:['#153a44','#1c4c56','#256069','#3a8a92','#6fd2d2'] }, // Tide (rippling water)
    { base:['#4a4f4c','#565b57','#3f443f','#515651'], acc:['#4a6b3a','#5f7d44'], mortar:'#2a2e2b', feat:'moss'    }, // Moss   (mossy cobble)
    { base:['#2f4266','#3a5480','#28384f','#42608f'], acc:['#8fc4ee','#b6dcf7'], mortar:'#1b2942', feat:'sparkle' }, // Gale   (wind-worn stone)
    { base:['#42464a','#4c5054','#3a3e42','#54585c'], acc:['#666a6e','#5a5e62'], mortar:'#26292c', feat:'brick'   }, // Veil   (cracked brick)
    { base:['#a8763c','#b8834a','#9a6a34','#c08e52'], acc:['#e0c08a','#f0e2c2'], mortar:'#7a5426', feat:'moss'    }, // Card   (kraft board)
    { base:['#5f9e46','#6cae4f','#55913f','#77bb58'], acc:['#9ed163','#c8e79a'], mortar:'#3f7a30', feat:'moss'    }, // Bloom  (clipped lawn)
  ];
  const tileCache = {};
  function genTile(w, seed, phase){
    const P = BLOCK[w], N = 16, cnv = document.createElement('canvas'); cnv.width = cnv.height = N;
    const g = cnv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + seed*3.7 + o*19.1)*43758.5453; return n-Math.floor(n); };
    if (P.feat==='wave'){                            // continuous rippling water — no block mortar
      const sh = P.shades, k = Math.PI*2/N;
      for (let y=0;y<N;y++) for (let x=0;x<N;x++){
        const wv = Math.sin(x*k*2 + y*k - phase)*0.6 + Math.sin(x*k - y*k*2 - phase*0.7)*0.4;   // -1..1, seamless
        const lvl = (wv+1)/2;
        g.fillStyle = sh[Math.min(sh.length-1, Math.floor(lvl*sh.length))];
        g.fillRect(x,y,1,1);
      }
      return cnv;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      let col = P.base[Math.floor(R(x,y,1)*P.base.length)];
      if (P.feat==='moss'){
        const m = R(x,y,2)*0.55 + (Math.sin(x*0.55+seed)+Math.sin(y*0.5+seed*1.3))*0.22 + 0.2;
        if (m>0.72) col = P.acc[Math.floor(R(x,y,3)*P.acc.length)];
      } else if (P.feat==='glow')   { if (R(x,y,4)>0.94) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      else if (P.feat==='sparkle')  { if (R(x,y,4)>0.96) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      g.fillStyle = col; g.fillRect(x,y,1,1);
    }
    // mortar bevel around the block so cells read as separate blocks
    g.fillStyle = P.mortar; g.globalAlpha = 0.55;
    g.fillRect(0,0,N,1); g.fillRect(0,N-1,N,1); g.fillRect(0,0,1,N); g.fillRect(N-1,0,1,N);
    g.globalAlpha = 1;
    if (P.feat==='brick'){                          // offset brick mortar + a crack
      g.fillStyle = P.mortar; g.globalAlpha = 0.6;
      g.fillRect(0,7,N,1); g.fillRect(0,15,N,1);
      g.fillRect(8,0,1,8); g.fillRect(4,8,1,8);
      g.globalAlpha = 0.7;
      let cxk = 2 + Math.floor(R(0,0,9)*(N-4));
      for (let y=1;y<N-1;y++){ g.fillRect(cxk,y,1,1); cxk += Math.floor(R(cxk,y,10)*3)-1; cxk = Math.max(1,Math.min(N-2,cxk)); }
      g.globalAlpha = 1;
    }
    if (P.feat==='glow'){                            // a hot vein through the warm stone
      g.fillStyle = P.acc[0]; g.globalAlpha = 0.9;
      let cxk = 2 + Math.floor(R(1,1,11)*(N-4));
      for (let y=2;y<N-2;y++){ if (R(cxk,y,12)>0.35){ g.fillRect(cxk,y,1,1); } cxk += Math.floor(R(cxk,y,13)*3)-1; cxk = Math.max(2,Math.min(N-3,cxk)); }
      g.globalAlpha = 1;
    }
    return cnv;
  }
  function blockTiles(w){
    if (tileCache[w]) return tileCache[w];
    let set;
    if (BLOCK[w].feat==='wave'){
      const frames = [], N = 8;
      for (let f=0; f<N; f++) frames.push(genTile(w, 7, (f/N)*Math.PI*2));
      set = { animated:true, tiles:frames };
    } else {
      const arr = []; for (let v=0;v<4;v++) arr.push(genTile(w, v*97+13, 0));
      set = { animated:false, tiles:arr };
    }
    return (tileCache[w] = set);
  }
  function drawFloorBlock(i,b,x,y,s,t){
    const set = blockTiles(curLook);
    const tile = set.animated
      ? set.tiles[Math.floor(t/120) % set.tiles.length]         // water ripples in sync
      : set.tiles[Math.floor(hash(i,7)*set.tiles.length) % set.tiles.length];
    ctx.globalAlpha = Math.min(1, 0.12 + 0.88*b);
    ctx.drawImage(tile, x, y, s+0.6, s+0.6);        // slight overlap avoids seams when scaled
    ctx.globalAlpha = 1;
  }

  // ---- render ----
  /* ---- skins ----------------------------------------------------------------
     Each world draws itself. Everything above this point is shared — the maze, the
     fog, the thread's position, the camera — and a skin is only ever handed the
     frame time and asked to paint. Adding a world's look means adding one entry to
     SKINS and pointing that world at it; nothing else in the game needs to know.
     -------------------------------------------------------------------------- */
  // Rough fieldstone for the mine walls: irregular-width blocks in a few rows, each with
  // its own bright top bevel, tinted from the world's own wall colour. Row height stays
  // constant and each row's stone widths always sum back to the full tile width, so the
  // pattern still repeats seamlessly even though it isn't a uniform grid. Anchored to
  // world space (via cardAnchor) so it doesn't swim as the camera pans.
  const wallStoneCache = {};
  function wallStoneTile(color, cellPx){
    const key = (color || T.wall) + '@' + Math.round(cellPx || 42);
    if (wallStoneCache[key]) return wallStoneCache[key];
    const rowH = Math.max(7, Math.round((cellPx || 42) * 0.34));
    const N = rowH * 4;
    const rows = [3, 4, 3, 4];              // stones per row — varying the count is what
    const cv = document.createElement('canvas'); cv.width = cv.height = N;   // keeps rows from lining up into a grid
    const g = cv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + o*4.7)*43758.5453; return n-Math.floor(n); };
    g.fillStyle = `rgba(${WALL_SHADOW.join(',')},1)`; g.fillRect(0,0,N,N);   // mortar shows in the gaps
    rows.forEach((cols, rIdx) => {
      const y = rIdx*rowH;
      const raw = []; let sum = 0;
      for (let c=0;c<cols;c++){ const w = 0.65 + R(c,rIdx,1)*0.7; raw.push(w); sum += w; }
      let x = 0, placed = 0;
      for (let c=0;c<cols;c++){
        const w = c===cols-1 ? (N-placed) : Math.round(raw[c]/sum*N);
        const base = shadeRGB(color, 0.16 + R(c,rIdx,2)*0.22);
        const lit  = shadeRGB(color, 0.48 + R(c,rIdx,3)*0.16);
        g.fillStyle = `rgb(${base.join(',')})`;
        g.fillRect(x+1, y+1, Math.max(1,w-2), rowH-2);
        g.fillStyle = `rgb(${lit.join(',')})`;              // bright top bevel per stone
        g.fillRect(x+1, y+1, Math.max(1,w-2), Math.max(1, rowH*0.24));
        x += w; placed += w;
      }
    });
    return (wallStoneCache[key] = ctx.createPattern(cv, 'repeat'));
  }

  function drawIso(t){
    ctx.clearRect(0,0,viewW,viewH);
    // ambient floor
    ctx.fillStyle = T.bg;
    ctx.fillRect(0,0,viewW,viewH);

    const c0 = Math.max(0, Math.floor(camX/cellSize));
    const r0 = Math.max(0, Math.floor(camY/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((camX+viewW)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((camY+viewH)/cellSize));

    // maze under fog: only explored cells render, brightest where the thread's light reaches
    const thread = getVar('--thread');
    const WB = 5, wallBuckets = Array.from({length:WB},()=>[]);   // segments grouped by brightness
    ctx.imageSmoothingEnabled = false;                          // keep the pixel blocks crisp
    for (let r=r0; r<=r1; r++){
      for (let c=c0; c<=c1; c++){
        const i = idx(c,r);
        const b = brightnessOf(i);
        if (b <= 0) continue;                     // unexplored stays dark
        const x = c*cellSize - camX, y = r*cellSize - camY, s = cellSize;
        drawFloorBlock(i, b, x, y, s, t);         // chunky pixel block for this cell
        if (b > DIM){                             // warm lantern light pooled on top
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.05 * b;
          ctx.fillStyle = thread;
          ctx.fillRect(x, y, s, s);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
        }
        const w = cells[i].walls;
        if (w[0]||w[1]||w[2]||w[3]){
          const bkt = wallBuckets[Math.min(WB-1, Math.floor(b*WB))];
          // top/left are always this cell's to declare; right/bottom are the neighbour's
          // to declare too, so only take them here at the edge of the render window (or
          // world) where that neighbour won't get a turn — otherwise the same physical
          // wall gets pushed from both sides and drawn twice.
          if (w[0]) bkt.push(x,y,x+s,y);
          if (w[3]) bkt.push(x,y,x,y+s);
          if (w[1] && (c===c1 || brightnessOf(idx(c+1,r))<=0)) bkt.push(x+s,y,x+s,y+s);
          if (w[2] && (r===r1 || brightnessOf(idx(c,r+1))<=0)) bkt.push(x,y+s,x+s,y+s);
        }
      }
    }
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;

    // walls: solid & opaque, drawn in batched passes — all shadows first, then all cores, then a
    // thin highlight. No transparency and single-stroke-per-batch, so overlaps never show.
    // Same relief as the hedges: thickness and offsets scale with the cell, with a steep
    // mostly-vertical throw between the shadow and the lit edge rather than a flat diagonal.
    const wk = cellSize/42;
    const thick = Math.max(5, cellSize*0.357);
    ctx.lineCap = 'square'; ctx.lineJoin = 'miter';   // flat, but extends half a stroke past each end so an L of two walls meets in a solid corner instead of leaving a notch
    const strokeBuckets = (col, lw, dx, dy, lighten)=>{
      ctx.save(); if (dx||dy) ctx.translate(dx,dy); ctx.lineWidth = lw;
      for (let lvl=0; lvl<WB; lvl++){
        const arr = wallBuckets[lvl]; if (!arr.length) continue;
        const bb = (lvl+0.5)/WB;
        ctx.strokeStyle = mixRGB(col, bgRGB, 1-bb);
        ctx.beginPath();
        for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
        ctx.stroke();
      }
      ctx.restore();
    };
    strokeBuckets(WALL_SHADOW, thick*1.2, 1.5*wk, 4.5*wk);            // drop shadow (opaque)

    // solid raised core, replaced with a world-anchored stone-block pattern so the
    // wall face reads as masonry rather than a flat fill
    ctx.save();
    ctx.lineWidth = thick;
    ctx.strokeStyle = cardAnchor(wallStoneTile(T.wall, cellSize), camX, camY);
    ctx.beginPath();
    for (let lvl=0; lvl<WB; lvl++){
      const arr = wallBuckets[lvl]; if (!arr.length) continue;
      for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
    }
    ctx.stroke();
    ctx.restore();
    // ...and dimmed toward fog per brightness bucket, same falloff the flat fill used
    ctx.save(); ctx.lineWidth = thick;
    for (let lvl=0; lvl<WB; lvl++){
      const arr = wallBuckets[lvl]; if (!arr.length) continue;
      const fade = 1 - (lvl+0.5)/WB;
      if (fade <= 0.02) continue;
      ctx.strokeStyle = `rgba(${bgRGB.join(',')},${fade.toFixed(3)})`;
      ctx.beginPath();
      for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
      ctx.stroke();
    }
    ctx.restore();

    drawParticles(t);                                         // drifting atmosphere in the lantern light
    const haze = LOOK_FX[curLook].haze;
    if (haze){                                                // soft world tint (e.g. Gale's cold sky)
      const hg = ctx.createRadialGradient(viewW/2, viewH*0.44, 0, viewW/2, viewH*0.44, viewH*0.7);
      hg.addColorStop(0, `rgba(${haze},0.16)`); hg.addColorStop(1, `rgba(${haze},0)`);
      ctx.fillStyle = hg; ctx.fillRect(0,0,viewW,viewH);
    }

    // deepen the dark beyond the reach of the light — and let it close in as the lantern gutters
    const lowLight = 1 - light;                               // 0 (full) .. 1 (guttering)
    const crit = Math.max(0, (CRIT - light) / CRIT);          // 0 above CRIT .. 1 at empty
    const pulse = crit>0 ? (0.06*crit)*(0.5+0.5*Math.sin(t/240)) : 0;  // ominous throb when dark
    const inner = viewH*(0.16 - lowLight*0.07 - crit*0.05);   // lit pool tightens, then clamps in hard
    const darkA = 0.55 + lowLight*0.28 + crit*0.16 + pulse;   // up to ~0.95 and pulsing
    const vg = ctx.createRadialGradient(viewW/2, viewH*0.46, Math.max(0,inner), viewW/2, viewH*0.46, viewH*0.72);
    vg.addColorStop(0, 'rgba(6,10,12,0)');
    vg.addColorStop(1, `rgba(5,9,11,${Math.min(0.97,darkA)})`);
    ctx.fillStyle = vg; ctx.fillRect(0,0,viewW,viewH);

    if (explored.has(startCell)) drawMarker(startCell, T.start, false, t);
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    // the thread — dims behind you as the lantern fades
    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize, tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.45 + 0.55*light;
      // glow underlay
      ctx.strokeStyle = `rgba(${T.threadRGB},0.22)`;
      ctx.lineWidth = cellSize*0.5;
      strokeTrail();
      // core
      const grad = ctx.createLinearGradient(0,0,viewW,viewH);
      grad.addColorStop(0, getVar('--thread'));
      grad.addColorStop(1, T.core);
      ctx.strokeStyle = grad;
      ctx.lineWidth = cellSize*0.2;
      strokeTrail();
      ctx.globalAlpha = 1;
    }
    // head bead — now at the smoothly-eased tip, under the finger
    const bx = tipX - camX, by = tipY - camY;
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.17, 0, 7);
    ctx.fillStyle = getVar('--thread-core'); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.30, 0, 7);
    ctx.strokeStyle = `rgba(${T.coreRGB},0.35)`; ctx.lineWidth = 2; ctx.stroke();
  }

  // The ground, the hedges and the cloud are static between steps: they only move
  // because the camera does. So they are drawn once into a world-anchored layer a
  // little larger than the viewport and then blitted with an offset, and only rebuilt
  // when the fog version changes or the camera runs past the margin.
  let bakeCv = null, bakeVer = -1, bakeX = 0, bakeY = 0, bakeCell = 0, bakeW = 0, bakeH = 0;
  const BAKE_M = 96;

  /* ---- skin: garden -----------------------------------------------------------
     A clipped garden in cut paper. Nothing here has height: the depth is entirely in
     the layering, because every mass — hedge and cloud alike — is the same shape cut
     three times, each sheet a little smaller than the one below it, so a shaded rim
     shows along one side and a lit one along the other.

     Hedge and cloud are built differently on purpose. A hedge wants a bumpy, clipped
     silhouette, so it is a union of capsules with circles bulging past their edges. A
     cloud does not: it wants to read as one sheet cut with a radius, so it is the maze
     grid itself, with a corner rounded only where both edges meeting there are on the
     outside. Building the cloud out of circles instead makes a heap of discs that never
     quite integrate.

     None of it moves between steps, so all of it bakes into a world-anchored layer the
     way the previous hedge world did — including the footprints, which only change when
     you commit to a cell.
     ---------------------------------------------------------------------------- */
  // One of these per garden look, keyed by the same LOOK index the level's `T` uses —
  // GARDEN itself is reassigned to the right entry in applyTheme() as the level changes,
  // so the whole hedge/cloud/path palette turns over with the season. sceneGarden (the
  // world-select card) shadows this with a fixed Bloom reference of its own further
  // down, so the card's art never drifts with whatever level you last played.
  const GARDEN_PALETTES = {
    [LOOK.BLOOM]: {
      grass:'#9ed163',
      hedgeLo:'#2c7038', hedgeMid:'#48a04c', hedgeHi:'#63b862',
      cloudLo:'#c2d2c4', cloudMid:'#e7eee5', cloudHi:'#fbfdfa',
      cast:'rgba(38,64,30,.42)',
      pathLo:'#d9c69c', path:'#f4ead0', lamp:'#ffe6a8', lampCore:'#fffdf2',
      petal:'#fbfbf4', petalPink:'#ffdce8', pollen:'#eec14a', stem:'#2c7038',
      spark:'#f6e07c',
    },
    [LOOK.SPRING]: {
      grass:'#b9e07a',
      hedgeLo:'#2e5f28', hedgeMid:'#5cae4a', hedgeHi:'#a6e26b',
      cloudLo:'#cfe0c8', cloudMid:'#eaf3e0', cloudHi:'#fbfdfa',
      cast:'rgba(38,64,30,.38)',
      pathLo:'#f0bed0', path:'#ffe9ef', lamp:'#ffd3e6', lampCore:'#fffdf2',
      petal:'#fffdf9', petalPink:'#ff9ec4', pollen:'#f7c8db', stem:'#2e5f28',
      spark:'#ffe2ef',
    },
    [LOOK.FALL]: {
      grass:'#c99a45',
      hedgeLo:'#4a2410', hedgeMid:'#b5551f', hedgeHi:'#e8a33d',
      cloudLo:'#dcc39a', cloudMid:'#f0dcc0', cloudHi:'#fff6e6',
      cast:'rgba(58,32,14,.45)',
      pathLo:'#b3813f', path:'#e8c98a', lamp:'#ffb45a', lampCore:'#fff3df',
      petal:'#fdeccb', petalPink:'#e8934a', pollen:'#d9782a', stem:'#4a2410',
      spark:'#ffcf7a',
    },
    [LOOK.WINTER]: {
      grass:'#eef4f2',
      hedgeLo:'#12261c', hedgeMid:'#1f4530', hedgeHi:'#ffffff',
      cloudLo:'#d7e3ea', cloudMid:'#eef3f6', cloudHi:'#ffffff',
      cast:'rgba(14,30,38,.35)',
      pathLo:'#b9d0da', path:'#dce9ee', lamp:'#bfe9f2', lampCore:'#ffffff',
      petal:'#ffffff', petalPink:'#8fd6e8', pollen:'#cdeef5', stem:'#1f4530',
      spark:'#d8f4fb',
    },
    [LOOK.DEAD]: {
      grass:'#a49986',
      hedgeLo:'#241b12', hedgeMid:'#4a4030', hedgeHi:'#847a63',
      cloudLo:'#b6ae9c', cloudMid:'#cfc9ba', cloudHi:'#e2dccb',
      cast:'rgba(28,22,14,.45)',
      pathLo:'#a89f88', path:'#c7c0ac', lamp:'#a89878', lampCore:'#d8d2c2',
      petal:'#c9c0a8', petalPink:'#8a7d5c', pollen:'#8a7d5c', stem:'#241b12',
      spark:'#b3a98f',
    },
  };
  let GARDEN = GARDEN_PALETTES[LOOK.BLOOM];
  let paperPat = null, paperTileCv = null;
  // the tooth of the stock, world-anchored so it never swims under the camera
  function paperTile(){
    if (paperPat) return paperPat;
    const t = document.createElement('canvas'); t.width = t.height = 128;
    const c = t.getContext('2d');
    for (let i=0;i<900;i++){
      c.fillStyle = i%2 ? 'rgba(255,255,255,.15)' : 'rgba(70,96,44,.10)';
      c.fillRect(hash(i,0,71)*128, hash(i,1,71)*128, 1.4, 1.4);
    }
    paperTileCv = t;
    paperPat = ctx.createPattern(t, 'repeat');
    return paperPat;
  }

  const gSeen = i => brightnessOf(i) > 0;
  const gFoggy = (c,r) => !(c>=0 && c<cols && r>=0 && r<rows && gSeen(idx(c,r)));


  // ---- hedge tiles: 4 hand-drawn stamps (middle/endcap/corner/t-stop) rotated at draw

      const grown = side + HEDGE_SEAM_OVERLAP_NATIVE*scale;
      const shift = HEDGE_SEAM_OVERLAP_NATIVE*scale/2;
      const dx = s.orient === 'h' ? alongPx-shift : crossPx-shift;
      const dy = s.orient === 'h' ? crossPx-shift : alongPx-shift;
      if (phase === 'shadow') hedgeDrawTileShadow(g, img, dx, dy, grown, grown, 0, scale);
      else hedgeDrawTileBody(g, img, dx, dy, grown, grown, 0, scale);
    }
    // Every tile is stamped as a true, undistorted square -- side length equal to the wall's
    // visual cross-axis thickness. The earlier approach stretched the square 72x72 source art
    // into a full-cell-wide x thin-tall box, which warped it non-uniformly (round scallops
    // became ovals, the border stroke read as a different thickness on different sides -- the
    // "extra border" that kept showing up). HEDGE_WALL_THICKNESS = 0.5 means exactly 2 of
    // these squares tile one maze cell with zero stretch in either axis.
    const crossNative = (s.orient === 'h' ? hedgeImg.hMiddle.height : hedgeImg.hVert.width) * HEDGE_WALL_THICKNESS;
    const sq = crossNative*scale;
    const crossPx = (s.orient==='h' ? s.fixed*cs - oy : s.fixed*cs - ox) - sq/2;
    const segKnown = i => s.orient==='h'
      ? hedgeSegKnown(s.a+i, s.fixed, s.a+i+1, s.fixed)
      : hedgeSegKnown(s.fixed, s.a+i, s.fixed, s.a+i+1);

    for (let i=0;i<n;i++){
      if (!segKnown(i)) continue;
      const slotStart = (s.orient==='h' ? (s.a+i)*cs - ox : (s.a+i)*cs - oy);
      const midImg = s.orient==='h' ? hedgeImg.hMiddle : hedgeImg.hVert;
      const capStartImg = s.orient==='h' ? hedgeImg.hLeft  : hedgeImg.vTop;
      const capEndImg   = s.orient==='h' ? hedgeImg.hRight : hedgeImg.vBottom;
      if (n===1 && startDead && endDead){
        // A fully isolated 1-cell stub: no interior half at all, just the two open tips
        // meeting in the middle -- each gets its own square, so nothing overlaps.
        place(capStartImg, slotStart, crossPx, sq);
        place(capEndImg, slotStart + sq, crossPx, sq);
      } else if (i===0 && startDead){
        // outer square (toward the dead tip) is the cap; inner square continues into the strip
        place(capStartImg, slotStart, crossPx, sq);
        place(midImg, slotStart + sq, crossPx, sq);
      } else if (i===n-1 && endDead){
        place(midImg, slotStart, crossPx, sq);
        place(capEndImg, slotStart + sq, crossPx, sq);
      } else {
        place(midImg, slotStart, crossPx, sq);
        place(midImg, slotStart + sq, crossPx, sq);
      }
    }
  }
  function hedgeDrawCorner(g, cj, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(cj.x, cj.y)) return;
    const img = hedgeImg.corner;
    const w = img.width*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const h = img.height*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const px = cj.x*cs - ox, py = cj.y*cs - oy;
    // Centered on the junction point -- matches hedgeDrawTStop's convention and the strips'
    // symmetric cross-axis centering. The old per-rotation quadrant offset (dx/dy picked
    // per cj.rot to place the tile entirely in one quadrant) left the box straddling the
    // wrong side of the point, producing a squared-off overhang/notch at every corner --
    // this was the real cause of the "corners overlapping" reports, confirmed via a PIL
    // repro of this exact placement math against the real tile art. Centering removes the
    // notch cleanly on all 4 rotations. Grown by the same seam-overlap amount as the strip
    // squares (hedgeDrawStrip's place()) so the corner's own border-wrap sliver doesn't show
    // as a seam where it meets the adjoining straight run.
    // The corner casts its own shadow too now, same as every other tile -- safe because
    // drawHedgeTiles renders in two full passes (every shadow, then every body). A corner's
    // shadow used to get drawn inline with its body, right after the neighboring middle/endcap
    // had already painted its own opaque body -- so the corner's shadow landed on top of that
    // already-finished neighbor and showed up as a doubled/misaligned dark patch at the joint.
    // With bodies deferred to a second pass, whatever a shadow oversteps onto a neighbor's
    // footprint just gets cleanly capped by that neighbor's own body afterward, so the shadow
    // can safely reach all the way to the corner's true edge.
    if (phase === 'shadow') hedgeDrawTileShadow(g, img, px - w/2, py - h/2, w, h, cj.rot, scale);
    else hedgeDrawTileBody(g, img, px - w/2, py - h/2, w, h, cj.rot, scale);
  }
  function hedgeDrawTStop(g, tj, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(tj.x, tj.y)) return;
    const img = hedgeImg.tStop;
    const w = img.width*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const h = img.height*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const px = tj.x*cs - ox, py = tj.y*cs - oy;
    if (phase === 'shadow') hedgeDrawTileShadow(g, img, px - w/2, py - h/2, w, h, tj.rot, scale);
    else hedgeDrawTileBody(g, img, px - w/2, py - h/2, w, h, tj.rot, scale);
  }
  function hedgeDrawPlus(g, x, y, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(x, y)) return;
    const r = (hedgeImg.hMiddle.height*scale*HEDGE_JUNCTION_FRAC)/2 * 0.9;
    const px = x*cs - ox, py = y*cs - oy;
    const offsetPx = HEDGE_SHADOW_OFFSET_NATIVE*scale;
    if (phase === 'shadow'){
      g.fillStyle = GARDEN.hedgeLo;
      g.beginPath(); g.ellipse(px, py+offsetPx, r, r, 0, 0, Math.PI*2); g.fill();
      return;
    }
    g.fillStyle = GARDEN.hedgeLo;
    g.beginPath(); g.ellipse(px, py, r, r, 0, 0, Math.PI*2); g.fill();
    const r2 = r*0.68;
    g.fillStyle = GARDEN.hedgeMid;
    g.beginPath(); g.ellipse(px, py, r2, r2, 0, 0, Math.PI*2); g.fill();
  }
  function drawHedgeTiles(g, ox, oy){
    if (!hedgeTilesReady) return;
    if (hedgeLevelVer !== levelVer) rebuildHedgeGeometry();
    const cs = cellSize, scale = cs / HEDGE_NATIVE_CELL;
    // Two full passes -- every shadow, then every body -- instead of shadow+body per tile.
    // Guarantees a tile's opaque art always caps whatever shadow lands on its footprint
    // (its own or a neighbor's overspill), regardless of draw order between strips/corners/
    // T-stops/plus. See hedgeDrawCorner for why this was needed.
    hedgeStrips.forEach(s => hedgeDrawStrip(g, s, ox, oy, cs, scale, 'shadow'));
    hedgeCorners.forEach(cj => hedgeDrawCorner(g, cj, ox, oy, cs, scale, 'shadow'));
    hedgeTStops.forEach(tj => hedgeDrawTStop(g, tj, ox, oy, cs, scale, 'shadow'));
    hedgePlus.forEach(p => hedgeDrawPlus(g, p.x, p.y, ox, oy, cs, scale, 'shadow'));
    hedgeStrips.forEach(s => hedgeDrawStrip(g, s, ox, oy, cs, scale, 'body'));
    hedgeCorners.forEach(cj => hedgeDrawCorner(g, cj, ox, oy, cs, scale, 'body'));
    hedgeTStops.forEach(tj => hedgeDrawTStop(g, tj, ox, oy, cs, scale, 'body'));
    hedgePlus.forEach(p => hedgeDrawPlus(g, p.x, p.y, ox, oy, cs, scale, 'body'));
  }

  /* The hedge silhouette. The body is one rounded rectangle per wall rather than a
     chain of circles — a capsule either way, but fifteen times fewer subpaths, which
     is the difference between a bake you notice and one you do not. The scallops stay
     circles; they are the whole look. */
  function gardenHedge(g, ox, oy, c0, r0, c1, r1, rough){
    const th = Math.max(5, cellSize*0.357), s = cellSize;
    const dot = (x,y,r) => { g.moveTo(x+r, y); g.arc(x, y, r, 0, 7); };
    g.beginPath();
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r), w = cells[i].walls;
      const x = c*s - ox, y = r*s - oy;
      const known = (dc,dr) => {
        if (gSeen(i)) return true;
        const nc = c+dc, nr = r+dr;
        return nc>=0 && nc<cols && nr>=0 && nr<rows && gSeen(idx(nc,nr));
      };
      // Few, large, overlapping lobes rather than many small ones: beads read as
      // bubbles, lobes that run into each other read as a clipped hedge waving.
      const run = (x0, y0, horiz, seed) => {
        if (horiz) g.roundRect(x0 - th/2, y0 - th/2, s + th, th, th/2);
        else       g.roundRect(x0 - th/2, y0 - th/2, th, s + th, th/2);
        const step = Math.max(7, cellSize*0.40);
        for (let n = 0; step*(n + 0.5) < s; n++){
          const d = step*(n + 0.5);
          const k = hash(seed + n*4.13, 3);
          const rr = th*(0.38 + k*0.20)*(rough||1);
          const j = (hash(seed + n*7.71, 5) - 0.5)*step*0.34;
          const push = th/2 - rr*0.70;              // seated in the body, not perched on it
          if (horiz){ dot(x0+d+j, y0 - push, rr); dot(x0+d+j, y0 + push, rr*0.9); }
          else      { dot(x0 - push, y0+d+j, rr); dot(x0 + push, y0+d+j, rr*0.9); }
        }
      };
      const seed = c*131.7 + r*57.3;
      if (w[0] && known(0,-1)) run(x, y, true,  seed);
      if (w[3] && known(-1,0)) run(x, y, false, seed + 1.7);
      if (w[1] && c===cols-1 && gSeen(i)) run(x + s, y, false, seed + 3.4);
      if (w[2] && r===rows-1 && gSeen(i)) run(x, y + s, true,  seed + 5.1);
    }
  }

  /* The cloud. One square per unreached cell, unioned into a sheet; a corner takes a
     radius only when both edges meeting there are exposed, so cells that carry on join
     square and the bank stays one piece. The inset bites only on exposed sides too —
     apply it all round and the upper sheets come apart into a tiled grid. Cells overlap
     their neighbours slightly, because an exactly abutting seam antialiases into a
     visible lattice. The field runs two cells past the layer, so nothing at the frame
     has an outside and the sheet reaches the edge flush. */
  // Hard boundary for the cloud layer: exact, un-rounded cell squares for every still-
  // foggy cell. gardenFog's own sheets use rounding, inset, and small per-sheet offsets
  // (the hand-torn-paper look, plus a drop shadow on the lowest sheet) that can spill a
  // few px past a cell's true edge -- invisible between two foggy cells, but visible as
  // a stray white/gray sliver when that spill lands on an already-seen cell sitting next
  // to a freshly revealed hedge corner (a corner's rounded art leaves a bit of that
  // neighbour cell's edge uncovered, unlike a straight run's wall thickness). Clipping
  // the whole cloud pass to this mask stops any sheet from ever painting past a cell
  // that isn't actually still foggy, without touching reveal timing.
  function gardenFogMask(g, ox, oy, c0, r0, c1, r1){
    const s = cellSize;
    g.beginPath();
    for (let r=r0-2; r<=r1+2; r++) for (let c=c0-2; c<=c1+2; c++){
      if (!gFoggy(c,r)) continue;
      g.rect(c*s - ox, r*s - oy, s, s);
    }
  }
  function gardenFog(g, ox, oy, c0, r0, c1, r1, rad, inset){
    const s = cellSize, ov = Math.max(0.6, s*0.014), ins = inset || 0;
    g.beginPath();
    for (let r=r0-2; r<=r1+2; r++) for (let c=c0-2; c<=c1+2; c++){
      if (!gFoggy(c,r)) continue;
      const n = gFoggy(c,r-1), so = gFoggy(c,r+1), w = gFoggy(c-1,r), e = gFoggy(c+1,r);
      const x0 = c*s - ox + (w ? -ov : ins), x1 = (c+1)*s - ox + (e ? ov : -ins);
      const y0 = r*s - oy + (n ? -ov : ins), y1 = (r+1)*s - oy + (so ? ov : -ins);
      g.roundRect(x0, y0, x1-x0, y1-y0,
        [ (!n && !w) ? rad : 0, (!n && !e) ? rad : 0,
          (!so && !e) ? rad : 0, (!so && !w) ? rad : 0 ]);
      const fil = rad*0.55, cxp = c*s - ox, cyp = r*s - oy;
      const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
      if (n  && w && !gFoggy(c-1,r-1)) nook(cxp, cyp);
      if (n  && e && !gFoggy(c+1,r-1)) nook(cxp + s, cyp);
      if (so && e && !gFoggy(c+1,r+1)) nook(cxp + s, cyp + s);
      if (so && w && !gFoggy(c-1,r+1)) nook(cxp, cyp + s);
    }
  }

  // The path is a strip of paper laid on the grass — a darker sheet with a lighter one
  // on top, the same two-sheet logic as everything else here. Points are the committed
  // cells; the live stub out to where you actually are is drawn on top, every frame.
  function gardenPathAt(g, ox, oy, upto){
    const s = cellSize, n = upto === undefined ? trail.length : upto;
    if (n < 1) return false;
    const at = i => [(cx(trail[i])+0.5)*s - ox, (cy(trail[i])+0.5)*s - oy];
    g.beginPath();
    const [x0,y0] = at(0); g.moveTo(x0, y0);
    for (let i=1; i<n-1; i++){
      const [ax,ay] = at(i), [bx,by] = at(i+1);
      g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
    }
    if (n > 1){ const [lx,ly] = at(n-1); g.lineTo(lx, ly); }
    return true;
  }

  function drawGarden(t){
    ctx.clearRect(0,0,viewW,viewH);
    const needW = viewW + BAKE_M*2, needH = viewH + BAKE_M*2;
    const stale = bakeVer !== fogVer || bakeCell !== cellSize
               || bakeW !== needW || bakeH !== needH
               || camX < bakeX || camY < bakeY
               || camX + viewW > bakeX + needW || camY + viewH > bakeY + needH;
    if (stale){
      if (!bakeCv || bakeW !== needW || bakeH !== needH){
        bakeCv = document.createElement('canvas');
        bakeW = needW; bakeH = needH;
      }
      bakeCv.width = Math.round(needW*dpr); bakeCv.height = Math.round(needH*dpr);
      bakeX = camX - BAKE_M; bakeY = camY - BAKE_M;
      bakeVer = fogVer; bakeCell = cellSize;
      const bg = bakeCv.getContext('2d');
      bg.setTransform(dpr,0,0,dpr,0,0);
      bakeGarden(bg, bakeX, bakeY, needW, needH);
    }
    ctx.drawImage(bakeCv, Math.round(bakeX - camX), Math.round(bakeY - camY), bakeW, bakeH);
    gardenActors(t);
  }

  function bakeGarden(g, ox, oy, w, h){
    const s = cellSize, k = s/42;
    const c0 = Math.max(0, Math.floor(ox/s)), r0 = Math.max(0, Math.floor(oy/s));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/s)), r1 = Math.min(rows-1, Math.ceil((oy+h)/s));

    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), ox, oy); g.fillRect(0,0,w,h);

    // the path you have laid, under everything else on the ground
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (gardenPathAt(g, ox, oy)){
      g.save();
      g.shadowColor = GARDEN.cast; g.shadowBlur = s*0.10; g.shadowOffsetY = s*0.055;
      g.strokeStyle = GARDEN.pathLo; g.lineWidth = s*0.30; g.stroke();
      g.restore();
      gardenPathAt(g, ox, oy);
      g.strokeStyle = GARDEN.path; g.lineWidth = s*0.22; g.stroke();
    }

    // what grows in the corridor, off the path you wore walking it
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r);
      if (!gSeen(i)) continue;
      const x = c*s - ox, y = r*s - oy;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + s*0.19 + hash(c,r,32)*s*0.62, sy = y + s*0.19 + hash(c,r,33)*s*0.62;
        g.fillStyle = GARDEN.spark;
        const sr = s*0.107;
        g.beginPath();
        g.moveTo(sx, sy-sr); g.quadraticCurveTo(sx, sy, sx+sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy+sr); g.quadraticCurveTo(sx, sy, sx-sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy-sr); g.fill();
      }
    }

    // the hedge: PNG stamps (middle/endcap/corner/t-stop), rotated to fit and each with
    // its own baked-in drop shadow. Drawn BEFORE the cloud (the cloud used to be under the
    // hedge, so any piece that was "known" -- even via the lenient any-touching-cell-seen
    // rule -- always painted fully solid, visible right through fog that hadn't actually
    // cleared over its own cell yet). Now the cloud is the top layer again, so a hedge
    // piece only reads as fully revealed once the fog over its own footprint is gone --
    // otherwise it's dimmed/hidden under cloud like everything else that isn't seen yet.
    drawHedgeTiles(g, ox, oy);

    // the cloud: the same three sheets, cut from the grid, clipped hard to the exact set
    // of still-foggy cells (gardenFogMask) so none of the three sheets' blur/offset can
    // spill onto an already-seen cell -- that's what used to read as fog "cutting off" a
    // corner that had just been drawn. With the clip, a foggy cell's cloud can only ever
    // cover that cell's own square, so it sits over an early-revealed hedge piece cleanly,
    // right up to the cell boundary, instead of in some blobby shape that doesn't line up
    // with the grid.
    g.save();
    gardenFogMask(g, ox, oy, c0, r0, c1, r1);
    g.clip();
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k;
    g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.40, 0);
    g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.42, 1.5*k);
    g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 4*k, oy + 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    gardenFog(g, ox, oy, c0, r0, c1, r1, s*0.46, 5*k);
    g.fillStyle = GARDEN.cloudHi; g.fill();
    g.save(); g.clip();
    g.fillStyle = cardAnchor(paperTile(), ox + 9*k, oy + 13*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.restore(); // fog mask clip
  }

  // only the things that move between steps
  // Gusts: the garden's light fuel. Same data as flames (the `flames` set, the same
  // low-light boost) but drawn as three wind lines instead of fire, each ending in a small
  // curl. Nothing is drawn outside the current reveal window — no faint always-on ghost —
  // so each line is a true draw-on: a hard-edged mask window slides in from the left to
  // reveal it, holds, then slides again to erase it from the left outward (last thing
  // visible is the curled tip), rests briefly, and repeats. The three lines are staggered
  // so they draw on one after another, top to bottom, rather than all at once.
  const WIND_LINES = [
    { y:-0.30, len:0.42, curl:0.15, curlDir: 1  },   // top — curls up
    { y: 0,    len:0.62, curl:0.19, curlDir: 1  },   // middle — curls up
    { y: 0.30, len:0.46, curl:0.15, curlDir: -1 },   // bottom — curls down
  ];
  // bounding box helpers: the loop now sits at the START of the line (like the classic
  // wind glyph — curl first, then the line trails out to the right of it), so it bulges
  // slightly left of the line's nominal start point
  function windLineLeftPad(ln){ return ln.curl ? ln.curl*1.15 : 0; }
  function windLinePath(scale, ln){
    const x0 = -scale*0.55, x1 = x0 + scale*ln.len;
    if (ln.curl){
      // the loop leads the line: a small hook the line unwinds out of, curling up or
      // down depending on the line, then continuing straight out to the right
      const r = scale*ln.curl;
      if (ln.curlDir < 0){
        ctx.arc(x0, scale*ln.y + r, r, -Math.PI/2 - Math.PI*1.5, -Math.PI/2, false);
      } else {
        ctx.arc(x0, scale*ln.y - r, r, Math.PI/2 + Math.PI*1.5, Math.PI/2, true);
      }
      ctx.lineTo(x1, scale*ln.y);
    } else {
      ctx.moveTo(x0, scale*ln.y);
      ctx.lineTo(x1, scale*ln.y);
    }
  }
  function windGlyph(cx0, cy0, scale, intensity, t, seed){
    const puff = T.ember;
    ctx.save();
    ctx.translate(cx0, cy0);
    ctx.lineCap = 'round';

    const period = 1900, stagger = 260;
    const growDur = 0.32, holdDur = 0.12, eraseDur = 0.32; // remainder of the period rests empty
    const x0 = -scale*0.55;
    WIND_LINES.forEach((ln, li) => {
      const local = (((t + seed*400 - li*stagger) % period) + period) % period;
      const ph = local / period;
      let a, b; // visible window, as a 0..1 fraction along the line's extent
      if (ph < growDur){ a = 0; b = ph/growDur; }
      else if (ph < growDur+holdDur){ a = 0; b = 1; }
      else if (ph < growDur+holdDur+eraseDur){ a = (ph-growDur-holdDur)/eraseDur; b = 1; }
      else return; // resting between cycles — nothing drawn at all, no ghost line
      if (b-a <= 0.01) return;
      const leftBound = x0 - scale*windLineLeftPad(ln);
      const rightBound = x0 + scale*ln.len;
      const extPx = rightBound - leftBound;
      const wx0 = leftBound + extPx*a, wx1 = leftBound + extPx*b;
      const curlPad = ln.curl ? scale*ln.curl*2.3 : 0;   // clip tall enough for the curl on either side
      ctx.save();
      ctx.beginPath();
      ctx.rect(wx0 - scale*0.03, scale*ln.y - scale*0.18 - curlPad, (wx1-wx0) + scale*0.06, scale*0.36 + curlPad*2);
      ctx.clip();
      // dark under-stroke for contrast, then the bright core — both hard-edged to the
      // same window, no soft fade or always-on ghost beyond it
      ctx.strokeStyle = `rgba(4,6,9,${(0.30*intensity).toFixed(3)})`;
      ctx.lineWidth = Math.max(2.4, scale*0.135);
      ctx.beginPath(); windLinePath(scale, ln); ctx.stroke();
      ctx.strokeStyle = `rgba(${puff},${(0.98*intensity).toFixed(3)})`;
      ctx.lineWidth = Math.max(1.8, scale*0.095);
      ctx.beginPath(); windLinePath(scale, ln); ctx.stroke();
      ctx.restore();
    });

    ctx.restore();
  }
  function drawGusts(t){
    const head = trail[trail.length-1];
    const lowLight = 1 - light;
    const nearRange = 6 + lowLight*6;
    const boost = 1 + lowLight*0.9;
    flames.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.7 : Math.max(0, 0.8 - dCells/(nearRange+4)));
      intensity = Math.min(1, intensity*boost);
      if (intensity <= 0.03) return;
      const bob = Math.sin(t/900 + i*1.7)*cellSize*0.06;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + bob;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      windGlyph(sx, sy, cellSize*0.62, intensity, t, i);
