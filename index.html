    c.strokeStyle = 'rgba(120,40,22,.34)'; c.lineWidth = Math.max(1, cs*0.030);
    c.save(); c.translate(cs*0.030, cs*0.030);
    yarnTwistPath(c, yarnSamples(pts, 8), cs); c.stroke();
    c.restore();
    c.globalCompositeOperation = 'source-over';
    g.drawImage(yarnCv, 0, 0, w, h);
  }

  const CARD_TURN = 380;                   // ms for one flap to go from shut to gone
  const cardPats = {}, cardTileCv = {};
  // One 256px tile per stock face. Every fibre is drawn at all nine wrap offsets so
  // the tile joins seamlessly — the alternative, insetting them off the edge, leaves
  // a clean band every 256px that the eye picks up as a grid.
  function cardTile(which){
    if (cardPats[which]) return cardPats[which];
    const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d');
    const rnd = (k,sd) => { const v = Math.sin(k*12.9898 + sd*78.233)*43758.5453; return v - Math.floor(v); };
    const fibres = (n, cols, len) => {
      c.lineWidth = 0.6;
      for (let k=0; k<n; k++){
        const x = rnd(k,1.3)*N, y = rnd(k,2.7)*N, a = rnd(k,4.1)*6.2832;
        const l = len*(0.5 + rnd(k,5.9)), ddx = Math.cos(a)*l, ddy = Math.sin(a)*l;
        c.strokeStyle = cols[k % cols.length];
        for (let ox=-N; ox<=N; ox+=N) for (let oy=-N; oy<=N; oy+=N){
          c.beginPath(); c.moveTo(x+ox, y+oy); c.lineTo(x+ox+ddx, y+oy+ddy); c.stroke();
        }
      }
    };
    const speck = (n, cols, size) => {
      for (let k=0; k<n; k++){
        c.fillStyle = cols[k % cols.length];
        c.fillRect(rnd(k,7.1)*N, rnd(k,8.3)*N, size, size);
      }
    };
    if (which === 'face'){                          // the printed outer liner
      c.fillStyle = CARD.face; c.fillRect(0,0,N,N);
      fibres(1400, ['rgba(96,64,24,.16)','rgba(240,214,168,.20)'], 3.2);
      speck(1150, ['rgba(86,56,20,.14)','rgba(246,224,182,.16)'], 1.1);
    } else if (which === 'back'){                   // the inner liner, seen when it turns over
      c.fillStyle = CARD.back; c.fillRect(0,0,N,N);
      fibres(1000, ['rgba(120,84,38,.12)','rgba(255,244,220,.22)'], 3);
    } else {                                        // the table the whole thing lies on
      c.fillStyle = CARD.table; c.fillRect(0,0,N,N);
      speck(2600, [CARD.tableInk, CARD.tableLit], 1.2);
    }
    cardTileCv[which] = cv;
    cardPats[which] = ctx.createPattern(cv, 'repeat');
    return cardPats[which];
  }
  // patterns are anchored to the world, so the fibre stays put as the camera moves
  function cardAnchor(pat, ox, oy){
    if (pat.setTransform) pat.setTransform(new DOMMatrix().translate(-ox % 256, -oy % 256));
    return pat;
  }

  let flapOpen = null, flapLevel = -1, flapT = 0;
  let cardCv = null, cardStamp = -1, cardX = 0, cardY = 0,
      cardCell = 0, cardW = 0, cardH = 0;

  // A flap is a square hinged on one edge. As it turns, the side opposite the hinge
  // sweeps toward it and the panel foreshortens; past vertical the depth goes
  // negative, it lands beyond its own hinge, and you are looking at its back.
  function flapPath(g, c, r, ox, oy, open, dx, dy){
    const size = cellSize - cellSize*0.06;          // the saw kerf between one flap and the next
    const x = c*cellSize - ox + cellSize*0.03 + (dx||0);
    const y = r*cellSize - oy + cellSize*0.03 + (dy||0);
    const hinge = (Math.abs(hash(c*3.1 + r*5.7, 2))*4) | 0;
    const depth = size * Math.cos(open * Math.PI * 0.60);
    const bow = open * cellSize * 0.083;
    const sg = Math.sign(depth) || 1, d = Math.abs(depth);
    const inset = (1 - d/size) * (size*0.073);      // the far edge narrows as it tips away
    // cut a degree or two off square, so the field reads as separate pieces rather
    // than one sheet scored into a grid
    const mx = c*cellSize - ox + cellSize/2, my = r*cellSize - oy + cellSize/2;
    g.save();
    g.translate(mx, my); g.rotate((hash(c*2.7 + r*4.1, 9)*2 - 1) * 0.016); g.translate(-mx, -my);
    if (hinge === 0 || hinge === 2){                // hinged along a horizontal edge
      const hy = hinge === 0 ? y : y + size, fy = hy + (hinge === 0 ? sg*d : -sg*d);
      g.moveTo(x, hy);
      g.lineTo(x + inset, fy);
      g.quadraticCurveTo(x + size/2, fy + bow, x + size - inset, fy);
      g.lineTo(x + size, hy);
    } else {                                        // hinged along a vertical edge
      const hx = hinge === 3 ? x : x + size, fx = hx + (hinge === 3 ? sg*d : -sg*d);
      g.moveTo(hx, y);
      g.lineTo(fx, y + inset);
      g.quadraticCurveTo(fx + bow, y + size/2, fx, y + size - inset);
      g.lineTo(hx, y + size);
    }
    g.closePath();
    g.restore();
    return depth;
  }

  function drawCard(t){
    // a level you have just walked into starts with its flaps where the fog says they
    // are, so resuming a run does not replay two hundred openings
    if (!flapOpen || flapOpen.length !== cells.length || flapLevel !== levelVer){
      flapOpen = new Float32Array(cells.length);
      for (let i=0; i<cells.length; i++) flapOpen[i] = explored.has(i) ? 1 : 0;
      flapLevel = levelVer; flapT = t;
    }
    const dt = Math.min(64, Math.max(0, t - flapT)); flapT = t;
    const sp = dt / CARD_TURN;
    const moving = [];
    for (let i=0; i<flapOpen.length; i++){
      if (!explored.has(i)) continue;               // still shut; the baked layer has it
      const o = flapOpen[i];
      if (o < 1){ const n = Math.min(1, o + sp); flapOpen[i] = n; if (n < 1) moving.push(i); }
    }

    ctx.clearRect(0,0,viewW,viewH);
    const needW = viewW + BAKE_M*2, needH = viewH + BAKE_M*2;
    const stale = cardStamp !== fogVer || cardCell !== cellSize
               || cardW !== needW || cardH !== needH
               || camX < cardX || camY < cardY
               || camX + viewW > cardX + needW || camY + viewH > cardY + needH;
    if (stale){
      if (!cardCv || cardW !== needW || cardH !== needH){
        cardCv = document.createElement('canvas'); cardW = needW; cardH = needH;
      }
      cardCv.width = Math.round(needW*dpr); cardCv.height = Math.round(needH*dpr);
      cardX = camX - BAKE_M; cardY = camY - BAKE_M;
      cardStamp = fogVer; cardCell = cellSize;
      const bg = cardCv.getContext('2d');
      bg.setTransform(dpr,0,0,dpr,0,0);
      bakeCard(bg, cardX, cardY, needW, needH);
    }
    ctx.drawImage(cardCv, Math.round(cardX - camX), Math.round(cardY - camY), cardW, cardH);
    cardActors(t);
    if (moving.length) cardFlaps(ctx, camX, camY, moving);
  }

  /* ---- the corrugated wall ---------------------------------------------------
     Shared by the live board and the world-select card, so the card cannot drift
     out of step with the game the way it did while this lived inline in bakeCard.
     segs are pairs of endpoints already deduplicated by the caller; cs is the cell
     size, k the caller's relief unit, and wox/woy the offset back to world space
     that keeps the flute phase from crawling as the view moves.
     -------------------------------------------------------------------------- */
  function drawCardWalls(g, segs, cs, k, wox, woy, pal){
    if (!segs.length) return;
    if (!pal) pal = CARD;
    const thick = Math.max(4, cs*0.33);
    const sk = thick / WALL_SVG.thick, bandH = WALL_SVG.band*sk, halfT = thick/2;
    // For every endpoint, which axes (horizontal / vertical) of wall touch it. A long
    // straight run is built from one segment per cell, so *every* cell boundary along
    // it shares an endpoint with its neighbour too — but both sides are the same
    // axis, so the wave and bands should run straight through with no trim at all
    // (the world-anchored phase already makes that seamless). Only an endpoint where
    // both a horizontal *and* a vertical segment meet — an actual corner or T-join —
    // needs the trim; treating every shared endpoint the same way was cutting a small
    // gap out of every plain straight run, not just real corners, which is the "space
    // in between" the wave lines shouldn't have had.
    const capKey = (x,y) => Math.round(x*4)+','+Math.round(y*4);
    const capCount = new Map(), capAxes = new Map();
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
      [[x1,y1],[x2,y2]].forEach(([px,py]) => {
        const kk = capKey(px,py);
        capCount.set(kk, (capCount.get(kk)||0)+1);
        if (!capAxes.has(kk)) capAxes.set(kk, new Set());
        capAxes.get(kk).add(axis);
      });
    }
    const isJunction = (x,y) => (capAxes.get(capKey(x,y))||0).size > 1;
    const isDeadEnd = (x,y) => capCount.get(capKey(x,y)) === 1;

    // `square` line caps extend the stroke half its own width past each endpoint. At a
    // corner that's exactly what's wanted — it's what fills the notch where two walls
    // meet. At an exposed end there's nothing to fill, so the dark base was spilling
    // half a wall-thickness past where the wall actually stops, well beyond the much
    // shorter end cap. Pulling a dead end's endpoint back by halfT means the square
    // cap lands precisely on the true end instead of past it.
    // a trim can never eat more than the segment it's trimming — at a very small cell
    // size a wall is short enough that two dead-end trims would otherwise cross over
    // and flip the segment back on itself
    const fitTrim = (st, et, len) => {
      const total = st + et;
      if (total <= len*0.9) return [st, et];
      const f = (len*0.9) / (total || 1);
      return [st*f, et*f];
    };
    const line = (lw, col, dx, dy) => {
      g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'square'; g.lineJoin = 'round';
      g.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const len = Math.hypot(x2-x1,y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
        const [st, et] = fitTrim(isDeadEnd(x1,y1) ? halfT : 0, isDeadEnd(x2,y2) ? halfT : 0, len);
        g.moveTo(x1+ux*st+dx, y1+uy*st+dy); g.lineTo(x2-ux*et+dx, y2-uy*et+dy);
      }
      g.stroke();
    };
    // same throw as the other two worlds' walls: a steep, mostly-vertical offset of
    // (1.5,4.5) in units of cellSize/42, not the flatter/inconsistent angle this used
    // to have. wk is scoped to just this relief, separate from the card's own `k`
    // (cellSize/30) that everything else on the board still uses.
    const wk = cs/42;
    line(thick, pal.slot, 0.5*wk, 1.5*wk);                  // the slot it stands in
    g.save(); g.filter = 'blur(' + (2.8*k).toFixed(2) + 'px)'; g.globalAlpha = 0.4;
    line(thick, pal.shadow + '1)', 1.5*wk, 4.5*wk); g.restore();
    line(thick, pal.wallBase, 0, 0);                        // the wall's own custom art
    // At a corner or T-join the two walls share a `thick` x `thick` hub square. Trimming
    // both sides back from it left that square carrying only the plain dark base — the
    // blank corners. So the horizontal wall now *claims* the hub: a horizontal segment
    // pushes its band and wave a half-thickness out past the junction, carrying the
    // pattern straight across, and the vertical segment meeting it pulls back by the
    // same amount and yields. Negative = reach outward, positive = pull inward.
    const endShift = (x, y, axis, lw) => {
      if (isJunction(x,y)) return axis === 'h' ? -halfT : halfT;
      return isDeadEnd(x,y) ? lw/2 : 0;
    };
    // only inward pulls can run past each other on a short wall, so clamp just those
    const shiftPair = (sd, ed, len) => {
      const [cs_, ce_] = fitTrim(Math.max(0,sd), Math.max(0,ed), len);
      return [sd > 0 ? cs_ : sd, ed > 0 ? ce_ : ed];
    };

    // the liner bands: they run across a corner with the horizontal wall, and are
    // pulled back half their own width at a dead end so their square caps don't hang
    // past the wall's flush end the way the base's did
    const offsetLine = (lw, col, offset) => {
      g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'square'; g.lineJoin = 'round';
      g.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const len = Math.hypot(x2-x1,y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len, nx=-uy, ny=ux;
        const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
        const [sd, ed] = shiftPair(endShift(x1,y1,axis,lw), endShift(x2,y2,axis,lw), len);
        const cx1=x1+ux*sd, cy1=y1+uy*sd, cx2=x2-ux*ed, cy2=y2-uy*ed;
        g.moveTo(cx1+nx*offset, cy1+ny*offset); g.lineTo(cx2+nx*offset, cy2+ny*offset);
      }
      g.stroke();
    };
    offsetLine(bandH, pal.wallLiner, -halfT + bandH/2);     // top liner
    offsetLine(bandH, pal.wallLiner,  halfT - bandH/2);     // bottom liner

    // the flute wave, one segment at a time, each clipped to its own strip of wall —
    // the phase is anchored to world position (see wallFlutePhaseStart) so adjacent
    // collinear segments line up seamlessly with no trim needed, and two horizontals
    // overlapping in a hub draw the identical curve there. At a junction the clip
    // reaches out over the hub for a horizontal and pulls back for a vertical, so the
    // wave carries across the corner instead of stopping at its edge.
    g.strokeStyle = pal.wallLiner; g.lineWidth = WALL_SVG.stroke*sk;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const len = Math.hypot(x2-x1,y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
      const axis = Math.abs(x2-x1) >= Math.abs(y2-y1) ? 'h' : 'v';
      const [sd, ed] = shiftPair(endShift(x1,y1,axis,0), endShift(x2,y2,axis,0), len);
      const cx1 = x1+ux*sd, cy1 = y1+uy*sd;
      const cx2 = x2-ux*ed, cy2 = y2-uy*ed;
      g.save();
      g.beginPath();
      if (axis === 'h') g.rect(Math.min(cx1,cx2), y1-halfT, Math.abs(cx2-cx1), thick);
      else g.rect(x1-halfT, Math.min(cy1,cy2), thick, Math.abs(cy2-cy1));
      g.clip();
      g.beginPath();
      wallFluteSegment(g, x1, y1, x2, y2, thick, wox, woy);   // ox/oy re-anchor the phase to the world
      g.stroke();
      g.restore();
    }
    // A solid cap — the same colour as the sides — at any end that isn't shared with
    // another wall segment at all (capCount===1): a true dead end, an exposed cut edge.
    // The cap sits *inside* the wall's own footprint (it grows inward from the end,
    // not out past it), so the wall's outer boundary is one flush edge: dark base,
    // cap, and closing line all stop at exactly the same place.
    const capW = WALL_SVG.capW*sk;
    const tipLines = [];   // the straight closing line right at each cap's outer edge
    g.fillStyle = pal.wallLiner;
    g.beginPath();
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const len = Math.hypot(x2-x1,y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len, nx=-uy, ny=ux;
      // dx,dy points inward along the wall from this end
      const addCap = (px,py,dx,dy) => {
        g.moveTo(px-nx*halfT, py-ny*halfT);
        g.lineTo(px+nx*halfT, py+ny*halfT);
        g.lineTo(px+dx*capW+nx*halfT, py+dy*capW+ny*halfT);
        g.lineTo(px+dx*capW-nx*halfT, py+dy*capW-ny*halfT);
        g.closePath();
        tipLines.push(px-nx*halfT, py-ny*halfT, px+nx*halfT, py+ny*halfT, dx, dy);
      };
      if (isDeadEnd(x1,y1)) addCap(x1,y1,  ux,  uy);   // start end: inward is +u
      if (isDeadEnd(x2,y2)) addCap(x2,y2, -ux, -uy);   // far end: inward is -u
    }
    g.fill();
    // a crisp line right at the very tip of every capped end, so it reads as a
    // deliberate closing edge rather than the fill just trailing off. A stroke straddles
    // its own path, so it's nudged half a line-width inward — otherwise that half would
    // hang past the wall's end, which is the overhang this whole pass is removing.
    if (tipLines.length){
      const tw = Math.max(1.4, sk*1.4);
      g.strokeStyle = pal.wallLiner; g.lineWidth = tw; g.lineCap = 'butt';
      g.beginPath();
      for (let n=0;n<tipLines.length;n+=6){
        const ix = tipLines[n+4]*tw/2, iy = tipLines[n+5]*tw/2;
        g.moveTo(tipLines[n]+ix, tipLines[n+1]+iy);
        g.lineTo(tipLines[n+2]+ix, tipLines[n+3]+iy);
      }
      g.stroke();
    }
  }

  // the table, the board, the walls, and every flap still lying shut
  function bakeCard(g, ox, oy, w, h){
    const k = cellSize/30;
    const c0 = Math.max(0, Math.floor(ox/cellSize)), r0 = Math.max(0, Math.floor(oy/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((ox+w)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((oy+h)/cellSize));

    g.fillStyle = cardAnchor(cardTile('table'), ox, oy); g.fillRect(0,0,w,h);
    // the board the maze is cut from, sitting proud of the table
    const bx = -ox - cellSize*0.14, by = -oy - cellSize*0.14;
    const bw = cols*cellSize + cellSize*0.28, bh = rows*cellSize + cellSize*0.28;
    g.save();
    g.shadowColor = CARD.shadow + '.34)'; g.shadowBlur = 9*k; g.shadowOffsetY = 4*k;
    g.fillStyle = CARD.board; g.fillRect(bx, by, bw, bh);
    g.restore();
    g.save();                                       // grain, to keep the mat off flat colour
    g.beginPath(); g.rect(bx, by, bw, bh); g.clip();
    g.globalAlpha = 0.20; g.fillStyle = cardAnchor(cardTile('back'), ox, oy);
    g.fillRect(bx, by, bw, bh);
    g.restore();
    g.strokeStyle = CARD.boardEdge; g.lineWidth = 1.4; g.strokeRect(bx, by, bw, bh);

    // walls: a strip of board standing in a slot, shown only where the ground either
    // side of it has been reached. `known()` is checked from both of a shared wall's
    // cells independently, and since it's a symmetric OR (this cell lit, or its
    // neighbour is), both sides agree and both push the same wall — so every interior
    // wall (and every wall bordering the lit area, which is most of them, including
    // real fog-frontier tips) went into `segs` twice with identical coordinates. That
    // silently inflated every endpoint's tally by one or more, which meant a genuine
    // dead end's count was never actually 1 — end caps were wired up correctly but the
    // condition that triggers them could never fire. Deduplicating by the wall's own
    // canonical (order-independent) endpoints fixes this at the source, before any of
    // the corner/dead-end logic below ever sees it.
    const rawSegs = [];
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      const i = idx(c,r), wl = cells[i].walls;
      const x = c*cellSize - ox, y = r*cellSize - oy, s = cellSize;
      const known = (dc,dr) => {
        if (brightnessOf(i) > 0) return true;
        const nc = c+dc, nr = r+dr;
        return nc>=0 && nc<cols && nr>=0 && nr<rows && brightnessOf(idx(nc,nr)) > 0;
      };
      if (wl[0] && known(0,-1)) rawSegs.push(x, y, x+s, y);
      if (wl[3] && known(-1,0)) rawSegs.push(x, y, x, y+s);
      if (wl[1] && known(1,0))  rawSegs.push(x+s, y, x+s, y+s);
      if (wl[2] && known(0,1))  rawSegs.push(x, y+s, x+s, y+s);
    }
    const segMap = new Map();
    for (let n=0;n<rawSegs.length;n+=4){
      const x1=rawSegs[n],y1=rawSegs[n+1],x2=rawSegs[n+2],y2=rawSegs[n+3];
      const a=[Math.round(x1*4),Math.round(y1*4)], b=[Math.round(x2*4),Math.round(y2*4)];
      const [p,q] = (a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) ? [a,b] : [b,a];
      segMap.set(p[0]+','+p[1]+','+q[0]+','+q[1], [x1,y1,x2,y2]);
    }
    const segs = [];
    segMap.forEach(s => segs.push(s[0],s[1],s[2],s[3]));
    drawCardWalls(g, segs, cellSize, k, ox, oy);


    // every flap still shut. They all carry the same blur, so one accumulated path
    // gives the whole field its shadow for a single filter pass.
    const shutCells = [];
    for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++){
      if (!explored.has(idx(c,r))) shutCells.push(c, r);
    }
    if (shutCells.length) cardShutFlaps(g, ox, oy, shutCells, k);
  }

  function cardShutFlaps(g, ox, oy, list, k){
    const each = (dx, dy) => {
      g.beginPath();
      for (let n=0;n<list.length;n+=2) flapPath(g, list[n], list[n+1], ox, oy, 0, dx, dy);
    };
    g.save();
    g.filter = 'blur(' + (1.4*k).toFixed(2) + 'px)'; g.globalAlpha = 0.42;
    g.fillStyle = CARD.shadow + '1)'; each(1.2*k, 1.8*k); g.fill();
    g.restore();
    g.fillStyle = cardAnchor(cardTile('face'), ox, oy); each(0,0); g.fill();
    g.strokeStyle = CARD.edge; g.lineWidth = 1; each(0,0); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.34)'; each(0, -0.9*k); g.stroke();
  }

  // The few mid-turn, drawn live over the baked field. A flap opens like a pair of
  // shutters: it splits down the middle and each leaf swings out on its own outer
  // hinge, so the ground appears from the centre first rather than sweeping in from
  // one side. At rest the two leaves meet exactly and read as one square, which is why
  // the baked shut layer above needs no knowledge of any of this.
  //
  // Each leaf's path is built inside a rotated frame but filled outside it, so the
  // stock's fibre and every drop shadow stay in screen space — the light keeps coming
  // from one direction even for the flaps whose split runs the other way.
  function cardFlaps(g, ox, oy, moving){
    const k = cellSize/30;
    for (const i of moving) shutterFlap(g, cx(i), cy(i), ox, oy, flapOpen[i], k);
  }
  // one flap mid-turn — shared with the world-select card, which shows a single flap
  // caught partway so the card advertises what the world does
  function shutterFlap(g, c, r, ox, oy, o, k){
    {
      const fade = o < 0.78 ? 1 : Math.max(0, (1 - o)/0.22);
      if (fade <= 0.01) return;
      const size = cellSize - cellSize*0.06;
      const x = c*cellSize - ox + cellSize*0.03;
      const y = r*cellSize - oy + cellSize*0.03;
      const mx = c*cellSize - ox + cellSize/2, my = r*cellSize - oy + cellSize/2;
      const hinge = (Math.abs(hash(c*3.1 + r*5.7, 2))*4) | 0;
      const across = (hinge === 1 || hinge === 3);      // which way this one splits
      const ang = (hash(c*2.7 + r*4.1, 9)*2 - 1)*0.016 + (across ? Math.PI/2 : 0);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const tp = (px, py) => [ mx + (px-mx)*ca - (py-my)*sa, my + (px-mx)*sa + (py-my)*ca ];

      const half = size/2, bow = o*cellSize*0.05;
      const depth = half * Math.cos(o * Math.PI * 0.60);
      const sg = Math.sign(depth) || 1, dd = Math.abs(depth);
      const inset = (1 - dd/half) * (size*0.055);

      // one leaf, hinged on its outer edge; dir points from that hinge toward the split
      const leafPath = (hx, dir, ddx, ddy) => {
        const fx = hx + dir*sg*dd, oxx = ddx||0, oyy = ddy||0;
        const P = (px,py) => { const q = tp(px,py); return [q[0]+oxx, q[1]+oyy]; };
        const a = P(hx, y), b = P(fx, y+inset);
        const cq = P(fx + dir*bow, y+size/2), d2 = P(fx, y+size-inset), e = P(hx, y+size);
        g.moveTo(a[0], a[1]);
        g.lineTo(b[0], b[1]);
        g.quadraticCurveTo(cq[0], cq[1], d2[0], d2[1]);
        g.lineTo(e[0], e[1]);
        g.closePath();
      };

      // the cut down the middle, as a dark recess under the leaves: shadow hugging each
      // inner edge and easing off between them, lifting as real ground takes over
      const gapL = depth > 0 ? x + dd : x;
      const gapR = depth > 0 ? x + size - dd : x + size;
      if (gapR - gapL > 0.4){
        const g0 = tp(gapL, y+size/2), g1 = tp(gapR, y+size/2);
        const sh = g.createLinearGradient(g0[0], g0[1], g1[0], g1[1]);
        sh.addColorStop(0,   'rgba(40,26,10,.78)');
        sh.addColorStop(0.5, 'rgba(40,26,10,.34)');
        sh.addColorStop(1,   'rgba(40,26,10,.78)');
        const q0 = tp(gapL, y), q1 = tp(gapR, y), q2 = tp(gapR, y+size), q3 = tp(gapL, y+size);
        g.save();
        g.globalAlpha = fade * Math.max(0, 1 - o*0.75);
        g.fillStyle = sh;
        g.beginPath();
        g.moveTo(q0[0],q0[1]); g.lineTo(q1[0],q1[1]); g.lineTo(q2[0],q2[1]); g.lineTo(q3[0],q3[1]);
        g.closePath(); g.fill();
        g.restore();
      }

      const stock = cardAnchor(cardTile(depth >= 0 ? 'face' : 'back'), ox, oy);
      [[x, 1], [x+size, -1]].forEach(([hx, dir]) => {
        g.save();
        g.globalAlpha = 0.42 * (1 - o*0.25) * fade;
        g.shadowColor = CARD.shadow + '.9)';
        g.shadowBlur = (1.4 + o*5) * k;
        g.fillStyle = CARD.shadow + '1)';
        g.beginPath(); leafPath(hx, dir, 1.2*k + o*2.4*k, 1.8*k + o*3.0*k);
        g.fill(); g.restore();

        g.save(); g.globalAlpha = fade;
        g.beginPath(); leafPath(hx, dir, 0, 0);
        g.fillStyle = stock; g.fill();
        g.strokeStyle = CARD.edge; g.lineWidth = 1; g.stroke();
        if (depth >= 0){                              // a contact line while it still touches
          g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 1;
          g.beginPath(); leafPath(hx, dir, 0, -0.9*k); g.stroke();
        }
        g.restore();
      });

      // while it is all but shut, a fine dark score down the centre, so a closed flap
      // already shows where it is going to part
      if (o < 0.14){
        const s0 = tp(x+half, y), s1 = tp(x+half, y+size);
        g.save(); g.globalAlpha = fade;
        g.strokeStyle = 'rgba(48,32,14,' + (0.55*(1 - o/0.14)).toFixed(3) + ')';
        g.lineWidth = Math.max(1, cellSize*0.022);
        g.beginPath(); g.moveTo(s0[0],s0[1]); g.lineTo(s1[0],s1[1]); g.stroke();
        g.restore();
      }
    }
  }

  // the trail and everything standing on the spread
  function cardActors(t){
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    // same thin + soft glow trail every world uses now, in place of the old
    // yarn-and-twist rendering (yarnBodyAndTwist is left defined but unused).
    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize,
                              tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.strokeStyle = TRAIL_HALO; ctx.lineWidth = cellSize*0.28;
      strokeTrail();
      ctx.strokeStyle = TRAIL_THREAD; ctx.lineWidth = cellSize*0.09;
      strokeTrail();
    }
    // The two-tone bead -- same fixed-green head marker as every other world. Its
    // own drop shadow grounds it onto the board, same job the old invisible-point
    // shadow trick used to do for Olli's sprite.
    const hx = tipX - camX, hy = tipY - camY;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = cellSize*0.08; ctx.shadowOffsetY = cellSize*0.03;
    ctx.fillStyle = OLLI_GREEN_DK;
    ctx.beginPath(); ctx.arc(hx, hy, cellSize*0.16, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = OLLI_GREEN;
    ctx.beginPath(); ctx.arc(hx, hy-cellSize*0.015, cellSize*0.13, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(hx-cellSize*0.045, hy-cellSize*0.06, cellSize*0.05, cellSize*0.03, -0.5, 0, 7); ctx.fill();
  }

  const SKINS = { iso: drawIso, garden: drawGarden, card: drawCard };
  function draw(t){ (SKINS[T.skin] || SKINS.iso)(t); }

  // build the thread's points: committed cell centres, plus the live tip
  function threadPoints(){
    const pts = [];
    for (const i of trail) pts.push({ x:(cx(i)+0.5)*cellSize-camX, y:(cy(i)+0.5)*cellSize-camY });
    const hx = (cx(trail[trail.length-1])+0.5)*cellSize-camX, hy = (cy(trail[trail.length-1])+0.5)*cellSize-camY;
    const tx = tipX-camX, ty = tipY-camY;
    if (Math.hypot(tx-hx, ty-hy) > cellSize*0.04) pts.push({ x:tx, y:ty });  // add tip if beyond the head
    return pts;
  }
  function strokeTrail(){
    const pts = threadPoints();
    if (pts.length < 2){ if(pts.length===1){ } return; }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length-1;i++){                 // midpoint smoothing → flowing line, no hard corners
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  }

  function drawMarker(i, color, pulse, t){
    const x=(cx(i)+0.5)*cellSize-camX, y=(cy(i)+0.5)*cellSize-camY;
    if (pulse){
      const p = (Math.sin(t/520)*0.5+0.5);
      ctx.beginPath(); ctx.arc(x,y, cellSize*(0.28+0.22*p), 0, 7);
      ctx.strokeStyle = `rgba(${T.beaconRGB},${0.5-0.4*p})`; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.2, 0, 7);
      ctx.fillStyle = color; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.19, 0, 7);
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  // The exit shines through the fog — a light to head toward. It stays sealed (a
  // grey, closed basket) until you've gathered enough embers, then opens to reveal
  // Olli's collection inside. The basket itself is the same fixed-colour icon used
  // at the end of every world; only the ambient glow guiding you toward it, and the
  // off-screen compass arrow, live here.
  function drawBeacon(t){
    const head = trail[trail.length-1];
    const open = exitOpen();
    const bx=(cx(endCell)+0.5)*cellSize, by=(cy(endCell)+0.5)*cellSize;
    const hx=(cx(head)+0.5)*cellSize, hy=(cy(head)+0.5)*cellSize;
    const dCells = Math.hypot(bx-hx, by-hy)/cellSize;
    const intensity = Math.max(0.05, Math.min(1, 1 - dCells/16)) * (open ? 1 : 0.5);
    const sx = bx - camX, sy = by - camY;
    const onScreen = sx>-cellSize && sx<viewW+cellSize && sy>-cellSize && sy<viewH+cellSize;
    if (onScreen){
      const rad = cellSize*(0.8 + 2.4*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${BASKET_GLOW},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${BASKET_GLOW},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      if (explored.has(endCell)){
        // the basket itself -- same fixed-colour icon, outline, hover and shadow
        // as every other level's exit; sizing/position matches the finalized mockup.
        const bs = cellSize*1.05;
        drawExitBasket(ctx, sx, sy - bs*0.30, bs, open, t);
      } else {                                        // not yet explored: a dim hint
        ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.1*intensity+2,0,7);
        ctx.fillStyle=`rgba(${BASKET_GLOW},${0.6*intensity})`; ctx.fill();
      }
    } else {
      // edge compass: which way is the light
      const ccx=viewW/2, ccy=viewH/2, dx=sx-ccx, dy=sy-ccy, m=24;
      const tx = dx!==0 ? ((dx>0?viewW-m:m)-ccx)/dx : Infinity;
      const ty = dy!==0 ? ((dy>0?viewH-m:m)-ccy)/dy : Infinity;
      const tt = Math.min(Math.abs(tx),Math.abs(ty));
      const ex=ccx+dx*tt, ey=ccy+dy*tt, ang=Math.atan2(dy,dx);
      ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
      ctx.globalAlpha = (open ? 0.3 : 0.18) + 0.5*intensity; ctx.fillStyle = open ? TOMATO : WICKER_DK;
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
  }

  // Embers: steady warm motes — the exit keys. Glow faintly through nearby fog.
  function drawEmbers(t){
    const head = trail[trail.length-1];
    // Fixed red, matching the goal token's own #FF2828 (drawGoalToken/GOAL_TOKEN_SRC),
    // rather than T.ember's per-look warm yellow/orange -- now that the icon itself is
    // the same in every world, its glow reads as one colour too instead of shifting
    // with the theme underneath it.
    const warm = '255,40,40';
    const nearRange = 5;
    embers.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.6 : Math.max(0, 0.7 - dCells/(nearRange+4)));
      if (intensity <= 0.02) return;
      const bob = Math.sin(t/700 + i)*cellSize*0.06;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + bob;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      // Smaller and dimmer than the glow used to be, breathing in size + opacity on the
      // same slow cycle the "breathe" mockup variant used, phase-staggered by `i` (same
      // trick `bob` already uses) so nearby collectibles don't pulse in lockstep. Both
      // the base size and the breathing swing still scale with `intensity`, same as
      // before, so the fog-of-war fade for distant/unseen items is unchanged.
      const breathe = 0.5 + 0.5*Math.sin(t/900 + i);
      const rad = cellSize*(0.16 + 0.16*intensity + 0.07*breathe*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${warm},${(intensity*(0.20+0.15*breathe)).toFixed(3)})`);
      g.addColorStop(1, `rgba(${warm},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      drawGoalToken(ctx, sx, sy, cellSize, 0.5+0.4*intensity);
    });
  }

  // Flames: flickering fire — your light fuel. They burn brighter and reach further when your
  // own lantern is fading, so the dark itself guides you to fuel.
  function drawFlames(t){
    const head = trail[trail.length-1];
    const lowLight = 1 - light;
    const nearRange = 6 + lowLight*6;
    const boost = 1 + lowLight*0.9;
    flames.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.7 : Math.max(0, 0.8 - dCells/(nearRange+4)));
      intensity = Math.min(1, intensity*boost);
      if (intensity <= 0.03) return;
      const flick = 0.8 + 0.2*Math.sin(t/90 + i*1.7) + 0.08*Math.sin(t/41 + i*4.3);
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      const rad = cellSize*(0.42 + 0.42*intensity)*flick;
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(255,170,70,${0.6*intensity})`);
      g.addColorStop(1, `rgba(255,110,40,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      // little flame tongue
      const h = cellSize*0.34*flick;
      ctx.beginPath();
      ctx.moveTo(sx, sy - h);
      ctx.quadraticCurveTo(sx + cellSize*0.14, sy - h*0.15, sx, sy + cellSize*0.09);
      ctx.quadraticCurveTo(sx - cellSize*0.14, sy - h*0.15, sx, sy - h);
      ctx.fillStyle = `rgba(255,236,190,${0.85*intensity})`;
      ctx.fill();
    });
  }

  // Soft ripple when an ember is gathered.
  function drawBlooms(){
    const now = performance.now(), LIFE = 620;
    blooms = blooms.filter(b => now - b.t0 < LIFE);
    for (const b of blooms){
      const p = (now - b.t0)/LIFE;                 // 0..1
      const scale = b.big ? 2.4 : 1;
      const rad = cellSize*(0.2 + p*1.3)*scale;
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      const col = b.big ? T.beaconRGB : T.ember;
      ctx.strokeStyle = `rgba(${col},${0.5*(1-p)})`; ctx.lineWidth = 2.5*(1-p)+0.5; ctx.stroke();
    }
    // quick ring acknowledging a tap
    const TAP = 360;
    pings = pings.filter(b => now - b.t0 < TAP);
    for (const b of pings){
      const p = (now - b.t0)/TAP;
      const rad = cellSize*(0.15 + p*0.5);
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      ctx.strokeStyle = `rgba(${T.coreRGB},${0.55*(1-p)})`; ctx.lineWidth = 2*(1-p)+0.5; ctx.stroke();
    }
  }

  // ---- helpers ----
  let varCache = {};
  function getVar(name){ return varCache[name] || (varCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim()); }
  function fmt(ms){ const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function showHint(msg){
    elHint.textContent = msg;
    elHint.style.opacity = '1';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>{ elHint.style.opacity = '0'; }, 2600);
  }
  function updateHud(){
    const open = exitOpen();
    elEmbers.textContent = open ? `${emberNeed}/${emberNeed}` : `${Math.min(emberGot,emberNeed)}/${emberNeed}`;
    // the "way is open" tint, taken down the same way the mark is so it reads on the
    // light bar rather than glowing off it
    const beaconInk = `rgb(${toRGB(T.beacon).map(c => Math.round(c*0.46)).join(',')})`;
    elEmbers.parentElement.style.color = open ? beaconInk : '';
    if (elGoalIcon) elGoalIcon.classList.toggle('lit', open);
    elLightFill.style.width = Math.round(light*100) + '%';
    const low = light < CRIT && !won;
    elTrack.classList.toggle('low', low);
    elLightFill.style.background = low
      ? 'linear-gradient(90deg,#ff4d33,#ff8a5a)'                         // warning red when fading
      : `linear-gradient(90deg,${T.thread},${T.core})`;
    if (light > 0.55) warnedLow = false;                                 // re-arm the warning for next dark spell
    elTime.textContent = fmt((won || paused) ? elapsed : (started ? performance.now()-startTime : 0));
  }

  // ---- loop ----
  function frame(t){
    const dt = lastT ? t - lastT : 0; lastT = t;
    if (walkQueue.length && !won){        // glide the thread along a tapped route
      walkAcc += dt;
      while (walkAcc >= STEP_MS && walkQueue.length && !won){
        walkAcc -= STEP_MS;
        applyStep(walkQueue.shift());
      }
    }
    if (dragging && moved && !won) dragUpdate();
    else { tipCell = trail[trail.length-1]; tipT = 0; }   // idle / tap-walk: tip rests at the head
    // ease the drawn tip toward its target point on the head->tipCell edge
    const head = trail[trail.length-1], O = cellCenter(head), C = cellCenter(tipCell);
    const gx = O.x + (C.x-O.x)*tipT, gy = O.y + (C.y-O.y)*tipT;
    tipX += (gx - tipX) * TIP_EASE;
    tipY += (gy - tipY) * TIP_EASE;
    updateCamera();
    draw(t);
    updateHud();
    const hd = trail[trail.length-1];
    // the drone belongs to the maze — let it fade out while the world map is open
    Snd.ambient(light, Math.hypot(cx(hd)-cx(endCell), cy(hd)-cy(endCell)), !won && !mapEl.classList.contains('show'));
    requestAnimationFrame(frame);
  }

  // ---- controls ----
  // Exit/restart/sound live in the triple-tap menu now instead of topbar buttons --
  // tmSoundIcon has to exist before applyMute's first call below, since applyMute
  // closes over it.
  const tapMenu = document.getElementById('tapMenu');
  const tmSoundIcon = document.getElementById('tmSoundIcon');
  function openTapMenu(){ tapMenu?.classList.add('show'); }
  function closeTapMenu(){ tapMenu?.classList.remove('show'); }
  // tapping the dimmed backdrop itself (not one of the pills) dismisses the menu --
  // e.target===tapMenu is only true for a tap that lands on the backdrop, since a tap
  // on a pill button has that button (a descendant) as its target instead.
  tapMenu?.addEventListener('click', e => { if (e.target === tapMenu) closeTapMenu(); });
  document.getElementById('tmExit')?.addEventListener('click', ()=>{ closeTapMenu(); openMap(); });
  document.getElementById('tmRestart')?.addEventListener('click', ()=>{ closeTapMenu(); loadLevel(cur, true); });
  document.getElementById('tmSound')?.addEventListener('click', ()=>{
    soundMuted = !soundMuted;
    try{ localStorage.setItem('thread_mute', soundMuted?'1':'0'); }catch(e){}
    Snd.resume(); applyMute();
  });
  // Three quick taps anywhere on the board opens the menu; a slow fourth tap after the
  // 500ms window starts a fresh count instead of accidentally completing an old one.
  // Registered as its own listener on the same canvas/event the drag gesture already
  // uses -- onDown doesn't stop propagation, so both fire independently off one tap.
  let tapCount = 0, tapTimer = null;
  canvas.addEventListener('pointerdown', ()=>{
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 500);
    if (tapCount >= 3){
      tapCount = 0; clearTimeout(tapTimer);
      openTapMenu();
    }
  });
  // sound toggle (persisted)
  const speakerOn = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>';
  const speakerOff = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/>';
  let soundMuted = false; try{ soundMuted = localStorage.getItem('thread_mute')==='1'; }catch(e){}
  function applyMute(){
    Snd.setMuted(soundMuted);
    if (tmSoundIcon) tmSoundIcon.innerHTML = soundMuted ? speakerOff : speakerOn;
  }
  applyMute();
  // the map opens before anything is touched, so the audio context is built
  // suspended; the very first gesture anywhere wakes it
  window.addEventListener('pointerdown', ()=>Snd.resume(), { once:true, capture:true });
  document.getElementById('next').addEventListener('click', ()=>loadLevel(cur+1 < TOTAL ? cur+1 : cur));
  document.getElementById('tomap').addEventListener('click', openMap);

  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>layout(), 120); });

  // go
  // Defensive fix for an iOS "Add to Home Screen" quirk: with no browser chrome to
  // hide, standalone launches still sometimes land pre-scrolled by a few dozen
  // pixels (a holdover from auto-hiding a Safari address bar that isn't there in
  // standalone mode) -- that crops the top of the screen and opens a blank gap at
  // the bottom. html/body are already pinned with overflow:hidden above; this
  // covers the same bug from the other side, in case the scroll gets set before
  // that layout is fully in effect. Fired now, on load, AND once more shortly after
  // since the stray scroll can also get applied slightly after the page first paints.
  window.scrollTo(0, 0);
  window.addEventListener('load', () => window.scrollTo(0, 0));
  setTimeout(() => window.scrollTo(0, 0), 300);

  loadProgress();
  loadSaves();
  loadLevel(Math.min(beaten, TOTAL-1));   // resume at the next unbeaten level
  requestAnimationFrame(frame);

  // ---- boot loading screen -> map reveal ------------------------------------------
  // Timed to the logo/monster entrance CSS above: the last letter starts at .46s and
  // takes .5s (done ~.96s), the monster starts at 1.05s and takes .46s (done ~1.51s).
  // REVEAL_DELAY holds about a second past that before the real map slides up from
  // the bottom (.bootSlide, defined next to .sheet.show) and the loading screen fades
  // out from underneath it.
  const REVEAL_DELAY = 2500;
  const loadingEl = document.getElementById('loading');
  setTimeout(() => {
    openMap();                                     // builds + shows the real map
    mapEl.classList.add('bootSlide');
    if (loadingEl){
      loadingEl.classList.add('hide');
      setTimeout(() => loadingEl.remove(), 450);   // matches the fade-out duration
    }
  }, REVEAL_DELAY);
})();
</script>
</body>
</html>
