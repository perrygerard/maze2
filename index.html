<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a1114" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>A MAZE THING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
        :root{
    --page:#0a1114;
    --app:#10191d;
    --app-2:#0c1417;
    --ink:#e8eef0;
    --muted:#7f96a0;
    --wall:#33474f;
    --thread:#ffc06a;
    --thread-core:#fff0d2;
    --beacon:#56e0c8;
    --line:#1c2a30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* overflow:hidden on both html AND body (not just body) matters specifically for
     iOS "Add to Home Screen" launches: with no browser chrome to hide, iOS has a
     long-standing habit of quietly scrolling the outer document by a few dozen
     pixels right after launch, as a vestigial holdover from auto-hiding a Safari
     address bar that doesn't exist in standalone mode. If html itself can still
     scroll, that lands the page a bit further down than 0 -- which crops whatever
     was at the very top (behind the status bar) and opens a blank gap at the
     bottom. Pinning both eliminates the outer scroll entirely; see the defensive
     scrollTo(0,0) in the boot script below for the same fix's other half. */
  html,body{height:100%;margin:0;overflow:hidden;}
  /* one focus ring, everywhere: currentColor picks up whatever ink each button already
     uses, so it reads correctly on the light chrome (cream panels) and the dark win
     screen alike without a per-component override. */
  button:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #12211f 0%, var(--page) 60%);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }

  /* Phone frame on wide screens; fills the viewport on real phones */
  .device{
    position:relative;width:min(400px,100%);height:min(844px,100dvh);
    background:var(--app);border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 2px #1e2c31, 0 0 0 12px #060b0d, 0 40px 90px -30px #000;
    display:flex;flex-direction:column;
  }
  @media (max-width:440px){
    body{padding:0;}
    .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
  }

  .device.menu .topbar{display:none;}
  /* Back at the head of the board, where it originally sat -- a white panel hanging
     from the top edge, flat all the way across (no corner radius on any side) rather
     than rounded at the bottom. Carries the safe-area inset on its top padding
     instead of a bottom one now, so a notch or status bar doesn't crowd the
     LVL/goal/time row. The light meter sits inset inside that panel below the row
     that shows what it buys, with its own breathing room on every side, rather than
     running flush to the panel's own edge — it reads as one more thing the panel is
     holding, not as part of the panel's own shape. */
  .topbar{
    position:absolute;left:0;right:0;top:0;
    display:flex;flex-direction:column;gap:16px;
    padding:max(20px,calc(env(safe-area-inset-top) + 10px)) 4px 4px;
    background:#faf8f3;border-radius:0;
    box-shadow:0 16px 40px -10px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.10);
    z-index:5;
  }
  .track{height:5px;border-radius:999px;background:#faf8f3;overflow:hidden;flex:none;}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb055,#ffd98f);
    transition:width .5s cubic-bezier(.3,.8,.3,1);width:60%;}
  .track.low{box-shadow:0 0 0 1px rgba(255,90,60,.5);animation:lowpulse .9s ease-in-out infinite;}
  @keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* the rest of the bar's furniture sits in its own row below the light strip — it carries
     its own side padding now, since the strip above it sits much closer to the edge.
     Three direct children now (LVL, the goal pill, the clock) instead of two side
     button clusters plus a figs group -- back/mute/reset moved out entirely, so
     space-between spreads the three remaining pieces across the full row on its own,
     no wrapper needed to hold a button next to the LVL label anymore. */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;}
  /* LVL n — the small label and the big numeral, in the world's own ink */
  .lvl{display:flex;align-items:center;gap:5px;flex:none;color:var(--thread-ink,#4a3a1e);
    user-select:none;}
  .lvl span{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.75;}
  .mark{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;}

  /* The clock still reads as a plain figure on the panel -- no chip, just the number.
     The goal count gets its own warm pill behind it now, matching the reference: it's
     the thing the panel is most calling out, so it earns a bit of its own furniture
     the clock doesn't need. */
  .fig{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;font-weight:700;color:var(--thread-ink,#4a3a1e);
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .fig.ember{background:#efe1c4;border-radius:999px;padding:7px 16px 7px 12px;}
  /* every level now scatters the same thing (see renderGoalIcon) so the icon itself
     no longer needs a per-world identity -- it just needs to read clearly at this
     size, which is why it's sized up to its own little illustration rather than a
     bullet point. */
  .goalIcon{width:24px;height:24px;flex:none;display:inline-flex;transition:filter .25s ease;}
  .goalIcon svg{width:100%;height:100%;display:block;}
  .goalIcon.lit{filter:saturate(1.3) brightness(1.1) drop-shadow(0 0 2px rgba(0,0,0,.2));}
  /* bare glyphs, no chip behind them — the bar is already a panel, a button inside a
     panel is one box too many */
  .iconbtn{border:0;background:none;color:#57534a;padding:0;
    width:26px;height:26px;cursor:pointer;display:grid;place-items:center;transition:color .18s;flex:none;}
  .iconbtn:hover{color:#22221c;}
  .iconbtn svg{width:19px;height:19px;stroke-width:2;}

  /* Triple-tap menu: a dimmed backdrop over the board with three pill buttons on it,
     the same white-panel-on-dark-scrim language the win screen already uses. Sits at
     z-index 4, one below the topbar's 5, so the opaque topbar (and the light meter
     inside it) stays visible and undimmed above the scrim instead of getting covered
     by it -- the dimming only ever reaches the board underneath. */
  .tapmenu{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;
    background:rgba(40,36,28,.55);}
  .tapmenu.show{display:flex;animation:fade .2s ease both;}
  .tapsheet{display:flex;flex-direction:column;gap:14px;width:min(76%,150px);}
  .tapbtn{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:#faf8f3;border:0;border-radius:999px;padding:17px 24px;
    font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:19px;font-weight:700;color:#3a352c;
    box-shadow:0 8px 22px -8px rgba(16,12,6,.38), 0 1px 3px rgba(16,12,6,.16);
    cursor:pointer;}
  .tapbtn svg{width:22px;height:22px;stroke-width:2.2;flex:none;color:#57534a;}

  .stage{position:relative;flex:1;min-height:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  /* only the live gameplay canvas drives its own drag handling and needs the browser's
     default touch gestures fully out of the way — the card-art canvases in the world
     deck (canvas.scene) must NOT inherit this, or a touch starting on the artwork
     (i.e. anywhere but the foot panel) stops the deck's own swipe-to-change-card from
     working, which is exactly the bug this rule used to cause when it was blanket-`canvas`. */
  #c{touch-action:none;}

  /* Instructions sit in the middle of the board, where the eye already is, rather than
     tucked along an edge. Centred text that wraps inside a max width instead of one
     nowrap line, so a longer hint stays on screen on a narrow phone. */
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(10,17,20,.62);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--ink);font-size:14px;line-height:1.45;padding:10px 16px;border-radius:18px;
    max-width:min(82%,300px);text-align:center;text-wrap:balance;
    pointer-events:none;transition:opacity .5s;}
  .hint b{color:var(--thread);font-weight:500;}

  /* Win */
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:radial-gradient(90% 60% at 50% 42%, rgba(21,42,40,.86), rgba(8,14,16,.94));
    backdrop-filter:blur(3px);z-index:8;text-align:center;padding:24px;}
  .win.show{display:flex;animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win h2{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:30px;margin:0;}
  .win p{color:var(--muted);margin:2px 0 18px;font-size:14px;}
  .win .figures{display:flex;gap:26px;margin-bottom:22px;}
  .win .figures div{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:21px;}
  .win .figures span{display:block;font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .btn{border:0;background:var(--thread);color:#241704;font:inherit;font-weight:600;font-size:15px;
    padding:12px 22px;border-radius:14px;cursor:pointer;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #2b3e45;}
  .win .row{display:flex;gap:10px;}

  /* world map */
  /* The page is paper the cards are laid on, not a night sky: the worlds carry the
     colour now, and a light ground is what lets three very different ones sit side by
     side without one of them looking like it is lit wrong. */
  /* No side padding here: the deck runs the full width so a card can sit closer to the
     edge and the next world still shows past it. What little inset the cards need comes
     from the deck's own padding, which the shadow can spill into. */
  .sheet{position:absolute;inset:0;touch-action:pan-y;display:none;flex-direction:column;z-index:9;padding:16px 0;
    /* No justify-content:center here on purpose — centering an overflowing flex
       container clips its leading edge in a way you can't scroll back to, and these
       cards are tall enough now to overflow on shorter screens. Top-aligned with the
       deck's own padding-block is the safe version of "centered". */

    padding-top:max(12px,env(safe-area-inset-top));}
  .sheet.show{display:flex;animation:fade .28s ease both;}
  /* the world's own light, washed across the page behind the cards */
  .mapbg{display:none;}   /* uniform background now (#F8FAF6 + noise on .sheet), not per-world tinted */
  .deck{position:relative;z-index:1;}
  /* the source sits above the frame — only its falloff is ever on screen, so the light
     reads as spilling in from somewhere out of view rather than as a lamp in the layout. */
  @keyframes litbreathe{
    0%,100%{filter:drop-shadow(0 2px 3px rgba(90,70,44,.16));}
    50%    {filter:drop-shadow(0 3px 9px rgba(90,70,44,.30));}
  }

  /* full-bleed single-world-scroll map, Candy-Crush style, in place of the horizontal
     card carousel. One tall scene fills the sheet edge to edge (no card margins, no
     rounded frame, no drop shadow); the trail runs off both the top and bottom of the
     canvas so there's always a bit more of it teased past the fold -- scenePath's own
     fog/near-cell rendering already fades that overrun out rather than hard-cropping
     it, which is what sells "the world keeps going" without needing any new maze
     content. */
  .deck{display:block;}
  .fbScene{display:block;width:100%;height:1900px;}   /* garden slice (1050) + iso slice (850) */
  /* the 3 cloud-band puff layers, split off the main canvas so each can scroll at its
     own rate (see buildCloudLayers/applyParallax) -- positioned with top/height set
     inline per layer, width always the full deck so puffs can spread edge to edge.
     will-change hints the browser this one repaints on scroll, which the big static
     terrain canvas next to it never does. */
  .cloudLayer{position:absolute;left:0;width:100%;display:block;pointer-events:none;
    will-change:transform;}
  /* Cards are narrower than the deck so the next world is always half-visible at the
     edge — that peek is what tells you the deck is a deck. The padding either side is
     what lets the first and last card still reach the middle when they snap. */
  /* No will-change here. It promotes the card to its own compositing layer sized to the
     card's own box, and the frame's shadow reaches past that box — which is what was
     clipping it. The scale still animates fine without the hint. */
  .card{flex:0 0 300px;scroll-snap-align:center;scroll-snap-stop:always;
    position:relative;background:none;transition:filter .3s ease;
    transform-origin:50% 46%;}
  /* exactly half the leftover width, so the end cards land dead centre like the rest —
     narrower cards than before means more of each neighbour shows at rest, which is what
     now carries the "which world am I on" signal that a separate dots row used to.
     82% only left a ~22px sliver at 0.55 opacity on a 400px phone — technically a peek,
     but thin and dim enough to read as page margin rather than "another card is here".
     76%/12% roughly doubles that sliver's width. */
  .card:first-child{margin-left:40px;}
  .card:last-child{margin-right:40px;}
  .card.locked{filter:grayscale(.86) brightness(.9);}
  /* A card is a window onto the world, not an illustration of it: the scene inside is
     painted by the same style the levels are, so what you are choosing between is what
     you are about to play. Art on top, a plain foot underneath carrying the name and
     the levels — the foot is the same on every card, the art is the only thing that
     changes. The shadow is tinted with the world's own colour rather than black, so a
     warm world sits in a warm shadow and does not look pasted onto the page. */
  /* Height now drives the frame directly instead of being derived from an aspect-ratio
     against the card's width — aspect-ratio was quietly the tighter constraint before
     (it maxed out around 625px on a 400px-wide phone, well under the old 660px cap), so
     cards never actually reached "80% of the viewport" in practice. Dropping it and
     sizing straight off the viewport height is what actually makes the card taller. */
  .frame{position:relative;width:300px;height:540px;
    margin:0 auto;border-radius:22px;overflow:hidden;background:#0f0f0d;
    box-shadow:0 22px 44px -14px rgba(var(--shd),.50),
               0 6px 14px -4px rgba(var(--shd),.30),
               0 1px 2px rgba(var(--shd),.22);}
  /* The art runs the full card — no Play button floating over it any more; a pin
     itself is the button now, so tapping the level you want is the whole interaction. */
  .art{position:absolute;inset:0;}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-x;}
  /* where you left off in this world — quiet, under the name, only on the card you are on */
  .cstat{display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:10px;color:#8a8578;font-variant-numeric:tabular-nums;line-height:1;}
  .cstat.hide{display:none;}
  .cstat .cgauge{width:46px;height:5px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;}
  .cstat .cgauge i{display:block;height:100%;background:currentColor;}
  .cstat svg{width:11px;height:11px;display:block;opacity:.85;}
  .cstat span{display:flex;align-items:center;gap:4px;}

  /* The levels used to sit in a bottom bar; now they're pins standing right on the
     trail the card art already draws (same points scenePts/paintScene place the
     thread/yarn/lantern along), so the card reads as a little map of the world
     instead of a maze picture with a separate score row bolted under it. .lvpins is
     just a click-through-less positioning layer over the art; each .pin carries its
     own absolute left/top set inline (computed from the same cs/ox/oy paintScene
     uses) so it lands exactly on the painted curve regardless of which skin. */
  .lvpins{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:0;
    border-radius:50%;background:#f7f5ef;color:#3a382f;font:inherit;font-size:13px;
    font-weight:600;cursor:pointer;pointer-events:auto;
    font-variant-numeric:tabular-nums;
    display:grid;place-items:center;line-height:1;
    box-shadow:0 1px 2px rgba(16,12,6,.22), 0 5px 11px -3px rgba(16,12,6,.45);
    transition:transform .12s;}
  .pin svg{width:14px;height:14px;}
  .pin:hover:not(.locked):not(.cur){background:#fff;}
  .pin:active:not(.locked){transform:scale(.92);}
  .pin.done{color:var(--acc);}
  /* the one marker that says "you are here" -- filled, on every world, in the same
     warm thread colour the game already uses for exactly that meaning, plus a small
     dropped shadow-dot so it reads as standing on the ground rather than just another
     disc in the row. */
  .pin.cur{background:#ffb454;color:#3a2c12;
    box-shadow:0 2px 3px rgba(16,12,6,.28), 0 6px 14px -3px rgba(120,70,10,.55);}
  .pin.cur::after{content:'';position:absolute;left:50%;bottom:-9px;
    width:6px;height:6px;margin-left:-3px;border-radius:99px;
    background:rgba(20,14,4,.32);}
  /* a run left part-way: a small mark so the deck shows which levels are still warm */
  .pin.held::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:4px;height:4px;border-radius:99px;background:currentColor;opacity:.55;}
  .pin.locked{opacity:.4;cursor:default;}

  /* ---- boot loading screen ---------------------------------------------------------
     Sits above everything (highest z-index in the file) until the intro animation
     finishes, then fades out from underneath the map, which slides up from off-screen
     as its own transform-only entrance -- see the "go" section at the bottom of the
     script for the timing that ties the two together.
     Background matches the app's own off-white sheet colour (#F8FAF6) rather than
     inventing a new one, so there's no colour-flash between this screen and the map
     underneath it. Logo sits slightly above centre; the monster is pulled up under
     it on a negative margin so its horns overlap into the bottom of the letters, and
     paints IN FRONT of the letters (z-index 2 vs the logo's 1) so the overlap reads
     as the monster popping up over the wordmark. */
  .loading{
    position:absolute;inset:0;z-index:20;background:#F8FAF6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .loading.hide{opacity:0;pointer-events:none;transition:opacity .4s ease;}
  /* Each "letter" is its own full-size SVG (same viewBox, only its own path(s)
     visible) stacked with position:absolute so they land perfectly on top of one
     another -- animating the SVG root's own box like this keeps the transform in
     plain CSS pixels, rather than animating a <path>/<g> inside one shared SVG,
     which needs transform-box:fill-box and ties the translate distance to the
     SVG's internal viewBox units instead of real pixels. o/l1/l2 read left to
     right as the O, then the two "l" swashes; i carries the third swash plus the
     dot, since that's the rightmost group and the dot sits directly above it.
     The source SVG's own ink isn't centred in its 242-wide viewBox (more empty
     space on the left than the right), so a small translateX nudges the actual
     lettering back to true centre instead of just centring the empty box. */
  .loadingLogo{
    position:relative; z-index:1; width:250px; height:calc(250px * 162 / 242);
    transform:translateX(-9px);
  }
  .loadingLogo .ltr{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    opacity:0;
    animation:letterDrop .5s cubic-bezier(.24,.85,.34,1) both;
  }
  .loadingLogo .ltr-o { animation-delay:.10s; }
  .loadingLogo .ltr-l1{ animation-delay:.22s; }
  .loadingLogo .ltr-l2{ animation-delay:.34s; }
  .loadingLogo .ltr-i { animation-delay:.46s; }
  /* drops from above with a small bounce past rest before settling */
  @keyframes letterDrop{
    0%  {opacity:0; transform:translateY(-46px);}
    60% {opacity:1; transform:translateY(6px);}
    80% {            transform:translateY(-2px);}
    100%{opacity:1; transform:translateY(0);}
  }
  /* wider than the logo and pulled up on a negative margin so the horns overlap
     into the bottom of the letters -- z-index:2 (above the logo's 1) is what makes
     the monster paint in front of the wordmark where they overlap. */
  .loadingMonster{
    position:relative; z-index:2; width:228px; margin-top:-56px;
    opacity:0;transform:scale(.15) translateY(10px);
    animation:monsterIn .46s cubic-bezier(.28,1,.4,1) 1.05s forwards;
    transform-origin:50% 100%;
  }
  .loadingMonster img{width:100%;height:auto;display:block;}
  /* monster: pops up from almost nothing with a small bounce overshoot past full
     size before settling */
  @keyframes monsterIn{
    0%  {opacity:0; transform:scale(.15) translateY(10px);}
    60% {opacity:1; transform:scale(1.08) translateY(0);}
    80% {            transform:scale(.96);}
    100%{opacity:1; transform:scale(1);}
  }
  /* the map's own entrance the first time it's revealed, sliding up from fully
     off-screen -- distinct from the quick opacity-only .fade used when returning
     to the map mid-game, and only ever applied for that one boot transition
     (see the "go" section, which is the only place .bootSlide gets added). Higher
     specificity than plain .sheet.show so it wins over the default fade animation
     while both classes are present. */

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const topbarEl = document.querySelector('.topbar');
  const elTime = document.getElementById('time');
  const elEmbers = document.getElementById('embers');
  const elLightFill = document.getElementById('lightFill');
  const elTrack = elLightFill.parentElement;
  const elHint = document.getElementById('hint');
  const winEl = document.getElementById('win');
  const markEl = document.querySelector('.mark');
  const elGoalIcon = document.getElementById('goalIcon');
  const mapEl = document.getElementById('map');

  // ---- sound: fully synthesized (Web Audio), so the game stays one self-contained file ----
  // Everything sits in a minor-pentatonic scale; each world has its own root note, so moving
  // between worlds changes key. Soft attacks + a reverb send keep it calm and spacious.
  const Snd = (() => {
    const ROOTS = [196.00, 220.00, 174.61, 246.94, 130.81, 164.81];  // Ember G3, Tide A3, Moss F3, Gale B3, Veil C3, Card E3
    const PENT = [0,3,5,7,10];
    let ctx=null, master=null, reverb=null, noiseBuf=null, ready=false, muted=false, root=196;
    let drA,drB,drGain, beaconOsc,beaconGain, shimA,shimB,shimGain;
    const now = ()=>ctx.currentTime;
    function makeImpulse(dur,decay){ const len=ctx.sampleRate*dur, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
    function ensure(){
      if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      master = ctx.createGain(); master.gain.value = muted?0:0.55; master.connect(ctx.destination);
      reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(2.4,2.6);
      const rg = ctx.createGain(); rg.gain.value=0.55; reverb.connect(rg); rg.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      const df = ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=440;
      drGain = ctx.createGain(); drGain.gain.value=0; df.connect(drGain); drGain.connect(master);
      drA=ctx.createOscillator(); drA.type='sine'; drB=ctx.createOscillator(); drB.type='sine';
      drA.connect(df); drB.connect(df); drA.start(); drB.start();
      const bf=ctx.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=1100;
      beaconGain=ctx.createGain(); beaconGain.gain.value=0; beaconOsc=ctx.createOscillator(); beaconOsc.type='sine';
      beaconOsc.connect(bf); bf.connect(beaconGain); beaconGain.connect(master); beaconGain.connect(reverb); beaconOsc.start();
      const sf=ctx.createBiquadFilter(); sf.type='lowpass'; sf.frequency.value=3200;
      shimGain=ctx.createGain(); shimGain.gain.value=0; shimA=ctx.createOscillator(); shimA.type='sine'; shimB=ctx.createOscillator(); shimB.type='sine';

    function retune(){ if(!ready) return; const t=now();
      drA.frequency.setTargetAtTime(root/2,t,0.12); drB.frequency.setTargetAtTime(root/2*1.006,t,0.12);
      beaconOsc.frequency.setTargetAtTime(root*1.5,t,0.12);
      shimA.frequency.setTargetAtTime(root*3,t,0.12); shimB.frequency.setTargetAtTime(root*4.04,t,0.12); }

      const o=ctx.createOscillator(); o.type=type||'triangle'; o.frequency.value=freq;
      const gg=ctx.createGain(); gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+0.008); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      if(lp){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); f.connect(gg); } else o.connect(gg);
      gg.connect(master); if(rev) gg.connect(reverb); o.start(t); o.stop(t+dur+0.03); }

      isMuted(){ return muted; },
      setMuted(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:0.55, now(), 0.03); },
      setWorld(w){ root = ROOTS[w] ?? 196; retune(); },
      trace(len,dir){ tone(sfreq(len), dir<0?0.035:0.055, dir<0?0.11:0.09, 'triangle', 1600, true); },
      ember(){ [1,2.01,3.02].forEach((m,i)=> tone(sfreq(9)*m, 0.09/(i+1), 0.7, 'sine', 5000, true)); },
      flame(){ if(!ready) return; const t=now();

      win(){ [0,3,7,12,15].forEach((s,i)=> setTimeout(()=> tone(root*Math.pow(2,s/12), 0.10, 1.1, 'triangle', 3200, true), i*115)); },

      tap(){ tone(sfreq(5), 0.045, 0.14, 'sine', 2200, true); },
      ui(){ tone(root*2, 0.035, 0.08, 'sine', 3000, false); },
      ambient(lightLvl, beaconCells, active){ if(!ready) return; const t=now();

  let curWorld = 0, curLook = 0;
  const hash = (i,s)=>{ const x=Math.sin(i*127.1 + s*311.7)*43758.5453; return x-Math.floor(x); };

  const toRGB = hex => { const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  function shadeRGB(hex, f){ let [R,G,B]=toRGB(hex); if(f>=0){R+=(255-R)*f;G+=(255-G)*f;B+=(255-B)*f;} else {R*=(1+f);G*=(1+f);B*=(1+f);} return [R|0,G|0,B|0]; }

  let wallCoreRGB = [90,106,114], wallHiRGB = [150,164,172], bgRGB = [14,23,27];

  const LEVELS_PER_WORLD = 5;

  // difficulty ramps smoothly across all levels
  function levelParams(i){

      reachSpan: 3.2 - d*1.0,           // sight reaches a little less far

  function loadProgress(){ try{ const v=parseInt(localStorage.getItem('thread_progress')); if(!isNaN(v)) beaten=Math.max(0,Math.min(TOTAL,v)); }catch(e){} }

  // ---- per-level bookmarks ----
  // Stepping out to the map shouldn't cost you the run. Each level you leave keeps its
  // maze, its thread, what it has already lit, and where its clock stopped, so coming
  // back puts you exactly where you stood. Winning a level clears its bookmark, and so
  // does the reset button — those are the two ways to ask for a fresh maze.
  const SAVES = new Map();     // level index -> snapshot
  function saveSaves(){
    try{
      const o = {}; SAVES.forEach((v,k)=>{ o[k] = v; });
      localStorage.setItem('thread_levels', JSON.stringify(o));
    }catch(e){}               // a full quota just means the run lives in memory only
  }
  function loadSaves(){
    try{
      const o = JSON.parse(localStorage.getItem('thread_levels') || '{}');
      for (const k in o){ const i = +k; if (i>=0 && i<TOTAL && o[k] && o[k].walls) SAVES.set(i, o[k]); }
    }catch(e){}
  }
  function dropSave(i){ if (SAVES.delete(i)) saveSaves(); }

  // The clock stops the moment you leave for the map and picks up on the way back, so
  // menu time never lands on the level's total.
  function pauseClock(){
    if (started && !won && !paused){ elapsed = performance.now() - startTime; paused = true; }
  }

  function snapLevel(){
    if (!cells || won) return;                       // a finished level starts over next time
    let w = '';
    for (let i=0; i<cells.length; i++){
      const b = cells[i].walls;
      w += ((b[0]?1:0)|(b[1]?2:0)|(b[2]?4:0)|(b[3]?8:0)).toString(16);
    }
    SAVES.set(cur, {
      cols, rows, walls:w, start:startCell, end:endCell,
      trail: trail.slice(), explored: [...explored],
      embers: [...embers], flames: [...flames],
      light, emberGot, emberTotal, emberNeed, started, warnedLow,
      elapsed: (started && !paused) ? performance.now() - startTime : elapsed,
    });

  }

  function restoreLevel(i){
    const s = SAVES.get(i);
    if (!s || s.cols !== levelCols || s.rows !== levelRows || s.walls.length !== s.cols*s.rows) return false;
    cols = s.cols; rows = s.rows;
    cells = new Array(cols*rows);
    for (let k=0; k<cells.length; k++){
      const n = parseInt(s.walls[k], 16) || 0;
      cells[k] = { walls:[!!(n&1), !!(n&2), !!(n&4), !!(n&8)], v:true };

    light = s.light; emberGot = s.emberGot; emberTotal = s.emberTotal; emberNeed = s.emberNeed;

  // ---- state ----
  let cols, rows, cells, cellSize;

  // How tall the opaque topbar panel is right now -- the camera's vertical clamp keeps this

  let topInset = 0;
  let trail = [];              // array of cell indices
  let inTrail = new Set();     // membership for O(1)
  let endCell = 0, startCell = 0;

  let flameDensity = 0.018;    // fraction of cells holding a flame (light fuel)

  const FLAME_GAIN = 0.42;     // light restored per flame

  let embers = new Set();      // cells holding an uncollected ember (exit key)
  let flames = new Set();      // cells holding an uncollected flame (light fuel)
  let emberTotal = 0, emberGot = 0, emberNeed = 1;   // exit opens once emberGot >= emberNeed
  let warnedLow = false;       // whether we've warned about fading light this dark spell
  let braid = 0.05;            // fraction of extra walls opened (loops / alternate routes)

  // tap-to-move: a tap walks the thread along the corridor to the tapped cell
  let walkQueue = [];          // cells still to step into during an auto-walk
  let walkAcc = 0, lastT = 0;  // animation pacing
  const STEP_MS = 52;          // time per cell while auto-walking
  const DRAG_THRESH = 10;      // px of movement before a touch counts as a drag (else it's a tap)
  let downX = 0, downY = 0, moved = false;
  let pings = [];              // little rings acknowledging a tap
  let hintTimer = 0;           // transient message timer

  // smooth drag: a continuous "tip" that follows the finger along the corridor,
  // while the logical trail commits whole cells underneath it
  let tipX = 0, tipY = 0;      // rendered tip, world coords (eased)
  let tipCell = 0;             // the neighbour the tip is currently heading toward
  let tipT = 0;                // finger's projected fraction along head->tipCell (target)
  let fingerSX = 0, fingerSY = 0; // last finger position, canvas-relative screen px

  const idx = (c, r) => r * cols + c;
  const cx = i => i % cols;
  const cy = i => (i - (i % cols)) / cols;

  // ---- maze generation (recursive backtracker) ----
  function genMaze() {
    cells = Array.from({length: cols*rows}, () => ({ walls:[true,true,true,true], v:false }));
    const stack = [];
    let cur = idx(0,0); cells[cur].v = true;
    const dirs = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]; // dc,dr,wall,opposite
    let count = 1;
    while (count < cols*rows) {
      const c = cx(cur), r = cy(cur);
      const nbrs = [];
      for (const [dc,dr,w,ow] of dirs) {
        const nc=c+dc, nr=r+dr;
        if (nc>=0&&nc<cols&&nr>=0&&nr<rows && !cells[idx(nc,nr)].v) nbrs.push([idx(nc,nr),w,ow]);
      }
      if (nbrs.length) {
        const [ni,w,ow] = nbrs[(Math.random()*nbrs.length)|0];
        cells[cur].walls[w] = false; cells[ni].walls[ow] = false;
        stack.push(cur); cur = ni; cells[cur].v = true; count++;
      } else cur = stack.pop();
    }
    // braid: open a share of the remaining walls so there are loops and real route choices,
    // instead of a single line from start to finish.
    if (braid > 0){
      const closed = [];
      for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
        const i = idx(c,r);
        if (c<cols-1 && cells[i].walls[1]) closed.push([i, idx(c+1,r), 1, 3]);
        if (r<rows-1 && cells[i].walls[2]) closed.push([i, idx(c,r+1), 2, 0]);
      }
      for (let k=closed.length-1; k>0; k--){ const j=(Math.random()*(k+1))|0; [closed[k],closed[j]]=[closed[j],closed[k]]; }
      const openCount = Math.floor(closed.length * braid);
      for (let k=0; k<openCount; k++){ const [a,b,w,ow]=closed[k]; cells[a].walls[w]=false; cells[b].walls[ow]=false; }
    }
  }

  // Choose the exit at a random spot among the cells farthest (by corridor distance) from the
  // start — so its location varies each maze but the level is never trivially short.
  function pickExit(){
    const d = new Int32Array(cols*rows).fill(-1);
    d[startCell] = 0; const q = [startCell]; let maxD = 0;
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      for (const n of openNeighbors(i)){
        if (d[n] < 0){ d[n] = d[i]+1; if (d[n] > maxD) maxD = d[n]; q.push(n); }
      }
    }
    const thresh = maxD * 0.7;                 // only the far reaches qualify
    const far = [];
    for (let i=0; i<cols*rows; i++){ if (i !== startCell && d[i] >= thresh) far.push(i); }
    return far.length ? far[(Math.random()*far.length)|0] : (cols*rows-1);
  }

  function resetGame(newMaze=true) {
    levelVer++;
    cols = levelCols; rows = levelRows;
    if (newMaze) genMaze();
    startCell = idx(0,0);
    endCell = pickExit();
    trail = [startCell];
    inTrail = new Set(trail);
    explored = new Set();
    nearDepth = new Map();
    light = LIGHT_START;
    blooms = [];
    walkQueue.length = 0; pings = []; moved = false;
    tipCell = startCell; tipT = 0;
    warnedLow = false;
    placeEmbers();
    placeFlames();
    reveal();
    started = false; won = false; elapsed = 0; startTime = 0; paused = false;
    fingerActive = null;
    winEl.classList.remove('show');
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = 0; }
    elHint.innerHTML = `Gather <b>${emberNeed}</b> treat${emberNeed===1?'':'s'} for Olli`;
    elHint.style.opacity = '1';
    layout();
    tipX = (cx(startCell)+0.5)*cellSize; tipY = (cy(startCell)+0.5)*cellSize;
    // center camera on start immediately
    tCamX = camX = clampCam(cellSize*(cx(startCell)+0.5) - viewW/2, worldW()-viewW);
    tCamY = camY = clampCam(cellSize*(cy(startCell)+0.5) - viewH/2, worldH()-viewH, -topInset);
    updateHud();
  }

  // ---- worlds: apply a look, load a level, show the map ----
  function applyTheme(w, l){
    const W_ = WORLDS[w];
    curWorld = w; curLook = W_.levels[l] ?? W_.levels[0];
    // the look supplies the colours; the world supplies the renderer that uses them
    T = Object.assign({}, LOOKS[curLook], { skin:W_.skin, world:W_.name });
    const rs = document.documentElement.style;
    rs.setProperty('--app', T.app);
    rs.setProperty('--wall', T.wall);
    rs.setProperty('--thread', T.thread);
    rs.setProperty('--thread-core', T.core);
    rs.setProperty('--beacon', T.beacon);
    // The status bar is a light panel now, and the world's thread colour is pitched for
    // a dark one — it would wash out on white. This is the same hue taken down far
    // enough to read as ink, so the bar still changes with the world without going faint.
    rs.setProperty('--thread-ink', `rgb(${toRGB(T.thread).map(c => Math.round(c*0.42)).join(',')})`);
    varCache = {};                                   // bust cached CSS-var colours
    if (elLightFill){
      elLightFill.style.background = `linear-gradient(90deg, ${T.thread}, ${T.core})`;
      elLightFill.style.boxShadow = `0 0 10px rgba(${T.threadRGB},.6)`;
    }
    wallCoreRGB = shadeRGB(T.wall, 0.32); wallHiRGB = shadeRGB(T.wall, 0.62); bgRGB = toRGB(T.bg); // solid wall tones
    // the garden's hedge/cloud/path palette turns over with the level's season — every
    // other skin ignores this, since only garden reads from GARDEN at all
    if (W_.skin === 'garden') GARDEN = GARDEN_PALETTES[curLook] || GARDEN_PALETTES[LOOK.BLOOM];
    seedParticles();
    renderGoalIcon();
  }

  // What you collect is the same little tomato in every world now, not a per-theme
  // portrait (the garden's pinwheel vane, the ember glow elsewhere) -- so the icon is
  // fixed markup rather than something rebuilt from T.skin/T.beacon/T.core each time.
  function renderGoalIcon(){
    if (!elGoalIcon) return;
    elGoalIcon.innerHTML = '<svg viewBox="0 0 18 21" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="8" width="2" height="8" rx="1" fill="#595349"/>' +
      '<circle cx="9" cy="12" r="9" fill="#FF2828"/>' +
      '<ellipse cx="12.8284" cy="7.82844" rx="1.5" ry="2.5" transform="rotate(-45 12.8284 7.82844)" fill="#FFE8BE"/>' +
      '</svg>';
  }

    g.fillStyle = OLLI_GREEN_DK;
    g.beginPath(); g.arc(head[0], head[1], cs*0.16, 0, 7); g.fill();
    g.restore();
    g.fillStyle = OLLI_GREEN;
    g.beginPath(); g.arc(head[0], head[1]-cs*0.015, cs*0.13, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(head[0]-cs*0.045, head[1]-cs*0.06, cs*0.05, cs*0.03, -0.5, 0, 7); g.fill();
    // a flame waiting off to the side, the way one sits in a level
    const fx = ox + 5.4*cs, fy = oy + 6.4*cs;
    const fg = g.createRadialGradient(fx, fy, 0, fx, fy, cs*0.95);
    fg.addColorStop(0, 'rgba(255,196,110,.85)'); fg.addColorStop(0.45, 'rgba(232,132,44,.34)');
    fg.addColorStop(1, 'rgba(232,132,44,0)');
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, cs*0.95, 0, 7); g.fill();
    g.fillStyle = '#fff3d6';
    g.beginPath(); g.ellipse(fx, fy, cs*0.07, cs*0.15, 0, 0, 7); g.fill();

    const vg = g.createRadialGradient(w*0.42, h*0.48, Math.min(w,h)*0.10,
                                      w*0.42, h*0.48, Math.max(w,h)*0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.62, 'rgba(0,0,0,.34)');
    vg.addColorStop(1, 'rgba(0,0,0,.86)');
    g.fillStyle = vg; g.fillRect(0,0,w,h);
  }

  // Garden: the clipped hedge, the bright lawn and the filament, under cloud
  // extraPts (optional): a few more [c,r] cells prepended before the trail's usual
  // start, purely for the stroke to run through -- not added to SCENE_ON/SCENE_NEAR,
  // so sceneLit still treats that ground as unseen and the existing fog pass below
  // paints its cloud over it same as always. That's what makes the trail look like it
  // runs on and gets swallowed by the cloud instead of stopping cleanly: the stroke
  // is genuinely there, the fog just still covers it, in the same order it always
  // draws in. pts itself (and everything anchored to it -- the walls, the fog shape,
  // the head bead) is untouched, so this is a no-op for every existing caller that
  // doesn't pass anything.
  function sceneGarden(g, w, h, cs, ox, oy, extraPts){
    // shadows the module-level GARDEN on purpose: the world-select card always shows
    // the same Bloom art regardless of which season the player last loaded in-level
    const GARDEN = GARDEN_PALETTES[LOOK.BLOOM];
    const k = cs/42;
    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), 0, 0); g.fillRect(0,0,w,h);

    const pts = scenePts(cs, ox, oy);
    const strokePts = (extraPts && extraPts.length)
      ? extraPts.map(([c,r]) => [ox + (c+0.5)*cs, oy + (r+0.5)*cs]).concat(pts)
      : pts;
    const lay = () => {
      g.beginPath(); g.moveTo(strokePts[0][0], strokePts[0][1]);
      for (let i=1;i<strokePts.length-1;i++){
        const [ax,ay] = strokePts[i], [bx,by] = strokePts[i+1];
        g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
      }
      g.lineTo(strokePts[strokePts.length-1][0], strokePts[strokePts.length-1][1]);
    };
    g.lineCap='round'; g.lineJoin='round';
    // same thin + soft glow trail every world uses now, in place of the old
    // two-tone GARDEN.pathLo/path stroke
    lay(); g.strokeStyle = TRAIL_HALO; g.lineWidth = cs*0.28; g.stroke();
    lay(); g.strokeStyle = TRAIL_THREAD; g.lineWidth = cs*0.09; g.stroke();

    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      if (sceneLit(c,r) <= 0) continue;
      const x = ox + c*cs, y = oy + r*cs;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + cs*0.19 + hash(c,r,32)*cs*0.62, sy = y + cs*0.19 + hash(c,r,33)*cs*0.62;
        const sr = cs*0.107;
        g.fillStyle = GARDEN.spark;
        g.beginPath();
        g.moveTo(sx, sy-sr); g.quadraticCurveTo(sx, sy, sx+sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy+sr); g.quadraticCurveTo(sx, sy, sx-sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy-sr); g.fill();
      }
    }

    // the same stroke-based corrugated-wall renderer the live board bakes with
    // (drawHedgeWalls) instead of the old bumpy capsule-fill hedge -- rounded bends,
    // capped dead ends, the flush wall-face riser and the long morning-sun shadow all
    // come along for free, so the card finally previews what the level actually looks
    // like instead of an older hedge treatment.
    {
      // sceneWalls caps the corridor with a wall wherever the path used to just end --
      // that's exactly the edge the extended trail now runs through, so with extraPts
      // set that one capping segment reads as the hedge cutting the trail off instead
      // of the trail continuing past it. Computing its key the same way the segment
      // dedup below does (and skipping it there) opens that one gap; every other wall
      // is untouched, and callers that don't pass extraPts never compute this at all.
      let gapKey = null;
      if (extraPts && extraPts.length){
        const [gc, gr] = extraPts[extraPts.length - 1];   // nearest extension cell to the start
        const [pc, pr] = SCENE_PATH[0];                    // the original start cell (pin 5)
        const gapRow = Math.max(gr, pr);                   // shared edge = the lower cell's top
        const gy = oy + gapRow*cs, gx1 = ox + Math.min(gc,pc)*cs, gx2 = gx1 + cs;
        const a=[Math.round(gx1*4),Math.round(gy*4)], b=[Math.round(gx2*4),Math.round(gy*4)];
        gapKey = a[0]+','+a[1]+','+b[0]+','+b[1];
      }
      const rawSegs = sceneWalls(cs, ox, oy);
      const segMap = new Map();
      for (let n=0;n<rawSegs.length;n+=4){
        const x1=rawSegs[n],y1=rawSegs[n+1],x2=rawSegs[n+2],y2=rawSegs[n+3];
        const a=[Math.round(x1*4),Math.round(y1*4)], b=[Math.round(x2*4),Math.round(y2*4)];
        const [p,q] = (a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) ? [a,b] : [b,a];
        const key = p[0]+','+p[1]+','+q[0]+','+q[1];
        if (key === gapKey) continue;
        segMap.set(key, [x1,y1,x2,y2]);
      }
      const segs = [];
      segMap.forEach(sv => segs.push(sv[0],sv[1],sv[2],sv[3]));
      // This card always renders Bloom (see the shadowed GARDEN above), so the same
      // reversed fill/speckle treatment bakeGarden applies for LOOK.BLOOM applies here
      // unconditionally -- #163d1f/rgba(22,61,31, is the precomputed dark shade of the
      // #246534 border, same values bakeGarden uses.
      const HEDGE_WALL_PAL = {
        shadow: 'rgba(22,61,31,', wallBase: '#163d1f', wallLiner: '#246534',
        speckle: 'rgba('+toRGB(GARDEN.hedgeMid).join(',')+',.5)',
      };
      drawHedgeWalls(g, segs, cs, k, 0, 0, HEDGE_WALL_PAL, w, h);
    }

    const fogAt = (c,r) => sceneLit(c,r) <= 0;
    const fog = (rad, ins) => {
      const ov = Math.max(0.6, cs*0.014);
      g.beginPath();
      for (let r=-3; r<=SCENE_H+3; r++) for (let c=-3; c<=SCENE_W+3; c++){
        if (!fogAt(c,r)) continue;
        const n = fogAt(c,r-1), s2 = fogAt(c,r+1), we = fogAt(c-1,r), e = fogAt(c+1,r);
        const x0 = ox + c*cs + (we ? -ov : ins), x1 = ox + (c+1)*cs + (e ? ov : -ins);
        const y0 = oy + r*cs + (n ? -ov : ins), y1 = oy + (r+1)*cs + (s2 ? ov : -ins);
        g.roundRect(x0, y0, x1-x0, y1-y0,
          [ (!n && !we) ? rad : 0, (!n && !e) ? rad : 0,
            (!s2 && !e) ? rad : 0, (!s2 && !we) ? rad : 0 ]);
        const fil = rad*0.55, cxp = ox + c*cs, cyp = oy + r*cs;
        const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
        if (n  && we && !fogAt(c-1,r-1)) nook(cxp, cyp);
        if (n  && e  && !fogAt(c+1,r-1)) nook(cxp + cs, cyp);
        if (s2 && e  && !fogAt(c+1,r+1)) nook(cxp + cs, cyp + cs);
        if (s2 && we && !fogAt(c-1,r+1)) nook(cxp, cyp + cs);
      }
    };
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k; g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    fog(cs*0.40, 0); g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    fog(cs*0.42, 1.5*k); g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip(); g.fillStyle = cardAnchor(paperTile(), 4*k, 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    fog(cs*0.46, 5*k); g.fillStyle = GARDEN.cloudHi; g.fill();
    g.restore();
    const [hx, hy] = pts[pts.length-1];
    // Olli, carrying the light -- the warm glow stays, cast from a near-invisible
    // point so it halos around him instead of showing as its own bright disc
    g.save();
    g.shadowColor = 'rgba(255,206,110,.95)'; g.shadowBlur = cs*0.55;
    g.fillStyle = 'rgba(255,206,110,.01)';
    g.beginPath(); g.arc(hx, hy, cs*0.04, 0, 7); g.fill();
    g.restore();
    // the two-tone bead -- same fixed-green head marker as every other world (the
    // old start-of-trail ring at pts[0] is gone too, matching the live board)
    g.save();
    g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = cs*0.08; g.shadowOffsetY = cs*0.03;
    g.fillStyle = OLLI_GREEN_DK;
    g.beginPath(); g.arc(hx, hy, cs*0.16, 0, 7); g.fill();
    g.restore();
    g.fillStyle = OLLI_GREEN;
    g.beginPath(); g.arc(hx, hy-cs*0.015, cs*0.13, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(hx-cs*0.045, hy-cs*0.06, cs*0.05, cs*0.03, -0.5, 0, 7); g.fill();
  }

  // Paper: the board, still shut over most of it, and the yarn on what is open
  function scenePaper(g, w, h, cs, ox, oy){
    const k = cs/30;
    g.fillStyle = cardAnchor(cardTile('table'), 0, 0); g.fillRect(0,0,w,h);
    g.save();
    g.shadowColor = CARD.shadow + '.34)'; g.shadowBlur = 9*k; g.shadowOffsetY = 4*k;
    g.fillStyle = CARD.board;
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();
    g.save(); g.globalAlpha = 0.20;
    g.fillStyle = cardAnchor(cardTile('back'), 0, 0);
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();

    // the same corrugated wall the board draws — sceneWalls can hand the same physical
    // wall in from both of its cells, so it gets the identical dedup the board does
    // before any of the corner or end-cap logic sees it
    const rawScene = sceneWalls(cs, ox, oy);
    const sceneMap = new Map();
    for (let n=0;n<rawScene.length;n+=4){
      const x1=rawScene[n],y1=rawScene[n+1],x2=rawScene[n+2],y2=rawScene[n+3];
      const a=[Math.round(x1*4),Math.round(y1*4)], b=[Math.round(x2*4),Math.round(y2*4)];
      const [p,q] = (a[0]<b[0] || (a[0]===b[0] && a[1]<b[1])) ? [a,b] : [b,a];
      sceneMap.set(p[0]+','+p[1]+','+q[0]+','+q[1], [x1,y1,x2,y2]);
    }
    const segs = [];
    sceneMap.forEach(s => segs.push(s[0],s[1],s[2],s[3]));
    drawCardWalls(g, segs, cs, k, 0, 0);

    const pts = scenePts(cs, ox, oy), head = pts[pts.length-1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    // same thin + soft glow trail every world uses now, in place of the old
    // yarn-and-twist rendering (yarnBodyAndTwist is left defined but unused)
    g.strokeStyle = TRAIL_HALO; g.lineWidth = cs*0.28; sceneStroke(g, pts);
    g.strokeStyle = TRAIL_THREAD; g.lineWidth = cs*0.09; sceneStroke(g, pts);
    // the two-tone bead -- same fixed-green head marker as every other world (the
    // old start-of-trail ring at pts[0] and the yarn-ball head are both gone,
    // matching the live board)
    g.save();
    g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = cs*0.08; g.shadowOffsetY = cs*0.03;
    g.fillStyle = OLLI_GREEN_DK;
    g.beginPath(); g.arc(head[0], head[1], cs*0.16, 0, 7); g.fill();
    g.restore();
    g.fillStyle = OLLI_GREEN;
    g.beginPath(); g.arc(head[0], head[1]-cs*0.015, cs*0.13, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(head[0]-cs*0.045, head[1]-cs*0.06, cs*0.05, cs*0.03, -0.5, 0, 7); g.fill();

    // every flap still shut, plus one caught mid-turn so the card shows what it does
    const shut = [];
    for (let r=-1; r<=SCENE_H; r++) for (let c=-1; c<=SCENE_W; c++)
      if (sceneLit(c,r) <= 0) shut.push(c, r);
    const save = [cellSize, camX, camY];
    cellSize = cs; camX = -ox; camY = -oy;              // flapPath works in world space
    cardShutFlaps(g, -ox, -oy, shut, k);
    // one caught partway, opening as shutters exactly as it does in play
    g.save(); g.globalAlpha = 0.92;
    shutterFlap(g, 5, 4, -ox, -oy, 0.55, k);
    g.restore();
    cellSize = save[0]; camX = save[1]; camY = save[2];
  }

  const SCENES = [sceneGarden, sceneLantern, scenePaper];
  function paintScene(cv, wi){
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);
    // the corridor is centred on the card; the grid runs off every edge behind it
    const cs = r.width/5.2, ox = -cs*0.45, oy = r.height/2 - 4.5*cs;
    (SCENES[wi] || SCENES[0])(g, r.width, r.height, cs, ox, oy);
  }

  // the five level pins sit at points along the very same SCENE_PATH the card's
  // decorative trail is drawn through (see scenePts, used by every scene renderer
  // above) -- picking indices spaced across the path's 17-cell length lands each pin
  // on a cell centre the trail already visits, so no separate layout or interpolation
  // is needed and a pin always sits exactly on the painted curve, on every skin.
  // Path index 0 is the top of the trail, index 17 the bottom; labels run the other
  // way (1 at the bottom pin, 5 at the top) so the numbers read start-to-finish the
  // way the trail itself is walked, thread-tip end first.
  const PIN_PATH_IDX = [17, 13, 9, 4, 0];
  function scenePinPt(l){
    const cs = 300/5.2, ox = -cs*0.45, oy = 540/2 - 4.5*cs;
    const [c, r] = SCENE_PATH[PIN_PATH_IDX[l]];
    return [ox + (c+0.5)*cs, oy + (r+0.5)*cs];
  }

  // ---- full-bleed map, two worlds stacked in one scroll -----------------------------
  // Garden (world 0) sits in the lower slice, where the player currently is; iso
  // (world 1) continues in the slice above it. Each world only ever draws within its
  // own local w x <its own slice height> box (that's what its background fill/vignette
  // is sized against), so translating the canvas before calling it is enough to place
  // it in the right band -- no clipping needed, the two slices can't stomp on each
  // other because neither one's fillRect ever reaches past its own local height.
  // FB_SLICE_H holds each slice's own height; index 0 is the bottom-most (current)
  // world, higher indices stack upward above it, matching the vertical order they
  // paint and scroll in.
  const FB_SLICE_H = [1050, 850];         // [garden, iso] -- iso will grow this array later
  const FB_BOTTOM_GAP = [200, 260];       // how far each world's own pin 1 sits off ITS slice's bottom edge
  // where slice `slot` starts, top-down: everything above it (higher slot indices)
  // stacked first, since slot 0 is the bottom-most / last-painted slice
  function fbSliceTop(slot){
    let y = 0;
    for (let s = FB_SLICE_H.length - 1; s > slot; s--) y += FB_SLICE_H[s];
    return y;
  }
  function fbGeom(slot, w){
    const cs = w/5.2, ox = -cs*0.45;
    const oy = FB_SLICE_H[slot] - FB_BOTTOM_GAP[slot] - 8.5*cs;
    return { cs, ox, oy };
  }
  // A puffy, hand-drawn-feeling cloud band bridging the seam between two worlds --
  // built as a row of overlapping circles at varying size and height, the way a kid's
  // drawing makes a cloud, rather than a flat gradient rectangle or trying to stretch
  // sceneGarden's own cell-based fog (which only rounds where it meets the path, not
  // usefully far from it) all the way up into iso's territory. Three layers in the
  // exact same cloudLo/cloudMid/cloudHi progression and colours sceneGarden's own fog
  // already uses -- furthest/most jittery at the back, nearest/calmest at the front --
  // so it reads as the same clouds, just a bigger bank of them right at the boundary.
  function paintFullbleedScene(cv){
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);

    // iso, upper slice -- hard-coded to LOOK.EMBER same as the small-card thumbnail.
    {
      const isoH = FB_SLICE_H[1];
      const { cs, ox, oy } = fbGeom(1, r.width);
      g.save(); g.translate(0, fbSliceTop(1));
      sceneLantern(g, r.width, isoH, cs, ox, oy);
      g.restore();
    }
    // garden, lower slice -- the extended trail (extraPts) runs up from pin 5 and
    // vanishes into garden's own cloud layer well before reaching this slice's own
    // top edge.
    {
      const gardenH = FB_SLICE_H[0];
      const { cs, ox, oy } = fbGeom(0, r.width);
      g.save(); g.translate(0, fbSliceTop(0));
      sceneGarden(g, r.width, gardenH, cs, ox, oy, [[1,-2],[1,-1],[1,0]]);
      g.restore();
    }
    // the seam cloud band itself is NOT painted here -- see buildCloudLayers/
    // CLOUD_LAYER_DEFS below. Splitting it onto its own canvases, each with its own
    // scroll-linked transform, is what makes the parallax possible: the terrain here
    // stays the one fixed "ground truth" layer everything else is measured against.
  }
  // Depth-ordered back-to-front: lo is furthest/most jittery and drawn first (also
  // scrolls slowest -- speed furthest from 1), hi is nearest/calmest and drawn last
  // (speed closest to 1, closest to tracking the terrain 1:1). spreadf/baseRf are kept
  // tight so the whole band bunches close to the seam instead of reaching a long way up
  // into iso, and the speeds sit close together (all near 1) so the parallax reads as a
  // light drift rather than the layers visibly separating from each other on scroll.
  const CLOUD_LAYER_DEFS = [
    { key:'cloudLo',  baseRf:0.85, spreadf:0.70, count:7, seed:41.3, shadow:true,  speed:0.82 },
    { key:'cloudMid', baseRf:0.95, spreadf:0.50, count:8, seed:52.7, shadow:false, speed:0.88 },
    { key:'cloudHi',  baseRf:1.05, spreadf:0.30, count:9, seed:66.1, shadow:false, speed:0.94 },
  ];
  function paintCloudLayerCanvas(cv, def, w, cs, localSeamY){
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);
    const GARDEN = GARDEN_PALETTES[LOOK.BLOOM];
    const baseR = cs*def.baseRf, spread = cs*def.spreadf;
    g.save();
    if (def.shadow){ g.shadowColor = GARDEN.cast; g.shadowBlur = cs*0.12; g.shadowOffsetY = cs*0.10; }
    g.fillStyle = GARDEN[def.key];
    g.beginPath();
    const step = w / (def.count - 1);
    for (let i = 0; i < def.count; i++){
      const cx = i * step;
      const rr = baseR * (0.72 + hash(def.seed, i) * 0.56);
      const cy = localSeamY - spread * (0.25 + hash(def.seed, i + 0.5) * 0.75);
      g.moveTo(cx + rr, cy);
      g.arc(cx, cy, rr, 0, Math.PI*2);
    }
    g.fill();
    g.restore();
  }
  // Builds the 3 parallax cloud layers as their own absolutely-positioned canvases,
  // each tall enough to hold its own puffs with margin to spare, and wires a scroll
  // listener that keeps each one's on-screen position at seamY but lets it lag behind
  // the real scroll by (1 - speed) -- see the comment on the listener itself for the
  // actual formula. Called once per buildMap(), after the main scene canvas exists so
  // fbSliceTop/fbGeom have something to measure against.
  function buildCloudLayers(deck, w){
    deck.querySelectorAll('.cloudLayer').forEach(el => el.remove());
    const seamY = fbSliceTop(0), cs = fbGeom(0, w).cs;
    const layers = CLOUD_LAYER_DEFS.map(def => {
      const spread = cs*def.spreadf, baseR = cs*def.baseRf;
      const top = Math.round(seamY - spread - baseR*1.6);
      const height = Math.round(spread + baseR*3.2);
      const cv = document.createElement('canvas');
      cv.className = 'cloudLayer';
      cv.style.top = top + 'px';
      cv.style.height = height + 'px';
      cv.dataset.speed = def.speed;
      cv.dataset.naturalTop = top;
      deck.appendChild(cv);
      paintCloudLayerCanvas(cv, def, w, cs, seamY - top);
      return cv;
    });
    const sheetEl = document.getElementById('map');
    const applyParallax = () => {
      const st = sheetEl.scrollTop;
      layers.forEach(cv => {
        const speed = +cv.dataset.speed;
        // A layer scrolling at "speed" (0..1) should appear to move only `speed` px
        // for every 1px the real scroll moves. Left alone it moves 1:1 with the
        // scroll (normal DOM behaviour); this transform cancels out the (1 - speed)
        // portion of that movement, so slower layers visibly lag behind -- exactly

  /* ---- the page is the card, spread out ------------------------------------------

  function boxBlur(data, w, h, r){

          }

  function bgFrame(t){

  function layout() {

  const dist = (a, b) => Math.abs(cx(a)-cx(b)) + Math.abs(cy(a)-cy(b));

  // Scatter embers — you must gather a quota of them to open the exit, so they're spread
  // across the maze (biased toward dead ends and side corridors) to force real exploration.
  function placeEmbers(){

    const deadEnds = [], others = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell) continue;
      if (dist(i,startCell) < 3) continue;                 // give the opening room to breathe

    }
    const shuffle = a => { for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];} return a; };
    const pool = shuffle(deadEnds).concat(shuffle(others));

  // Scatter flames — pure light fuel, spread across corridors (not on embers), so keeping the
  // lantern alive is its own hunt, separate from opening the exit.
  function placeFlames(){
    flames = new Set();
    const count = Math.max(4, Math.round(cols*rows * flameDensity));
    const pool = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell || embers.has(i)) continue;

  const exitOpen = () => emberGot >= emberNeed;

  // Cast sight from the head: flood through OPEN corridors only, as far as the lantern reaches.
  // Walls block it, so corners hide what's beyond — you see down your hallway, not through it.
  let fogVer = 0;                 // bumped whenever what is visible changes
  let levelVer = 0;               // bumped on a new deal, so a skin can drop level state
  function reveal(){
    fogVer++;
    sightReach = reachOf(light);
    const maxDepth = Math.max(1, Math.round(sightReach));
    nearDepth = new Map();
    const head = trail[trail.length-1];
    const q = [head]; nearDepth.set(head, 0); explored.add(head);
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi], d = nearDepth.get(i);

  function brightnessOf(i){

  // One corridor-step: advance into new ground (spending light, gathering embers) or retract
  // back along the thread (free). Shared by dragging and tap-to-walk so they behave identically.
  function applyStep(next){
    const prev = trail.length > 1 ? trail[trail.length-2] : -1;
    if (next === prev){                            // retract — costs no light
      const popped = trail.pop();
      inTrail.delete(popped);
      Snd.trace(trail.length, -1);
    } else {                                        // advance into new ground
      trail.push(next);
      inTrail.add(next);
      Snd.trace(trail.length, 1);
      light = Math.max(0, light - DRAIN);
      if (embers.has(next)){                        // gather an ember (exit key — no light)
        embers.delete(next); emberGot++;

          blooms.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now(), big:true });
        }
      }
      if (flames.has(next)){                         // gather a flame (light fuel)
        flames.delete(next);
        Snd.flame();
        light = Math.min(1, light + FLAME_GAIN);
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now() });
        if (light > 0.55) warnedLow = false;
      }
      if (!warnedLow && light < CRIT){               // dramatic first warning
        warnedLow = true;

      }
    }

    if (!started) { started = true; startTime = performance.now(); elHint.style.opacity = '0'; }
    if (next === endCell){

      else {                                        // the way is sealed until the quota is met
        pings.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now() });
        Snd.sealed();
        const remain = emberNeed - emberGot;
        showHint(`Gather ${remain} more treat${remain===1?'':'s'} for Olli`);
      }
