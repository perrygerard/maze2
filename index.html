  // Shortest corridor route from the head to a tapped cell, staying within what's been seen
  // (so you can't tap your way through the fog). Unique in a perfect maze.
  function bfsPath(from, to){
    if (from === to || !explored.has(to)) return null;
    // tapping onto your own thread simply retraces back to that point
    if (inTrail.has(to)){
      const k = trail.indexOf(to);
      return k < 0 ? null : trail.slice(k, trail.length-1).reverse();
    }
    // otherwise route through seen corridors WITHOUT crossing the existing thread,
    // so with braided loops the line never knots itself
    const prevMap = new Map([[from, -1]]);
    const q = [from];
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      if (i === to) break;
      for (const n of openNeighbors(i)){
        if (!explored.has(n) || prevMap.has(n)) continue;
        if (inTrail.has(n) && n !== to) continue;   // don't walk over the thread
        prevMap.set(n, i); q.push(n);
      }
    }
    if (!prevMap.has(to)) return null;
    const path = []; let cur = to;
    while (cur !== from){ path.push(cur); cur = prevMap.get(cur); }
    return path.reverse();
  }

  // Move the trail head toward the finger cell, one valid corridor-step at a time.
  // Because the finger is physically on the corridor being traced, "step toward finger"
  // reliably follows the path — no global pathfinding needed.
  function stepToward(target) {
    let guard = 0;
    while (guard++ < 24) {
      const head = trail[trail.length-1];
      if (head === target || won) break;
      const prev = trail.length > 1 ? trail[trail.length-2] : -1;
      const nbrs = openNeighbors(head);
      let best = -1, bestD = dist(head, target);
      for (const n of nbrs) {
        const d = dist(n, target);
        if (d >= bestD) continue;                 // must make progress toward the finger
        if (n === prev || !inTrail.has(n)) {      // retrace previous, or explore new
          if (d < bestD) { best = n; bestD = d; }
        }
      }
      if (best === -1) break;
      applyStep(best);
    }
  }

  function onDown(e){
    if (won) return;
    dragging = true; moved = false;
    Snd.resume();
    downX = e.clientX; downY = e.clientY;
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;
    walkQueue.length = 0;                 // a new touch cancels any auto-walk in progress
    const head = trail[trail.length-1];   // start the tip exactly at the head
    tipCell = head; tipT = 0;
    tipX = (cx(head)+0.5)*cellSize; tipY = (cy(head)+0.5)*cellSize;
  }
  function onMove(e){
    if (!dragging || won) return;
    if (!moved && Math.hypot(e.clientX-downX, e.clientY-downY) < DRAG_THRESH) return;
    moved = true;                         // past the threshold: this is a drag
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;   // record; tracing happens per-frame
  }
  function onUp(e){
    if (!won && moved){                   // drag ended mid-edge: round to the nearest cell
      if (tipT >= 0.5) applyStep(tipCell);
    }
    dragging = false; fingerActive = null;
    if (won || moved) return;             // a drag already handled it
    const target = cellAt(e.clientX, e.clientY, false);   // a tap: walk there along the corridor
    const path = bfsPath(trail[trail.length-1], target);
    if (path && path.length){
      walkQueue = path; walkAcc = 0;
      Snd.tap();
      pings.push({ x:(cx(target)+0.5)*cellSize, y:(cy(target)+0.5)*cellSize, t0:performance.now() });
    }
  }

  // ---- smooth corridor-tracking tip ----
  const cellCenter = i => ({ x:(cx(i)+0.5)*cellSize, y:(cy(i)+0.5)*cellSize });
  const fingerWorld = () => ({ x: fingerSX + camX, y: fingerSY - FINGER_LIFT*cellSize + camY });

  // Which open direction the finger is pulling toward from cell h, and how far (0..1) along it.
  function chooseTip(h, F){
    const O = cellCenter(h);
    const dx = F.x-O.x, dy = F.y-O.y, dlen = Math.hypot(dx,dy);
    if (dlen < cellSize*0.06) return { cell:h, t:0 };
    const prev = trail.length>1 ? trail[trail.length-2] : -1;
    const cands = [];
    for (const n of openNeighbors(h)) if (!inTrail.has(n)) cands.push(n); // advance into new ground
    if (prev>=0) cands.push(prev);                                        // or retrace
    if (!cands.length) return { cell:h, t:0 };
    let best=-1, bestScore=-2, bestT=0;
    for (const c of cands){
      const C = cellCenter(c);
      const ex = C.x-O.x, ey = C.y-O.y, el = Math.hypot(ex,ey)||1;
      const align = (dx*ex+dy*ey)/(dlen*el);
      const t = Math.max(0, Math.min(1, (dx*ex+dy*ey)/(el*el)));
      const bias = (c===tipCell) ? 0.12 : 0;   // hysteresis: don't flicker between directions
      if (align+bias > bestScore){ bestScore=align+bias; best=c; bestT=t; }
    }
    if (best<0 || bestScore < 0.12) return { cell:(best>=0?best:h), t:0 }; // finger pulling into a wall
    return { cell:best, t:bestT };
  }

  // Per-frame: commit whole cells the finger has crossed, then set the tip's target.
  function dragUpdate(){
    const F = fingerWorld();
    let head = trail[trail.length-1], guard = 0;
    while (guard++ < 8 && !won){
      const pk = chooseTip(head, F);
      if (pk.t < 0.999) break;              // finger hasn't reached the next centre yet
      applyStep(pk.cell);                   // crossed it — commit (light, embers, fog, win)
      head = trail[trail.length-1];
    }
    if (won){ tipCell=head; tipT=0; return; }
    const pk = chooseTip(head, F);
    tipCell = pk.cell; tipT = pk.t;
  }


  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e); });
  canvas.addEventListener('pointermove', onMove, {passive:false});
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function doWin(){
    if (won) return;
    won = true; dragging = false; fingerActive = null; walkQueue.length = 0;
    dropSave(cur);                                   // a beaten level is dealt fresh next time
    Snd.win();
    beaten = Math.max(beaten, cur+1); saveProgress();
    elapsed = started ? (performance.now() - startTime) : 0;
    document.getElementById('wtime').firstChild.nodeValue = fmt(elapsed);
    document.getElementById('wsteps').firstChild.nodeValue = String(trail.length-1);
    document.getElementById('wembers').firstChild.nodeValue = `${emberGot}/${emberTotal}`;
    const last = cur+1 >= TOTAL;
    const nextBtn = document.getElementById('next');
    nextBtn.textContent = last ? 'Play again' : 'Next level';
    const tags = ["You followed the trail.","Still warm — he was just here.","The snacks kept your glow up.","Closer than yesterday."];
    document.getElementById('wintag').textContent = last ? 'You found him.' : tags[(Math.random()*tags.length)|0];
    document.getElementById('winh2').textContent = last ? 'Olly olly, oxen free!' : 'Found one!';
    setTimeout(()=>winEl.classList.add('show'), 420);
  }

  // ---- camera follow (dead-zone + easing) ----
  function updateCamera(){
    const head = trail[trail.length-1];
    const hx = tipX, hy = tipY;           // follow the smooth tip, not the snapping cell
    if (walkQueue.length > 0){
      // tap-walking: no finger involved, so keep the lantern centred as the maze glides past
      tCamX = (cx(head)+0.5)*cellSize - viewW/2;
      tCamY = (cy(head)+0.5)*cellSize - viewH/2;
    } else {
      // dragging (or idle): hold a still patch of world so the finger maps to a stable cell
      const dzX = viewW*0.24, dzY = viewH*0.22;
      if (hx < tCamX + dzX) tCamX = hx - dzX;
      if (hx > tCamX + viewW - dzX) tCamX = hx - viewW + dzX;
      if (hy < tCamY + dzY) tCamY = hy - dzY;
      if (hy > tCamY + viewH - dzY) tCamY = hy - viewH + dzY;
    }
    tCamX = clampCam(tCamX, worldW()-viewW);
    tCamY = clampCam(tCamY, worldH()-viewH, -topInset);
    camX += (tCamX - camX) * 0.16;
    camY += (tCamY - camY) * 0.16;
  }

  // ---- per-world atmosphere ----
  let parts = [];
  function seedParticles(){
    const f = LOOK_FX[curLook].part, w = viewW||400, h = viewH||800;
    parts = [];
    for (let k=0;k<f.n;k++) parts.push({
      x: Math.random()*w, y: Math.random()*h,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
      ph: Math.random()*6.28, sp: 0.6 + Math.random()*0.8
    });
  }
  function drawParticles(t){
    const f = LOOK_FX[curLook].part;
    for (const p of parts){
      p.y += f.vy * p.sp;
      p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = viewH+4; else if (p.y > viewH+4) p.y = -4;
      if (p.x < -4) p.x = viewW+4; else if (p.x > viewW+4) p.x = -4;
      let a = 0.5;
      if (f.twinkle) a = 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3));
      if (f.type==='bubble'){
        ctx.strokeStyle = `rgba(${f.color},${a*0.5})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
        ctx.fillStyle = `rgba(${f.color},${a*0.12})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      } else if (f.type==='star'){
        ctx.fillStyle = `rgba(${f.color},${a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${f.color},${a*0.55})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
    }
  }
  // smooth value noise (continuous across cells) for mottled materials
  // ---- Minecraft-Dungeons-style block floor: chunky pixel tiles, one block per cell ----
  const BLOCK = [
    { base:['#3a2620','#472c22','#2f211d','#523228'], acc:['#c85a2a','#e0742f'], mortar:'#20140f', feat:'glow'    }, // Ember  (warm stone)
    { base:['#1f4a52','#256069','#1a3f4a','#2d6b74'], acc:['#4fb0a8','#7fd8c8'], mortar:'#123037', feat:'wave', shades:['#153a44','#1c4c56','#256069','#3a8a92','#6fd2d2'] }, // Tide (rippling water)
    { base:['#4a4f4c','#565b57','#3f443f','#515651'], acc:['#4a6b3a','#5f7d44'], mortar:'#2a2e2b', feat:'moss'    }, // Moss   (mossy cobble)
    { base:['#2f4266','#3a5480','#28384f','#42608f'], acc:['#8fc4ee','#b6dcf7'], mortar:'#1b2942', feat:'sparkle' }, // Gale   (wind-worn stone)
    { base:['#42464a','#4c5054','#3a3e42','#54585c'], acc:['#666a6e','#5a5e62'], mortar:'#26292c', feat:'brick'   }, // Veil   (cracked brick)
    { base:['#a8763c','#b8834a','#9a6a34','#c08e52'], acc:['#e0c08a','#f0e2c2'], mortar:'#7a5426', feat:'moss'    }, // Card   (kraft board)
    { base:['#5f9e46','#6cae4f','#55913f','#77bb58'], acc:['#9ed163','#c8e79a'], mortar:'#3f7a30', feat:'moss'    }, // Bloom  (clipped lawn)
  ];
  const tileCache = {};
  function genTile(w, seed, phase){
    const P = BLOCK[w], N = 16, cnv = document.createElement('canvas'); cnv.width = cnv.height = N;
    const g = cnv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + seed*3.7 + o*19.1)*43758.5453; return n-Math.floor(n); };
    if (P.feat==='wave'){                            // continuous rippling water — no block mortar
      const sh = P.shades, k = Math.PI*2/N;
      for (let y=0;y<N;y++) for (let x=0;x<N;x++){
        const wv = Math.sin(x*k*2 + y*k - phase)*0.6 + Math.sin(x*k - y*k*2 - phase*0.7)*0.4;   // -1..1, seamless
        const lvl = (wv+1)/2;
        g.fillStyle = sh[Math.min(sh.length-1, Math.floor(lvl*sh.length))];
        g.fillRect(x,y,1,1);
      }
      return cnv;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      let col = P.base[Math.floor(R(x,y,1)*P.base.length)];
      if (P.feat==='moss'){
        const m = R(x,y,2)*0.55 + (Math.sin(x*0.55+seed)+Math.sin(y*0.5+seed*1.3))*0.22 + 0.2;
        if (m>0.72) col = P.acc[Math.floor(R(x,y,3)*P.acc.length)];
      } else if (P.feat==='glow')   { if (R(x,y,4)>0.94) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      else if (P.feat==='sparkle')  { if (R(x,y,4)>0.96) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      g.fillStyle = col; g.fillRect(x,y,1,1);
    }
    // mortar bevel around the block so cells read as separate blocks
    g.fillStyle = P.mortar; g.globalAlpha = 0.55;
    g.fillRect(0,0,N,1); g.fillRect(0,N-1,N,1); g.fillRect(0,0,1,N); g.fillRect(N-1,0,1,N);
    g.globalAlpha = 1;
    if (P.feat==='brick'){                          // offset brick mortar + a crack
      g.fillStyle = P.mortar; g.globalAlpha = 0.6;
      g.fillRect(0,7,N,1); g.fillRect(0,15,N,1);
      g.fillRect(8,0,1,8); g.fillRect(4,8,1,8);
      g.globalAlpha = 0.7;
      let cxk = 2 + Math.floor(R(0,0,9)*(N-4));
      for (let y=1;y<N-1;y++){ g.fillRect(cxk,y,1,1); cxk += Math.floor(R(cxk,y,10)*3)-1; cxk = Math.max(1,Math.min(N-2,cxk)); }
      g.globalAlpha = 1;
    }
    if (P.feat==='glow'){                            // a hot vein through the warm stone
      g.fillStyle = P.acc[0]; g.globalAlpha = 0.9;
      let cxk = 2 + Math.floor(R(1,1,11)*(N-4));
      for (let y=2;y<N-2;y++){ if (R(cxk,y,12)>0.35){ g.fillRect(cxk,y,1,1); } cxk += Math.floor(R(cxk,y,13)*3)-1; cxk = Math.max(2,Math.min(N-3,cxk)); }
      g.globalAlpha = 1;
    }
    return cnv;
  }
  function blockTiles(w){
    if (tileCache[w]) return tileCache[w];
    let set;
    if (BLOCK[w].feat==='wave'){
      const frames = [], N = 8;
      for (let f=0; f<N; f++) frames.push(genTile(w, 7, (f/N)*Math.PI*2));
      set = { animated:true, tiles:frames };
    } else {
      const arr = []; for (let v=0;v<4;v++) arr.push(genTile(w, v*97+13, 0));
      set = { animated:false, tiles:arr };
    }
    return (tileCache[w] = set);
  }
  function drawFloorBlock(i,b,x,y,s,t){
    const set = blockTiles(curLook);
    const tile = set.animated
      ? set.tiles[Math.floor(t/120) % set.tiles.length]         // water ripples in sync
      : set.tiles[Math.floor(hash(i,7)*set.tiles.length) % set.tiles.length];
    ctx.globalAlpha = Math.min(1, 0.12 + 0.88*b);
    ctx.drawImage(tile, x, y, s+0.6, s+0.6);        // slight overlap avoids seams when scaled
    ctx.globalAlpha = 1;
  }

  // ---- render ----
  /* ---- skins ----------------------------------------------------------------
     Each world draws itself. Everything above this point is shared — the maze, the
     fog, the thread's position, the camera — and a skin is only ever handed the
     frame time and asked to paint. Adding a world's look means adding one entry to
     SKINS and pointing that world at it; nothing else in the game needs to know.
     -------------------------------------------------------------------------- */
  // Rough fieldstone for the mine walls: irregular-width blocks in a few rows, each with
  // its own bright top bevel, tinted from the world's own wall colour. Row height stays
  // constant and each row's stone widths always sum back to the full tile width, so the
  // pattern still repeats seamlessly even though it isn't a uniform grid. Anchored to
  // world space (via cardAnchor) so it doesn't swim as the camera pans.
  const wallStoneCache = {};
  function wallStoneTile(color, cellPx){
    const key = (color || T.wall) + '@' + Math.round(cellPx || 42);
    if (wallStoneCache[key]) return wallStoneCache[key];
    const rowH = Math.max(7, Math.round((cellPx || 42) * 0.34));
    const N = rowH * 4;
    const rows = [3, 4, 3, 4];              // stones per row — varying the count is what
    const cv = document.createElement('canvas'); cv.width = cv.height = N;   // keeps rows from lining up into a grid
    const g = cv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + o*4.7)*43758.5453; return n-Math.floor(n); };
    g.fillStyle = `rgba(${WALL_SHADOW.join(',')},1)`; g.fillRect(0,0,N,N);   // mortar shows in the gaps
    rows.forEach((cols, rIdx) => {
      const y = rIdx*rowH;
      const raw = []; let sum = 0;
      for (let c=0;c<cols;c++){ const w = 0.65 + R(c,rIdx,1)*0.7; raw.push(w); sum += w; }
      let x = 0, placed = 0;
      for (let c=0;c<cols;c++){
        const w = c===cols-1 ? (N-placed) : Math.round(raw[c]/sum*N);
        const base = shadeRGB(color, 0.16 + R(c,rIdx,2)*0.22);
        const lit  = shadeRGB(color, 0.48 + R(c,rIdx,3)*0.16);
        g.fillStyle = `rgb(${base.join(',')})`;
        g.fillRect(x+1, y+1, Math.max(1,w-2), rowH-2);
        g.fillStyle = `rgb(${lit.join(',')})`;              // bright top bevel per stone
        g.fillRect(x+1, y+1, Math.max(1,w-2), Math.max(1, rowH*0.24));
        x += w; placed += w;
      }
    });
    return (wallStoneCache[key] = ctx.createPattern(cv, 'repeat'));
  }

  function drawIso(t){
    ctx.clearRect(0,0,viewW,viewH);
    // ambient floor
    ctx.fillStyle = T.bg;
    ctx.fillRect(0,0,viewW,viewH);

    const c0 = Math.max(0, Math.floor(camX/cellSize));
    const r0 = Math.max(0, Math.floor(camY/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((camX+viewW)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((camY+viewH)/cellSize));

    // maze under fog: only explored cells render, brightest where the thread's light reaches
    const thread = getVar('--thread');
    const WB = 5, wallBuckets = Array.from({length:WB},()=>[]);   // segments grouped by brightness
    ctx.imageSmoothingEnabled = false;                          // keep the pixel blocks crisp
    for (let r=r0; r<=r1; r++){
      for (let c=c0; c<=c1; c++){
        const i = idx(c,r);
        const b = brightnessOf(i);
        if (b <= 0) continue;                     // unexplored stays dark
        const x = c*cellSize - camX, y = r*cellSize - camY, s = cellSize;
        drawFloorBlock(i, b, x, y, s, t);         // chunky pixel block for this cell
        if (b > DIM){                             // warm lantern light pooled on top
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.05 * b;
          ctx.fillStyle = thread;
          ctx.fillRect(x, y, s, s);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
        }
        const w = cells[i].walls;
        if (w[0]||w[1]||w[2]||w[3]){
          const bkt = wallBuckets[Math.min(WB-1, Math.floor(b*WB))];
          // top/left are always this cell's to declare; right/bottom are the neighbour's
          // to declare too, so only take them here at the edge of the render window (or
          // world) where that neighbour won't get a turn — otherwise the same physical
          // wall gets pushed from both sides and drawn twice.
          if (w[0]) bkt.push(x,y,x+s,y);
          if (w[3]) bkt.push(x,y,x,y+s);
          if (w[1] && (c===c1 || brightnessOf(idx(c+1,r))<=0)) bkt.push(x+s,y,x+s,y+s);
          if (w[2] && (r===r1 || brightnessOf(idx(c,r+1))<=0)) bkt.push(x,y+s,x+s,y+s);
        }
      }
    }
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;

    // walls: solid & opaque, drawn in batched passes — all shadows first, then all cores, then a
    // thin highlight. No transparency and single-stroke-per-batch, so overlaps never show.
    // Same relief as the hedges: thickness and offsets scale with the cell, with a steep
    // mostly-vertical throw between the shadow and the lit edge rather than a flat diagonal.
    const wk = cellSize/42;
    const thick = Math.max(5, cellSize*0.357);
    ctx.lineCap = 'square'; ctx.lineJoin = 'miter';   // flat, but extends half a stroke past each end so an L of two walls meets in a solid corner instead of leaving a notch
    const strokeBuckets = (col, lw, dx, dy, lighten)=>{
      ctx.save(); if (dx||dy) ctx.translate(dx,dy); ctx.lineWidth = lw;
      for (let lvl=0; lvl<WB; lvl++){
        const arr = wallBuckets[lvl]; if (!arr.length) continue;
        const bb = (lvl+0.5)/WB;
        ctx.strokeStyle = mixRGB(col, bgRGB, 1-bb);
        ctx.beginPath();
        for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
        ctx.stroke();
      }
      ctx.restore();
    };
    strokeBuckets(WALL_SHADOW, thick*1.2, 1.5*wk, 4.5*wk);            // drop shadow (opaque)

    // solid raised core, replaced with a world-anchored stone-block pattern so the
    // wall face reads as masonry rather than a flat fill
    ctx.save();
    ctx.lineWidth = thick;
    ctx.strokeStyle = cardAnchor(wallStoneTile(T.wall, cellSize), camX, camY);
    ctx.beginPath();
    for (let lvl=0; lvl<WB; lvl++){
      const arr = wallBuckets[lvl]; if (!arr.length) continue;
      for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
    }
    ctx.stroke();
    ctx.restore();
    // ...and dimmed toward fog per brightness bucket, same falloff the flat fill used
    ctx.save(); ctx.lineWidth = thick;
    for (let lvl=0; lvl<WB; lvl++){
      const arr = wallBuckets[lvl]; if (!arr.length) continue;
      const fade = 1 - (lvl+0.5)/WB;
      if (fade <= 0.02) continue;
      ctx.strokeStyle = `rgba(${bgRGB.join(',')},${fade.toFixed(3)})`;
      ctx.beginPath();
      for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
      ctx.stroke();
    }
    ctx.restore();

    drawParticles(t);                                         // drifting atmosphere in the lantern light
    const haze = LOOK_FX[curLook].haze;
    if (haze){                                                // soft world tint (e.g. Gale's cold sky)
      const hg = ctx.createRadialGradient(viewW/2, viewH*0.44, 0, viewW/2, viewH*0.44, viewH*0.7);
      hg.addColorStop(0, `rgba(${haze},0.16)`); hg.addColorStop(1, `rgba(${haze},0)`);
      ctx.fillStyle = hg; ctx.fillRect(0,0,viewW,viewH);
    }

    // deepen the dark beyond the reach of the light — and let it close in as the lantern gutters
    const lowLight = 1 - light;                               // 0 (full) .. 1 (guttering)
    const crit = Math.max(0, (CRIT - light) / CRIT);          // 0 above CRIT .. 1 at empty
    const pulse = crit>0 ? (0.06*crit)*(0.5+0.5*Math.sin(t/240)) : 0;  // ominous throb when dark
    const inner = viewH*(0.16 - lowLight*0.07 - crit*0.05);   // lit pool tightens, then clamps in hard
    const darkA = 0.55 + lowLight*0.28 + crit*0.16 + pulse;   // up to ~0.95 and pulsing
    const vg = ctx.createRadialGradient(viewW/2, viewH*0.46, Math.max(0,inner), viewW/2, viewH*0.46, viewH*0.72);
    vg.addColorStop(0, 'rgba(6,10,12,0)');
    vg.addColorStop(1, `rgba(5,9,11,${Math.min(0.97,darkA)})`);
    ctx.fillStyle = vg; ctx.fillRect(0,0,viewW,viewH);

    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    // the trail — same thin + soft glow technique in every world now, dims behind
    // you as the lantern fades. Colour comes from the current look's own thread pair.
    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize, tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.45 + 0.55*light;
      // wide dark halo, for contrast against whatever's underneath
      ctx.strokeStyle = TRAIL_HALO;
      ctx.lineWidth = cellSize*0.28;
      strokeTrail();
      // core
      ctx.strokeStyle = TRAIL_THREAD;
      ctx.lineWidth = cellSize*0.09;
      strokeTrail();
      ctx.globalAlpha = 1;
    }
    // Olli — now at the smoothly-eased tip, under the finger. The lantern glow he
    // carries stays (it's also how the light radius reads), cast from a near-invisible
    // point so it still halos around him without a bright disc showing through.
    const bx = tipX - camX, by = tipY - camY;
    ctx.save();
    ctx.shadowColor = `rgba(${T.coreRGB},.9)`; ctx.shadowBlur = cellSize*0.5;
    ctx.fillStyle = 'rgba(0,0,0,.01)';
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.04, 0, 7); ctx.fill();
    ctx.restore();
    // The two-tone bead: a fixed green (Olli's own colour, not a per-look accent),
    // darker base + lighter top bevel + a small highlight -- same shape/colour in
    // every world, marking the trail's head in place of his sprite.
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = cellSize*0.08; ctx.shadowOffsetY = cellSize*0.03;
    ctx.fillStyle = OLLI_GREEN_DK;
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.16, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = OLLI_GREEN;
    ctx.beginPath(); ctx.arc(bx, by-cellSize*0.015, cellSize*0.13, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(bx-cellSize*0.045, by-cellSize*0.06, cellSize*0.05, cellSize*0.03, -0.5, 0, 7); ctx.fill();
  }

  // The ground, the hedges and the cloud are static between steps: they only move
  // because the camera does. So they are drawn once into a world-anchored layer a
  // little larger than the viewport and then blitted with an offset, and only rebuilt
  // when the fog version changes or the camera runs past the margin.
  let bakeCv = null, bakeVer = -1, bakeX = 0, bakeY = 0, bakeCell = 0, bakeW = 0, bakeH = 0;
  const BAKE_M = 96;

  /* ---- skin: garden -----------------------------------------------------------
     A clipped garden in cut paper. Nothing here has height: the depth is entirely in
     the layering, because every mass — hedge and cloud alike — is the same shape cut
     three times, each sheet a little smaller than the one below it, so a shaded rim
     shows along one side and a lit one along the other.

     Hedge and cloud are built differently on purpose. A hedge wants a bumpy, clipped
     silhouette, so it is a union of capsules with circles bulging past their edges. A
     cloud does not: it wants to read as one sheet cut with a radius, so it is the maze
     grid itself, with a corner rounded only where both edges meeting there are on the
     outside. Building the cloud out of circles instead makes a heap of discs that never
     quite integrate.

     None of it moves between steps, so all of it bakes into a world-anchored layer the
     way the previous hedge world did — including the footprints, which only change when
     you commit to a cell.
     ---------------------------------------------------------------------------- */
  // One of these per garden look, keyed by the same LOOK index the level's `T` uses —
  // GARDEN itself is reassigned to the right entry in applyTheme() as the level changes,
  // so the whole hedge/cloud/path palette turns over with the season. sceneGarden (the
  // world-select card) shadows this with a fixed Bloom reference of its own further
  // down, so the card's art never drifts with whatever level you last played.
  const GARDEN_PALETTES = {
    [LOOK.BLOOM]: {
      grass:'#9ed163',
      hedgeLo:'#2c7038', hedgeMid:'#48a04c', hedgeHi:'#63b862',
      cloudLo:'#c2d2c4', cloudMid:'#e7eee5', cloudHi:'#fbfdfa',
      cast:'rgba(38,64,30,.42)',
      pathLo:'#d9c69c', path:'#f4ead0', lamp:'#ffe6a8', lampCore:'#fffdf2',
      petal:'#fbfbf4', petalPink:'#ffdce8', pollen:'#eec14a', stem:'#2c7038',
      spark:'#f6e07c',
    },
    [LOOK.SPRING]: {
      grass:'#b9e07a',
      hedgeLo:'#2e5f28', hedgeMid:'#5cae4a', hedgeHi:'#a6e26b',
      cloudLo:'#cfe0c8', cloudMid:'#eaf3e0', cloudHi:'#fbfdfa',
      cast:'rgba(38,64,30,.38)',
      pathLo:'#f0bed0', path:'#ffe9ef', lamp:'#ffd3e6', lampCore:'#fffdf2',
      petal:'#fffdf9', petalPink:'#ff9ec4', pollen:'#f7c8db', stem:'#2e5f28',
      spark:'#ffe2ef',
    },
    // Fall's approved v2 colorway: the hedge stays a natural evergreen (hedgeLo/
    // hedgeMid) rather than turning orange -- it's the duo-tone `speckle` (rust +
    // gold) that carries the autumn read, plus small leaf piles tucked into the
    // hedge's inside corners (see drawHedgeBlooms's sibling, drawGardenLeafPiles,
    // wired into bakeGarden below). Ambient fields (clouds/path/lamp/petal/spark/
    // cast) are the "Golden Harvest" warm-gold atmosphere explored alongside it.
    [LOOK.FALL]: {
      grass:'#849829',
      hedgeLo:'#3E4200', hedgeMid:'#5D6F0C', hedgeHi:'#f7c452',
      speckle:['#AC5408', '#C69307'],
      cloudLo:'#e6cd9e', cloudMid:'#f7e6c0', cloudHi:'#fffaea',
      cast:'rgba(74,44,14,.40)',
      pathLo:'#c99a56', path:'#f2d99c', lamp:'#ffc766', lampCore:'#fff6df',
      petal:'#ffedc4', petalPink:'#f0ac3d', pollen:'#e0921f', stem:'#3E4200',
      spark:'#ffe28a',
    },
    [LOOK.WINTER]: {
      grass:'#eef4f2',
      hedgeLo:'#12261c', hedgeMid:'#1f4530', hedgeHi:'#ffffff',
      cloudLo:'#d7e3ea', cloudMid:'#eef3f6', cloudHi:'#ffffff',
      cast:'rgba(14,30,38,.35)',
      pathLo:'#b9d0da', path:'#dce9ee', lamp:'#bfe9f2', lampCore:'#ffffff',
      petal:'#ffffff', petalPink:'#8fd6e8', pollen:'#cdeef5', stem:'#1f4530',
      spark:'#d8f4fb',
    },
    [LOOK.DEAD]: {
      grass:'#a49986',
      hedgeLo:'#241b12', hedgeMid:'#4a4030', hedgeHi:'#847a63',
      cloudLo:'#b6ae9c', cloudMid:'#cfc9ba', cloudHi:'#e2dccb',
      cast:'rgba(28,22,14,.45)',
      pathLo:'#a89f88', path:'#c7c0ac', lamp:'#a89878', lampCore:'#d8d2c2',
      petal:'#c9c0a8', petalPink:'#8a7d5c', pollen:'#8a7d5c', stem:'#241b12',
      spark:'#b3a98f',

  let GARDEN = GARDEN_PALETTES[LOOK.BLOOM];
  let paperPat = null, paperTileCv = null;
  // the tooth of the stock, world-anchored so it never swims under the camera
  function paperTile(){
    if (paperPat) return paperPat;
    const t = document.createElement('canvas'); t.width = t.height = 128;
    const c = t.getContext('2d');
    for (let i=0;i<900;i++){
      c.fillStyle = i%2 ? 'rgba(255,255,255,.15)' : 'rgba(70,96,44,.10)';
      c.fillRect(hash(i,0,71)*128, hash(i,1,71)*128, 1.4, 1.4);
    }
    paperTileCv = t;
    paperPat = ctx.createPattern(t, 'repeat');
    return paperPat;
  }

  // Clipped onto just the hedge's top layer (see drawHedgeWalls/bakeGarden) to break up
  // the flat fill the way the hand-drawn stamp art's speckle used to, without needing
  // per-season art. One colour, not three, so it reads as shading/clipped-leaf shadow
  // rather than confetti, and blocky irregular patches instead of round dots -- a coarse
  // value-noise field (the same corner-lattice-plus-smoothstep interpolation as any
  // standard value noise), sampled on a 2px grid and thresholded, so a patch's edges
  // fall on that grid instead of tracing a smooth curve. The corner lattice wraps mod G,
  // so the field is exactly periodic across the tile and the pattern repeats with no seam.
  // Keyed per colour (not one shared pattern) -- Bloom's reversed treatment and
  // Fall's duo-tone need their own speckle tints alongside the default, so all three
  // coexist rather than one overwriting the others' cache.
  const hedgeSpecklePats = {};
  // colors: a single string (the original one-tone speckle) or an array of strings
  // for a duo/multi-tone speckle (Fall) -- each colour gets its own independently
  // seeded noise lattice (offset by its index) so patches don't land in lockstep.
  // thresh: how much of the noise field counts as "on" -- lower is denser. Defaults
  // to the original 0.70; Fall's leafier scatter uses a lower value (see bakeGarden).
  function hedgeSpeckle(colors, thresh){
    colors = colors || 'rgba(36,101,52,.5)';
    if (typeof colors === 'string') colors = [colors];
    thresh = thresh === undefined ? 0.70 : thresh;
    const key = colors.join('|') + '@' + thresh;
    if (hedgeSpecklePats[key]) return hedgeSpecklePats[key];
    // CELL has to stay a whole number of pixels -- the previous pass at "3x smaller"
    // scaled it down to a fraction (2/3) right along with G, which kept the same
    // proportions on paper but meant almost every block landed on a non-integer
    // coordinate. fillRect at a fractional position isn't a hard-edged rect, it's
    // partial pixel coverage blended with whatever's behind it, and with a block
    // that small almost the whole block was that blended edge -- which is what read
    // as a soft, low-res blur rather than a crisp patch. G is still tripled from the
    // original pass at this (18) for the smaller patches; CELL stays a flat 1px
    // (rounded down from 2/3) so every block is hard-edged, and THRESH is nudged up
    // to keep the coverage from reading as denser now that patches are finer-grained.
    const T = 96, G = 54, CELL = 1;
    const t = document.createElement('canvas'); t.width = t.height = T;
    const c = t.getContext('2d');
    const smooth = v => v*v*(3-2*v);
    colors.forEach((color, ci) => {
      const seedOff = ci * 137.9;
      const corner = (gx,gy) => hash(((gx%G)+G)%G + 71.3*(((gy%G)+G)%G) + seedOff, 61);
      const noiseAt = (x,y) => {
        const gx = x/T*G, gy = y/T*G;
        const x0 = Math.floor(gx), y0 = Math.floor(gy);
        const fx = smooth(gx-x0), fy = smooth(gy-y0);
        const c00 = corner(x0,y0), c10 = corner(x0+1,y0), c01 = corner(x0,y0+1), c11 = corner(x0+1,y0+1);
        return (c00*(1-fx)+c10*fx)*(1-fy) + (c01*(1-fx)+c11*fx)*fy;
      };
      c.fillStyle = color;
      for (let y=0;y<T;y+=CELL){
        for (let x=0;x<T;x+=CELL){
          if (noiseAt(x+CELL/2, y+CELL/2) > thresh) c.fillRect(x, y, CELL, CELL);
        }
      }
    });
    const pat = ctx.createPattern(t, 'repeat');
    hedgeSpecklePats[key] = pat;
    return pat;
  }

  const gSeen = i => brightnessOf(i) > 0;

  const hedgeImg = {};
  let hedgeTilesReady = false;
  (function loadHedgeTiles(){
    const names = Object.keys(HEDGE_TILE_SRC);
    let loaded = 0;
    names.forEach(name => {
      const im = new Image();
      im.onload = () => {
        loaded++;
        if (loaded === names.length){ buildHedgeDerivedTiles(); hedgeTilesReady = true; bakeVer = -1; }
      };
      im.src = HEDGE_TILE_SRC[name];
      hedgeImg[name] = im;
    });
  })();
  function rotateHedgeTile(img, deg){
    const swapped = (deg === 90 || deg === 270);
    const w = img.width, h = img.height;
    const c = document.createElement('canvas');
    c.width = swapped ? h : w; c.height = swapped ? w : h;
    const cctx = c.getContext('2d');
    cctx.translate(c.width/2, c.height/2);
    cctx.rotate(deg*Math.PI/180);
    cctx.drawImage(img, -w/2, -h/2, w, h);
    return c;
  }
  function buildHedgeDerivedTiles(){
    // middle: wobble top+bottom, flush left+right -> as-is for horizontal runs, rotated 90
    // for vertical runs (wobble becomes left+right).
    hedgeImg.hMiddle = hedgeImg.middle;
    hedgeImg.hVert   = rotateHedgeTile(hedgeImg.middle, 90);
    // endcap: flush bottom, wobble top+left+right at rot 0 (caps a vertical stub whose wall
    // continues downward). Rotating 90 CW cycles which side is flush: 90->flush left (wall
    // continues left), 180->flush top (wall continues up), 270->flush right (continues right).
    hedgeImg.vTop    = rotateHedgeTile(hedgeImg.endcap, 0);
    hedgeImg.hRight  = rotateHedgeTile(hedgeImg.endcap, 90);
    hedgeImg.vBottom = rotateHedgeTile(hedgeImg.endcap, 180);
    hedgeImg.hLeft   = rotateHedgeTile(hedgeImg.endcap, 270);
  }
  const HEDGE_NATIVE_CELL = 72;
  const HEDGE_SHADOW_OFFSET_NATIVE = 6;
  // fraction of a cell each straight-run square stamp's side spans. 0.5 is deliberate, not
  // just "close enough to the old 0.55": it means exactly 2 of these square stamps tile one
  // maze cell with zero stretch in either axis (see hedgeDrawStrip). Still comfortably inside
  // the sealing-bug-free range verified earlier (0 cells sealed at 0.45-0.55).
  const HEDGE_WALL_THICKNESS = 0.5;
  // Matches HEDGE_WALL_THICKNESS exactly so the corner/T-stop wobble reads at the same scale
  // as the straight runs instead of looking like a slightly different radius where they meet.
  const HEDGE_JUNCTION_FRAC = 0.5;
  // how far adjacent square stamps grow into each other -- see hedgeDrawStrip's place().
  const HEDGE_SEAM_OVERLAP_NATIVE = 6;

  // ---- maze walls[N,E,S,W] per cell -> deduped grid-edge segments -> straight strips ->
  // corner/T/plus junction classification, computed once per maze and cached until the
  // level changes (fog reveals don't change the wall layout, only what's drawn of it) ----
  let hedgeStrips = [], hedgeCorners = [], hedgeTStops = [], hedgePlus = [];
  let hedgeLevelVer = -1, hedgeDegAt = () => 0;
  function hedgeWallSegments(){
    const segs = [];
    for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
      const w = cells[idx(c,r)].walls;
      if (w[0]) segs.push([c,r, c+1,r]);                     // N
      if (w[3]) segs.push([c,r, c,r+1]);                     // W
      if (c===cols-1 && w[1]) segs.push([c+1,r, c+1,r+1]);   // E, only the far column needs it
      if (r===rows-1 && w[2]) segs.push([c,r+1, c+1,r+1]);   // S, only the far row needs it
    }
    return segs;
  }
  function hedgeDedupeSegs(segs){
    const seen = new Set(); const out = [];
    segs.forEach(s => { const k = s.join(','); if (!seen.has(k)){ seen.add(k); out.push(s); } });
    return out;
  }
  function hedgeBuildStrips(segs){
    const horiz = segs.filter(s => s[1] === s[3]);
    const vert  = segs.filter(s => s[0] === s[2]);
    function mergeRanges(pairs){
      pairs.sort((a,b) => a[0]-b[0]);
      const merged = []; let cur = null;
      pairs.forEach(([a,b]) => {
        if (cur && a === cur[1]) cur[1] = b;
        else { if (cur) merged.push(cur.slice()); cur = [a,b]; }
      });
      if (cur) merged.push(cur);
      return merged;
    }
    const strips = [];
    const byRow = new Map();
    horiz.forEach(([x0,y,x1]) => { if (!byRow.has(y)) byRow.set(y, []); byRow.get(y).push([Math.min(x0,x1), Math.max(x0,x1)]); });
    byRow.forEach((pairs, y) => { mergeRanges(pairs).forEach(([x0,x1]) => strips.push({orient:'h', fixed:y, a:x0, b:x1})); });
    const byCol = new Map();
    vert.forEach(([x,y0,,y1]) => { if (!byCol.has(x)) byCol.set(x, []); byCol.get(x).push([Math.min(y0,y1), Math.max(y0,y1)]); });
    byCol.forEach((pairs, x) => { mergeRanges(pairs).forEach(([y0,y1]) => strips.push({orient:'v', fixed:x, a:y0, b:y1})); });
    return strips;
  }
  function hedgeDegreeMap(deduped){
    const deg = new Map();
    const bump = (x,y) => { const k = `${x},${y}`; deg.set(k, (deg.get(k)||0)+1); };
    deduped.forEach(([x1,y1,x2,y2]) => { bump(x1,y1); bump(x2,y2); });
    return deg;
  }
  function rebuildHedgeGeometry(){
    const segs = hedgeDedupeSegs(hedgeWallSegments());
    hedgeStrips = hedgeBuildStrips(segs);
    const degMap = hedgeDegreeMap(segs);
    const degAt = (x,y) => degMap.get(`${x},${y}`) || 0;

    const pointTouches = new Map();
    hedgeStrips.forEach(s => {
      const addTouch = (x,y,end) => {
        const k = `${x},${y}`;
        if (!pointTouches.has(k)) pointTouches.set(k, []);
        pointTouches.get(k).push({strip:s, end});
      };
      if (s.orient === 'h') { addTouch(s.a, s.fixed, 'a'); addTouch(s.b, s.fixed, 'b'); }
      else { addTouch(s.fixed, s.a, 'a'); addTouch(s.fixed, s.b, 'b'); }
    });
    hedgeCorners = []; hedgeTStops = []; hedgePlus = [];
    pointTouches.forEach((touches, key) => {
      const [x,y] = key.split(',').map(Number);
      if (degAt(x,y) < 2) return;
      const hs = touches.filter(t => t.strip.orient === 'h');
      const vs = touches.filter(t => t.strip.orient === 'v');
      if (hs.length === 1 && vs.length === 1 && touches.length === 2){
        const hDir = hs[0].end === 'a' ? 'right' : 'left';
        const vDir = vs[0].end === 'a' ? 'down' : 'up';
        const rot = { 'left_down':0, 'left_up':90, 'right_up':180, 'right_down':270 }[`${hDir}_${vDir}`];
        hedgeCorners.push({x, y, rot});
      } else if (touches.length === 1){
        const t = touches[0];
        const stubDir = t.strip.orient === 'h'
          ? (t.end === 'a' ? 'right' : 'left')
          : (t.end === 'a' ? 'down' : 'up');
        const rot = { down:0, left:90, up:180, right:270 }[stubDir];
        hedgeTStops.push({x, y, rot});
      } else {
        hedgePlus.push({x, y});
      }
    });
    const segOrientAt = new Map();
    segs.forEach(([x1,y1,x2,y2]) => {
      const isH = y1 === y2;
      [[x1,y1],[x2,y2]].forEach(([x,y]) => {
        const k = `${x},${y}`;
        if (!segOrientAt.has(k)) segOrientAt.set(k, new Set());
        segOrientAt.get(k).add(isH ? 'h' : 'v');
      });
    });
    segOrientAt.forEach((orients, key) => {
      if (pointTouches.has(key)) return;
      if (orients.has('h') && orients.has('v')){
        const [x,y] = key.split(',').map(Number);
        hedgePlus.push({x, y});
      }
    });
    hedgeDegAt = degAt;
    hedgeLevelVer = levelVer;
  }

  // fog-of-war gate: an edge/junction shows once any cell it touches has been seen --
  // generalises gardenHedge's old per-cell known(dc,dr) check to arbitrary grid points
  function hedgeCellKnown(c, r){
    return c>=0 && c<cols && r>=0 && r<rows && gSeen(idx(c,r));
  }
  // Back to the original, lenient "any touching cell seen" rule for both junctions and
  // segments -- reveal as early and smoothly as before. The cloud-overlap problem this used
  // to cause (a piece revealed while part of its own footprint was still under a still-foggy
  // cell) is now handled at the drawing-order level instead: the cloud is drawn BEFORE the
  // hedge tiles (see bakeGarden), so any cloud remnant a freshly-revealed piece overlaps just
  // ends up underneath it, not on top. That fixes the visual glitch without having to hold
  // pieces back until their whole neighborhood is lit, which is what made hedges pop in late
  // and abruptly instead of revealing gradually with the light.
  function hedgePointKnown(x, y){
    return hedgeCellKnown(x-1,y-1) || hedgeCellKnown(x,y-1) || hedgeCellKnown(x-1,y) || hedgeCellKnown(x,y);
  }
  // A segment only needs one of its two flanking cells seen; if neither is but a junction it
  // touches is already known, show it anyway so a straight run never lags behind the bend
  // it's feeding into (the original corner/T-stop "notch" bug).
  function hedgeSegKnown(x1,y1,x2,y2){
    if (hedgePointKnown(x1,y1) || hedgePointKnown(x2,y2)) return true;
    if (y1 === y2) return hedgeCellKnown(x1, y1-1) || hedgeCellKnown(x1, y1);
    return hedgeCellKnown(x1-1, y1) || hedgeCellKnown(x1, y1);
  }

  // Shadow and body are two separate draw calls (instead of one combined call) so the whole
  // hedge layer can be rendered in two full passes -- every tile's shadow first, then every
  // tile's body on top (see drawHedgeTiles). Solid color, hard edges, no blur -- matches the
  // flat-cutout art style of the rest of the hedge tiles instead of a soft/glowy shadow.
  let hedgeScratch = null;
  function hedgeDrawTileShadow(g, img, dx, dy, dw, dh, rotationDeg, scale){
    // Same shape as the body, grown uniformly around its own centre and recoloured solid --
    // the same "layered paper" trick used everywhere else in this file (the cloud sheets,
    // the blob-based hedge preview): a bigger, darker copy sits under a smaller, lighter
    // one, peeking out by the same amount on every side. The previous version shifted an
    // unscaled copy straight down instead, which only reads as a shadow on edges that face
    // "up" -- a corner's curve faces up on one side of the bend and sideways on the other,
    // so the sideways-facing half of the curve got little or no peek and kept reading as
    // "shadow doesn't reach the edge" no matter how the compositing order was fixed.
    // Growing has no preferred direction, so every edge gets the same peek regardless of
    // which way the tile is rotated.
    if (!hedgeScratch) hedgeScratch = document.createElement('canvas');
    const growPx = HEDGE_SHADOW_OFFSET_NATIVE * scale;
    const pad = 4;
    const gw = dw + growPx*2, gh = dh + growPx*2;
    const sw = Math.ceil(gw + pad*2), sh = Math.ceil(gh + pad*2);
    hedgeScratch.width = sw; hedgeScratch.height = sh;
    const sc = hedgeScratch.getContext('2d');
    sc.clearRect(0,0,sw,sh);
    sc.save();
    if (rotationDeg){
      sc.translate(sw/2, sh/2);
      sc.rotate(rotationDeg*Math.PI/180);
      sc.drawImage(img, -gw/2, -gh/2, gw, gh);
    } else {
      sc.drawImage(img, pad, pad, gw, gh);
    }
    sc.globalCompositeOperation = 'source-in';
    sc.fillStyle = GARDEN.hedgeLo;
    sc.fillRect(0,0,sw,sh);
    sc.restore();
    g.drawImage(hedgeScratch, dx-growPx-pad, dy-growPx-pad, sw, sh);
  }
  function hedgeDrawTileBody(g, img, dx, dy, dw, dh, rotationDeg, scale){
    g.save();
    if (rotationDeg){
      g.translate(dx+dw/2, dy+dh/2);
      g.rotate(rotationDeg*Math.PI/180);
      g.drawImage(img, -dw/2, -dh/2, dw, dh);
    } else {
      g.drawImage(img, dx, dy, dw, dh);
    }
    g.restore();
  }

  function hedgeDrawStrip(g, s, ox, oy, cs, scale, phase){
    const n = s.b - s.a;
    const startDead = hedgeDegAt(...(s.orient==='h' ? [s.a,s.fixed] : [s.fixed,s.a])) === 1;
    const endDead   = hedgeDegAt(...(s.orient==='h' ? [s.b,s.fixed] : [s.fixed,s.b])) === 1;
    function place(img, alongPx, crossPx, side){
      // Grow the square slightly, centered on its nominal footprint -- both axes together, so
      // it's still a perfect square, just marginally bigger, never stretched. Each stamp's
      // border stroke wraps a few native px onto its flush edges near the corners (where it
      // curves around from the wobbly edge); two squares butted exactly edge-to-edge each show
      // that sliver, which doubles up into a visible seam line between every stamp. Growing
      // (rather than resizing non-uniformly) means the later-drawn neighbor's own fill paints
      // over the earlier square's sliver instead. Re-checked against real maze data: still zero
      // door-openings get sealed with this much growth.
      const grown = side + HEDGE_SEAM_OVERLAP_NATIVE*scale;
      const shift = HEDGE_SEAM_OVERLAP_NATIVE*scale/2;
      const dx = s.orient === 'h' ? alongPx-shift : crossPx-shift;
      const dy = s.orient === 'h' ? crossPx-shift : alongPx-shift;
      if (phase === 'shadow') hedgeDrawTileShadow(g, img, dx, dy, grown, grown, 0, scale);
      else hedgeDrawTileBody(g, img, dx, dy, grown, grown, 0, scale);
    }
    // Every tile is stamped as a true, undistorted square -- side length equal to the wall's
    // visual cross-axis thickness. The earlier approach stretched the square 72x72 source art
    // into a full-cell-wide x thin-tall box, which warped it non-uniformly (round scallops
    // became ovals, the border stroke read as a different thickness on different sides -- the
    // "extra border" that kept showing up). HEDGE_WALL_THICKNESS = 0.5 means exactly 2 of
    // these squares tile one maze cell with zero stretch in either axis.
    const crossNative = (s.orient === 'h' ? hedgeImg.hMiddle.height : hedgeImg.hVert.width) * HEDGE_WALL_THICKNESS;
    const sq = crossNative*scale;
    const crossPx = (s.orient==='h' ? s.fixed*cs - oy : s.fixed*cs - ox) - sq/2;
    const segKnown = i => s.orient==='h'
      ? hedgeSegKnown(s.a+i, s.fixed, s.a+i+1, s.fixed)
      : hedgeSegKnown(s.fixed, s.a+i, s.fixed, s.a+i+1);

    for (let i=0;i<n;i++){
      if (!segKnown(i)) continue;
      const slotStart = (s.orient==='h' ? (s.a+i)*cs - ox : (s.a+i)*cs - oy);
      const midImg = s.orient==='h' ? hedgeImg.hMiddle : hedgeImg.hVert;
      const capStartImg = s.orient==='h' ? hedgeImg.hLeft  : hedgeImg.vTop;
      const capEndImg   = s.orient==='h' ? hedgeImg.hRight : hedgeImg.vBottom;
      if (n===1 && startDead && endDead){
        // A fully isolated 1-cell stub: no interior half at all, just the two open tips
        // meeting in the middle -- each gets its own square, so nothing overlaps.
        place(capStartImg, slotStart, crossPx, sq);
        place(capEndImg, slotStart + sq, crossPx, sq);
      } else if (i===0 && startDead){
        // outer square (toward the dead tip) is the cap; inner square continues into the strip
        place(capStartImg, slotStart, crossPx, sq);
        place(midImg, slotStart + sq, crossPx, sq);
      } else if (i===n-1 && endDead){
        place(midImg, slotStart, crossPx, sq);
        place(capEndImg, slotStart + sq, crossPx, sq);
      } else {
        place(midImg, slotStart, crossPx, sq);
        place(midImg, slotStart + sq, crossPx, sq);
      }
    }
  }
  function hedgeDrawCorner(g, cj, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(cj.x, cj.y)) return;
    const img = hedgeImg.corner;
    const w = img.width*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const h = img.height*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const px = cj.x*cs - ox, py = cj.y*cs - oy;
    // Centered on the junction point -- matches hedgeDrawTStop's convention and the strips'
    // symmetric cross-axis centering. The old per-rotation quadrant offset (dx/dy picked
    // per cj.rot to place the tile entirely in one quadrant) left the box straddling the
    // wrong side of the point, producing a squared-off overhang/notch at every corner --
    // this was the real cause of the "corners overlapping" reports, confirmed via a PIL
    // repro of this exact placement math against the real tile art. Centering removes the
    // notch cleanly on all 4 rotations. Grown by the same seam-overlap amount as the strip
    // squares (hedgeDrawStrip's place()) so the corner's own border-wrap sliver doesn't show
    // as a seam where it meets the adjoining straight run.
    // The corner casts its own shadow too now, same as every other tile -- safe because
    // drawHedgeTiles renders in two full passes (every shadow, then every body). A corner's
    // shadow used to get drawn inline with its body, right after the neighboring middle/endcap
    // had already painted its own opaque body -- so the corner's shadow landed on top of that
    // already-finished neighbor and showed up as a doubled/misaligned dark patch at the joint.
    // With bodies deferred to a second pass, whatever a shadow oversteps onto a neighbor's
    // footprint just gets cleanly capped by that neighbor's own body afterward, so the shadow
    // can safely reach all the way to the corner's true edge.
    if (phase === 'shadow') hedgeDrawTileShadow(g, img, px - w/2, py - h/2, w, h, cj.rot, scale);
    else hedgeDrawTileBody(g, img, px - w/2, py - h/2, w, h, cj.rot, scale);
  }
  function hedgeDrawTStop(g, tj, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(tj.x, tj.y)) return;
    const img = hedgeImg.tStop;
    const w = img.width*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const h = img.height*scale*HEDGE_JUNCTION_FRAC + HEDGE_SEAM_OVERLAP_NATIVE*scale;
    const px = tj.x*cs - ox, py = tj.y*cs - oy;
    if (phase === 'shadow') hedgeDrawTileShadow(g, img, px - w/2, py - h/2, w, h, tj.rot, scale);
    else hedgeDrawTileBody(g, img, px - w/2, py - h/2, w, h, tj.rot, scale);
  }
  function hedgeDrawPlus(g, x, y, ox, oy, cs, scale, phase){
    if (!hedgePointKnown(x, y)) return;
    const r = (hedgeImg.hMiddle.height*scale*HEDGE_JUNCTION_FRAC)/2 * 0.9;
    const px = x*cs - ox, py = y*cs - oy;
    const growPx = HEDGE_SHADOW_OFFSET_NATIVE*scale;
    if (phase === 'shadow'){
      // Grown in place (same centre, bigger radius) rather than shifted down, so the ring
      // peeks out evenly all the way around -- matches the strip/corner/T-stop fix above.
      g.fillStyle = GARDEN.hedgeLo;
      g.beginPath(); g.ellipse(px, py, r+growPx, r+growPx, 0, 0, Math.PI*2); g.fill();
      return;
    }
    g.fillStyle = GARDEN.hedgeLo;
    g.beginPath(); g.ellipse(px, py, r, r, 0, 0, Math.PI*2); g.fill();
    const r2 = r*0.68;
    g.fillStyle = GARDEN.hedgeMid;
    g.beginPath(); g.ellipse(px, py, r2, r2, 0, 0, Math.PI*2); g.fill();
