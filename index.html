  :root{
    --page:#0a1114;
    --app:#10191d;
    --app-2:#0c1417;
    --ink:#e8eef0;
    --muted:#7f96a0;
    --wall:#33474f;
    --thread:#ffc06a;
    --thread-core:#fff0d2;
    --beacon:#56e0c8;
    --line:#1c2a30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #12211f 0%, var(--page) 60%);
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }

  /* Phone frame on wide screens; fills the viewport on real phones */
  .device{
    position:relative;width:min(400px,100%);height:min(844px,100dvh);
    background:var(--app);border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 2px #1e2c31, 0 0 0 12px #060b0d, 0 40px 90px -30px #000;
    display:flex;flex-direction:column;
  }
  @media (max-width:440px){
    body{padding:0;}
    .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
  }

  .device.menu .topbar{display:none;}
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top));
    z-index:5;
  }
  .mark{font-family:"Fraunces",serif;font-weight:600;font-size:20px;letter-spacing:.2px;flex:none;
    cursor:pointer;user-select:none;white-space:nowrap;}
  /* light gauge + figures live up here now, off the board */
  .gauge{display:flex;align-items:center;gap:8px;flex:1;min-width:46px;max-width:210px;}
  .lantern{width:15px;height:15px;color:var(--thread);flex:none;}
  .track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb055,#ffd98f);
    box-shadow:0 0 10px rgba(255,192,106,.6);transition:width .5s cubic-bezier(.3,.8,.3,1);width:60%;}
  .track.low{box-shadow:0 0 0 1px rgba(255,90,60,.5), 0 0 14px rgba(255,90,60,.55);animation:lowpulse .9s ease-in-out infinite;}
  .lantern.low{color:#ff6a4a;animation:lowpulse .9s ease-in-out infinite;}
  @keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.4}}
  .fig{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;
    font-variant-numeric:tabular-nums;flex:none;}
  .fig .ico{width:13px;height:13px;color:var(--muted);opacity:.85;}
  .fig.ember i{width:7px;height:7px;border-radius:50%;background:var(--thread);
    box-shadow:0 0 6px rgba(255,192,106,.85);display:inline-block;}
  .iconbtn{border:1px solid var(--line);background:var(--app-2);color:var(--muted);
    width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:.18s;flex:none;}
  .iconbtn:hover{color:var(--ink);border-color:#2b3e45;}
  .iconbtn svg{width:16px;height:16px;}

  .stage{position:relative;flex:1;min-height:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(10,17,20,.62);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--ink);font-size:13px;padding:9px 15px;border-radius:999px;
    pointer-events:none;transition:opacity .5s;white-space:nowrap;}
  .hint b{color:var(--thread);font-weight:500;}

  /* Win */
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:radial-gradient(90% 60% at 50% 42%, rgba(21,42,40,.86), rgba(8,14,16,.94));
    backdrop-filter:blur(3px);z-index:8;text-align:center;padding:24px;}
  .win.show{display:flex;animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win h2{font-family:"Fraunces",serif;font-weight:600;font-size:30px;margin:0;}
  .win p{color:var(--muted);margin:2px 0 18px;font-size:14px;}
  .win .figures{display:flex;gap:26px;margin-bottom:22px;}
  .win .figures div{font-family:"Fraunces",serif;font-size:26px;}
  .win .figures span{display:block;font-family:"Space Grotesk";font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .btn{border:0;background:var(--thread);color:#241704;font:inherit;font-weight:600;font-size:15px;
    padding:12px 22px;border-radius:14px;cursor:pointer;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #2b3e45;}
  .win .row{display:flex;gap:10px;}

  /* world map */
  /* the map is an ocean the islands sit in — flat teal, matching the art direction */
  .sheet{position:absolute;inset:0;touch-action:pan-y;display:none;flex-direction:column;z-index:9;padding:20px 18px;
    background:#0b1013;overflow-y:auto;
    padding-top:max(20px,env(safe-area-inset-top));}
  .sheet.show{display:flex;animation:fade .28s ease both;}
  /* the level's own ground, drawn live behind the menu */
  .mapbg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;}
  /* a world whose ground fills its card rather than floating in it */
  .land{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .land svg{display:block;width:100%;height:100%;}
  /* the ground is busy where the title and rail sit, so it is dimmed at both ends */
  .land::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(8,10,14,.80) 0%,rgba(8,10,14,.34) 20%,
      rgba(8,10,14,0) 42%,rgba(8,10,14,0) 58%,rgba(8,10,14,.44) 80%,rgba(8,10,14,.88) 100%);}
  .gametitle, .deck, .dots{position:relative;z-index:1;}
  .gametitle{margin:8px 2px 18px;text-align:center;}
  .gt-name{font-family:"Tiny5",monospace;font-weight:400;font-size:34px;line-height:1;
    letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;
    background:linear-gradient(90deg,rgba(201,212,222,.10) 0%,rgba(201,212,222,.30) 26%,
      rgba(214,226,238,.72) 62%,#e6eef6 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;}
  /* the shelves pulse in sequence, so the ripple travels outward from the shore */
  .sea{opacity:var(--o0);}
  .flow, .cloud{will-change:opacity,transform;}
  @media (prefers-reduced-motion: no-preference){
    .sea{animation:searipple 3.4s ease-in-out infinite;}
    .flow{animation:flowpulse 2.4s ease-in-out infinite;}
    .cloud{animation:clouddrift 24s ease-in-out infinite;}
  }
  @keyframes searipple{0%,100%{opacity:var(--o0)}50%{opacity:var(--o1)}}
  @keyframes flowpulse{0%,100%{opacity:.34}50%{opacity:1}}
  @keyframes clouddrift{0%,100%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
  .isle{display:block;overflow:visible;}
  /* the deck: one card per island, swiped sideways and snapped into place */
  .deck{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;min-width:0;touch-action:pan-x;margin-top:auto;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
  .deck::-webkit-scrollbar{display:none;}
  .card{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
    position:relative;background:none;transition:filter .3s ease;
    will-change:transform,opacity;transform-origin:50% 46%;}
  .card.filled{border-radius:30px;overflow:hidden;
    box-shadow:0 24px 46px -18px rgba(0,0,0,.86), inset 0 0 0 1px rgba(255,255,255,.09);}
  .card-title,.card-stage,.lvrail{position:relative;z-index:1;}
  .card-title,.card-stage{will-change:transform;}
  .card.locked{filter:grayscale(.9) brightness(.78);}
  .card-title{padding:20px 16px 10px;text-align:center;font-family:"Tiny5",monospace;
    font-weight:400;font-size:30px;letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;
    text-shadow:0 2px 14px rgba(0,0,0,.55);}
  .card-stage{position:relative;overflow:visible;}
  /* the level rail: every level in the world, the one you are on opened up */
  .lvrail{--ink:#3a2a10;display:flex;align-items:center;gap:5px;margin:0;padding:11px 11px 13px;
    border-radius:0 0 30px 30px;}
  .lv{flex:1 1 0;min-width:0;height:38px;border:0;border-radius:999px;
    background:rgba(0,0,0,.10);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);
    color:var(--ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:background .18s, transform .12s;}
  .lv:hover:not(.locked):not(.cur){background:rgba(0,0,0,.20);}
  .lv:active:not(.locked){transform:scale(.94);}
  .lv .lvn{display:grid;place-items:center;}
  .lv .lvn svg{width:15px;height:15px;}
  .lv.done{background:rgba(0,0,0,.26);}
  .lv.locked{opacity:.42;cursor:default;background:none;box-shadow:none;}
  .lv.cur{flex:4.4 1 0;gap:8px;background:rgba(0,0,0,.27);padding:0 12px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);}
  .lv.cur .lvn{flex:none;}
  .lv.cur .lvflame{width:11px;height:11px;flex:none;opacity:.9;}
  .lv.cur .lvflame svg{width:11px;height:11px;display:block;}
  .lvgauge{flex:1 1 auto;min-width:16px;height:5px;border-radius:999px;
    background:rgba(0,0,0,.22);overflow:hidden;}
  .lvgauge i{display:block;height:100%;border-radius:999px;background:var(--ink);}
  .lvfig{display:flex;align-items:center;gap:4px;flex:none;font-size:11px;font-weight:600;
    color:var(--ink);font-variant-numeric:tabular-nums;}
  .lvfig .lvclock{width:11px;height:11px;display:block;opacity:.8;}
  .lvfig .lvclock svg{width:11px;height:11px;display:block;}
  .dots{display:flex;gap:7px;justify-content:center;align-items:center;padding:16px 0 6px;margin-bottom:auto;}
  .dot{width:7px;height:7px;border-radius:99px;background:rgba(234,250,243,.3);
    transition:width .25s ease, background .25s ease;}
  .dot.on{width:22px;background:#eafaf3;}
</style>
</head>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const winEl = document.getElementById('win');
  const markEl = document.querySelector('.mark');
  const mapEl = document.getElementById('map');

  // ---- sound: fully synthesized (Web Audio), so the game stays one self-contained file ----
  // Everything sits in a minor-pentatonic scale; each world has its own root note, so moving
  // between worlds changes key. Soft attacks + a reverb send keep it calm and spacious.
  const Snd = (() => {
    const ROOTS = [196.00, 220.00, 174.61, 246.94, 130.81];   // Ember G3, Tide A3, Moss F3, Gale B3, Veil C3

    let drA,drB,drGain, beaconOsc,beaconGain, shimA,shimB,shimGain;
    const now = ()=>ctx.currentTime;
    function makeImpulse(dur,decay){ const len=ctx.sampleRate*dur, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
    function ensure(){
      if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      master = ctx.createGain(); master.gain.value = muted?0:0.55; master.connect(ctx.destination);
      reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(2.4,2.6);
      const rg = ctx.createGain(); rg.gain.value=0.55; reverb.connect(rg); rg.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      const df = ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=440;
      drGain = ctx.createGain(); drGain.gain.value=0; df.connect(drGain); drGain.connect(master);
      drA=ctx.createOscillator(); drA.type='sine'; drB=ctx.createOscillator(); drB.type='sine';
      drA.connect(df); drB.connect(df); drA.start(); drB.start();
      const bf=ctx.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=1100;
      beaconGain=ctx.createGain(); beaconGain.gain.value=0; beaconOsc=ctx.createOscillator(); beaconOsc.type='sine';
      beaconOsc.connect(bf); bf.connect(beaconGain); beaconGain.connect(master); beaconGain.connect(reverb); beaconOsc.start();

  // an open, softly-curved line through a list of points (quadratic through the

  // ---- the menu's ground: the level background, drawn live behind the cards ----
  // Same fill, haze and drifting motes a level uses, so the menu sits in the world it
  // is offering. The world crossfades as you swipe between cards.
  const bgCanvas = document.getElementById('mapBg'), bgCtx = bgCanvas.getContext('2d');
  let bgParts = [], bgWorld = 0, bgRaf = 0, bgTint = null;
  function bgSeed(w, h){
    const f = WORLD_FX[bgWorld].part;

    for (let i=0; i<f.n; i++) bgParts.push({
      x: Math.random()*w, y: Math.random()*h, ph: Math.random()*Math.PI*2,

  }
  function bgResize(){
    const r = mapEl.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, 2);

  function bgSetWorld(wi){

    const f = WORLD_FX[wi].part;                    // keep positions, take the new motes
    bgParts.forEach(p => { p.r = f.size[0] + Math.random()*(f.size[1]-f.size[0]); });
  }
  function bgFrame(t){
    if (!mapEl.classList.contains('show')){ bgRaf = 0; return; }
    const w = bgCanvas.clientWidth, h = bgCanvas.clientHeight;
    const W_ = WORLDS[bgWorld], fx = WORLD_FX[bgWorld], f = fx.part;
    const target = toRGB(W_.bg).map(c => c*0.52);   // deeper than the level, so a card reads forward
    bgTint = bgTint ? bgTint.map((c,i)=> c + (target[i]-c)*0.08) : target.slice();

      if (p.y < -4) p.y = h+4; else if (p.y > h+4) p.y = -4;

  window.addEventListener('resize', ()=>{ if (mapEl.classList.contains('show')) bgResize(); });
  // a mouse drag does not pan an overflow container, so the deck is dragged by hand;

  function openMap(){

  function hideMap(){ mapEl.classList.remove('show');

  const worldW = () => cols*cellSize;
  const worldH = () => rows*cellSize;
  const clampCam = (v, max) => max <= 0 ? max/2 : Math.max(0, Math.min(max, v));

  // ---- layout / sizing ----
  function layout() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);

  // ---- input ----
  const FINGER_LIFT = 1.15; // active point sits ~1.15 cells above the fingertip so it isn't hidden

  function cellAt(clientX, clientY, lift) {

    const wx = px + camX, wy = py + camY;

    c = Math.max(0, Math.min(cols-1, c));
    rr = Math.max(0, Math.min(rows-1, rr));

  }

  function openNeighbors(i) {
    const c = cx(i), r = cy(i), out = [];
    if (!cells[i].walls[0]) out.push(idx(c, r-1)); // N
    if (!cells[i].walls[1]) out.push(idx(c+1, r)); // E
    if (!cells[i].walls[2]) out.push(idx(c, r+1)); // S
    if (!cells[i].walls[3]) out.push(idx(c-1, r)); // W

  const dist = (a, b) => Math.abs(cx(a)-cx(b)) + Math.abs(cy(a)-cy(b));

  // Scatter embers — you must gather a quota of them to open the exit, so they're spread
  // across the maze (biased toward dead ends and side corridors) to force real exploration.
  function placeEmbers(){
    embers = new Set(); emberGot = 0;
    const count = Math.max(4, Math.round(cols*rows * emberDensity));
    const deadEnds = [], others = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell) continue;
      if (dist(i,startCell) < 3) continue;                 // give the opening room to breathe
      (openNeighbors(i).length === 1 ? deadEnds : others).push(i);
    }
    const shuffle = a => { for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];} return a; };
    const pool = shuffle(deadEnds).concat(shuffle(others));
    const chosen = [];
    for (const i of pool){
      if (chosen.length >= count) break;
      if (chosen.every(c => dist(c,i) >= 3)) chosen.push(i);   // keep them spread out
    }

  // Scatter flames — pure light fuel, spread across corridors (not on embers), so keeping the
  // lantern alive is its own hunt, separate from opening the exit.
  function placeFlames(){
    flames = new Set();
    const count = Math.max(4, Math.round(cols*rows * flameDensity));
    const pool = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell || embers.has(i)) continue;
      if (dist(i,startCell) < 4) continue;                 // first flame shouldn't be right at the door

    for (let k=pool.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[pool[k],pool[j]]=[pool[j],pool[k]];}

    for (const i of pool){

  const exitOpen = () => emberGot >= emberNeed;

  // Cast sight from the head: flood through OPEN corridors only, as far as the lantern reaches.
  // Walls block it, so corners hide what's beyond — you see down your hallway, not through it.
  function reveal(){
    sightReach = reachOf(light);
    const maxDepth = Math.max(1, Math.round(sightReach));
    nearDepth = new Map();
    const head = trail[trail.length-1];
    const q = [head]; nearDepth.set(head, 0); explored.add(head);
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi], d = nearDepth.get(i);
      if (d >= maxDepth) continue;

  function brightnessOf(i){

  // One corridor-step: advance into new ground (spending light, gathering embers) or retract
  // back along the thread (free). Shared by dragging and tap-to-walk so they behave identically.
  function applyStep(next){
    const prev = trail.length > 1 ? trail[trail.length-2] : -1;
    if (next === prev){                            // retract — costs no light
      const popped = trail.pop();
      inTrail.delete(popped);
      Snd.trace(trail.length, -1);
    } else {                                        // advance into new ground
      trail.push(next);
      inTrail.add(next);
      Snd.trace(trail.length, 1);
      light = Math.max(0, light - DRAIN);
      if (embers.has(next)){                        // gather an ember (exit key — no light)
        embers.delete(next); emberGot++;
        Snd.ember();
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now(), key:true });

        }
      }
      if (flames.has(next)){                         // gather a flame (light fuel)

      }
    }
  }

  // Shortest corridor route from the head to a tapped cell, staying within what's been seen
  // (so you can't tap your way through the fog). Unique in a perfect maze.
  function bfsPath(from, to){
    if (from === to || !explored.has(to)) return null;
    // tapping onto your own thread simply retraces back to that point
    if (inTrail.has(to)){
      const k = trail.indexOf(to);
      return k < 0 ? null : trail.slice(k, trail.length-1).reverse();
    }
    // otherwise route through seen corridors WITHOUT crossing the existing thread,
    // so with braided loops the line never knots itself
    const prevMap = new Map([[from, -1]]);
    const q = [from];
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      if (i === to) break;
      for (const n of openNeighbors(i)){
        if (!explored.has(n) || prevMap.has(n)) continue;
        if (inTrail.has(n) && n !== to) continue;   // don't walk over the thread
        prevMap.set(n, i); q.push(n);
      }
    }
    if (!prevMap.has(to)) return null;
    const path = []; let cur = to;
    while (cur !== from){ path.push(cur); cur = prevMap.get(cur); }
    return path.reverse();
  }

  // Move the trail head toward the finger cell, one valid corridor-step at a time.
  // Because the finger is physically on the corridor being traced, "step toward finger"
  // reliably follows the path — no global pathfinding needed.
  function stepToward(target) {
    let guard = 0;
    while (guard++ < 24) {
      const head = trail[trail.length-1];
      if (head === target || won) break;
      const prev = trail.length > 1 ? trail[trail.length-2] : -1;
      const nbrs = openNeighbors(head);
      let best = -1, bestD = dist(head, target);
      for (const n of nbrs) {
        const d = dist(n, target);
        if (d >= bestD) continue;                 // must make progress toward the finger
        if (n === prev || !inTrail.has(n)) {      // retrace previous, or explore new
          if (d < bestD) { best = n; bestD = d; }
        }
      }
      if (best === -1) break;
      applyStep(best);
    }
  }

  function onDown(e){
    if (won) return;
    dragging = true; moved = false;
    Snd.resume();
    downX = e.clientX; downY = e.clientY;
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;
    walkQueue.length = 0;                 // a new touch cancels any auto-walk in progress
    const head = trail[trail.length-1];   // start the tip exactly at the head
    tipCell = head; tipT = 0;
    tipX = (cx(head)+0.5)*cellSize; tipY = (cy(head)+0.5)*cellSize;
  }
  function onMove(e){
    if (!dragging || won) return;
    if (!moved && Math.hypot(e.clientX-downX, e.clientY-downY) < DRAG_THRESH) return;
    moved = true;                         // past the threshold: this is a drag
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;   // record; tracing happens per-frame
  }
  function onUp(e){
    if (!won && moved){                   // drag ended mid-edge: round to the nearest cell
      if (tipT >= 0.5) applyStep(tipCell);
    }
    dragging = false; fingerActive = null;
    if (won || moved) return;             // a drag already handled it
    const target = cellAt(e.clientX, e.clientY, false);   // a tap: walk there along the corridor
    const path = bfsPath(trail[trail.length-1], target);
    if (path && path.length){
      walkQueue = path; walkAcc = 0;
      Snd.tap();
      pings.push({ x:(cx(target)+0.5)*cellSize, y:(cy(target)+0.5)*cellSize, t0:performance.now() });
    }
  }

  // ---- smooth corridor-tracking tip ----
  const cellCenter = i => ({ x:(cx(i)+0.5)*cellSize, y:(cy(i)+0.5)*cellSize });
  const fingerWorld = () => ({ x: fingerSX + camX, y: fingerSY - FINGER_LIFT*cellSize + camY });

  // Which open direction the finger is pulling toward from cell h, and how far (0..1) along it.
  function chooseTip(h, F){
    const O = cellCenter(h);
    const dx = F.x-O.x, dy = F.y-O.y, dlen = Math.hypot(dx,dy);
    if (dlen < cellSize*0.06) return { cell:h, t:0 };
    const prev = trail.length>1 ? trail[trail.length-2] : -1;
    const cands = [];
    for (const n of openNeighbors(h)) if (!inTrail.has(n)) cands.push(n); // advance into new ground
    if (prev>=0) cands.push(prev);                                        // or retrace
    if (!cands.length) return { cell:h, t:0 };
    let best=-1, bestScore=-2, bestT=0;
    for (const c of cands){
      const C = cellCenter(c);
      const ex = C.x-O.x, ey = C.y-O.y, el = Math.hypot(ex,ey)||1;
      const align = (dx*ex+dy*ey)/(dlen*el);
      const t = Math.max(0, Math.min(1, (dx*ex+dy*ey)/(el*el)));
      const bias = (c===tipCell) ? 0.12 : 0;   // hysteresis: don't flicker between directions
      if (align+bias > bestScore){ bestScore=align+bias; best=c; bestT=t; }
    }
    if (best<0 || bestScore < 0.12) return { cell:(best>=0?best:h), t:0 }; // finger pulling into a wall
    return { cell:best, t:bestT };
  }

  // Per-frame: commit whole cells the finger has crossed, then set the tip's target.
  function dragUpdate(){
    const F = fingerWorld();
    let head = trail[trail.length-1], guard = 0;
    while (guard++ < 8 && !won){
      const pk = chooseTip(head, F);
      if (pk.t < 0.999) break;              // finger hasn't reached the next centre yet
      applyStep(pk.cell);                   // crossed it — commit (light, embers, fog, win)
      head = trail[trail.length-1];
    }
    if (won){ tipCell=head; tipT=0; return; }
    const pk = chooseTip(head, F);
    tipCell = pk.cell; tipT = pk.t;
  }


  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e); });
  canvas.addEventListener('pointermove', onMove, {passive:false});
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function doWin(){
    if (won) return;
    won = true; dragging = false; fingerActive = null; walkQueue.length = 0;
    Snd.win();
    beaten = Math.max(beaten, cur+1); saveProgress();
    elapsed = started ? (performance.now() - startTime) : 0;
    document.getElementById('wtime').firstChild.nodeValue = fmt(elapsed);
    document.getElementById('wsteps').firstChild.nodeValue = String(trail.length-1);
    document.getElementById('wembers').firstChild.nodeValue = `${emberGot}/${emberTotal}`;
    const last = cur+1 >= TOTAL;
    const nextBtn = document.getElementById('next');
    nextBtn.textContent = last ? 'Play again' : 'Next level';
    const tags = ["You found the way through.","The lantern carried you home.","The thread held.","Out, and still glowing."];
    document.getElementById('wintag').textContent = last ? 'You’ve threaded every world.' : tags[(Math.random()*tags.length)|0];
    document.getElementById('winh2').textContent = last ? 'Complete.' : 'Out.';
    setTimeout(()=>winEl.classList.add('show'), 420);
  }

  // ---- camera follow (dead-zone + easing) ----
  function updateCamera(){
    const head = trail[trail.length-1];
    const hx = tipX, hy = tipY;           // follow the smooth tip, not the snapping cell
    if (walkQueue.length > 0){
      // tap-walking: no finger involved, so keep the lantern centred as the maze glides past
      tCamX = (cx(head)+0.5)*cellSize - viewW/2;
      tCamY = (cy(head)+0.5)*cellSize - viewH/2;
    } else {
      // dragging (or idle): hold a still patch of world so the finger maps to a stable cell
      const dzX = viewW*0.24, dzY = viewH*0.22;
      if (hx < tCamX + dzX) tCamX = hx - dzX;
      if (hx > tCamX + viewW - dzX) tCamX = hx - viewW + dzX;
      if (hy < tCamY + dzY) tCamY = hy - dzY;
      if (hy > tCamY + viewH - dzY) tCamY = hy - viewH + dzY;
    }
    tCamX = clampCam(tCamX, worldW()-viewW);
    tCamY = clampCam(tCamY, worldH()-viewH);
    camX += (tCamX - camX) * 0.16;
    camY += (tCamY - camY) * 0.16;
  }

  // ---- per-world atmosphere ----
  let parts = [];
  function seedParticles(){
    const f = WORLD_FX[curWorld].part, w = viewW||400, h = viewH||800;
    parts = [];
    for (let k=0;k<f.n;k++) parts.push({
      x: Math.random()*w, y: Math.random()*h,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
      ph: Math.random()*6.28, sp: 0.6 + Math.random()*0.8
    });
  }
  function drawParticles(t){
    const f = WORLD_FX[curWorld].part;
    for (const p of parts){
      p.y += f.vy * p.sp;
      p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = viewH+4; else if (p.y > viewH+4) p.y = -4;
      if (p.x < -4) p.x = viewW+4; else if (p.x > viewW+4) p.x = -4;
      let a = 0.5;
      if (f.twinkle) a = 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3));
      if (f.type==='bubble'){
        ctx.strokeStyle = `rgba(${f.color},${a*0.5})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
        ctx.fillStyle = `rgba(${f.color},${a*0.12})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      } else if (f.type==='star'){
        ctx.fillStyle = `rgba(${f.color},${a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${f.color},${a*0.55})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
    }
  }
  // smooth value noise (continuous across cells) for mottled materials
  // ---- Minecraft-Dungeons-style block floor: chunky pixel tiles, one block per cell ----
  const BLOCK = [
    { base:['#3a2620','#472c22','#2f211d','#523228'], acc:['#c85a2a','#e0742f'], mortar:'#20140f', feat:'glow'    }, // Ember  (warm stone)
    { base:['#1f4a52','#256069','#1a3f4a','#2d6b74'], acc:['#4fb0a8','#7fd8c8'], mortar:'#123037', feat:'wave', shades:['#153a44','#1c4c56','#256069','#3a8a92','#6fd2d2'] }, // Tide (rippling water)
    { base:['#4a4f4c','#565b57','#3f443f','#515651'], acc:['#4a6b3a','#5f7d44'], mortar:'#2a2e2b', feat:'moss'    }, // Moss   (mossy cobble)
    { base:['#2f4266','#3a5480','#28384f','#42608f'], acc:['#8fc4ee','#b6dcf7'], mortar:'#1b2942', feat:'sparkle' }, // Gale   (wind-worn stone)
    { base:['#42464a','#4c5054','#3a3e42','#54585c'], acc:['#666a6e','#5a5e62'], mortar:'#26292c', feat:'brick'   }, // Veil   (cracked brick)
  ];
  const tileCache = {};
  function genTile(w, seed, phase){
    const P = BLOCK[w], N = 16, cnv = document.createElement('canvas'); cnv.width = cnv.height = N;
    const g = cnv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + seed*3.7 + o*19.1)*43758.5453; return n-Math.floor(n); };
    if (P.feat==='wave'){                            // continuous rippling water — no block mortar
      const sh = P.shades, k = Math.PI*2/N;
      for (let y=0;y<N;y++) for (let x=0;x<N;x++){
        const wv = Math.sin(x*k*2 + y*k - phase)*0.6 + Math.sin(x*k - y*k*2 - phase*0.7)*0.4;   // -1..1, seamless
        const lvl = (wv+1)/2;
        g.fillStyle = sh[Math.min(sh.length-1, Math.floor(lvl*sh.length))];
        g.fillRect(x,y,1,1);
      }
      return cnv;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      let col = P.base[Math.floor(R(x,y,1)*P.base.length)];
      if (P.feat==='moss'){
        const m = R(x,y,2)*0.55 + (Math.sin(x*0.55+seed)+Math.sin(y*0.5+seed*1.3))*0.22 + 0.2;
        if (m>0.72) col = P.acc[Math.floor(R(x,y,3)*P.acc.length)];
      } else if (P.feat==='glow')   { if (R(x,y,4)>0.94) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      else if (P.feat==='sparkle')  { if (R(x,y,4)>0.96) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      g.fillStyle = col; g.fillRect(x,y,1,1);
    }
    // mortar bevel around the block so cells read as separate blocks
    g.fillStyle = P.mortar; g.globalAlpha = 0.55;
    g.fillRect(0,0,N,1); g.fillRect(0,N-1,N,1); g.fillRect(0,0,1,N); g.fillRect(N-1,0,1,N);
    g.globalAlpha = 1;
    if (P.feat==='brick'){                          // offset brick mortar + a crack
      g.fillStyle = P.mortar; g.globalAlpha = 0.6;
      g.fillRect(0,7,N,1); g.fillRect(0,15,N,1);
      g.fillRect(8,0,1,8); g.fillRect(4,8,1,8);
      g.globalAlpha = 0.7;
      let cxk = 2 + Math.floor(R(0,0,9)*(N-4));
      for (let y=1;y<N-1;y++){ g.fillRect(cxk,y,1,1); cxk += Math.floor(R(cxk,y,10)*3)-1; cxk = Math.max(1,Math.min(N-2,cxk)); }
      g.globalAlpha = 1;
    }
    if (P.feat==='glow'){                            // a hot vein through the warm stone
      g.fillStyle = P.acc[0]; g.globalAlpha = 0.9;
      let cxk = 2 + Math.floor(R(1,1,11)*(N-4));
      for (let y=2;y<N-2;y++){ if (R(cxk,y,12)>0.35){ g.fillRect(cxk,y,1,1); } cxk += Math.floor(R(cxk,y,13)*3)-1; cxk = Math.max(2,Math.min(N-3,cxk)); }
      g.globalAlpha = 1;
    }
    return cnv;
  }
  function blockTiles(w){
    if (tileCache[w]) return tileCache[w];
    let set;
    if (BLOCK[w].feat==='wave'){
      const frames = [], N = 8;
      for (let f=0; f<N; f++) frames.push(genTile(w, 7, (f/N)*Math.PI*2));
      set = { animated:true, tiles:frames };
    } else {
      const arr = []; for (let v=0;v<4;v++) arr.push(genTile(w, v*97+13, 0));
      set = { animated:false, tiles:arr };
    }
    return (tileCache[w] = set);
  }
  function drawFloorBlock(i,b,x,y,s,t){
    const set = blockTiles(curWorld);
    const tile = set.animated
      ? set.tiles[Math.floor(t/120) % set.tiles.length]         // water ripples in sync
      : set.tiles[Math.floor(hash(i,7)*set.tiles.length) % set.tiles.length];
    ctx.globalAlpha = Math.min(1, 0.12 + 0.88*b);
    ctx.drawImage(tile, x, y, s+0.6, s+0.6);        // slight overlap avoids seams when scaled
    ctx.globalAlpha = 1;
  }

  // ---- render ----
  function draw(t){
    ctx.clearRect(0,0,viewW,viewH);
    // ambient floor
    ctx.fillStyle = T.bg;
    ctx.fillRect(0,0,viewW,viewH);

    const c0 = Math.max(0, Math.floor(camX/cellSize));
    const r0 = Math.max(0, Math.floor(camY/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((camX+viewW)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((camY+viewH)/cellSize));

    // maze under fog: only explored cells render, brightest where the thread's light reaches
    const thread = getVar('--thread');
    const WB = 5, wallBuckets = Array.from({length:WB},()=>[]);   // segments grouped by brightness
    ctx.imageSmoothingEnabled = false;                          // keep the pixel blocks crisp
    for (let r=r0; r<=r1; r++){
      for (let c=c0; c<=c1; c++){
        const i = idx(c,r);
        const b = brightnessOf(i);
        if (b <= 0) continue;                     // unexplored stays dark
        const x = c*cellSize - camX, y = r*cellSize - camY, s = cellSize;
        drawFloorBlock(i, b, x, y, s, t);         // chunky pixel block for this cell
        if (b > DIM){                             // warm lantern light pooled on top
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.05 * b;
          ctx.fillStyle = thread;
          ctx.fillRect(x, y, s, s);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
        }
        const w = cells[i].walls;
        if (w[0]||w[1]||w[2]||w[3]){
          const bkt = wallBuckets[Math.min(WB-1, Math.floor(b*WB))];
          if (w[0]) bkt.push(x,y,x+s,y);
          if (w[3]) bkt.push(x,y,x,y+s);
          if (w[1]) bkt.push(x+s,y,x+s,y+s);
          if (w[2]) bkt.push(x,y+s,x+s,y+s);
        }
      }
    }
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;

    // walls: solid & opaque, drawn in batched passes — all shadows first, then all cores, then a
    // thin highlight. No transparency and single-stroke-per-batch, so overlaps never show.
    const thick = Math.max(4, cellSize*0.14);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const strokeBuckets = (col, lw, dx, dy, lighten)=>{
      ctx.save(); if (dx||dy) ctx.translate(dx,dy); ctx.lineWidth = lw;
      for (let lvl=0; lvl<WB; lvl++){
        const arr = wallBuckets[lvl]; if (!arr.length) continue;
        const bb = (lvl+0.5)/WB;
        ctx.strokeStyle = mixRGB(col, bgRGB, 1-bb);
        ctx.beginPath();
        for (let k=0;k<arr.length;k+=4){ ctx.moveTo(arr[k],arr[k+1]); ctx.lineTo(arr[k+2],arr[k+3]); }
        ctx.stroke();
      }
      ctx.restore();
    };
    strokeBuckets(WALL_SHADOW, thick*1.2, 1.7, 1.7);            // drop shadow (opaque)
    strokeBuckets(wallCoreRGB, thick, 0, 0);                    // solid raised core
    strokeBuckets(wallHiRGB, Math.max(1.2, thick*0.3), -0.7, -0.9);  // top highlight edge

    drawParticles(t);                                         // drifting atmosphere in the lantern light
    const haze = WORLD_FX[curWorld].haze;
    if (haze){                                                // soft world tint (e.g. Gale's cold sky)
      const hg = ctx.createRadialGradient(viewW/2, viewH*0.44, 0, viewW/2, viewH*0.44, viewH*0.7);
      hg.addColorStop(0, `rgba(${haze},0.16)`); hg.addColorStop(1, `rgba(${haze},0)`);
      ctx.fillStyle = hg; ctx.fillRect(0,0,viewW,viewH);
    }

    // deepen the dark beyond the reach of the light — and let it close in as the lantern gutters
    const lowLight = 1 - light;                               // 0 (full) .. 1 (guttering)
    const crit = Math.max(0, (CRIT - light) / CRIT);          // 0 above CRIT .. 1 at empty
    const pulse = crit>0 ? (0.06*crit)*(0.5+0.5*Math.sin(t/240)) : 0;  // ominous throb when dark
    const inner = viewH*(0.16 - lowLight*0.07 - crit*0.05);   // lit pool tightens, then clamps in hard
    const darkA = 0.55 + lowLight*0.28 + crit*0.16 + pulse;   // up to ~0.95 and pulsing
    const vg = ctx.createRadialGradient(viewW/2, viewH*0.46, Math.max(0,inner), viewW/2, viewH*0.46, viewH*0.72);
    vg.addColorStop(0, 'rgba(6,10,12,0)');
    vg.addColorStop(1, `rgba(5,9,11,${Math.min(0.97,darkA)})`);
    ctx.fillStyle = vg; ctx.fillRect(0,0,viewW,viewH);

    if (explored.has(startCell)) drawMarker(startCell, T.start, false, t);
    drawBeacon(t);
    drawEmbers(t);
    drawFlames(t);
    drawBlooms();

    // the thread — dims behind you as the lantern fades
    const tipOut = Math.hypot(tipX-(cx(trail[trail.length-1])+0.5)*cellSize, tipY-(cy(trail[trail.length-1])+0.5)*cellSize) > cellSize*0.04;
    if (trail.length > 1 || tipOut){
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.45 + 0.55*light;
      // glow underlay
      ctx.strokeStyle = `rgba(${T.threadRGB},0.22)`;
      ctx.lineWidth = cellSize*0.5;
      strokeTrail();
      // core
      const grad = ctx.createLinearGradient(0,0,viewW,viewH);
      grad.addColorStop(0, getVar('--thread'));
      grad.addColorStop(1, T.core);
      ctx.strokeStyle = grad;
      ctx.lineWidth = cellSize*0.2;
      strokeTrail();
      ctx.globalAlpha = 1;
    }
    // head bead — now at the smoothly-eased tip, under the finger
    const bx = tipX - camX, by = tipY - camY;
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.17, 0, 7);
    ctx.fillStyle = getVar('--thread-core'); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, cellSize*0.30, 0, 7);
    ctx.strokeStyle = `rgba(${T.coreRGB},0.35)`; ctx.lineWidth = 2; ctx.stroke();
  }

  // build the thread's points: committed cell centres, plus the live tip
  function threadPoints(){
    const pts = [];
    for (const i of trail) pts.push({ x:(cx(i)+0.5)*cellSize-camX, y:(cy(i)+0.5)*cellSize-camY });
    const hx = (cx(trail[trail.length-1])+0.5)*cellSize-camX, hy = (cy(trail[trail.length-1])+0.5)*cellSize-camY;
    const tx = tipX-camX, ty = tipY-camY;
    if (Math.hypot(tx-hx, ty-hy) > cellSize*0.04) pts.push({ x:tx, y:ty });  // add tip if beyond the head
    return pts;
  }
  function strokeTrail(){
    const pts = threadPoints();
    if (pts.length < 2){ if(pts.length===1){ } return; }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length-1;i++){                 // midpoint smoothing → flowing line, no hard corners
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  }

  function drawMarker(i, color, pulse, t){
    const x=(cx(i)+0.5)*cellSize-camX, y=(cy(i)+0.5)*cellSize-camY;
    if (pulse){
      const p = (Math.sin(t/520)*0.5+0.5);
      ctx.beginPath(); ctx.arc(x,y, cellSize*(0.28+0.22*p), 0, 7);
      ctx.strokeStyle = `rgba(${T.beaconRGB},${0.5-0.4*p})`; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.2, 0, 7);
      ctx.fillStyle = color; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(x,y, cellSize*0.19, 0, 7);
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  // The exit shines through the fog — a light to head toward. It stays sealed (a dim ring)
  // until you've gathered enough embers, then opens into a bright, pulsing beacon.
  function drawBeacon(t){
    const head = trail[trail.length-1];
    const open = exitOpen();
    const bx=(cx(endCell)+0.5)*cellSize, by=(cy(endCell)+0.5)*cellSize;
    const hx=(cx(head)+0.5)*cellSize, hy=(cy(head)+0.5)*cellSize;
    const dCells = Math.hypot(bx-hx, by-hy)/cellSize;
    const intensity = Math.max(0.05, Math.min(1, 1 - dCells/16)) * (open ? 1 : 0.5);
    const sx = bx - camX, sy = by - camY;
    const cyan = T.beaconRGB;
    const onScreen = sx>-cellSize && sx<viewW+cellSize && sy>-cellSize && sy<viewH+cellSize;
    if (onScreen){
      const p = Math.sin(t/520)*0.5+0.5;
      const rad = cellSize*(0.8 + 2.4*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${cyan},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${cyan},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      if (explored.has(endCell)){
        if (open){                                   // open: bright pulsing beacon
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*(0.28+0.18*p),0,7);
          ctx.strokeStyle=`rgba(${cyan},${0.6-0.4*p})`; ctx.lineWidth=2.5; ctx.stroke();
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.2,0,7); ctx.fillStyle=getVar('--beacon'); ctx.fill();
        } else {                                     // sealed: a quiet, dim locked ring
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.26,0,7);
          ctx.strokeStyle=`rgba(${cyan},0.34)`; ctx.lineWidth=2; ctx.stroke();
          ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.13,0,7);
          ctx.strokeStyle=`rgba(${cyan},0.5)`; ctx.lineWidth=2; ctx.stroke();
        }
      } else {
        ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.1*intensity+2,0,7);
        ctx.fillStyle=`rgba(${cyan},${0.6*intensity})`; ctx.fill();
      }
    } else {
      // edge compass: which way is the light
      const ccx=viewW/2, ccy=viewH/2, dx=sx-ccx, dy=sy-ccy, m=24;
      const tx = dx!==0 ? ((dx>0?viewW-m:m)-ccx)/dx : Infinity;
      const ty = dy!==0 ? ((dy>0?viewH-m:m)-ccy)/dy : Infinity;
      const tt = Math.min(Math.abs(tx),Math.abs(ty));
      const ex=ccx+dx*tt, ey=ccy+dy*tt, ang=Math.atan2(dy,dx);
      ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
      ctx.globalAlpha = (open ? 0.3 : 0.18) + 0.5*intensity; ctx.fillStyle = getVar('--beacon');
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
  }

  // Embers: steady warm motes — the exit keys. Glow faintly through nearby fog.
  function drawEmbers(t){
    const head = trail[trail.length-1];
    const warm = T.ember;
    const nearRange = 5;
    embers.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.6 : Math.max(0, 0.7 - dCells/(nearRange+4)));
      if (intensity <= 0.02) return;
      const bob = Math.sin(t/700 + i)*cellSize*0.06;
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY + bob;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      const rad = cellSize*(0.30 + 0.30*intensity);
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(${warm},${0.5*intensity})`);
      g.addColorStop(1, `rgba(${warm},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy, cellSize*0.075, 0, 7);
      ctx.fillStyle = `rgba(${T.coreRGB},${0.5+0.4*intensity})`; ctx.fill();
    });
  }

  // Flames: flickering fire — your light fuel. They burn brighter and reach further when your
  // own lantern is fading, so the dark itself guides you to fuel.
  function drawFlames(t){
    const head = trail[trail.length-1];
    const lowLight = 1 - light;
    const nearRange = 6 + lowLight*6;
    const boost = 1 + lowLight*0.9;
    flames.forEach(i => {
      const dCells = dist(i, head);
      const inSight = nearDepth.has(i);
      if (!inSight && !explored.has(i) && dCells > nearRange) return;
      let intensity = inSight ? 1 : (explored.has(i) ? 0.7 : Math.max(0, 0.8 - dCells/(nearRange+4)));
      intensity = Math.min(1, intensity*boost);
      if (intensity <= 0.03) return;
      const flick = 0.8 + 0.2*Math.sin(t/90 + i*1.7) + 0.08*Math.sin(t/41 + i*4.3);
      const sx = (cx(i)+0.5)*cellSize - camX;
      const sy = (cy(i)+0.5)*cellSize - camY;
      if (sx<-cellSize||sx>viewW+cellSize||sy<-cellSize||sy>viewH+cellSize) return;
      const rad = cellSize*(0.42 + 0.42*intensity)*flick;
      const g = ctx.createRadialGradient(sx,sy,0, sx,sy,rad);
      g.addColorStop(0, `rgba(255,170,70,${0.6*intensity})`);
      g.addColorStop(1, `rgba(255,110,40,0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,rad,0,7); ctx.fill();
      // little flame tongue
      const h = cellSize*0.34*flick;
      ctx.beginPath();
      ctx.moveTo(sx, sy - h);
      ctx.quadraticCurveTo(sx + cellSize*0.14, sy - h*0.15, sx, sy + cellSize*0.09);
      ctx.quadraticCurveTo(sx - cellSize*0.14, sy - h*0.15, sx, sy - h);
      ctx.fillStyle = `rgba(255,236,190,${0.85*intensity})`;
      ctx.fill();
    });
  }

  // Soft ripple when an ember is gathered.
  function drawBlooms(){
    const now = performance.now(), LIFE = 620;
    blooms = blooms.filter(b => now - b.t0 < LIFE);
    for (const b of blooms){
      const p = (now - b.t0)/LIFE;                 // 0..1
      const scale = b.big ? 2.4 : 1;
      const rad = cellSize*(0.2 + p*1.3)*scale;
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      const col = b.big ? T.beaconRGB : T.ember;
      ctx.strokeStyle = `rgba(${col},${0.5*(1-p)})`; ctx.lineWidth = 2.5*(1-p)+0.5; ctx.stroke();
    }
    // quick ring acknowledging a tap
    const TAP = 360;
    pings = pings.filter(b => now - b.t0 < TAP);
    for (const b of pings){
      const p = (now - b.t0)/TAP;
      const rad = cellSize*(0.15 + p*0.5);
      ctx.beginPath(); ctx.arc(b.x-camX, b.y-camY, rad, 0, 7);
      ctx.strokeStyle = `rgba(${T.coreRGB},${0.55*(1-p)})`; ctx.lineWidth = 2*(1-p)+0.5; ctx.stroke();
    }
  }

  // ---- helpers ----
  let varCache = {};
  function getVar(name){ return varCache[name] || (varCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim()); }
  function fmt(ms){ const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function showHint(msg){
    elHint.textContent = msg;
    elHint.style.opacity = '1';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>{ elHint.style.opacity = '0'; }, 2600);
  }
  function updateHud(){
    const open = exitOpen();
    elEmbers.textContent = open ? `${emberNeed}/${emberNeed}` : `${Math.min(emberGot,emberNeed)}/${emberNeed}`;
    elEmbers.parentElement.style.color = open ? T.beacon : '';
    elEmbers.previousElementSibling && (elEmbers.previousElementSibling.style.background = open ? T.beacon : '');
    elLightFill.style.width = Math.round(light*100) + '%';
    const low = light < CRIT && !won;
    elTrack.classList.toggle('low', low);
    elLantern.classList.toggle('low', low);
    elLightFill.style.background = low
      ? 'linear-gradient(90deg,#ff4d33,#ff8a5a)'                         // warning red when fading
      : `linear-gradient(90deg,${T.thread},${T.core})`;
    if (light > 0.55) warnedLow = false;                                 // re-arm the warning for next dark spell
    elTime.textContent = fmt(won ? elapsed : (started ? performance.now()-startTime : 0));
  }

  // ---- loop ----
  function frame(t){
    const dt = lastT ? t - lastT : 0; lastT = t;
    if (walkQueue.length && !won){        // glide the thread along a tapped route
      walkAcc += dt;
      while (walkAcc >= STEP_MS && walkQueue.length && !won){
        walkAcc -= STEP_MS;
        applyStep(walkQueue.shift());
      }
    }
    if (dragging && moved && !won) dragUpdate();
    else { tipCell = trail[trail.length-1]; tipT = 0; }   // idle / tap-walk: tip rests at the head
    // ease the drawn tip toward its target point on the head->tipCell edge
    const head = trail[trail.length-1], O = cellCenter(head), C = cellCenter(tipCell);
    const gx = O.x + (C.x-O.x)*tipT, gy = O.y + (C.y-O.y)*tipT;
    tipX += (gx - tipX) * TIP_EASE;
    tipY += (gy - tipY) * TIP_EASE;
    updateCamera();
    draw(t);
    updateHud();
    const hd = trail[trail.length-1];
    // the drone belongs to the maze — let it fade out while the world map is open
    Snd.ambient(light, Math.hypot(cx(hd)-cx(endCell), cy(hd)-cy(endCell)), !won && !mapEl.classList.contains('show'));
    requestAnimationFrame(frame);
  }

  // ---- controls ----
  document.getElementById('reset').addEventListener('click', ()=>loadLevel(cur));         // fresh maze, same level
  // sound toggle (persisted)
  const elMute = document.getElementById('mute'), muteIcon = document.getElementById('muteIcon');
  const speakerOn = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>';
  const speakerOff = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/>';
  let soundMuted = false; try{ soundMuted = localStorage.getItem('thread_mute')==='1'; }catch(e){}
  function applyMute(){ Snd.setMuted(soundMuted); muteIcon.innerHTML = soundMuted ? speakerOff : speakerOn; elMute.style.color = soundMuted ? 'var(--muted)' : ''; }
  elMute.addEventListener('click', ()=>{ soundMuted=!soundMuted; try{ localStorage.setItem('thread_mute', soundMuted?'1':'0'); }catch(e){} Snd.resume(); applyMute(); });
  applyMute();
  document.getElementById('next').addEventListener('click', ()=>loadLevel(cur+1 < TOTAL ? cur+1 : cur));
  document.getElementById('tomap').addEventListener('click', openMap);
  markEl.addEventListener('click', openMap);

  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>layout(), 120); });

  // go
  loadProgress();
  loadLevel(Math.min(beaten, TOTAL-1));   // resume at the next unbeaten level
  if (PREVIEW_UNLOCK) openMap();           // TEMP: show the map right away for previewing
  requestAnimationFrame(frame);
})();
</script>
</body>
