<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>A MAZE THING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
        :root{
    --page:#0a1114;
    --app:#10191d;
    --app-2:#0c1417;
    --ink:#e8eef0;
    --muted:#7f96a0;
    --wall:#33474f;
    --thread:#ffc06a;
    --thread-core:#fff0d2;
    --beacon:#56e0c8;
    --line:#1c2a30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #12211f 0%, var(--page) 60%);
    color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }

  /* Phone frame on wide screens; fills the viewport on real phones */
  .device{
    position:relative;width:min(400px,100%);height:min(844px,100dvh);
    background:var(--app);border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 2px #1e2c31, 0 0 0 12px #060b0d, 0 40px 90px -30px #000;
    display:flex;flex-direction:column;
  }
  @media (max-width:440px){
    body{padding:0;}
    .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
  }

  .device.menu .topbar{display:none;}
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top));
    z-index:5;
  }
  .mark{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:20px;letter-spacing:.2px;flex:none;
    cursor:pointer;user-select:none;white-space:nowrap;}
  /* light gauge + figures live up here now, off the board */
  .gauge{display:flex;align-items:center;gap:8px;flex:1;min-width:46px;max-width:210px;}
  .lantern{width:15px;height:15px;color:var(--thread);flex:none;}
  .track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb055,#ffd98f);
    box-shadow:0 0 10px rgba(255,192,106,.6);transition:width .5s cubic-bezier(.3,.8,.3,1);width:60%;}
  .track.low{box-shadow:0 0 0 1px rgba(255,90,60,.5), 0 0 14px rgba(255,90,60,.55);animation:lowpulse .9s ease-in-out infinite;}
  .lantern.low{color:#ff6a4a;animation:lowpulse .9s ease-in-out infinite;}
  @keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.4}}
  .fig{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;
    font-variant-numeric:tabular-nums;flex:none;}
  .fig .ico{width:13px;height:13px;color:var(--muted);opacity:.85;}
  .fig.ember i{width:7px;height:7px;border-radius:50%;background:var(--thread);
    box-shadow:0 0 6px rgba(255,192,106,.85);display:inline-block;}
  .iconbtn{border:1px solid var(--line);background:var(--app-2);color:var(--muted);
    width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:.18s;flex:none;}
  .iconbtn:hover{color:var(--ink);border-color:#2b3e45;}
  .iconbtn svg{width:16px;height:16px;}

  .stage{position:relative;flex:1;min-height:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(10,17,20,.62);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--ink);font-size:13px;padding:9px 15px;border-radius:999px;
    pointer-events:none;transition:opacity .5s;white-space:nowrap;}
  .hint b{color:var(--thread);font-weight:500;}

  /* Win */
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:radial-gradient(90% 60% at 50% 42%, rgba(21,42,40,.86), rgba(8,14,16,.94));
    backdrop-filter:blur(3px);z-index:8;text-align:center;padding:24px;}
  .win.show{display:flex;animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win h2{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:30px;margin:0;}
  .win p{color:var(--muted);margin:2px 0 18px;font-size:14px;}
  .win .figures{display:flex;gap:26px;margin-bottom:22px;}
  .win .figures div{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:26px;}
  .win .figures span{display:block;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .btn{border:0;background:var(--thread);color:#241704;font:inherit;font-weight:600;font-size:15px;
    padding:12px 22px;border-radius:14px;cursor:pointer;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #2b3e45;}
  .win .row{display:flex;gap:10px;}

  /* world map */
  /* The page is paper the cards are laid on, not a night sky: the worlds carry the
     colour now, and a light ground is what lets three very different ones sit side by
     side without one of them looking like it is lit wrong. */
  /* No side padding here: the deck runs the full width so a card can sit closer to the
     edge and the next world still shows past it. What little inset the cards need comes
     from the deck's own padding, which the shadow can spill into. */
  .sheet{position:absolute;inset:0;touch-action:pan-y;display:none;flex-direction:column;z-index:9;padding:16px 0;
    background:#f7f2ea;overflow-y:auto;overflow-x:hidden;   /* the glow reaches past both edges */
    padding-top:max(12px,env(safe-area-inset-top));}
  .sheet.show{display:flex;animation:fade .28s ease both;}
  /* the world's own light, washed across the page behind the cards */
  .mapbg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;}
  .deck, .dots{position:relative;z-index:1;}
  /* the source sits above the frame — only its falloff is ever on screen, so the light
     reads as spilling in from somewhere out of view rather than as a lamp in the layout. */
  @keyframes litbreathe{
    0%,100%{filter:drop-shadow(0 2px 3px rgba(90,70,44,.16));}
    50%    {filter:drop-shadow(0 3px 9px rgba(90,70,44,.30));}
  }

  /* the deck: one card per world, swiped sideways and snapped into place */
  /* overflow-y has to be hidden for the horizontal scroll to behave, which means the
     card's drop shadow is clipped at this box's edge — the vertical padding is what
     gives the shadow somewhere to land instead of being cut off. */
  .deck{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;min-width:0;touch-action:pan-x;margin-top:auto;
    /* The end spacers are margins on the first and last card, not padding on this box.
       Padding here would shrink the flex content box, and the cards size against that —
       7% of padding made a "86%" card render at 86% of 86%, sitting off centre. Trailing
       padding on a horizontal scroller is also dropped from the scrollable area in
       WebKit and Blink, so the last card could never reach the middle. */
    padding-block:26px 52px;                /* headroom for the shadow, not dead space */
    scroll-snap-type:x mandatory;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
  .deck::-webkit-scrollbar{display:none;}
  /* Cards are narrower than the deck so the next world is always half-visible at the
     edge — that peek is what tells you the deck is a deck. The padding either side is
     what lets the first and last card still reach the middle when they snap. */
  /* No will-change here. It promotes the card to its own compositing layer sized to the
     card's own box, and the frame's shadow reaches past that box — which is what was
     clipping it. The scale still animates fine without the hint. */
  .card{flex:0 0 86%;scroll-snap-align:center;scroll-snap-stop:always;
    position:relative;background:none;transition:filter .3s ease;
    transform-origin:50% 46%;}
  /* exactly half the leftover width, so the end cards land dead centre like the rest */
  .card:first-child{margin-left:7%;}
  .card:last-child{margin-right:7%;}
  .card.locked{filter:grayscale(.86) brightness(.9);}
  /* A card is a window onto the world, not an illustration of it: the scene inside is
     painted by the same style the levels are, so what you are choosing between is what
     you are about to play. Art on top, a plain foot underneath carrying the name and
     the levels — the foot is the same on every card, the art is the only thing that
     changes. The shadow is tinted with the world's own colour rather than black, so a
     warm world sits in a warm shadow and does not look pasted onto the page. */
  .frame{position:relative;width:100%;aspect-ratio:60/109;max-height:min(80vh,660px);
    margin:0 auto;border-radius:22px;overflow:hidden;background:#0f0f0d;
    box-shadow:0 22px 44px -14px rgba(var(--shd),.50),
               0 6px 14px -4px rgba(var(--shd),.30),
               0 1px 2px rgba(var(--shd),.22);}
  /* The art runs the full card. A world you are not on is only its art — the foot is
     parked below the bottom edge and the button is faded out, so the deck reads as
     three places rather than three menus. Both come back as the card lands. */
  .art{position:absolute;inset:0;}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .cmid{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    opacity:0;transition:opacity .26s ease .04s;pointer-events:none;}
  .card.active .cmid{opacity:1;pointer-events:auto;}

  /* the foot: name, then levels. Identical on every card, and only on the active one. */
  .cfoot{position:absolute;left:0;right:0;bottom:0;z-index:3;
    background:#faf8f3;padding:15px 14px 14px;
    display:flex;flex-direction:column;align-items:stretch;gap:11px;
    transform:translateY(100%);
    transition:transform .40s cubic-bezier(.2,.85,.28,1);}
  .card.active .cfoot{transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .cfoot{transition:none;}
  }
  .cname{text-align:center;font-size:11px;font-weight:500;letter-spacing:.19em;
    text-indent:.19em;text-transform:uppercase;color:#4a4740;line-height:1;}

  /* ---- one chrome, every world ---------------------------------------------------
     The furniture used to be cut from each world's own material — pixel, hedge, kraft.
     Three worlds meant three of everything, and adding a fourth meant designing it all
     again. It is one system now: the same white pill, the same type, the same spacing,
     on every card. The art behind it does the work of telling the worlds apart, which
     is the only thing that actually needs to differ. */
  .mat{position:relative;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#f7f5ef;color:#22221c;border-radius:999px;}

  /* PLAY: the one thing on the card you are meant to hit. Kept white on every world so
     it never has to fight that world's palette — the shadow does the separating. */
  .play{border:0;cursor:pointer;font-weight:500;font-size:16px;letter-spacing:.13em;
    text-indent:.13em;padding:14px 40px;line-height:1;
    box-shadow:0 1px 2px rgba(16,12,6,.20), 0 8px 20px -4px rgba(16,12,6,.42);
    transition:transform .12s ease, box-shadow .18s ease;}
  .play:hover{box-shadow:0 1px 2px rgba(16,12,6,.22), 0 12px 26px -4px rgba(16,12,6,.5);}
  .play:active{transform:translateY(1px) scale(.985);}
  /* where you left off in this world — quiet, under the name, only on the card you are on */
  .cstat{display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:11px;color:#8a8578;font-variant-numeric:tabular-nums;line-height:1;}
  .cstat.hide{display:none;}
  .cstat .cgauge{width:46px;height:5px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;}
  .cstat .cgauge i{display:block;height:100%;background:currentColor;}
  .cstat svg{width:11px;height:11px;display:block;opacity:.85;}
  .cstat span{display:flex;align-items:center;gap:4px;}

  /* the level rail, now sitting in the foot rather than floating over the art. The row
     is plain numbers; only the level you are on takes a filled disc. */
  .lvrail{position:relative;display:flex;align-items:stretch;gap:2px;}
  .lv{flex:1 1 0;min-width:0;height:30px;border:0;background:none;
    color:#3a382f;font:inherit;font-size:14px;font-weight:500;cursor:pointer;position:relative;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s;}
  .lv .lvn{display:grid;place-items:center;line-height:1;
    width:28px;height:28px;border-radius:50%;transition:background .16s;}
  .lv .lvn svg{width:15px;height:15px;}
  .lv.done{color:var(--acc);}
  .lv:hover:not(.locked):not(.cur) .lvn{background:rgba(20,16,8,.07);}
  .lv:active:not(.locked){transform:scale(.92);}
  /* the one place a world's colour is allowed into the chrome */
  .lv.cur .lvn{background:var(--acc);color:var(--onacc);}
  /* a run left part-way: a small mark so the deck shows which levels are still warm */
  .lv.held::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:99px;background:currentColor;opacity:.55;}
  .lv.locked{opacity:.3;cursor:default;}

  .dots{display:flex;gap:7px;justify-content:center;align-items:center;padding:16px 0 6px;margin-bottom:auto;}
  .dot{width:7px;height:7px;border-radius:99px;background:rgba(96,74,48,.26);
    transition:width .25s ease, background .25s ease;}
  .dot.on{width:22px;background:rgba(96,74,48,.7);}
</style>
</head>
<body>
  <div class="device">
    <div class="topbar">
      <div class="mark">Thread</div>
      <div class="gauge">
        <svg class="lantern" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3 4 4.2 4 8a4 4 0 0 1-8 0c0-1.6.6-2.6 1.2-3.2.2 1.1 1 1.7 1.6 1.7C9.6 7 11 4 12 2z"/></svg>
        <div class="track"><div class="fill" id="lightFill"></div></div>
      </div>
      <span class="fig ember"><i></i><span id="embers">0/0</span></span>
      <span class="fig"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span id="time">0:00</span></span>
      <button class="iconbtn" id="mute" title="Sound" aria-label="Sound">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
      </button>
      <button class="iconbtn" id="reset" title="New maze" aria-label="New maze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>

    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="hint" id="hint">Drag or tap through the dark. Gather the <b>light</b></div>
      <div class="win" id="win">
        <h2 id="winh2">Out.</h2>
        <p id="wintag">You found the way through.</p>
        <div class="figures">
          <div id="wtime">0:00<span>time</span></div>
          <div id="wsteps">0<span>steps</span></div>
          <div id="wembers">0<span>embers</span></div>
        </div>
        <div class="row">
          <button class="btn" id="next">Next level</button>
          <button class="btn ghost" id="tomap">Map</button>
        </div>
      </div>
    </div>
      <div class="sheet" id="map">
        <canvas class="mapbg" id="mapBg" aria-hidden="true"></canvas>
        <div class="deck" id="mapDeck"></div>
        <div class="dots" id="mapDots"></div>
      </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const elTime = document.getElementById('time');
  const elEmbers = document.getElementById('embers');
  const elLightFill = document.getElementById('lightFill');
  const elTrack = elLightFill.parentElement;
  const elLantern = document.querySelector('.lantern');
  const elHint = document.getElementById('hint');
  const winEl = document.getElementById('win');
  const markEl = document.querySelector('.mark');
  const mapEl = document.getElementById('map');

  // ---- sound: fully synthesized (Web Audio), so the game stays one self-contained file ----
  // Everything sits in a minor-pentatonic scale; each world has its own root note, so moving
  // between worlds changes key. Soft attacks + a reverb send keep it calm and spacious.
  const Snd = (() => {
    const ROOTS = [196.00, 220.00, 174.61, 246.94, 130.81, 164.81];  // Ember G3, Tide A3, Moss F3, Gale B3, Veil C3, Card E3
    const PENT = [0,3,5,7,10];
    let ctx=null, master=null, reverb=null, noiseBuf=null, ready=false, muted=false, root=196;
    let drA,drB,drGain, beaconOsc,beaconGain, shimA,shimB,shimGain;
    const now = ()=>ctx.currentTime;
    function makeImpulse(dur,decay){ const len=ctx.sampleRate*dur, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
    function ensure(){
      if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      master = ctx.createGain(); master.gain.value = muted?0:0.55; master.connect(ctx.destination);
      reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(2.4,2.6);
      const rg = ctx.createGain(); rg.gain.value=0.55; reverb.connect(rg); rg.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      const df = ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=440;
      drGain = ctx.createGain(); drGain.gain.value=0; df.connect(drGain); drGain.connect(master);
      drA=ctx.createOscillator(); drA.type='sine'; drB=ctx.createOscillator(); drB.type='sine';
      drA.connect(df); drB.connect(df); drA.start(); drB.start();
      const bf=ctx.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=1100;
      beaconGain=ctx.createGain(); beaconGain.gain.value=0; beaconOsc=ctx.createOscillator(); beaconOsc.type='sine';
      beaconOsc.connect(bf); bf.connect(beaconGain); beaconGain.connect(master); beaconGain.connect(reverb); beaconOsc.start();
      const sf=ctx.createBiquadFilter(); sf.type='lowpass'; sf.frequency.value=3200;
      shimGain=ctx.createGain(); shimGain.gain.value=0; shimA=ctx.createOscillator(); shimA.type='sine'; shimB=ctx.createOscillator(); shimB.type='sine';
      shimA.connect(sf); shimB.connect(sf); sf.connect(shimGain); shimGain.connect(master); shimGain.connect(reverb);
      shimA.start(); shimB.start();
      ready=true; retune();
    }
    function retune(){ if(!ready) return; const t=now();
      drA.frequency.setTargetAtTime(root/2,t,0.12); drB.frequency.setTargetAtTime(root/2*1.006,t,0.12);
      beaconOsc.frequency.setTargetAtTime(root*1.5,t,0.12);
      shimA.frequency.setTargetAtTime(root*3,t,0.12); shimB.frequency.setTargetAtTime(root*4.04,t,0.12); }
    function tone(freq,g,dur,type,lp,rev){ if(!ready) return; const t=now();
      const o=ctx.createOscillator(); o.type=type||'triangle'; o.frequency.value=freq;
      const gg=ctx.createGain(); gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(g,t+0.008); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      if(lp){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); f.connect(gg); } else o.connect(gg);
      gg.connect(master); if(rev) gg.connect(reverb); o.start(t); o.stop(t+dur+0.03); }
    const sfreq = step => { const s=((step%15)+15)%15; return root*Math.pow(2,(PENT[s%5]+12*Math.floor(s/5))/12); };
    return {
      resume(){ ensure(); },
      isMuted(){ return muted; },
      setMuted(m){ muted=m; if(master) master.gain.setTargetAtTime(m?0:0.55, now(), 0.03); },
      setWorld(w){ root = ROOTS[w] ?? 196; retune(); },
      trace(len,dir){ tone(sfreq(len), dir<0?0.035:0.055, dir<0?0.11:0.09, 'triangle', 1600, true); },
      ember(){ [1,2.01,3.02].forEach((m,i)=> tone(sfreq(9)*m, 0.09/(i+1), 0.7, 'sine', 5000, true)); },
      flame(){ if(!ready) return; const t=now();
        const src=ctx.createBufferSource(); src.buffer=noiseBuf;
        const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(260,t); f.frequency.exponentialRampToValueAtTime(1500,t+0.28); f.Q.value=0.7;
        const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.2,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
        src.connect(f); f.connect(g); g.connect(master); g.connect(reverb); src.start(t); src.stop(t+0.55);
        tone(root, 0.11, 0.5, 'sine', 800, true); },
      exitOpen(){ [0,7,12].forEach((s,i)=> setTimeout(()=> tone(root*Math.pow(2,s/12)*2, 0.08, 0.9, 'sine', 4500, true), i*95)); },
      sealed(){ tone(root*0.74, 0.09, 0.34, 'sine', 480, true); },
      win(){ [0,3,7,12,15].forEach((s,i)=> setTimeout(()=> tone(root*Math.pow(2,s/12), 0.10, 1.1, 'triangle', 3200, true), i*115)); },
      low(){ tone(root*0.5, 0.13, 0.6, 'sine', 300, true); },
      tap(){ tone(sfreq(5), 0.045, 0.14, 'sine', 2200, true); },

  const toRGB = hex => { const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  function shadeRGB(hex, f){ let [R,G,B]=toRGB(hex); if(f>=0){R+=(255-R)*f;G+=(255-G)*f;B+=(255-B)*f;} else {R*=(1+f);G*=(1+f);B*=(1+f);} return [R|0,G|0,B|0]; }

  // difficulty ramps smoothly across all levels
  function levelParams(i){

      cols: Math.round(11 + d*17),      // 11 → 28
      rows: Math.round(15 + d*23),      // 15 → 38

  // ---- per-level bookmarks ----
  // Stepping out to the map shouldn't cost you the run. Each level you leave keeps its

  // does the reset button — those are the two ways to ask for a fresh maze.
  const SAVES = new Map();     // level index -> snapshot
  function saveSaves(){

  }
  function loadSaves(){
    try{
      const o = JSON.parse(localStorage.getItem('thread_levels') || '{}');

  function pauseClock(){

  }

  function snapLevel(){
    if (!cells || won) return;                       // a finished level starts over next time
    let w = '';
    for (let i=0; i<cells.length; i++){
      const b = cells[i].walls;
      w += ((b[0]?1:0)|(b[1]?2:0)|(b[2]?4:0)|(b[3]?8:0)).toString(16);

  // ---- state ----

  // ---- maze generation (recursive backtracker) ----
  function genMaze() {
    cells = Array.from({length: cols*rows}, () => ({ walls:[true,true,true,true], v:false }));
    const stack = [];
    let cur = idx(0,0); cells[cur].v = true;
    const dirs = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]; // dc,dr,wall,opposite
    let count = 1;
    while (count < cols*rows) {
      const c = cx(cur), r = cy(cur);
      const nbrs = [];
      for (const [dc,dr,w,ow] of dirs) {
        const nc=c+dc, nr=r+dr;
        if (nc>=0&&nc<cols&&nr>=0&&nr<rows && !cells[idx(nc,nr)].v) nbrs.push([idx(nc,nr),w,ow]);
      }
      if (nbrs.length) {
        const [ni,w,ow] = nbrs[(Math.random()*nbrs.length)|0];
        cells[cur].walls[w] = false; cells[ni].walls[ow] = false;
        stack.push(cur); cur = ni; cells[cur].v = true; count++;
      } else cur = stack.pop();
    }

    // instead of a single line from start to finish.
    if (braid > 0){

      for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
        const i = idx(c,r);

        if (r<rows-1 && cells[i].walls[2]) closed.push([i, idx(c,r+1), 2, 0]);
      }
      for (let k=closed.length-1; k>0; k--){ const j=(Math.random()*(k+1))|0; [closed[k],closed[j]]=[closed[j],closed[k]]; }

      for (let k=0; k<openCount; k++){ const [a,b,w,ow]=closed[k]; cells[a].walls[w]=false; cells[b].walls[ow]=false; }
    }
  }

  // Choose the exit at a random spot among the cells farthest (by corridor distance) from the
  // start — so its location varies each maze but the level is never trivially short.
  function pickExit(){
    const d = new Int32Array(cols*rows).fill(-1);
    d[startCell] = 0; const q = [startCell]; let maxD = 0;
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      for (const n of openNeighbors(i)){
        if (d[n] < 0){ d[n] = d[i]+1; if (d[n] > maxD) maxD = d[n]; q.push(n); }
      }
    }
    const thresh = maxD * 0.7;                 // only the far reaches qualify
    const far = [];
    for (let i=0; i<cols*rows; i++){ if (i !== startCell && d[i] >= thresh) far.push(i); }
    return far.length ? far[(Math.random()*far.length)|0] : (cols*rows-1);
  }

  function resetGame(newMaze=true) {

  // ---- worlds: apply a look, load a level, show the map ----

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';

  // ---- island art: isometric block terrain ----

  const ISO_N = 12;          // grid is ISO_N × ISO_N cells
  const ISO_FILL = 1.25;      // how much of the map's width one island spans

  // each look's signature surface: the material and its highlight
  const FEATCOL = [
    { a:'#f0561f', b:'#ffa53f' },   // Ember   molten rock

    // the sea shelves out from the shore on the same grid, so the coast stays blocky
    const cells = [];
    for (let gy=ISO_LO; gy<=ISO_HI; gy++) for (let gx=ISO_LO; gx<=ISO_HI; gx++){
      const h = isleHeight(gx,gy,spec);
      if (h) cells.push([gx,gy,h,0]);
    }
    // slabs torn loose and hanging above the island: same block, but only a thin
    // lip of side face, so nothing connects them to the ground
    spec.floats.forEach(f => cells.push([f[0],f[1],f[2],1,f[3]||1]));
    spec.trees.forEach(([gx,gy]) => cells.push([gx,gy,isleHeight(gx,gy,spec),2,1]));
    cells.sort((a,b)=> (a[0]+a[1]) - (b[0]+b[1]));           // painter's order
    const sideL = shadeHex(P.cliff, 0.12), sideR = P.cliff;
    cells.forEach(([gx,gy,h,fl,k])=>{
      const [x,y] = isoTop(g,gx,gy,h);
      if (fl === 2){ s += treeAt(g,P,x,y); return; }
      if (fl === 1 && spec.floatKind === 'cloud'){
        s += `<g class="cloud" style="animation-duration:${(19 + (gx*7+gy*5)%11 * 1.4).toFixed(1)}s;`
          + `animation-delay:${(-((gx*5+gy*11)%14) * 1.3).toFixed(1)}s">${puff(x, y, k)}</g>`;
        return;
      }
      const d = fl ? g.HZ*0.5 : h*g.HZ + g.SKIRT;
      s += `<path d="M ${(x-g.W).toFixed(1)} ${y.toFixed(1)} L ${x.toFixed(1)} ${(y+g.H).toFixed(1)} `
         + `L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} L ${(x-g.W).toFixed(1)} ${(y+d).toFixed(1)} Z" fill="${sideL}"/>`
         + `<path d="M ${x.toFixed(1)} ${(y+g.H).toFixed(1)} L ${(x+g.W).toFixed(1)} ${y.toFixed(1)} `
         + `L ${(x+g.W).toFixed(1)} ${(y+d).toFixed(1)} L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} Z" fill="${sideR}"/>`;
      const isSummit = spec.summit && gx===spec.summit[0] && gy===spec.summit[1];
      if (fl)                     s += face(x,y, spec.floatKind==='glow' ? P.featB : P.steps[P.steps.length-2]);
      else if (isSummit && P.volcano) s += face(x,y,P.featB); // the crater, glowing
      else if (featOf(spec,gx,gy)) s += face(x,y,P.featA) + flowWrap(gx,gy,face(x,y,P.featB,0.55));
      else                        s += face(x,y,P.steps[Math.min(P.steps.length-1,h-1)]);
    });
    return s;
  }
  // an open, softly-curved line through a list of points (quadratic through the
  // midpoints), used for the walking route so bends read as curves, not corners
  function smoothOpen(pts){
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
    for (let i=1;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
      d += `Q ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
    }
    const last = pts[pts.length-1];
    return d + `L ${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  }
  // which grid cell each level stands on. Chosen to clear the lava branches
  // (gx===3, gy===3 and the gx===gy diagonal) and to stay well apart on screen.
  // positions around the ring, ordered back to front (by gx+gy) so the numbers read
  // as a path across the island; each world starts from a different point on it
  const NODE_IDX = [0,9,15,22,27];
  function nodeCell(wi, lvl){
    const ring = isleSpec(wi).ring;
    return ring[(NODE_IDX[lvl] + wi*3) % ring.length];
  }
  /* ---- the deck's cards -----------------------------------------------------------
     A card is a window onto its world rather than an illustration of it: the scene
     inside is painted by the same vocabulary the levels are — the same lawn, the same
     hedge pattern, the same board and flutes — so choosing a card is looking at what
     you are about to play. All three show the same little corridor so the difference
     between them is only ever the style.
     -------------------------------------------------------------------------------- */
  // The corridor keeps to the left of the grid so there is real ground it has not
  // reached — without that there is nothing for the fog, the cloud or the shut flaps
  // to cover, and each card would only show its walls.
  const SCENE_W = 7, SCENE_H = 10;
  const SCENE_PATH = [
    [1,1],[2,1],[3,1],[4,1],
    [4,2],
    [4,3],[3,3],[2,3],[1,3],
    [1,4],
    [1,5],[2,5],[3,5],
    [3,6],
    [3,7],[2,7],[1,7],
    [1,8],
  ];
  const sKey = (c,r) => c + ',' + r;
  const SCENE_ON = new Set(SCENE_PATH.map(p => sKey(p[0],p[1])));
  // the ring of ground the light has touched without your walking it
  const SCENE_NEAR = (() => {
    const out = new Set();
    for (const [c,r] of SCENE_PATH)
      for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const k = sKey(c+dc, r+dr);
        if (!SCENE_ON.has(k)) out.add(k);
      }
    return out;
  })();
  const sceneLit = (c,r) => SCENE_ON.has(sKey(c,r)) ? 1 : (SCENE_NEAR.has(sKey(c,r)) ? 0.26 : 0);
  // walls: every edge of a corridor cell the corridor does not pass through, plus a
  // scatter on the fringe so the maze reads as continuing past what has been seen
  function sceneWalls(cs, ox, oy){
    const segs = [];
    const at = (c,r) => ox + c*cs, av = (c,r) => oy + r*cs;
    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      const on = SCENE_ON.has(sKey(c,r)), near = SCENE_NEAR.has(sKey(c,r));
      if (!on && !near) continue;
      const x = at(c,r), y = av(c,r);
      const wall = (dc,dr,k) => on
        ? !SCENE_ON.has(sKey(c+dc, r+dr))
        : hash(c*7.1 + r*3.3, k) > 0.88;              // fringe: the odd stub, no more
      if (wall(0,-1,1)) segs.push(x, y, x+cs, y);
      if (wall(-1,0,2)) segs.push(x, y, x, y+cs);
      if (wall(1,0,3))  segs.push(x+cs, y, x+cs, y+cs);
      if (wall(0,1,4))  segs.push(x, y+cs, x+cs, y+cs);
    }
    return segs;
  }
  const scenePts = (cs, ox, oy) => SCENE_PATH.map(([c,r]) => [ox + (c+0.5)*cs, oy + (r+0.5)*cs]);
  function sceneStroke(g, pts){
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length-1; i++){
      const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
      g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    g.stroke();
  }
  function sceneSegPath(g, segs, dx, dy){
    g.beginPath();
    for (let k=0;k<segs.length;k+=4){ g.moveTo(segs[k]+dx, segs[k+1]+dy); g.lineTo(segs[k+2]+dx, segs[k+3]+dy); }
  }

  // Lantern: the lantern's own reach, the floor blocks it lights, and the thread
  function sceneLantern(g, w, h, cs, ox, oy){
    const L = LOOKS[LOOK.EMBER];
    g.fillStyle = L.bg; g.fillRect(0,0,w,h);
    const set = blockTiles(LOOK.EMBER), tiles = set.tiles;
    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      const b = sceneLit(c,r);
      if (b <= 0) continue;
      g.globalAlpha = Math.min(1, 0.12 + 0.88*b);
      g.drawImage(tiles[Math.floor(hash(c*13+r, 7)*tiles.length) % tiles.length],
                  ox + c*cs, oy + r*cs, cs+0.6, cs+0.6);
    }
    g.globalAlpha = 1;
    const segs = sceneWalls(cs, ox, oy);
    const thick = Math.max(3, cs*0.20);
    g.lineCap = 'round'; g.lineJoin = 'round';
    const wallLine = (col, lw, dx, dy) => {
      g.strokeStyle = col; g.lineWidth = lw; sceneSegPath(g, segs, dx, dy); g.stroke();
    };
    wallLine('rgba(4,6,9,.85)', thick*1.2, 1.6, 1.6);
    wallLine(`rgb(${shadeRGB(L.wall,0.32).join(',')})`, thick, 0, 0);
    wallLine(`rgb(${shadeRGB(L.wall,0.62).join(',')})`, Math.max(1, thick*0.3), -0.7, -0.9);

    const pts = scenePts(cs, ox, oy), head = pts[pts.length-1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save();
    g.shadowColor = `rgba(${L.threadRGB},.8)`; g.shadowBlur = cs*0.5;
    g.strokeStyle = L.thread; g.lineWidth = cs*0.20; sceneStroke(g, pts);
    g.restore();
    g.strokeStyle = L.core; g.lineWidth = cs*0.075; sceneStroke(g, pts);
    // the start, and the light you are carrying
    g.strokeStyle = L.start; g.lineWidth = Math.max(1.4, cs*0.06);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.26, 0, 7); g.stroke();
    g.save();
    g.shadowColor = `rgba(${L.coreRGB},.9)`; g.shadowBlur = cs*0.7;
    g.fillStyle = L.core; g.beginPath(); g.arc(head[0], head[1], cs*0.17, 0, 7); g.fill();
    g.restore();
    // a flame waiting off to the side, the way one sits in a level
    const fx = ox + 5.4*cs, fy = oy + 6.4*cs;
    const fg = g.createRadialGradient(fx, fy, 0, fx, fy, cs*0.95);
    fg.addColorStop(0, 'rgba(255,196,110,.85)'); fg.addColorStop(0.45, 'rgba(232,132,44,.34)');
    fg.addColorStop(1, 'rgba(232,132,44,0)');
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, cs*0.95, 0, 7); g.fill();
    g.fillStyle = '#fff3d6';
    g.beginPath(); g.ellipse(fx, fy, cs*0.07, cs*0.15, 0, 0, 7); g.fill();

    const vg = g.createRadialGradient(w*0.42, h*0.48, Math.min(w,h)*0.10,
                                      w*0.42, h*0.48, Math.max(w,h)*0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.62, 'rgba(0,0,0,.34)');
    vg.addColorStop(1, 'rgba(0,0,0,.86)');
    g.fillStyle = vg; g.fillRect(0,0,w,h);
  }

  // Garden: the clipped hedge, the bright lawn and the filament, under cloud
  function sceneGarden(g, w, h, cs, ox, oy){
    const k = cs/42;
    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), 0, 0); g.fillRect(0,0,w,h);

    const pts = scenePts(cs, ox, oy);
    const lay = () => {
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i=1;i<pts.length-1;i++){
        const [ax,ay] = pts[i], [bx,by] = pts[i+1];
        g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
      }
      g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    };
    g.lineCap='round'; g.lineJoin='round';
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = cs*0.10; g.shadowOffsetY = cs*0.055;
    lay(); g.strokeStyle = GARDEN.pathLo; g.lineWidth = cs*0.30; g.stroke();
    g.restore();
    lay(); g.strokeStyle = GARDEN.path; g.lineWidth = cs*0.22; g.stroke();

    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      if (sceneLit(c,r) <= 0) continue;
      const x = ox + c*cs, y = oy + r*cs;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + cs*0.19 + hash(c,r,32)*cs*0.62, sy = y + cs*0.19 + hash(c,r,33)*cs*0.62;
        const sr = cs*0.107;
        g.fillStyle = GARDEN.spark;
        g.beginPath();
        g.moveTo(sx, sy-sr); g.quadraticCurveTo(sx, sy, sx+sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy+sr); g.quadraticCurveTo(sx, sy, sx-sr, sy);
        g.quadraticCurveTo(sx, sy, sx, sy-sr); g.fill();
      }
      if (SCENE_ON.has(sKey(c,r)) || hash(c*5.3 + r*2.9, 21) > 0.34) continue;
      const fx = x + cs*0.24 + hash(c,r,22)*cs*0.5, fy = y + cs*0.26 + hash(c,r,23)*cs*0.45;
      g.strokeStyle = GARDEN.stem; g.lineWidth = Math.max(1.4, cs*0.052); g.lineCap='round';
      g.beginPath(); g.moveTo(fx, fy + cs*0.31); g.lineTo(fx, fy + cs*0.07); g.stroke();
      g.save();
      g.shadowColor = GARDEN.cast; g.shadowBlur = cs*0.095; g.shadowOffsetY = cs*0.06;
      g.fillStyle = hash(c,r,24) > 0.5 ? GARDEN.petal : GARDEN.petalPink;
      for (let p=0;p<6;p++){
        const a = p/6*6.2832;
        g.beginPath();
        g.ellipse(fx + Math.cos(a)*cs*0.100, fy + Math.sin(a)*cs*0.100, cs*0.081, cs*0.081, 0, 0, 7);
        g.fill();
      }
      g.restore();
      g.fillStyle = GARDEN.pollen; g.beginPath(); g.arc(fx, fy, cs*0.057, 0, 7); g.fill();
    }

    const segs = sceneWalls(cs, ox, oy);
    const th = Math.max(4, cs*0.357);
    const hedge = rough => {
      const dot = (x,y,r) => { g.moveTo(x+r, y); g.arc(x, y, r, 0, 7); };
      g.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
        const horiz = y1 === y2, len = horiz ? x2-x1 : y2-y1;
        if (horiz) g.roundRect(x1 - th/2, y1 - th/2, len + th, th, th/2);
        else       g.roundRect(x1 - th/2, y1 - th/2, th, len + th, th/2);
        const step = Math.max(6, cs*0.40), seed = n*13.7;
        for (let m = 0; step*(m + 0.5) < len; m++){
          const d = step*(m + 0.5);
          const rr = th*(0.38 + hash(seed + m*4.13, 3)*0.20)*rough;
          const j = (hash(seed + m*7.71, 5) - 0.5)*step*0.34;
          const push = th/2 - rr*0.70;
          if (horiz){ dot(x1+d+j, y1 - push, rr); dot(x1+d+j, y1 + push, rr*0.9); }
          else      { dot(x1 - push, y1+d+j, rr); dot(x1 + push, y1+d+j, rr*0.9); }
        }
      }
    };
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 9*k; g.shadowOffsetX = 3*k; g.shadowOffsetY = 7*k;
    hedge(1.06); g.fillStyle = GARDEN.hedgeLo; g.fill();
    g.restore();
    g.save(); g.translate(-1.5*k, -4.5*k);
    hedge(0.94); g.fillStyle = GARDEN.hedgeMid; g.fill();
    g.save(); g.clip(); g.fillStyle = cardAnchor(paperTile(), 1.5*k, 4.5*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-3*k, -9*k);
    hedge(0.74); g.fillStyle = GARDEN.hedgeHi; g.fill();
    g.restore();

    const fogAt = (c,r) => sceneLit(c,r) <= 0;
    const fog = (rad, ins) => {
      const ov = Math.max(0.6, cs*0.014);
      g.beginPath();
      for (let r=-3; r<=SCENE_H+3; r++) for (let c=-3; c<=SCENE_W+3; c++){
        if (!fogAt(c,r)) continue;
        const n = fogAt(c,r-1), s2 = fogAt(c,r+1), we = fogAt(c-1,r), e = fogAt(c+1,r);
        const x0 = ox + c*cs + (we ? -ov : ins), x1 = ox + (c+1)*cs + (e ? ov : -ins);
        const y0 = oy + r*cs + (n ? -ov : ins), y1 = oy + (r+1)*cs + (s2 ? ov : -ins);
        g.roundRect(x0, y0, x1-x0, y1-y0,
          [ (!n && !we) ? rad : 0, (!n && !e) ? rad : 0,
            (!s2 && !e) ? rad : 0, (!s2 && !we) ? rad : 0 ]);
        const fil = rad*0.55, cxp = ox + c*cs, cyp = oy + r*cs;
        const nook = (px, py) => { g.moveTo(px + fil, py); g.arc(px, py, fil, 0, 7); };
        if (n  && we && !fogAt(c-1,r-1)) nook(cxp, cyp);
        if (n  && e  && !fogAt(c+1,r-1)) nook(cxp + cs, cyp);
        if (s2 && e  && !fogAt(c+1,r+1)) nook(cxp + cs, cyp + cs);
        if (s2 && we && !fogAt(c-1,r+1)) nook(cxp, cyp + cs);
      }
    };
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = 12*k; g.shadowOffsetX = 4*k; g.shadowOffsetY = 10*k;
    fog(cs*0.40, 0); g.fillStyle = GARDEN.cloudLo; g.fill();
    g.restore();
    g.save(); g.translate(-4*k, -6*k);
    fog(cs*0.42, 1.5*k); g.fillStyle = GARDEN.cloudMid; g.fill();
    g.save(); g.clip(); g.fillStyle = cardAnchor(paperTile(), 4*k, 6*k); g.fillRect(0,0,w,h);
    g.restore(); g.restore();
    g.save(); g.translate(-9*k, -13*k);
    fog(cs*0.46, 5*k); g.fillStyle = GARDEN.cloudHi; g.fill();
    g.restore();
    const [hx, hy] = pts[pts.length-1];
    g.save();
    g.shadowColor = 'rgba(255,206,110,.95)'; g.shadowBlur = cs*0.55;
    g.fillStyle = GARDEN.lamp;
    g.beginPath(); g.arc(hx, hy, cs*0.13, 0, 7); g.fill();
    g.restore();
    g.fillStyle = GARDEN.lampCore;
    g.beginPath(); g.arc(hx, hy, cs*0.085, 0, 7); g.fill();
    g.strokeStyle = '#f4ecd8'; g.lineWidth = Math.max(1.4, cs*0.055);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.24, 0, 7); g.stroke();
  }

  // Paper: the board, still shut over most of it, and the yarn on what is open
  function scenePaper(g, w, h, cs, ox, oy){
    const k = cs/30;
    g.fillStyle = cardAnchor(cardTile('table'), 0, 0); g.fillRect(0,0,w,h);
    g.save();
    g.shadowColor = CARD.shadow + '.34)'; g.shadowBlur = 9*k; g.shadowOffsetY = 4*k;
    g.fillStyle = CARD.board;
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();
    g.save(); g.globalAlpha = 0.20;
    g.fillStyle = cardAnchor(cardTile('back'), 0, 0);
    g.fillRect(ox - cs*0.14, oy - cs*0.14, SCENE_W*cs + cs*0.28, SCENE_H*cs + cs*0.28);
    g.restore();

    const segs = sceneWalls(cs, ox, oy);
    const thick = Math.max(4, cs*0.33);
    const line = (lw, col, dx, dy) => {
      g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'butt'; g.lineJoin = 'round';
      sceneSegPath(g, segs, dx, dy); g.stroke();
    };
    line(thick, CARD.slot, 0.4*k, 3.4*k);
    g.save(); g.filter = 'blur(' + (2.8*k).toFixed(2) + 'px)'; g.globalAlpha = 0.4;
    line(thick, CARD.shadow + '1)', 4*k, 5.4*k); g.restore();
    line(thick, cardAnchor(cardTile('face'), 0, 0), 0, 0);
    g.strokeStyle = CARD.flute; g.lineWidth = 1;
    const half = thick*0.30;
    g.beginPath();
    for (let n=0;n<segs.length;n+=4){
      const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
      const len = Math.hypot(x2-x1, y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
      const nx=-uy*half, ny=ux*half;
      for (let d=2; d<len; d+=3.6){
        g.moveTo(x1+ux*d-nx, y1+uy*d-ny); g.lineTo(x1+ux*d+nx, y1+uy*d+ny);
      }
    }
    g.stroke();

    const pts = scenePts(cs, ox, oy), head = pts[pts.length-1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save();
    g.shadowColor = CARD.shadow + '.45)'; g.shadowBlur = cs*0.10; g.shadowOffsetY = cs*0.05;
    g.strokeStyle = CARD.yarnDark; g.lineWidth = cs*0.20; sceneStroke(g, pts);
    g.restore();
    g.strokeStyle = CARD.yarn; g.lineWidth = cs*0.155; sceneStroke(g, pts);
    g.strokeStyle = CARD.yarnLit; g.lineWidth = Math.max(1, cs*0.05);
    g.beginPath();
    for (let i=1; i<pts.length; i++){
      const [x1,y1] = pts[i-1], [x2,y2] = pts[i];
      const len = Math.hypot(x2-x1, y2-y1) || 1, ux=(x2-x1)/len, uy=(y2-y1)/len;
      const nx=-uy*cs*0.067, ny=ux*cs*0.067, sx=ux*cs*0.047, sy=uy*cs*0.047;
      for (let d=0; d<len; d+=cs*0.147){
        g.moveTo(x1+ux*d-nx-sx, y1+uy*d-ny-sy); g.lineTo(x1+ux*d+nx+sx, y1+uy*d+ny+sy);
      }
    }
    g.stroke();
    g.strokeStyle = '#f4ecd8'; g.lineWidth = Math.max(1.4, cs*0.06);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.24, 0, 7); g.stroke();
    g.save();
    g.shadowColor = CARD.shadow + '.45)'; g.shadowBlur = cs*0.12; g.shadowOffsetY = cs*0.055;
    g.fillStyle = CARD.yarnDark; g.beginPath(); g.arc(head[0], head[1], cs*0.19, 0, 7); g.fill();
    g.restore();
    g.fillStyle = CARD.yarn; g.beginPath(); g.arc(head[0], head[1], cs*0.147, 0, 7); g.fill();

    // every flap still shut, plus one caught mid-turn so the card shows what it does
    const shut = [];
    for (let r=-1; r<=SCENE_H; r++) for (let c=-1; c<=SCENE_W; c++)
      if (sceneLit(c,r) <= 0) shut.push(c, r);
    const save = [cellSize, camX, camY];
    cellSize = cs; camX = -ox; camY = -oy;              // flapPath works in world space
    cardShutFlaps(g, -ox, -oy, shut, k);
    g.save(); g.globalAlpha = 0.92;
    g.beginPath(); const dep = flapPath(g, 5, 4, -ox, -oy, 0.55, 0, -2.4*k);
    g.fillStyle = cardAnchor(cardTile(dep >= 0 ? 'face' : 'back'), -ox, -oy); g.fill();
    g.strokeStyle = CARD.edge; g.lineWidth = 1; g.stroke();
    g.restore();
    cellSize = save[0]; camX = save[1]; camY = save[2];
  }

  const SCENES = [sceneLantern, sceneGarden, scenePaper];
  function paintScene(cv, wi){
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d);
    const g = cv.getContext('2d');
    g.setTransform(d,0,0,d,0,0);
    // the corridor is centred on the card; the grid runs off every edge behind it
    const cs = r.width/5.2, ox = -cs*0.45, oy = r.height/2 - 4.5*cs;
    (SCENES[wi] || SCENES[0])(g, r.width, r.height, cs, ox, oy);
  }

  // the world's furniture, cut from the world's own material
  const CARD_MAT = [
    { mat:'pixel', edge:'#c0532a', acc:'#8a3a1c', onacc:'#f6efe2',
      tag:'#ffc06a', tagink:'rgba(6,9,12,.85)', fibre:null },
    { mat:'hedge', edge:'#2c7038', acc:'#eef7e6', onacc:'#2c7038',
      tag:'#ffffff', tagink:'rgba(28,68,30,.8)', fibre:'hedge' },
    { mat:'kraft', edge:'#8a5f2c', acc:'#7a4f22', onacc:'#f0e2c2',
      tag:'#f4ecd8', tagink:'rgba(52,36,18,.85)', fibre:'kraft' },
  ];
  const fibreCache = {};
  function fibreURL(kind){
    if (fibreCache[kind] !== undefined) return fibreCache[kind];
    let cv = null;
    if (kind === 'hedge'){ paperTile(); cv = paperTileCv; }
    else if (kind === 'kraft'){ cardTile('face'); cv = cardTileCv.face; }
    fibreCache[kind] = cv ? `url(${cv.toDataURL()})` : 'none';
    return fibreCache[kind];
  }
  // which level PLAY drops you into: the one you are on if it is in this world,
  // otherwise the first you have not finished
  function playTarget(wi){
    const a = wi*LEVELS_PER_WORLD;
    if (worldOf(cur) === wi) return cur;
    return Math.max(a, Math.min(a + LEVELS_PER_WORLD - 1, beaten));
  }

  function buildMap(){
    const deck = document.getElementById('mapDeck');
    const W = Math.max(260, (mapEl.clientWidth||360) - 36);   // a card's usable width
    let cards = '', dots = '';
    WORLDS.forEach((w, wi) => {
      const a = wi*LEVELS_PER_WORLD, seen = PREVIEW_UNLOCK || beaten >= a;
      const M = CARD_MAT[wi] || CARD_MAT[0];
      let rail = '';
      for (let l=0; l<LEVELS_PER_WORLD; l++){
        const i = a+l, done = i<beaten, locked = !PREVIEW_UNLOCK && i>beaten;
        const st = levelStat(i), held = i!==cur && !done && st && st.started;
        const cls = 'lv' + (done?' done':'') + (locked?' locked':'')
                  + (i===cur?' cur':'') + (held?' held':'');
        const face = done ? CHECK : (locked ? LOCK : (l+1));
        rail += `<button data-i="${i}" ${locked?'disabled':''} class="${cls}">`
              + `<span class="lvn">${face}</span></button>`;
      }
      const on = worldOf(cur) === wi, s = on ? levelStat(cur) : null;
      const stat = `<div class="cstat${on?'':' hide'}">`
        + `<span class="cgauge"><i style="width:${Math.round(Math.max(0,Math.min(1,s?s.light:1))*100)}%"></i></span>`
        + `<span>${FLAME}${s?s.got:0}/${s?s.need:0}</span>`
        + `<span>${CLOCK}${fmt(s?s.elapsed:0)}</span></div>`;
      // the shadow takes the world's own hue darkened — not black — and keys off the
      // same colour the page tint does, so card and ground agree about the light
      const shd = toRGB(M.edge).map(c => Math.round(c*0.34 + 10)).join(',');
      cards += `<div class="card${seen?'':' locked'}">`
        + `<div class="frame" style="--edge:${M.edge};--acc:${M.acc};--onacc:${M.onacc};`
        + `--tag:${M.tag};--tagink:${M.tagink};--shd:${shd}">`
        + `<div class="art">`
        +   `<canvas class="scene" data-w="${wi}"></canvas>`
        +   `<div class="cmid"><button class="play mat" data-w="${wi}">Play</button></div>`
        + `</div>`
        + `<div class="cfoot">`
        +   `<div class="cname">${seen ? w.name : '? ? ?'}</div>`
        +   stat
        +   `<div class="lvrail">${rail}</div>`
        + `</div>`
        + `</div></div>`;
      dots += `<span class="dot" data-w="${wi}"></span>`;
    });
    deck.innerHTML = cards;
    document.getElementById('mapDots').innerHTML = dots;
    deck.querySelectorAll('.lv').forEach(el=>{
      const i = +el.dataset.i;
      if (!(!PREVIEW_UNLOCK && i>beaten))
        el.addEventListener('click', ()=>{ Snd.resume(); Snd.ui(); loadLevel(i); });
    });
    deck.querySelectorAll('.play').forEach(el=>{
      el.addEventListener('click', ()=>{ Snd.resume(); Snd.ui(); loadLevel(playTarget(+el.dataset.w)); });
    });
    requestAnimationFrame(()=>{
      deck.querySelectorAll('canvas.scene').forEach(cv => paintScene(cv, +cv.dataset.w));
    });
    // a card is no longer the width of the deck, so the snap step has to be measured
    const step = () => {
      const c = deck.querySelector('.card');
      return (c ? c.getBoundingClientRect().width : deck.clientWidth) + DECK_GAP;
    };
    // as the deck moves, each card trails it a little, and the trailing is eased so it
    // settles rather than tracking the finger rigidly
    const paint = () => {
      const stp = Math.max(1, step()), sl = deck.scrollLeft;
      const at = Math.round(sl / stp);
      deck.parentElement.querySelectorAll('.dot').forEach((d,k)=> d.classList.toggle('on', k===at));
      bgSetWorld(Math.max(0, Math.min(WORLDS.length-1, at)));
      deck.querySelectorAll('.card').forEach((c,k)=>{
        const p = (k*stp - sl) / stp;                 // 0 centred, ±1 one card away
        const aa = Math.min(1, Math.abs(p));
        const ease = Math.sign(p) * (aa*aa*(3 - 2*aa));  // smoothstep: eased at both ends
        // the foot and the button belong to whichever card is nearest the middle, and
        // the threshold sits well inside a full step so they commit rather than dither
        // back and forth while a swipe is still in the air
        c.classList.toggle('active', aa < 0.34);
        c.style.opacity = (1 - aa*0.45).toFixed(3);
        c.style.transform = `scale(${(1 - aa*0.06).toFixed(4)})`;
        const f = c.querySelector('.frame');
        if (f) f.style.transform = `translateX(${(ease*stp*0.10).toFixed(1)}px)`;
      });
    };
    if (!deck.dataset.wired){
      deck.dataset.wired = '1';
      let queued = false;
      deck.addEventListener('scroll', ()=>{
        if (queued) return;
        queued = true;
        requestAnimationFrame(()=>{ queued = false; paint(); });
      }, { passive:true });
    }
    // open on the world you are actually in
    requestAnimationFrame(()=>{ deck.scrollLeft = worldOf(cur) * step(); paint(); });
  }

  // ---- the menu's ground: the level background, drawn live behind the cards ----
  // Same fill, haze and drifting motes a level uses, so the menu sits in the world it
  // is offering. The world crossfades as you swipe between cards.
  const bgCanvas = document.getElementById('mapBg'), bgCtx = bgCanvas.getContext('2d');
  let bgParts = [], bgWorld = 0, bgRaf = 0, bgTint = null;
  function bgSeed(w, h){
    const f = LOOK_FX[WORLDS[bgWorld].art].part;
    bgParts = [];
    for (let i=0; i<f.n; i++) bgParts.push({
      x: Math.random()*w, y: Math.random()*h, ph: Math.random()*Math.PI*2,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
    });
  }
  function bgResize(){
    const r = mapEl.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, 2);
    if (!r.width || !r.height) return;
    bgCanvas.width = Math.round(r.width*d); bgCanvas.height = Math.round(r.height*d);
    bgCanvas.style.width = r.width+'px'; bgCanvas.style.height = r.height+'px';
    bgCtx.setTransform(d,0,0,d,0,0);
    bgSeed(r.width, r.height);
  }
  function bgSetWorld(wi){
    if (wi === bgWorld || !WORLDS[wi]) return;
    bgWorld = wi;
    const f = LOOK_FX[WORLDS[wi].art].part;         // keep positions, take the new motes
    bgParts.forEach(p => { p.r = f.size[0] + Math.random()*(f.size[1]-f.size[0]); });
  }
  function bgFrame(t){
    if (!mapEl.classList.contains('show')){ bgRaf = 0; return; }
    const w = bgCanvas.clientWidth, h = bgCanvas.clientHeight;
    const ai = WORLDS[bgWorld].art, W_ = LOOKS[ai], fx = LOOK_FX[ai], f = fx.part;
    // The page is paper again — a floor texture here read as noise once it was knocked
    // back far enough to sit under the cards, and as clutter when it was not.
    const idc = (CARD_MAT[bgWorld] || CARD_MAT[0]).edge;
    const target = toRGB(idc).map(c => 242 - (242-c)*0.42);
    bgTint = bgTint ? bgTint.map((c,i)=> c + (target[i]-c)*0.08) : target.slice();
    bgCtx.fillStyle = `rgb(${bgTint.map(c=>c|0).join(',')})`;
    bgCtx.fillRect(0,0,w,h);

    /* The card lights the page it is lying on. A wide pool of the world's own colour is
       centred where the card sits and falls away from it, and a vignette pulls the far
       corners down — together they read as one light source at the card rather than a
       flat sheet, which is what was missing. The pool breathes very slightly, on the
       same slow cycle the lantern uses, so the page is never quite static. */
    const cxp = w/2, cyp = h*0.44;
    const tc = toRGB(W_.thread).join(',');
    const breathe = 1 + 0.06*Math.sin(t/2600);
    const glow = bgCtx.createRadialGradient(cxp, cyp, 0, cxp, cyp, Math.max(w,h)*0.72*breathe);
    glow.addColorStop(0,    `rgba(${tc},.42)`);
    glow.addColorStop(0.40, `rgba(${tc},.19)`);
    glow.addColorStop(1,    `rgba(${tc},0)`);
    bgCtx.fillStyle = glow; bgCtx.fillRect(0,0,w,h);

    const dk = toRGB(idc).map(c => Math.round(c*0.5)).join(',');
    const vig = bgCtx.createRadialGradient(cxp, cyp, Math.min(w,h)*0.34,
                                           cxp, cyp, Math.max(w,h)*0.86);
    vig.addColorStop(0, `rgba(${dk},0)`);
    vig.addColorStop(1, `rgba(${dk},.20)`);
    bgCtx.fillStyle = vig; bgCtx.fillRect(0,0,w,h);
    for (const p of bgParts){                        // the same drift a level uses, inked
      p.y += f.vy; p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = h+4; else if (p.y > h+4) p.y = -4;
      if (p.x < -4) p.x = w+4; else if (p.x > w+4) p.x = -4;
      const aa = (f.twinkle ? 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3)) : 0.5) * 0.34;
      bgCtx.fillStyle = `rgba(120,96,64,${aa.toFixed(3)})`;
      bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, 7); bgCtx.fill();
    }
    bgRaf = requestAnimationFrame(bgFrame);
  }
  window.addEventListener('resize', ()=>{ if (mapEl.classList.contains('show')) bgResize(); });
  // a mouse drag does not pan an overflow container, so the deck is dragged by hand;
  // touch is left to the browser's own panning
  (function deckDrag(){
    const deck = document.getElementById('mapDeck');
    let down = false, id = null, startX = 0, startAt = 0, moved = false, swallow = false;
    deck.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;
      down = true; moved = false; id = e.pointerId;
      startX = e.clientX; startAt = deck.scrollLeft;
      deck.style.scrollSnapType = 'none'; deck.style.scrollBehavior = 'auto';
    });
    window.addEventListener('pointermove', e => {
      if (!down || e.pointerId !== id) return;
      const dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 4) moved = true;   // let a still pointer still be a tap
      if (moved){ deck.scrollLeft = startAt - dx; e.preventDefault(); }
    }, { passive:false });
    window.addEventListener('pointerup', e => {
      if (!down || e.pointerId !== id) return;
      down = false;
      deck.style.scrollSnapType = ''; deck.style.scrollBehavior = '';
      if (moved){                                      // settle on whichever card is nearest
        const step = deck.clientWidth + DECK_GAP;
        deck.scrollTo({ left: Math.round(deck.scrollLeft/step)*step, behavior:'smooth' });
        swallow = true;                                // only the click ending this drag
        setTimeout(()=>{ swallow = false; }, 0);
      }
    });
    deck.addEventListener('click', e => {              // a drag must not also pick a level
      if (swallow){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  })();
  function openMap(){
    pauseClock(); snapLevel();                       // the level you're leaving keeps its place
    winEl.classList.remove('show'); mapEl.classList.add('show');
    document.querySelector('.device').classList.add('menu');
    buildMap();
    bgWorld = worldOf(cur); bgTint = null; bgResize();
    if (!bgRaf) bgRaf = requestAnimationFrame(bgFrame);
    Snd.resume(); Snd.ui();
  }
  function hideMap(){ mapEl.classList.remove('show');
    document.querySelector('.device').classList.remove('menu'); if (bgRaf){ cancelAnimationFrame(bgRaf); bgRaf = 0; } }

  const worldW = () => cols*cellSize;
  const worldH = () => rows*cellSize;
  const clampCam = (v, max) => max <= 0 ? max/2 : Math.max(0, Math.min(max, v));

  // ---- layout / sizing ----
  function layout() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    viewW = r.width; viewH = r.height;
    // show ~7 cells across, clamped to a comfortable finger size
    cellSize = Math.max(38, Math.min(66, Math.round(viewW / 7)));
    tCamX = camX = clampCam(camX, worldW()-viewW);
    tCamY = camY = clampCam(camY, worldH()-viewH);
    seedParticles();
  }

  // ---- input ----
  const FINGER_LIFT = 1.15; // active point sits ~1.15 cells above the fingertip so it isn't hidden

  function cellAt(clientX, clientY, lift) {
    const r = canvas.getBoundingClientRect();
    const px = clientX - r.left;
    const py = clientY - r.top - (lift ? FINGER_LIFT*cellSize : 0); // lift only while dragging
    const wx = px + camX, wy = py + camY;
    if (lift) fingerActive = { x: wx, y: wy };
    let c = Math.floor(wx / cellSize), rr = Math.floor(wy / cellSize);
    c = Math.max(0, Math.min(cols-1, c));
    rr = Math.max(0, Math.min(rows-1, rr));
    return idx(c, rr);
  }

  function openNeighbors(i) {
    const c = cx(i), r = cy(i), out = [];
    if (!cells[i].walls[0]) out.push(idx(c, r-1)); // N
    if (!cells[i].walls[1]) out.push(idx(c+1, r)); // E
    if (!cells[i].walls[2]) out.push(idx(c, r+1)); // S
    if (!cells[i].walls[3]) out.push(idx(c-1, r)); // W
    return out;
  }
  const dist = (a, b) => Math.abs(cx(a)-cx(b)) + Math.abs(cy(a)-cy(b));

  // Scatter embers — you must gather a quota of them to open the exit, so they're spread
  // across the maze (biased toward dead ends and side corridors) to force real exploration.
  function placeEmbers(){
    embers = new Set(); emberGot = 0;
    const count = Math.max(4, Math.round(cols*rows * emberDensity));
    const deadEnds = [], others = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell) continue;
      if (dist(i,startCell) < 3) continue;                 // give the opening room to breathe
      (openNeighbors(i).length === 1 ? deadEnds : others).push(i);
    }
    const shuffle = a => { for(let k=a.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[a[k],a[j]]=[a[j],a[k]];} return a; };
    const pool = shuffle(deadEnds).concat(shuffle(others));
    const chosen = [];
    for (const i of pool){
      if (chosen.length >= count) break;
      if (chosen.every(c => dist(c,i) >= 3)) chosen.push(i);   // keep them spread out
    }
    chosen.forEach(i => embers.add(i));
    emberTotal = embers.size;
    emberNeed = Math.max(1, Math.min(emberTotal, Math.round(emberTotal * needFrac)));
  }

  // Scatter flames — pure light fuel, spread across corridors (not on embers), so keeping the
  // lantern alive is its own hunt, separate from opening the exit.
  function placeFlames(){
    flames = new Set();
    const count = Math.max(4, Math.round(cols*rows * flameDensity));
    const pool = [];
    for (let i=0; i<cols*rows; i++){
      if (i===startCell || i===endCell || embers.has(i)) continue;
      if (dist(i,startCell) < 4) continue;                 // first flame shouldn't be right at the door
      pool.push(i);
    }
    for (let k=pool.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[pool[k],pool[j]]=[pool[j],pool[k]];}
    const chosen = [];
    for (const i of pool){
      if (chosen.length >= count) break;
      if (chosen.every(c => dist(c,i) >= 4)) chosen.push(i);
    }
    chosen.forEach(i => flames.add(i));
  }
  const exitOpen = () => emberGot >= emberNeed;

  // Cast sight from the head: flood through OPEN corridors only, as far as the lantern reaches.
  // Walls block it, so corners hide what's beyond — you see down your hallway, not through it.
  let fogVer = 0;                 // bumped whenever what is visible changes
  let levelVer = 0;               // bumped on a new deal, so a skin can drop level state
  function reveal(){
    fogVer++;
    sightReach = reachOf(light);
    const maxDepth = Math.max(1, Math.round(sightReach));
    nearDepth = new Map();
    const head = trail[trail.length-1];
    const q = [head]; nearDepth.set(head, 0); explored.add(head);
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi], d = nearDepth.get(i);
      if (d >= maxDepth) continue;
      for (const n of openNeighbors(i)){
        if (!nearDepth.has(n)){ nearDepth.set(n, d+1); explored.add(n); q.push(n); }
      }
    }
  }
  function brightnessOf(i){
    if (won) return 0.62;                                    // the way lights up on arrival
    if (nearDepth.has(i)){
      let b = 1 - nearDepth.get(i)/sightReach;               // smooth falloff that breathes with the light
      b = b<=0 ? 0 : (b>=1 ? 1 : b*b*(3-2*b));
      return Math.max(b, explored.has(i) ? DIM : 0);
    }
    return explored.has(i) ? DIM : 0;
  }

  // One corridor-step: advance into new ground (spending light, gathering embers) or retract
  // back along the thread (free). Shared by dragging and tap-to-walk so they behave identically.
  function applyStep(next){
    const prev = trail.length > 1 ? trail[trail.length-2] : -1;
    if (next === prev){                            // retract — costs no light
      const popped = trail.pop();
      inTrail.delete(popped);
      Snd.trace(trail.length, -1);
    } else {                                        // advance into new ground
      trail.push(next);
      inTrail.add(next);
      Snd.trace(trail.length, 1);
      light = Math.max(0, light - DRAIN);
      if (embers.has(next)){                        // gather an ember (exit key — no light)
        embers.delete(next); emberGot++;
        Snd.ember();
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now(), key:true });
        if (emberGot === emberNeed){                // just enough — the exit opens
          showHint('The way is open — reach the exit');
          Snd.exitOpen();
          blooms.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now(), big:true });
        }
      }
      if (flames.has(next)){                         // gather a flame (light fuel)
        flames.delete(next);
        Snd.flame();
        light = Math.min(1, light + FLAME_GAIN);
        blooms.push({ x:(cx(next)+0.5)*cellSize, y:(cy(next)+0.5)*cellSize, t0:performance.now() });
        if (light > 0.55) warnedLow = false;
      }
      if (!warnedLow && light < CRIT){               // dramatic first warning
        warnedLow = true; showHint('Your lantern is fading — find a flame'); Snd.low();
      }
    }
    reveal();
    if (!started) { started = true; startTime = performance.now(); elHint.style.opacity = '0'; }
    if (next === endCell){
      if (exitOpen()) doWin();
      else {                                        // the way is sealed until the quota is met
        pings.push({ x:(cx(endCell)+0.5)*cellSize, y:(cy(endCell)+0.5)*cellSize, t0:performance.now() });
        Snd.sealed();
        showHint(`Gather ${emberNeed - emberGot} more ember${emberNeed-emberGot===1?'':'s'} to open the way`);
      }
    }
  }

  // Shortest corridor route from the head to a tapped cell, staying within what's been seen
  // (so you can't tap your way through the fog). Unique in a perfect maze.
  function bfsPath(from, to){
    if (from === to || !explored.has(to)) return null;
    // tapping onto your own thread simply retraces back to that point
    if (inTrail.has(to)){
      const k = trail.indexOf(to);
      return k < 0 ? null : trail.slice(k, trail.length-1).reverse();
    }
    // otherwise route through seen corridors WITHOUT crossing the existing thread,
    // so with braided loops the line never knots itself
    const prevMap = new Map([[from, -1]]);
    const q = [from];
    for (let qi=0; qi<q.length; qi++){
      const i = q[qi];
      if (i === to) break;
      for (const n of openNeighbors(i)){
        if (!explored.has(n) || prevMap.has(n)) continue;
        if (inTrail.has(n) && n !== to) continue;   // don't walk over the thread
        prevMap.set(n, i); q.push(n);
      }
    }
    if (!prevMap.has(to)) return null;
    const path = []; let cur = to;
    while (cur !== from){ path.push(cur); cur = prevMap.get(cur); }
    return path.reverse();
  }

  // Move the trail head toward the finger cell, one valid corridor-step at a time.
  // Because the finger is physically on the corridor being traced, "step toward finger"
  // reliably follows the path — no global pathfinding needed.
  function stepToward(target) {
    let guard = 0;
    while (guard++ < 24) {
      const head = trail[trail.length-1];
      if (head === target || won) break;
      const prev = trail.length > 1 ? trail[trail.length-2] : -1;
      const nbrs = openNeighbors(head);
      let best = -1, bestD = dist(head, target);
      for (const n of nbrs) {
        const d = dist(n, target);
        if (d >= bestD) continue;                 // must make progress toward the finger
        if (n === prev || !inTrail.has(n)) {      // retrace previous, or explore new
          if (d < bestD) { best = n; bestD = d; }
        }
      }
      if (best === -1) break;
      applyStep(best);
    }
  }

  function onDown(e){
    if (won) return;
    dragging = true; moved = false;
    Snd.resume();
    downX = e.clientX; downY = e.clientY;
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;
    walkQueue.length = 0;                 // a new touch cancels any auto-walk in progress
    const head = trail[trail.length-1];   // start the tip exactly at the head
    tipCell = head; tipT = 0;
    tipX = (cx(head)+0.5)*cellSize; tipY = (cy(head)+0.5)*cellSize;
  }
  function onMove(e){
    if (!dragging || won) return;
    if (!moved && Math.hypot(e.clientX-downX, e.clientY-downY) < DRAG_THRESH) return;
    moved = true;                         // past the threshold: this is a drag
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    fingerSX = e.clientX - r.left; fingerSY = e.clientY - r.top;   // record; tracing happens per-frame
  }
  function onUp(e){
    if (!won && moved){                   // drag ended mid-edge: round to the nearest cell
      if (tipT >= 0.5) applyStep(tipCell);
    }
    dragging = false; fingerActive = null;
    if (won || moved) return;             // a drag already handled it
    const target = cellAt(e.clientX, e.clientY, false);   // a tap: walk there along the corridor
    const path = bfsPath(trail[trail.length-1], target);
    if (path && path.length){
      walkQueue = path; walkAcc = 0;
      Snd.tap();
      pings.push({ x:(cx(target)+0.5)*cellSize, y:(cy(target)+0.5)*cellSize, t0:performance.now() });
    }
  }

  // ---- smooth corridor-tracking tip ----
  const cellCenter = i => ({ x:(cx(i)+0.5)*cellSize, y:(cy(i)+0.5)*cellSize });
  const fingerWorld = () => ({ x: fingerSX + camX, y: fingerSY - FINGER_LIFT*cellSize + camY });

  // Which open direction the finger is pulling toward from cell h, and how far (0..1) along it.
  function chooseTip(h, F){
    const O = cellCenter(h);
    const dx = F.x-O.x, dy = F.y-O.y, dlen = Math.hypot(dx,dy);
    if (dlen < cellSize*0.06) return { cell:h, t:0 };
    const prev = trail.length>1 ? trail[trail.length-2] : -1;
    const cands = [];
    for (const n of openNeighbors(h)) if (!inTrail.has(n)) cands.push(n); // advance into new ground
    if (prev>=0) cands.push(prev);                                        // or retrace
    if (!cands.length) return { cell:h, t:0 };
    let best=-1, bestScore=-2, bestT=0;
    for (const c of cands){
      const C = cellCenter(c);
      const ex = C.x-O.x, ey = C.y-O.y, el = Math.hypot(ex,ey)||1;
      const align = (dx*ex+dy*ey)/(dlen*el);
      const t = Math.max(0, Math.min(1, (dx*ex+dy*ey)/(el*el)));
      const bias = (c===tipCell) ? 0.12 : 0;   // hysteresis: don't flicker between directions
      if (align+bias > bestScore){ bestScore=align+bias; best=c; bestT=t; }
    }
    if (best<0 || bestScore < 0.12) return { cell:(best>=0?best:h), t:0 }; // finger pulling into a wall
    return { cell:best, t:bestT };
  }

  // Per-frame: commit whole cells the finger has crossed, then set the tip's target.
  function dragUpdate(){
    const F = fingerWorld();
    let head = trail[trail.length-1], guard = 0;
    while (guard++ < 8 && !won){
      const pk = chooseTip(head, F);
      if (pk.t < 0.999) break;              // finger hasn't reached the next centre yet
      applyStep(pk.cell);                   // crossed it — commit (light, embers, fog, win)
      head = trail[trail.length-1];
    }
    if (won){ tipCell=head; tipT=0; return; }
    const pk = chooseTip(head, F);
    tipCell = pk.cell; tipT = pk.t;
  }


  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e); });
  canvas.addEventListener('pointermove', onMove, {passive:false});
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function doWin(){
    if (won) return;
    won = true; dragging = false; fingerActive = null; walkQueue.length = 0;
    dropSave(cur);                                   // a beaten level is dealt fresh next time
    Snd.win();
    beaten = Math.max(beaten, cur+1); saveProgress();
    elapsed = started ? (performance.now() - startTime) : 0;
    document.getElementById('wtime').firstChild.nodeValue = fmt(elapsed);
    document.getElementById('wsteps').firstChild.nodeValue = String(trail.length-1);
    document.getElementById('wembers').firstChild.nodeValue = `${emberGot}/${emberTotal}`;
    const last = cur+1 >= TOTAL;
    const nextBtn = document.getElementById('next');
    nextBtn.textContent = last ? 'Play again' : 'Next level';
    const tags = ["You found the way through.","The lantern carried you home.","The thread held.","Out, and still glowing."];
    document.getElementById('wintag').textContent = last ? 'You’ve threaded every world.' : tags[(Math.random()*tags.length)|0];
    document.getElementById('winh2').textContent = last ? 'Complete.' : 'Out.';
    setTimeout(()=>winEl.classList.add('show'), 420);
  }

  // ---- camera follow (dead-zone + easing) ----
  function updateCamera(){
    const head = trail[trail.length-1];
    const hx = tipX, hy = tipY;           // follow the smooth tip, not the snapping cell
    if (walkQueue.length > 0){
      // tap-walking: no finger involved, so keep the lantern centred as the maze glides past
      tCamX = (cx(head)+0.5)*cellSize - viewW/2;
      tCamY = (cy(head)+0.5)*cellSize - viewH/2;
    } else {
      // dragging (or idle): hold a still patch of world so the finger maps to a stable cell
      const dzX = viewW*0.24, dzY = viewH*0.22;
      if (hx < tCamX + dzX) tCamX = hx - dzX;
      if (hx > tCamX + viewW - dzX) tCamX = hx - viewW + dzX;
      if (hy < tCamY + dzY) tCamY = hy - dzY;
      if (hy > tCamY + viewH - dzY) tCamY = hy - viewH + dzY;
    }
    tCamX = clampCam(tCamX, worldW()-viewW);
    tCamY = clampCam(tCamY, worldH()-viewH);
    camX += (tCamX - camX) * 0.16;
    camY += (tCamY - camY) * 0.16;
  }

  // ---- per-world atmosphere ----
  let parts = [];
  function seedParticles(){
    const f = LOOK_FX[curLook].part, w = viewW||400, h = viewH||800;
    parts = [];
    for (let k=0;k<f.n;k++) parts.push({
      x: Math.random()*w, y: Math.random()*h,
      r: f.size[0] + Math.random()*(f.size[1]-f.size[0]),
      ph: Math.random()*6.28, sp: 0.6 + Math.random()*0.8
    });
  }
  function drawParticles(t){
    const f = LOOK_FX[curLook].part;
    for (const p of parts){
      p.y += f.vy * p.sp;
      p.x += Math.sin(t/900 + p.ph) * f.drift;
      if (p.y < -4) p.y = viewH+4; else if (p.y > viewH+4) p.y = -4;
      if (p.x < -4) p.x = viewW+4; else if (p.x > viewW+4) p.x = -4;
      let a = 0.5;
      if (f.twinkle) a = 0.25 + 0.5*(0.5+0.5*Math.sin(t/300 + p.ph*3));
      if (f.type==='bubble'){
        ctx.strokeStyle = `rgba(${f.color},${a*0.5})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
        ctx.fillStyle = `rgba(${f.color},${a*0.12})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      } else if (f.type==='star'){
        ctx.fillStyle = `rgba(${f.color},${a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,7); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(${f.color},${a*0.55})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
    }
  }
  // smooth value noise (continuous across cells) for mottled materials
  // ---- Minecraft-Dungeons-style block floor: chunky pixel tiles, one block per cell ----
  const BLOCK = [
    { base:['#3a2620','#472c22','#2f211d','#523228'], acc:['#c85a2a','#e0742f'], mortar:'#20140f', feat:'glow'    }, // Ember  (warm stone)
    { base:['#1f4a52','#256069','#1a3f4a','#2d6b74'], acc:['#4fb0a8','#7fd8c8'], mortar:'#123037', feat:'wave', shades:['#153a44','#1c4c56','#256069','#3a8a92','#6fd2d2'] }, // Tide (rippling water)
    { base:['#4a4f4c','#565b57','#3f443f','#515651'], acc:['#4a6b3a','#5f7d44'], mortar:'#2a2e2b', feat:'moss'    }, // Moss   (mossy cobble)
    { base:['#2f4266','#3a5480','#28384f','#42608f'], acc:['#8fc4ee','#b6dcf7'], mortar:'#1b2942', feat:'sparkle' }, // Gale   (wind-worn stone)
    { base:['#42464a','#4c5054','#3a3e42','#54585c'], acc:['#666a6e','#5a5e62'], mortar:'#26292c', feat:'brick'   }, // Veil   (cracked brick)
    { base:['#a8763c','#b8834a','#9a6a34','#c08e52'], acc:['#e0c08a','#f0e2c2'], mortar:'#7a5426', feat:'moss'    }, // Card   (kraft board)
    { base:['#5f9e46','#6cae4f','#55913f','#77bb58'], acc:['#9ed163','#c8e79a'], mortar:'#3f7a30', feat:'moss'    }, // Bloom  (clipped lawn)
  ];
  const tileCache = {};
  function genTile(w, seed, phase){
    const P = BLOCK[w], N = 16, cnv = document.createElement('canvas'); cnv.width = cnv.height = N;
    const g = cnv.getContext('2d');
    const R = (x,y,o)=>{ const n=Math.sin(x*12.9898 + y*78.233 + seed*3.7 + o*19.1)*43758.5453; return n-Math.floor(n); };
    if (P.feat==='wave'){                            // continuous rippling water — no block mortar
      const sh = P.shades, k = Math.PI*2/N;
      for (let y=0;y<N;y++) for (let x=0;x<N;x++){
        const wv = Math.sin(x*k*2 + y*k - phase)*0.6 + Math.sin(x*k - y*k*2 - phase*0.7)*0.4;   // -1..1, seamless
        const lvl = (wv+1)/2;
        g.fillStyle = sh[Math.min(sh.length-1, Math.floor(lvl*sh.length))];
        g.fillRect(x,y,1,1);
      }
      return cnv;
    }
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      let col = P.base[Math.floor(R(x,y,1)*P.base.length)];
      if (P.feat==='moss'){
        const m = R(x,y,2)*0.55 + (Math.sin(x*0.55+seed)+Math.sin(y*0.5+seed*1.3))*0.22 + 0.2;
        if (m>0.72) col = P.acc[Math.floor(R(x,y,3)*P.acc.length)];
      } else if (P.feat==='glow')   { if (R(x,y,4)>0.94) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      else if (P.feat==='sparkle')  { if (R(x,y,4)>0.96) col = P.acc[Math.floor(R(x,y,5)*P.acc.length)]; }
      g.fillStyle = col; g.fillRect(x,y,1,1);
    }
    // mortar bevel around the block so cells read as separate blocks
    g.fillStyle = P.mortar; g.globalAlpha = 0.55;
    g.fillRect(0,0,N,1); g.fillRect(0,N-1,N,1); g.fillRect(0,0,1,N); g.fillRect(N-1,0,1,N);
    g.globalAlpha = 1;
    if (P.feat==='brick'){                          // offset brick mortar + a crack
      g.fillStyle = P.mortar; g.globalAlpha = 0.6;
      g.fillRect(0,7,N,1); g.fillRect(0,15,N,1);
      g.fillRect(8,0,1,8); g.fillRect(4,8,1,8);
      g.globalAlpha = 0.7;
      let cxk = 2 + Math.floor(R(0,0,9)*(N-4));
      for (let y=1;y<N-1;y++){ g.fillRect(cxk,y,1,1); cxk += Math.floor(R(cxk,y,10)*3)-1; cxk = Math.max(1,Math.min(N-2,cxk)); }
      g.globalAlpha = 1;
    }
    if (P.feat==='glow'){                            // a hot vein through the warm stone
      g.fillStyle = P.acc[0]; g.globalAlpha = 0.9;
      let cxk = 2 + Math.floor(R(1,1,11)*(N-4));
      for (let y=2;y<N-2;y++){ if (R(cxk,y,12)>0.35){ g.fillRect(cxk,y,1,1); } cxk += Math.floor(R(cxk,y,13)*3)-1; cxk = Math.max(2,Math.min(N-3,cxk)); }
      g.globalAlpha = 1;
    }
    return cnv;
  }
  function blockTiles(w){
    if (tileCache[w]) return tileCache[w];
    let set;
    if (BLOCK[w].feat==='wave'){
      const frames = [], N = 8;
      for (let f=0; f<N; f++) frames.push(genTile(w, 7, (f/N)*Math.PI*2));
      set = { animated:true, tiles:frames };
    } else {
      const arr = []; for (let v=0;v<4;v++) arr.push(genTile(w, v*97+13, 0));
      set = { animated:false, tiles:arr };
    }
    return (tileCache[w] = set);
  }
  function drawFloorBlock(i,b,x,y,s,t){
    const set = blockTiles(curLook);
    const tile = set.animated
      ? set.tiles[Math.floor(t/120) % set.tiles.length]         // water ripples in sync
      : set.tiles[Math.floor(hash(i,7)*set.tiles.length) % set.tiles.length];
    ctx.globalAlpha = Math.min(1, 0.12 + 0.88*b);
    ctx.drawImage(tile, x, y, s+0.6, s+0.6);        // slight overlap avoids seams when scaled
    ctx.globalAlpha = 1;
  }

  // ---- render ----
  /* ---- skins ----------------------------------------------------------------
     Each world draws itself. Everything above this point is shared — the maze, the
     fog, the thread's position, the camera — and a skin is only ever handed the
     frame time and asked to paint. Adding a world's look means adding one entry to
     SKINS and pointing that world at it; nothing else in the game needs to know.
     -------------------------------------------------------------------------- */
  function drawIso(t){
    ctx.clearRect(0,0,viewW,viewH);
    // ambient floor
    ctx.fillStyle = T.bg;
    ctx.fillRect(0,0,viewW,viewH);

    const c0 = Math.max(0, Math.floor(camX/cellSize));
    const r0 = Math.max(0, Math.floor(camY/cellSize));
    const c1 = Math.min(cols-1, Math.ceil((camX+viewW)/cellSize));
    const r1 = Math.min(rows-1, Math.ceil((camY+viewH)/cellSize));

    // maze under fog: only explored cells render, brightest where the thread's light reaches
    const thread = getVar('--thread');
    const WB = 5, wallBuckets = Array.from({length:WB},()=>[]);   // segments grouped by brightness
    ctx.imageSmoothingEnabled = false;                          // keep the pixel blocks crisp
    for (let r=r0; r<=r1; r++){
      for (let c=c0; c<=c1; c++){
