<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>A MAZE THING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
        :root{
    --page:#0a1114;
    --app:#10191d;
    --app-2:#0c1417;
    --ink:#e8eef0;
    --muted:#7f96a0;
    --wall:#33474f;
    --thread:#ffc06a;
    --thread-core:#fff0d2;
    --beacon:#56e0c8;
    --line:#1c2a30;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  /* one focus ring, everywhere: currentColor picks up whatever ink each button already
     uses, so it reads correctly on the light chrome (cream panels) and the dark win
     screen alike without a per-component override. */
  button:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #12211f 0%, var(--page) 60%);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }

  /* Phone frame on wide screens; fills the viewport on real phones */
  .device{
    position:relative;width:min(400px,100%);height:min(844px,100dvh);
    background:var(--app);border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 2px #1e2c31, 0 0 0 12px #060b0d, 0 40px 90px -30px #000;
    display:flex;flex-direction:column;
  }
  @media (max-width:440px){
    body{padding:0;}
    .device{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
  }

  .device.menu .topbar{display:none;}
  /* The status bar sits at the foot of the board in the same white rounded panel the
     world-select cards use, so the two screens share one piece of furniture instead of
     each having their own. It keeps clear of the device edges the same way the card
     foot does, and carries the safe-area inset on its margin rather than its padding —
     on a notched phone that lifts the whole panel instead of stretching it taller.
     The light meter sits inset inside that panel, with its own breathing room on every
     side, rather than running flush to the panel's own edge — it reads as one more
     thing the panel is holding, not as part of the panel's own shape. */
  .topbar{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;gap:16px;
    padding:4px 4px max(26px,calc(env(safe-area-inset-bottom) + 14px));
    background:#faf8f3;border-radius:0px;
    box-shadow:0 16px 40px -10px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.10);
    z-index:5;
  }
  .track{height:5px;border-radius:999px;background:#faf8f3;overflow:hidden;flex:none;}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb055,#ffd98f);
    transition:width .5s cubic-bezier(.3,.8,.3,1);width:60%;}
  .track.low{box-shadow:0 0 0 1px rgba(255,90,60,.5);animation:lowpulse .9s ease-in-out infinite;}
  @keyframes lowpulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* the rest of the bar's furniture sits in its own row below the light strip — it carries
     its own side padding now, since the strip above it sits much closer to the edge */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;}
  .side{display:flex;align-items:center;gap:10px;flex:none;}
  /* LVL n — the small label and the big numeral, in the world's own ink */
  .lvl{display:flex;align-items:center;gap:5px;flex:none;color:var(--thread-ink,#4a3a1e);
    user-select:none;}
  .lvl span{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;opacity:.75;}
  .mark{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;}

  /* the goal and the clock read as plain figures on the panel now — no chip behind
     either one, just the numbers and the icon that says what they mean */
  .figs{display:flex;align-items:center;gap:18px;}
  .fig{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;font-weight:700;color:var(--thread-ink,#4a3a1e);
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* the goal icon mirrors whatever you're actually collecting in that world — a little
     vane for the garden, a warm ember glow everywhere else — instead of a plain dot.
     Sized up so it reads as its own little illustration, not a bullet point. */
  .goalIcon{width:24px;height:24px;flex:none;display:inline-flex;transition:filter .25s ease;}
  .goalIcon svg{width:100%;height:100%;display:block;}
  .goalIcon.lit{filter:saturate(1.3) brightness(1.1) drop-shadow(0 0 2px rgba(0,0,0,.2));}
  /* bare glyphs, no chip behind them — the bar is already a panel, a button inside a
     panel is one box too many */
  .iconbtn{border:0;background:none;color:#57534a;padding:0;
    width:26px;height:26px;cursor:pointer;display:grid;place-items:center;transition:color .18s;flex:none;}
  .iconbtn:hover{color:#22221c;}
  .iconbtn svg{width:19px;height:19px;stroke-width:2;}

  .stage{position:relative;flex:1;min-height:0;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  /* only the live gameplay canvas drives its own drag handling and needs the browser's
     default touch gestures fully out of the way — the card-art canvases in the world
     deck (canvas.scene) must NOT inherit this, or a touch starting on the artwork
     (i.e. anywhere but the foot panel) stops the deck's own swipe-to-change-card from
     working, which is exactly the bug this rule used to cause when it was blanket-`canvas`. */
  #c{touch-action:none;}

  /* Instructions sit in the middle of the board, where the eye already is, rather than
     tucked along an edge. Centred text that wraps inside a max width instead of one
     nowrap line, so a longer hint stays on screen on a narrow phone. */
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(10,17,20,.62);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--ink);font-size:14px;line-height:1.45;padding:10px 16px;border-radius:18px;
    max-width:min(82%,300px);text-align:center;text-wrap:balance;
    pointer-events:none;transition:opacity .5s;}
  .hint b{color:var(--thread);font-weight:500;}

  /* Win */
  .win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:radial-gradient(90% 60% at 50% 42%, rgba(21,42,40,.86), rgba(8,14,16,.94));
    backdrop-filter:blur(3px);z-index:8;text-align:center;padding:24px;}
  .win.show{display:flex;animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .win h2{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:30px;margin:0;}
  .win p{color:var(--muted);margin:2px 0 18px;font-size:14px;}
  .win .figures{display:flex;gap:26px;margin-bottom:22px;}
  .win .figures div{font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:21px;}
  .win .figures span{display:block;font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .btn{border:0;background:var(--thread);color:#241704;font:inherit;font-weight:600;font-size:15px;
    padding:12px 22px;border-radius:14px;cursor:pointer;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid #2b3e45;}
  .win .row{display:flex;gap:10px;}

  /* world map */
  /* The page is paper the cards are laid on, not a night sky: the worlds carry the
     colour now, and a light ground is what lets three very different ones sit side by
     side without one of them looking like it is lit wrong. */
  /* No side padding here: the deck runs the full width so a card can sit closer to the
     edge and the next world still shows past it. What little inset the cards need comes
     from the deck's own padding, which the shadow can spill into. */
  .sheet{position:absolute;inset:0;touch-action:pan-y;display:none;flex-direction:column;z-index:9;padding:16px 0;
    /* No justify-content:center here on purpose — centering an overflowing flex
       container clips its leading edge in a way you can't scroll back to, and these
       cards are tall enough now to overflow on shorter screens. Top-aligned with the
       deck's own padding-block is the safe version of "centered". */
    background:#faf8f3;overflow-y:auto;overflow-x:hidden;   /* the glow reaches past both edges */
    padding-top:max(12px,env(safe-area-inset-top));}
  .sheet.show{display:flex;animation:fade .28s ease both;}
  /* the world's own light, washed across the page behind the cards */
  .mapbg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;}
  .deck{position:relative;z-index:1;}
  /* the source sits above the frame — only its falloff is ever on screen, so the light
     reads as spilling in from somewhere out of view rather than as a lamp in the layout. */
  @keyframes litbreathe{
    0%,100%{filter:drop-shadow(0 2px 3px rgba(90,70,44,.16));}
    50%    {filter:drop-shadow(0 3px 9px rgba(90,70,44,.30));}
  }

  /* the deck: one card per world, swiped sideways and snapped into place */
  /* overflow-y has to be hidden for the horizontal scroll to behave, which means the
     card's drop shadow is clipped at this box's edge — the vertical padding is what
     gives the shadow somewhere to land instead of being cut off. */
  .deck{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;min-width:0;touch-action:pan-x;
    /* The end spacers are margins on the first and last card, not padding on this box.
       Padding here would shrink the flex content box, and the cards size against that —
       7% of padding made a "86%" card render at 86% of 86%, sitting off centre. Trailing
       padding on a horizontal scroller is also dropped from the scrollable area in
       WebKit and Blink, so the last card could never reach the middle. */
    padding-block:26px 52px;                /* headroom for the shadow, not dead space */
    scroll-snap-type:x mandatory;scroll-behavior:smooth;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;}
  .deck::-webkit-scrollbar{display:none;}
  /* Cards are narrower than the deck so the next world is always half-visible at the
     edge — that peek is what tells you the deck is a deck. The padding either side is
     what lets the first and last card still reach the middle when they snap. */
  /* No will-change here. It promotes the card to its own compositing layer sized to the
     card's own box, and the frame's shadow reaches past that box — which is what was
     clipping it. The scale still animates fine without the hint. */
  .card{flex:0 0 76%;scroll-snap-align:center;scroll-snap-stop:always;
    position:relative;background:none;transition:filter .3s ease;
    transform-origin:50% 46%;}
  /* exactly half the leftover width, so the end cards land dead centre like the rest —
     narrower cards than before means more of each neighbour shows at rest, which is what
     now carries the "which world am I on" signal that a separate dots row used to.
     82% only left a ~22px sliver at 0.55 opacity on a 400px phone — technically a peek,
     but thin and dim enough to read as page margin rather than "another card is here".
     76%/12% roughly doubles that sliver's width. */
  .card:first-child{margin-left:12%;}
  .card:last-child{margin-right:12%;}
  .card.locked{filter:grayscale(.86) brightness(.9);}
  /* A card is a window onto the world, not an illustration of it: the scene inside is
     painted by the same style the levels are, so what you are choosing between is what
     you are about to play. Art on top, a plain foot underneath carrying the name and
     the levels — the foot is the same on every card, the art is the only thing that
     changes. The shadow is tinted with the world's own colour rather than black, so a
     warm world sits in a warm shadow and does not look pasted onto the page. */
  /* Height now drives the frame directly instead of being derived from an aspect-ratio
     against the card's width — aspect-ratio was quietly the tighter constraint before
     (it maxed out around 625px on a 400px-wide phone, well under the old 660px cap), so
     cards never actually reached "80% of the viewport" in practice. Dropping it and
     sizing straight off the viewport height is what actually makes the card taller. */
  .frame{position:relative;width:100%;height:min(90vh,720px);
    margin:0 auto;border-radius:22px;overflow:hidden;background:#0f0f0d;
    box-shadow:0 22px 44px -14px rgba(var(--shd),.50),
               0 6px 14px -4px rgba(var(--shd),.30),
               0 1px 2px rgba(var(--shd),.22);}
  /* The art runs the full card. A world you are not on is only its art — the foot is
     parked below the bottom edge and the button is faded out, so the deck reads as
     three places rather than three menus. Both come back as the card lands. */
  .art{position:absolute;inset:0;}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-x;}
  /* Fading to opacity:0 hides a card's Play button from view, but the element stays in
     the tab order — a keyboard user tabbing through the deck would land on an invisible
     control for a card that isn't showing. visibility:hidden pulls it out of the tab
     order too; the transition delay lets it stay visible until the fade actually
     finishes, and come back the instant the fade-in starts. */
  .cmid{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .26s ease .04s, visibility 0s linear .30s;}
  .card.active .cmid{opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .26s ease .04s, visibility 0s linear;}

  /* The foot: name, then levels. Identical on every card, and only on the active one.
     It floats clear of the frame rather than sitting flush in the bottom of it, so it
     reads as a panel laid on the art instead of a band welded to the card. --fi is the
     gap it keeps on all three sides; the parked position has to clear that gap too, or
     a sliver of its top edge would still show above the frame's bottom. */
  /* Same tab-trap fix as .cmid above: the parked foot panel sits below the visible
     screen but its .lv and .play buttons remain focusable unless visibility is pulled
     out too. The delay keeps it visible through the slide-down before hiding, and
     visible instantly on the way back in. */
  .cfoot{--fi:12px;
    position:absolute;left:var(--fi);right:var(--fi);bottom:var(--fi);z-index:3;
    background:#faf8f3;padding:15px 16px 14px;border-radius:24px;
    box-shadow:0 8px 22px -8px rgba(16,12,6,.38), 0 1px 3px rgba(16,12,6,.16);
    display:flex;flex-direction:column;align-items:stretch;gap:11px;
    transform:translateY(calc(100% + var(--fi)));visibility:hidden;
    transition:transform .40s cubic-bezier(.2,.85,.28,1), visibility 0s linear .40s;}
  .card.active .cfoot{transform:translateY(0);visibility:visible;
    transition:transform .40s cubic-bezier(.2,.85,.28,1), visibility 0s linear;}
  @media (prefers-reduced-motion: reduce){
    .cfoot, .cmid{transition:none;}
  }
  .cname{text-align:center;font-size:10px;font-weight:500;letter-spacing:.19em;
    text-indent:.19em;text-transform:uppercase;color:#4a4740;line-height:1;}

  /* ---- one chrome, every world ---------------------------------------------------
     The furniture used to be cut from each world's own material — pixel, hedge, kraft.
     Three worlds meant three of everything, and adding a fourth meant designing it all
     again. It is one system now: the same white pill, the same type, the same spacing,
     on every card. The art behind it does the work of telling the worlds apart, which
     is the only thing that actually needs to differ. */
  .mat{position:relative;font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#f7f5ef;color:#22221c;border-radius:999px;}

  /* PLAY: the one thing on the card you are meant to hit. Kept white on every world so
     it never has to fight that world's palette — the shadow does the separating. */
  .play{border:0;cursor:pointer;font-weight:500;font-size:15px;letter-spacing:.13em;
    text-indent:.13em;padding:14px 40px;line-height:1;
    box-shadow:0 1px 2px rgba(16,12,6,.20), 0 8px 20px -4px rgba(16,12,6,.42);
    transition:transform .12s ease, box-shadow .18s ease;}
  .play:hover{box-shadow:0 1px 2px rgba(16,12,6,.22), 0 12px 26px -4px rgba(16,12,6,.5);}
  .play:active{transform:translateY(1px) scale(.985);}
  /* where you left off in this world — quiet, under the name, only on the card you are on */
  .cstat{display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:10px;color:#8a8578;font-variant-numeric:tabular-nums;line-height:1;}
  .cstat.hide{display:none;}
  .cstat .cgauge{width:46px;height:5px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;}
  .cstat .cgauge i{display:block;height:100%;background:currentColor;}
  .cstat svg{width:11px;height:11px;display:block;opacity:.85;}
  .cstat span{display:flex;align-items:center;gap:4px;}

  /* the level rail, now sitting in the foot rather than floating over the art. The row
     is plain numbers; only the level you are on takes a filled disc. */
  .lvrail{position:relative;display:flex;align-items:stretch;gap:2px;}
  .lv{flex:1 1 0;min-width:0;height:30px;border:0;background:none;
    color:#3a382f;font:inherit;font-size:14px;font-weight:500;cursor:pointer;position:relative;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s;}
  .lv .lvn{display:grid;place-items:center;line-height:1;
    width:28px;height:28px;border-radius:50%;transition:background .16s;}
  .lv .lvn svg{width:15px;height:15px;}
  .lv.done{color:var(--acc);}
  .lv:hover:not(.locked):not(.cur) .lvn{background:rgba(20,16,8,.07);}
  .lv:active:not(.locked){transform:scale(.92);}
  /* the one place a world's colour is allowed into the chrome */
  .lv.cur .lvn{background:var(--acc);color:var(--onacc);}
  /* a run left part-way: a small mark so the deck shows which levels are still warm */
  .lv.held::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:99px;background:currentColor;opacity:.55;}
  .lv.locked{opacity:.3;cursor:default;}
</style>
</head>
<body>
  <div class="device">
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="hint" id="hint">Drag or tap through the dark. <b>Snacks</b> keep you glowing</div>
      <div class="win" id="win">
        <h2 id="winh2">Found one!</h2>
        <p id="wintag">You followed the trail.</p>
        <div class="figures">
          <div id="wtime">0:00<span>time</span></div>
          <div id="wsteps">0<span>steps</span></div>
          <div id="wembers">0<span>treats</span></div>
        </div>
        <div class="row">
          <button class="btn" id="next">Next level</button>
          <button class="btn ghost" id="tomap">Map</button>
        </div>
      </div>
    </div>

    <div class="topbar">
      <!-- the light sits inset inside the panel, above the row that shows what it buys -->
      <div class="track"><div class="fill" id="lightFill"></div></div>
      <div class="bar">
        <div class="side">
          <button class="iconbtn" id="back" title="Levels" aria-label="Back to levels">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"/><path d="M10 6l-6 6 6 6"/></svg>
          </button>
          <div class="lvl"><span>LVL</span><b class="mark">1</b></div>
        </div>
        <div class="figs">
          <span class="fig ember"><span id="embers">0/0</span><span class="goalIcon" id="goalIcon"></span></span>
          <span class="fig time"><span id="time">0:00</span></span>
        </div>
        <div class="side">
          <button class="iconbtn" id="mute" title="Sound" aria-label="Sound">
            <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
          </button>
          <button class="iconbtn" id="reset" title="New maze" aria-label="New maze">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </button>
        </div>
      </div>
    </div>

      <div class="sheet" id="map">
        <canvas class="mapbg" id="mapBg" aria-hidden="true"></canvas>
        <div class="deck" id="mapDeck"></div>
      </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const elTime = document.getElementById('time');
  const elEmbers = document.getElementById('embers');
  const elLightFill = document.getElementById('lightFill');
  const elTrack = elLightFill.parentElement;
  const elHint = document.getElementById('hint');
  const winEl = document.getElementById('win');
  const markEl = document.querySelector('.mark');
  const elGoalIcon = document.getElementById('goalIcon');
  const mapEl = document.getElementById('map');

  // ---- sound: fully synthesized (Web Audio), so the game stays one self-contained file ----
  // Everything sits in a minor-pentatonic scale; each world has its own root note, so moving
  // between worlds changes key. Soft attacks + a reverb send keep it calm and spacious.
  const Snd = (() => {
    const ROOTS = [196.00, 220.00, 174.61, 246.94, 130.81, 164.81];  // Ember G3, Tide A3, Moss F3, Gale B3, Veil C3, Card E3
    const PENT = [0,3,5,7,10];
    let ctx=null, master=null, reverb=null, noiseBuf=null, ready=false, muted=false, root=196;
    let drA,drB,drGain, beaconOsc,beaconGain, shimA,shimB,shimGain;
    const now = ()=>ctx.currentTime;
    function makeImpulse(dur,decay){ const len=ctx.sampleRate*dur, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return buf; }
    function ensure(){
      if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      master = ctx.createGain(); master.gain.value = muted?0:0.55; master.connect(ctx.destination);
      reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(2.4,2.6);
      const rg = ctx.createGain(); rg.gain.value=0.55; reverb.connect(rg); rg.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      { const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      const df = ctx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=440;
      drGain = ctx.createGain(); drGain.gain.value=0; df.connect(drGain); drGain.connect(master);

      beaconGain=ctx.createGain(); beaconGain.gain.value=0; beaconOsc=ctx.createOscillator(); beaconOsc.type='sine';
      beaconOsc.connect(bf); bf.connect(beaconGain); beaconGain.connect(master); beaconGain.connect(reverb); beaconOsc.start();
      const sf=ctx.createBiquadFilter(); sf.type='lowpass'; sf.frequency.value=3200;

    function retune(){ if(!ready) return; const t=now();
      drA.frequency.setTargetAtTime(root/2,t,0.12); drB.frequency.setTargetAtTime(root/2*1.006,t,0.12);

      const o=ctx.createOscillator(); o.type=type||'triangle'; o.frequency.value=freq;

      if(lp){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); f.connect(gg); } else o.connect(gg);

      isMuted(){ return muted; },

  // ---- per-level bookmarks ----
  // Stepping out to the map shouldn't cost you the run. Each level you leave keeps its

  // does the reset button — those are the two ways to ask for a fresh maze.
  const SAVES = new Map();     // level index -> snapshot

    try{

  }

  // The clock stops the moment you leave for the map and picks up on the way back, so
  // menu time never lands on the level's total.
  function pauseClock(){

  }

  function snapLevel(){
    if (!cells || won) return;                       // a finished level starts over next time

  // ---- state ----

  // while the logical trail commits whole cells underneath it

  let tipCell = 0;             // the neighbour the tip is currently heading toward

  let fingerSX = 0, fingerSY = 0; // last finger position, canvas-relative screen px

  const idx = (c, r) => r * cols + c;
  const cx = i => i % cols;
  const cy = i => (i - (i % cols)) / cols;

  // ---- maze generation (recursive backtracker) ----
  function genMaze() {
    cells = Array.from({length: cols*rows}, () => ({ walls:[true,true,true,true], v:false }));
    const stack = [];
    let cur = idx(0,0); cells[cur].v = true;
    const dirs = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]]; // dc,dr,wall,opposite
    let count = 1;
    while (count < cols*rows) {
      const c = cx(cur), r = cy(cur);
      const nbrs = [];
      for (const [dc,dr,w,ow] of dirs) {
        const nc=c+dc, nr=r+dr;
        if (nc>=0&&nc<cols&&nr>=0&&nr<rows && !cells[idx(nc,nr)].v) nbrs.push([idx(nc,nr),w,ow]);
      }
      if (nbrs.length) {
        const [ni,w,ow] = nbrs[(Math.random()*nbrs.length)|0];
        cells[cur].walls[w] = false; cells[ni].walls[ow] = false;
        stack.push(cur); cur = ni; cells[cur].v = true; count++;
      } else cur = stack.pop();
    }
    // braid: open a share of the remaining walls so there are loops and real route choices,
    // instead of a single line from start to finish.
    if (braid > 0){
      const closed = [];
      for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
        const i = idx(c,r);
        if (c<cols-1 && cells[i].walls[1]) closed.push([i, idx(c+1,r), 1, 3]);
        if (r<rows-1 && cells[i].walls[2]) closed.push([i, idx(c,r+1), 2, 0]);

    };
    const face = (x,y,fill,k) => { const W_=g.W*(k||1), H_=g.H*(k||1);
      return `<path d="M ${x.toFixed(1)} ${(y-H_).toFixed(1)} L ${(x+W_).toFixed(1)} ${y.toFixed(1)} `
        + `L ${x.toFixed(1)} ${(y+H_).toFixed(1)} L ${(x-W_).toFixed(1)} ${y.toFixed(1)} Z" fill="${fill}"/>`; };

    trees.forEach(([gx,gy]) => cells.push([gx, gy, 2]));
    floats.forEach(f => cells.push([f[0], f[1], 1, f[2], f[3]]));
    cells.sort((a,b)=> (a[0]+a[1]) - (b[0]+b[1]));
    const sideL = shadeHex(P.cliff, 0.12), sideR = P.cliff;
    let s = '';
    cells.forEach(([gx,gy,kind,fh,fk])=>{
      const h = kind === 1 ? fh : height(gx,gy);

      const x = g.ox + (gx-gy)*g.W, y = g.oy + (gx+gy)*g.H - h*g.HZ;
      if (y > bh + g.HZ*5 || x < -g.W*3 || x > bw + g.W*3) return;
      if (kind === 2){ s += treeAt(g,P,x,y); return; }
      if (kind === 1){
        if (spec.floatKind === 'cloud'){
          s += `<g class="cloud" style="animation-duration:${(19 + (gx*7+gy*5)%11 * 1.4).toFixed(1)}s;`
            + `animation-delay:${(-((gx*5+gy*11)%14) * 1.3).toFixed(1)}s">${puffAt(g,x,y,fk)}</g>`;
        } else {
          const d0 = g.HZ*0.5;
          s += `<path d="M ${(x-g.W).toFixed(1)} ${y.toFixed(1)} L ${x.toFixed(1)} ${(y+g.H).toFixed(1)} `
             + `L ${x.toFixed(1)} ${(y+g.H+d0).toFixed(1)} L ${(x-g.W).toFixed(1)} ${(y+d0).toFixed(1)} Z" fill="${shadeHex(P.cliff,0.12)}"/>`

             + `L ${(x+g.W).toFixed(1)} ${(y+d0).toFixed(1)} L ${x.toFixed(1)} ${(y+g.H+d0).toFixed(1)} Z" fill="${P.cliff}"/>`

      }
      const d = h*g.HZ + g.SKIRT;
      s += `<path d="M ${(x-g.W).toFixed(1)} ${y.toFixed(1)} L ${x.toFixed(1)} ${(y+g.H).toFixed(1)} `
         + `L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} L ${(x-g.W).toFixed(1)} ${(y+d).toFixed(1)} Z" fill="${sideL}"/>`
         + `<path d="M ${x.toFixed(1)} ${(y+g.H).toFixed(1)} L ${(x+g.W).toFixed(1)} ${y.toFixed(1)} `
         + `L ${(x+g.W).toFixed(1)} ${(y+d).toFixed(1)} L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} Z" fill="${sideR}"/>`;
      const [ax,ay] = at(gx,gy);
      const isSummit = spec.summit && ax===spec.summit[0] && ay===spec.summit[1];
      if (isSummit && P.volcano) s += face(x,y,P.featB);
      else if (featAt(gx,gy) || strewn.has(kkey(gx,gy))) s += face(x,y,P.featA)
        + `<g class="flow" style="animation-delay:${(-Math.hypot(ax-5.5,ay-5.5)*0.26).toFixed(2)}s">`

  }
  function islandArt(wi, w, bw, bh, states){
    const P = islePalette(w, wi), spec = isleSpec(wi), g = isoGeom(bw, bh);
    const face = (x,y,fill,k) => { const W_=g.W*(k||1), H_=g.H*(k||1);
      return `<path d="M ${x.toFixed(1)} ${(y-H_).toFixed(1)} `
        + `L ${(x+W_).toFixed(1)} ${y.toFixed(1)} L ${x.toFixed(1)} ${(y+H_).toFixed(1)} `
        + `L ${(x-W_).toFixed(1)} ${y.toFixed(1)} Z" fill="${fill}"/>`; };
    // a cloud: flat overlapping lobes, shaded underneath, in the same flat language
    // a tree: a dark trunk with a canopy block sitting on top of it
    // Ember's lava and Tide's water are alive; the delay grows with distance from
    // the source, so the bright core reads as travelling along the flow
    const flowWrap = (gx,gy,inner) => spec.flow
      ? `<g class="flow" style="animation-delay:${(-isoDist(gx,gy)*0.26).toFixed(2)}s">${inner}</g>`
      : inner;
    let s = '';
    // the sea shelves out from the shore on the same grid, so the coast stays blocky
    const cells = [];
    for (let gy=ISO_LO; gy<=ISO_HI; gy++) for (let gx=ISO_LO; gx<=ISO_HI; gx++){
      const h = isleHeight(gx,gy,spec);
      if (h) cells.push([gx,gy,h,0]);
    }
    // slabs torn loose and hanging above the island: same block, but only a thin
    // lip of side face, so nothing connects them to the ground
    spec.floats.forEach(f => cells.push([f[0],f[1],f[2],1,f[3]||1]));
    spec.trees.forEach(([gx,gy]) => cells.push([gx,gy,isleHeight(gx,gy,spec),2,1]));
    cells.sort((a,b)=> (a[0]+a[1]) - (b[0]+b[1]));           // painter's order
    const sideL = shadeHex(P.cliff, 0.12), sideR = P.cliff;
    cells.forEach(([gx,gy,h,fl,k])=>{
      const [x,y] = isoTop(g,gx,gy,h);
      if (fl === 2){ s += treeAt(g,P,x,y); return; }
      if (fl === 1 && spec.floatKind === 'cloud'){
        s += `<g class="cloud" style="animation-duration:${(19 + (gx*7+gy*5)%11 * 1.4).toFixed(1)}s;`
          + `animation-delay:${(-((gx*5+gy*11)%14) * 1.3).toFixed(1)}s">${puff(x, y, k)}</g>`;
        return;
      }
      const d = fl ? g.HZ*0.5 : h*g.HZ + g.SKIRT;
      s += `<path d="M ${(x-g.W).toFixed(1)} ${y.toFixed(1)} L ${x.toFixed(1)} ${(y+g.H).toFixed(1)} `
         + `L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} L ${(x-g.W).toFixed(1)} ${(y+d).toFixed(1)} Z" fill="${sideL}"/>`
         + `<path d="M ${x.toFixed(1)} ${(y+g.H).toFixed(1)} L ${(x+g.W).toFixed(1)} ${y.toFixed(1)} `
         + `L ${(x+g.W).toFixed(1)} ${(y+d).toFixed(1)} L ${x.toFixed(1)} ${(y+g.H+d).toFixed(1)} Z" fill="${sideR}"/>`;
      const isSummit = spec.summit && gx===spec.summit[0] && gy===spec.summit[1];
      if (fl)                     s += face(x,y, spec.floatKind==='glow' ? P.featB : P.steps[P.steps.length-2]);
      else if (isSummit && P.volcano) s += face(x,y,P.featB); // the crater, glowing
      else if (featOf(spec,gx,gy)) s += face(x,y,P.featA) + flowWrap(gx,gy,face(x,y,P.featB,0.55));
      else                        s += face(x,y,P.steps[Math.min(P.steps.length-1,h-1)]);
    });

  }
  // an open, softly-curved line through a list of points (quadratic through the
  // midpoints), used for the walking route so bends read as curves, not corners
  function smoothOpen(pts){
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
    for (let i=1;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
      d += `Q ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
    }
    const last = pts[pts.length-1];
    return d + `L ${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  }
  // which grid cell each level stands on. Chosen to clear the lava branches
  // (gx===3, gy===3 and the gx===gy diagonal) and to stay well apart on screen.
  // positions around the ring, ordered back to front (by gx+gy) so the numbers read
  // as a path across the island; each world starts from a different point on it
  const NODE_IDX = [0,9,15,22,27];
  function nodeCell(wi, lvl){
    const ring = isleSpec(wi).ring;
    return ring[(NODE_IDX[lvl] + wi*3) % ring.length];
  }
  /* ---- the deck's cards -----------------------------------------------------------
     A card is a window onto its world rather than an illustration of it: the scene
     inside is painted by the same vocabulary the levels are — the same lawn, the same
     hedge pattern, the same board and flutes — so choosing a card is looking at what
     you are about to play. All three show the same little corridor so the difference
     between them is only ever the style.
     -------------------------------------------------------------------------------- */
  // The corridor keeps to the left of the grid so there is real ground it has not
  // reached — without that there is nothing for the fog, the cloud or the shut flaps
  // to cover, and each card would only show its walls.
  const SCENE_W = 7, SCENE_H = 10;
  const SCENE_PATH = [
    [1,1],[2,1],[3,1],[4,1],
    [4,2],
    [4,3],[3,3],[2,3],[1,3],
    [1,4],
    [1,5],[2,5],[3,5],
    [3,6],
    [3,7],[2,7],[1,7],
    [1,8],
  ];
  const sKey = (c,r) => c + ',' + r;
  const SCENE_ON = new Set(SCENE_PATH.map(p => sKey(p[0],p[1])));
  // the ring of ground the light has touched without your walking it
  const SCENE_NEAR = (() => {
    const out = new Set();
    for (const [c,r] of SCENE_PATH)
      for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const k = sKey(c+dc, r+dr);
        if (!SCENE_ON.has(k)) out.add(k);
      }
    return out;
  })();
  const sceneLit = (c,r) => SCENE_ON.has(sKey(c,r)) ? 1 : (SCENE_NEAR.has(sKey(c,r)) ? 0.26 : 0);
  // walls: every edge of a corridor cell the corridor does not pass through, plus a
  // scatter on the fringe so the maze reads as continuing past what has been seen
  function sceneWalls(cs, ox, oy){
    const segs = [];
    const at = (c,r) => ox + c*cs, av = (c,r) => oy + r*cs;
    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      const on = SCENE_ON.has(sKey(c,r)), near = SCENE_NEAR.has(sKey(c,r));
      if (!on && !near) continue;
      const x = at(c,r), y = av(c,r);
      const wall = (dc,dr,k) => on
        ? !SCENE_ON.has(sKey(c+dc, r+dr))
        : hash(c*7.1 + r*3.3, k) > 0.88;              // fringe: the odd stub, no more
      if (wall(0,-1,1)) segs.push(x, y, x+cs, y);
      if (wall(-1,0,2)) segs.push(x, y, x, y+cs);
      if (wall(1,0,3))  segs.push(x+cs, y, x+cs, y+cs);
      if (wall(0,1,4))  segs.push(x, y+cs, x+cs, y+cs);
    }
    return segs;
  }
  const scenePts = (cs, ox, oy) => SCENE_PATH.map(([c,r]) => [ox + (c+0.5)*cs, oy + (r+0.5)*cs]);
  function sceneStroke(g, pts){
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i=1; i<pts.length-1; i++){
      const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
      g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    g.stroke();
  }
  function sceneSegPath(g, segs, dx, dy){
    g.beginPath();
    for (let k=0;k<segs.length;k+=4){ g.moveTo(segs[k]+dx, segs[k+1]+dy); g.lineTo(segs[k+2]+dx, segs[k+3]+dy); }
  }

  // Lantern: the lantern's own reach, the floor blocks it lights, and the thread
  function sceneLantern(g, w, h, cs, ox, oy){
    const L = LOOKS[LOOK.EMBER];
    g.fillStyle = L.bg; g.fillRect(0,0,w,h);
    const set = blockTiles(LOOK.EMBER), tiles = set.tiles;
    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      const b = sceneLit(c,r);
      if (b <= 0) continue;
      g.globalAlpha = Math.min(1, 0.12 + 0.88*b);
      g.drawImage(tiles[Math.floor(hash(c*13+r, 7)*tiles.length) % tiles.length],
                  ox + c*cs, oy + r*cs, cs+0.6, cs+0.6);
    }
    g.globalAlpha = 1;
    const segs = sceneWalls(cs, ox, oy);
    // same relief as the hedge card: thickness and throw scale with cs, steep and mostly vertical
    const wk = cs/42;
    const thick = Math.max(5, cs*0.357);
    g.lineCap = 'square'; g.lineJoin = 'miter';   // flat, but extends half a stroke past each end so an L of two walls meets in a solid corner instead of leaving a notch
    const wallLine = (col, lw, dx, dy) => {
      g.strokeStyle = col; g.lineWidth = lw; sceneSegPath(g, segs, dx, dy); g.stroke();
    };
    wallLine('rgba(4,6,9,.85)', thick*1.2, 1.5*wk, 4.5*wk);
    g.save();
    g.lineWidth = thick; g.strokeStyle = cardAnchor(wallStoneTile(L.wall, cs), 0, 0);
    sceneSegPath(g, segs, 0, 0); g.stroke();
    g.restore();

    const pts = scenePts(cs, ox, oy), head = pts[pts.length-1];
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.save();
    g.shadowColor = `rgba(${L.threadRGB},.8)`; g.shadowBlur = cs*0.5;
    g.strokeStyle = L.thread; g.lineWidth = cs*0.20; sceneStroke(g, pts);
    g.restore();
    g.strokeStyle = L.core; g.lineWidth = cs*0.075; sceneStroke(g, pts);
    // the start, and the light you are carrying
    g.strokeStyle = L.start; g.lineWidth = Math.max(1.4, cs*0.06);
    g.beginPath(); g.arc(pts[0][0], pts[0][1], cs*0.26, 0, 7); g.stroke();
    g.save();
    g.shadowColor = `rgba(${L.coreRGB},.9)`; g.shadowBlur = cs*0.7;
    g.fillStyle = L.core; g.beginPath(); g.arc(head[0], head[1], cs*0.17, 0, 7); g.fill();
    g.restore();
    // a flame waiting off to the side, the way one sits in a level
    const fx = ox + 5.4*cs, fy = oy + 6.4*cs;
    const fg = g.createRadialGradient(fx, fy, 0, fx, fy, cs*0.95);
    fg.addColorStop(0, 'rgba(255,196,110,.85)'); fg.addColorStop(0.45, 'rgba(232,132,44,.34)');
    fg.addColorStop(1, 'rgba(232,132,44,0)');
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, cs*0.95, 0, 7); g.fill();
    g.fillStyle = '#fff3d6';
    g.beginPath(); g.ellipse(fx, fy, cs*0.07, cs*0.15, 0, 0, 7); g.fill();

    const vg = g.createRadialGradient(w*0.42, h*0.48, Math.min(w,h)*0.10,
                                      w*0.42, h*0.48, Math.max(w,h)*0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.62, 'rgba(0,0,0,.34)');
    vg.addColorStop(1, 'rgba(0,0,0,.86)');
    g.fillStyle = vg; g.fillRect(0,0,w,h);
  }

  // Garden: the clipped hedge, the bright lawn and the filament, under cloud
  function sceneGarden(g, w, h, cs, ox, oy){
    // shadows the module-level GARDEN on purpose: the world-select card always shows
    // the same Bloom art regardless of which season the player last loaded in-level
    const GARDEN = GARDEN_PALETTES[LOOK.BLOOM];
    const k = cs/42;
    g.fillStyle = GARDEN.grass; g.fillRect(0,0,w,h);
    g.fillStyle = cardAnchor(paperTile(), 0, 0); g.fillRect(0,0,w,h);

    const pts = scenePts(cs, ox, oy);
    const lay = () => {
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i=1;i<pts.length-1;i++){
        const [ax,ay] = pts[i], [bx,by] = pts[i+1];
        g.quadraticCurveTo(ax, ay, (ax+bx)/2, (ay+by)/2);
      }
      g.lineTo(pts[pts.length-1][0], pts[pts.length-1][1]);
    };
    g.lineCap='round'; g.lineJoin='round';
    g.save();
    g.shadowColor = GARDEN.cast; g.shadowBlur = cs*0.10; g.shadowOffsetY = cs*0.055;
    lay(); g.strokeStyle = GARDEN.pathLo; g.lineWidth = cs*0.30; g.stroke();
    g.restore();
    lay(); g.strokeStyle = GARDEN.path; g.lineWidth = cs*0.22; g.stroke();

    for (let r=0; r<SCENE_H; r++) for (let c=0; c<SCENE_W; c++){
      if (sceneLit(c,r) <= 0) continue;
      const x = ox + c*cs, y = oy + r*cs;
      if (hash(c*3.7 + r*8.1, 31) < 0.28){
        const sx = x + cs*0.19 + hash(c,r,32)*cs*0.62, sy = y + cs*0.19 + hash(c,r,33)*cs*0.62;
        const sr = cs*0.107;

    const th = Math.max(4, cs*0.357);
    const hedge = rough => {
      const dot = (x,y,r) => { g.moveTo(x+r, y); g.arc(x, y, r, 0, 7); };
      g.beginPath();
      for (let n=0;n<segs.length;n+=4){
        const x1=segs[n], y1=segs[n+1], x2=segs[n+2], y2=segs[n+3];
